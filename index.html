<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6df6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JLPT N2">
<meta name="description" content="2026-12-06 JLPT N2 대비 올인원 학습 웹앱 — 어휘·한자 플래시카드, 문법, 퀴즈, 독해, 청해">
<title>JLPT N2 올인원 · D-Day 2026-12-06</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#111827; --sub:#5b6675; --line:#e4e8f0;
  --accent:#2f6df6; --accent-soft:#e8efff; --teal:#0e9384; --teal-soft:#e2f5f1;
  --ok:#12805c; --ok-soft:#e4f6ee; --bad:#d6336c; --bad-soft:#fdeaf1; --warn:#b45309;
  --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1117; --card:#161c26; --ink:#e9eef6; --sub:#9aa7b8; --line:#26303d;
    --accent:#6d9bff; --accent-soft:#1b2740; --teal:#4fd1c5; --teal-soft:#12302c;
    --ok:#57d9a3; --ok-soft:#12302a; --bad:#ff8ab5; --bad-soft:#3a1a28; --warn:#f0b25a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans","Noto Sans KR","Noto Sans JP",sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.jp{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",-apple-system,sans-serif}

/* header */
header{
  position:sticky; top:0; z-index:30;
  padding:calc(8px + env(safe-area-inset-top)) 16px 10px;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.hrow{display:flex;align-items:center;gap:10px}
.dday{display:flex;align-items:baseline;gap:6px;min-width:0}
.dday b{font-size:26px;letter-spacing:-.5px;line-height:1.1}
.dday span{font-size:12px;color:var(--sub)}
.hprog{margin-left:auto;text-align:right;min-width:96px}
.hprog .pct{font-size:15px;font-weight:700;color:var(--accent)}
.hprog .lbl{font-size:11px;color:var(--sub)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--teal));border-radius:99px;transition:width .35s ease}
.hrow2{justify-content:flex-end;gap:7px;margin-top:6px;font-size:11px;color:var(--sub);letter-spacing:-.1px}
.sw{position:relative;flex:0 0 auto;width:34px;height:19px;border-radius:99px;border:0;padding:0;background:var(--line);transition:background .2s}
.sw i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.35);transition:left .2s}
.sw.on{background:var(--teal)}
.sw.on i{left:17px}

/* furigana */
ruby{ruby-align:center;ruby-position:over}
rt{font-size:.55em;line-height:1.05;font-weight:400;color:var(--sub);letter-spacing:0}
body.furi .ex,body.furi .gbody .val,body.furi .qwrap,body.furi .qtitle,
body.furi .ln b{line-height:2.05}
body.furi .opt{line-height:1.75}
body.furi .script .sp span{line-height:2.3}
body.furi .ptext{line-height:2.25}
body.furi .gt{line-height:2.0}
body.nofuri rt{display:none}

/* layout */
main{padding:14px 16px 8px;max-width:720px;margin:0 auto}
.tab{display:none;animation:fade .18s ease}
.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-size:20px;margin:4px 0 2px;letter-spacing:-.3px}
h3{font-size:15px;margin:18px 0 8px;color:var(--ink)}
.lead{color:var(--sub);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card.tight{padding:14px}
.row{display:flex;gap:8px;align-items:center}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.muted{color:var(--sub);font-size:13px}
.small{font-size:12px}
.hr{height:1px;background:var(--line);margin:12px 0}
.kv{display:flex;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv b{flex:0 0 92px;color:var(--sub);font-weight:600;font-size:13px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--sub);
  border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);
  background:var(--card);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:650}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;font-weight:650}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45}

/* home */
.hero{background:linear-gradient(135deg,var(--accent),var(--teal));color:#fff;border:0}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.hero .sub{opacity:.9;font-size:13px;margin-top:6px}
.hero .mini{display:flex;gap:14px;margin-top:14px;font-size:12px;opacity:.95}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbox{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.pbox .n{font-size:20px;font-weight:750}
.pbox .t{font-size:12px;color:var(--sub);margin-bottom:6px}
.plan{list-style:none;padding:0;margin:0}
.plan li{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.plan li:last-child{border-bottom:0}
.plan .d{flex:0 0 62px;font-weight:750;color:var(--accent);font-size:13px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;font-size:12px;font-weight:650}
.quick button b{display:block;font-size:20px;margin-bottom:4px}

/* flashcard */
.fcstage{perspective:1200px;margin-bottom:12px}
.fcard{position:relative;width:100%;min-height:360px;transition:transform .45s cubic-bezier(.2,.8,.2,1);
  transform-style:preserve-3d;-webkit-transform-style:preserve-3d;touch-action:pan-y}
.fcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:20px;display:flex;flex-direction:column;overflow-y:auto}
.face.back{transform:rotateY(180deg)}
.face .tag{align-self:flex-start;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  border-radius:99px;padding:3px 9px}
.word{font-size:40px;font-weight:750;letter-spacing:1px;margin:18px 0 4px;line-height:1.2;word-break:keep-all}
.read{font-size:17px;color:var(--teal);font-weight:650}
.mean{font-size:18px;font-weight:650;margin-top:auto}
.hint{font-size:12px;color:var(--sub);text-align:center;margin-top:12px}
.ex{margin-top:10px;font-size:17px;line-height:1.7}
.exk{font-size:13px;color:var(--sub);margin-top:6px}
.fnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fnav3{display:grid;grid-template-columns:auto 1fr auto;gap:8px}
.speak{border:1px solid var(--line);background:var(--card);border-radius:12px;width:44px;height:44px;font-size:18px}
.fcount{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:8px}

/* grammar */
.gcard{padding:0;overflow:hidden}
.ghead{display:flex;align-items:flex-start;gap:10px;padding:14px 16px}
.ghead>div:first-child{min-width:0;flex:1}
.ghead .gt{font-size:18px;font-weight:750;line-height:1.3;overflow-wrap:anywhere}
.ghead .gm{font-size:13px;color:var(--sub);margin-top:2px}
.ghead .gbtn{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.gbody{padding:0 16px 16px;font-size:14px}
.gbody .lab{font-size:11px;font-weight:800;color:var(--teal);letter-spacing:.4px;margin:10px 0 2px}
.gbody .val{font-size:14px}
.gbody .tip{background:var(--teal-soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}
.gbody .ex{font-size:16px;margin-top:2px}
.srch{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:16px;-webkit-appearance:none}
.done{background:var(--ok-soft)!important;border-color:transparent!important}
.likedot{color:var(--ok);font-weight:800}

/* quiz */
.qwrap{font-size:17px;line-height:1.9;margin:6px 0 14px}
.qblank{color:var(--accent);font-weight:800}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
  border-radius:13px;padding:13px 14px;margin-bottom:8px;font-size:16px;line-height:1.45}
.opt .no{flex:0 0 22px;height:22px;border-radius:7px;background:var(--bg);border:1px solid var(--line);
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
.opt.correct{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{opacity:1}
.verdict{font-size:15px;font-weight:750;margin:10px 0 6px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--bad)}
.exp{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.65}
.trans{background:var(--teal-soft);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6;margin:0 0 8px}
.trans b{display:inline-block;font-size:11px;font-weight:800;color:var(--teal);margin-right:6px;letter-spacing:.3px}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:6px}
.bigscore{font-size:34px;font-weight:800;letter-spacing:-1px}

/* reading */
.ptext{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;
  line-height:1.95;white-space:pre-wrap;letter-spacing:.1px}
.ptr{margin:10px 0 2px}
.ptr .exp{white-space:pre-wrap}
.explab{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.3px;margin-bottom:6px}
.qbox{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.qtitle{font-size:14px;font-weight:700;margin-bottom:8px}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tagline span{font-size:11px;font-weight:700;color:var(--sub);background:var(--bg);border:1px solid var(--line);
  border-radius:99px;padding:2px 8px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.t th{color:var(--sub);font-size:12px;font-weight:700;white-space:nowrap}
table.t td:first-child{font-weight:700;white-space:nowrap}
ol.rules{padding-left:20px;margin:6px 0 0}
ol.rules li{margin-bottom:8px;font-size:14px}
.ln{display:flex;gap:8px;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ln:last-child{border-bottom:0}
.ln b{flex:0 0 108px;color:var(--ink);font-weight:700}
.ln span{color:var(--sub)}

/* listening */
.player{display:flex;gap:8px;margin:12px 0 6px}
.player .btn{flex:1}
.btn.playing{box-shadow:0 0 0 3px rgba(47,109,246,.18)}
.script .sp .spsay.playing{opacity:1;border-color:var(--accent);color:var(--accent)}
.script{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;line-height:1.9;margin-top:10px}
.script .sp{display:flex;gap:8px;margin-bottom:9px;align-items:flex-start}
.script .sp b{flex:0 0 26px;color:var(--accent);font-size:12px;padding-top:4px}
.script .sp span{flex:1}
.script .sp .spsay{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:1px 5px;font-size:11px;line-height:1.5;opacity:.75}
.script .sp .spsay:active{opacity:1;transform:scale(.96)}
.script .sp em{font-style:normal;background:var(--teal-soft);border-radius:4px;padding:0 3px}
.script .sp .lko{display:block;font-style:normal;color:var(--sub);font-size:12.5px;line-height:1.65;margin-top:1px}
.hide{display:none!important}
.speed{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}

/* tips */
.src{border-left:4px solid var(--accent)}
.src.naver{border-left-color:#03c75a} .src.yt{border-left-color:#ff0033} .src.x{border-left-color:#111}
@media (prefers-color-scheme: dark){.src.x{border-left-color:#9aa7b8}}
.tipitem{padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.tipitem:last-child{border-bottom:0}
.tipitem b{display:block;font-size:14px;margin-bottom:2px}
.tipitem .meta{font-size:11px;color:var(--sub);margin-top:4px}
.links{display:flex;flex-direction:column;gap:8px}
.links a{display:block;border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-decoration:none;background:var(--card)}
.links a b{display:block;font-size:14px;color:var(--ink)}
.links a span{font-size:12px;color:var(--sub)}
.note{font-size:12px;color:var(--warn);background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}

/* tabbar */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  background:var(--card);
  background:color-mix(in srgb, var(--card) 92%, transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav.tabbar button{flex:1 1 0;min-width:0;border:0;background:transparent;padding:6px 0 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub);font-size:10px;font-weight:650}
nav.tabbar button i{font-style:normal;font-size:19px;line-height:1}
nav.tabbar button.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:rgba(20,26,36,.94);color:#fff;font-size:13px;padding:9px 14px;border-radius:99px;z-index:60;
  opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:374px){
  .word{font-size:34px}
  .hero .mini{flex-wrap:wrap;gap:8px}
  nav.tabbar button{font-size:9px}
  nav.tabbar button i{font-size:17px}
}


/* ── 기기 간 진도 동기화 ── */
.hbtn{margin-right:auto;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font:inherit;font-size:11px;font-weight:700;color:var(--sub)}
.hbtn:active{transform:scale(.97)}
.syrow{display:flex;gap:8px;margin-top:10px}
.syrow .btn{flex:1}
.syta{width:100%;box-sizing:border-box;margin-top:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px;line-height:1.5;resize:vertical;min-height:46px}
.systat{margin-top:8px;font-size:12px;color:var(--sub);line-height:1.6;word-break:break-all}
.systat.err{color:var(--bad)}
.sygist{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.sygist summary{font-size:13px;font-weight:700;color:var(--accent);cursor:pointer}
.syin{width:100%;box-sizing:border-box;margin-top:8px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.sylink{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}

/* ── 기출문제 ── */
.kq{font-weight:650;line-height:1.95;margin:2px 0 2px}
.kpara{margin:0 0 10px;line-height:1.95;font-size:15px}
.kpass{border-left:3px solid var(--accent)}
.kcard .tagline span:first-child{font-weight:750;color:var(--ink)}
.tg{font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 3px;
  border-bottom:2px solid var(--accent)}
body.furi .kcard .opt{line-height:1.9}
</style>
</head>
<body class="furi">
<header>
  <div class="hrow">
    <div class="dday"><b id="dnum">D-18</b><span id="dsub">N2 시험까지</span></div>
    <div class="hprog"><div class="pct" id="hpct">0%</div><div class="lbl">전체 진도</div></div>
  </div>
  <div class="bar"><i id="hbar"></i></div>
  <div class="hrow hrow2"><button class="hbtn" id="syncbtn">🔄 진도 동기화</button><span>예문 후리가나</span>
    <button class="sw on" id="furibtn" aria-pressed="true" aria-label="예문 후리가나 켜기/끄기"><i></i></button>
  </div>
</header>
<main>
  <section id="tab-home" class="tab on"></section>
  <section id="tab-vocab" class="tab"></section>
  <section id="tab-grammar" class="tab"></section>
  <section id="tab-quiz" class="tab"></section>
  <section id="tab-reading" class="tab"></section>
  <section id="tab-listening" class="tab"></section>
  <section id="tab-kako" class="tab"></section>
  <section id="tab-tips" class="tab"></section>
</main>

"w":"ふさわしい","k":"ふさわしい","m":"어울리다, 적합하다","c":"형용사","ex":"この{場|ば}にふさわしい{服装|ふくそう}を{選|えら}んだ。","exk":"이 자리에 어울리는 복장을 골랐다."},{"i":100,"w":"大幅な","k":"おおはばな","m":"대폭적인","c":"형용사","ex":"{大幅|おおはば}な{値引|ねび}きがあった。","exk":"대폭적인 할인이 있었다."},{"i":101,"w":"わずかな","k":"わずかな","m":"근소한, 약간의","c":"형용사","ex":"わずかな{差|さ}で{勝負|しょうぶ}が{決|き}まった。","exk":"근소한 차이로 승부가 갈렸다."},{"i":102,"w":"独特だ","k":"どくとくだ","m":"독특하다","c":"형용사","ex":"この{町|まち}には{独特|どくとく}な{文化|ぶんか}がある。","exk":"이 마을에는 독특한 문화가 있다."},{"i":103,"w":"幼稚だ","k":"ようちだ","m":"유치하다","c":"형용사","ex":"そんな{言|い}い{方|かた}は{幼稚|ようち}だ。","exk":"그런 말투는 유치하다."},{"i":104,"w":"面倒だ","k":"めんどうだ","m":"귀찮다, 번거롭다","c":"형용사","ex":"{手続|てつづ}きが{面倒|めんどう}で{先延|さきの}ばしにした。","exk":"절차가 번거로워 미뤘다."},{"i":105,"w":"手軽だ","k":"てがるだ","m":"손쉽다, 간편하다","c":"형용사","ex":"{手軽|てがる}に{作|つく}れる{料理|りょうり}を{教|おし}えてほしい。","exk":"간편하게 만들 수 있는 요리를 알려줬으면 한다."},{"i":106,"w":"騒々しい","k":"そうぞうしい","m":"소란스럽다","c":"형용사","ex":"{工事|こうじ}の{音|おと}が{騒々|そうぞう}しくて{眠|ねむ}れない。","exk":"공사 소리가 소란스러워 잠을 못 자겠다."},{"i":107,"w":"粗い","k":"あらい","m":"거칠다, 조잡하다","c":"형용사","ex":"この{紙|かみ}は{表面|ひょうめん}が{粗|あら}い。","exk":"이 종이는 표면이 거칠다."},{"i":108,"w":"勢い","k":"いきおい","m":"기세","c":"한자·단어형성","ex":"{勢|いきお}いよくドアが{開|ひら}いた。","exk":"기세 좋게 문이 열렸다."}]},"grammar":{"grammar":[{"i":1,"t":"〜ばかりに","c":"원인·이유","conn":"Vた / イAい / ナAな / {名詞|めいし}(である) + ばかりに","m":"~한 탓에 (나쁜 결과)","tip":"하나의 원인 때문에 나쁜 결과가 생겼다는 후회·원망. 뒤에는 반드시 부정적 결과. 긍정 결과에는 쓰지 않고, 「〜おかげで」와 정반대.","ex":"{正直|しょうじき}に{言|い}ったばかりに、{皆|みな}に{嫌|きら}われた。","exk":"솔직히 말한 탓에 모두에게 미움받았다."},{"i":2,"t":"〜あまり(に)","c":"원인·이유","conn":"{名詞|めいし}+の / Vる·Vた / ナAな + あまり(に)","m":"너무 ~한 나머지","tip":"감정·상태가 지나쳐서 자제할 수 없는 결과가 나옴. 「{驚|おどろ}きのあまり」「{緊張|きんちょう}のあまり」처럼 감정 명사와 잘 붙음. 앞에는 정도를 넘은 상태가 와야 함.","ex":"{緊張|きんちょう}のあまり、{何|なに}も{言|い}えなかった。","exk":"긴장한 나머지 아무 말도 못 했다."},{"i":3,"t":"〜ことから","c":"원인·이유","conn":"보통형 / {名詞|めいし}+である + ことから","m":"~인 것에서 (근거·유래)","tip":"이름의 유래, 판단의 근거를 말할 때. 「〜ことだから」는 '그 사람 성격상 틀림없이'라는 전혀 다른 문형이니 구별.","ex":"{顔|かお}が{似|に}ていることから、{兄弟|きょうだい}だと{分|わ}かった。","exk":"얼굴이 닮은 것에서 형제임을 알았다."},{"i":4,"t":"〜だけに","c":"원인·이유","conn":"보통형 / {名詞|めいし} + だけに","m":"~인 만큼 (더욱)","tip":"기대나 지위에 걸맞게 결과가 두드러짐. 감탄·안타까움 모두 가능. 「〜だけあって」는 칭찬(긍정 평가)에 한정되는 점이 다름.","ex":"{有名|ゆうめい}な{店|みせ}だけに、{味|あじ}も{価格|かかく}も{納得|なっとく}だ。","exk":"유명한 가게인 만큼 맛도 가격도 납득이 간다."},{"i":5,"t":"〜ものだから","c":"원인·이유","conn":"보통형 + ものだから","m":"~한 것이라서 (변명·핑계)","tip":"구어적. 자기의 사정을 변명하듯 설명. 「〜ので」보다 변명의 뉘앙스가 강함.","ex":"{電車|でんしゃ}が{遅|おく}れたものだから、{遅刻|ちこく}してしまった。","exk":"전철이 늦은 것이라 지각하고 말았다."},{"i":6,"t":"〜おかげで","c":"원인·이유","conn":"{名詞|めいし}+の / 보통형 + おかげで","m":"~덕분에","tip":"좋은 결과의 원인. 비꼬는 용법(「〜のおかげで{大変|たいへん}なことに」)도 있음. 「〜せいで」는 나쁜 결과 전용.","ex":"{先生|せんせい}のおかげで{合格|ごうかく}できた。","exk":"선생님 덕분에 합격할 수 있었다."},{"i":7,"t":"〜せいで","c":"원인·이유","conn":"{名詞|めいし}+の / 보통형 + せいで","m":"~때문에 (나쁜 결과)","tip":"책임을 돌리는 뉘앙스. 「〜せいか」는 '때문인지'로 추측. 「〜おかげで」와 긍정·부정이 갈림.","ex":"{寝坊|ねぼう}したせいで、{電車|でんしゃ}に{乗|の}り{遅|おく}れた。","exk":"늦잠 잔 탓에 전철을 놓쳤다."},{"i":8,"t":"〜からこそ","c":"원인·이유","conn":"보통형 + からこそ","m":"바로 ~이기 때문에 (강조)","tip":"이유를 하나로 못 박아 강조. 「〜からこそ〜のだ」 형태로 결론을 강조하는 일이 많음. 단순 「から」보다 한정적.","ex":"{苦労|くろう}したからこそ、{今|いま}の{自分|じぶん}がある。","exk":"고생했기 때문에 지금의 내가 있다."},{"i":9,"t":"〜にもかかわらず","c":"역접·양보","conn":"보통형 / {名詞|めいし}(である) + にもかかわらず","m":"~에도 불구하고","tip":"격식·문어. 예상 밖의 결과를 강하게 강조. 회화의 「〜のに」에 해당하지만 딱딱한 표현.","ex":"{大雨|おおあめ}にもかかわらず、{試合|しあい}は{行|おこな}われた。","exk":"폭우에도 불구하고 경기는 열렸다."},{"i":10,"t":"〜わりに(は)","c":"역접·양보","conn":"보통형 / {名詞|めいし}+の + わりに(は)","m":"~에 비해서는","tip":"기대치와 실제의 불균형. 형용사도 직접 붙음. 「〜にしては」와 비슷하지만 「わりに」가 더 폭넓게 쓰임.","ex":"{値段|ねだん}が{高|たか}いわりに、{味|あじ}はいまいちだ。","exk":"가격이 비싼 것에 비해 맛은 별로다."},{"i":11,"t":"〜くせに","c":"역접·양보","conn":"보통형 / {名詞|めいし}+の / ナAな + くせに","m":"~인 주제에","tip":"비난·경멸의 감정이 강함. 사람에게만 쓰고, 자기 자신에게는 쓰지 않음. 「〜のに」보다 감정적.","ex":"{知|し}らないくせに、{知|し}ったふりをする。","exk":"모르는 주제에 아는 척한다."},{"i":12,"t":"〜ものの","c":"역접·양보","conn":"보통형 + ものの","m":"~이긴 하지만","tip":"격식. 앞의 사실을 인정하고 뒤에서 예상과 다른 사실을 말함. 「〜けれども」의 문어판.","ex":"{約束|やくそく}したものの、{結局|けっきょく}{行|い}けなかった。","exk":"약속했지만 결국 갈 수 없었다."},{"i":13,"t":"〜とはいえ","c":"역접·양보","conn":"보통형 / {名詞|めいし} + とはいえ","m":"~라고는 해도","tip":"앞을 인정하면서 뒤에서 제한을 붙임. 「〜といっても」보다 문어적이고 단정적.","ex":"{春|はる}とはいえ、まだ{寒|さむ}い{日|ひ}が{続|つづ}く。","exk":"봄이라고는 해도 아직 추운 날이 이어진다."},{"i":14,"t":"〜にしては","c":"역접·양보","conn":"보통형 / {名詞|めいし} + にしては","m":"~치고는","tip":"기준과 다른 점을 지적. 「わりに」와 달리 명사·동사에 바로 붙고, 형용사에는 잘 안 붙임.","ex":"{初|はじ}めてにしては、よくできている。","exk":"처음치고는 잘 되어 있다."},{"i":15,"t":"〜からといって","c":"역접·양보","conn":"보통형 + からといって","m":"~라고 해서 (그렇다고 ~은 아니다)","tip":"뒤에 「〜わけではない」「〜とは{限|かぎ}らない」가 오는 것이 정형. 앞 이유만으로 단정할 수 없다는 뜻.","ex":"{安|やす}いからといって、{買|か}うわけではない。","exk":"싸다고 해서 사는 것은 아니다."},{"i":16,"t":"〜ながらも","c":"역접·양보","conn":"Vます어간 / イAい / ナA(であり) / {名詞|めいし}(であり) + ながらも","m":"~이면서도","tip":"격식. 「{狭|せま}いながらも」처럼 의외성·역접. 「〜つつも」와 거의 같은 뜻.","ex":"{狭|せま}いながらも、{住|す}みやすい{部屋|へや}だ。","exk":"좁으면서도 살기 좋은 방이다."},{"i":17,"t":"〜としても","c":"역접·양보","conn":"보통형 + としても","m":"~라고 해도","tip":"가정적 양보. 뒤에는 반대 의견·다른 사실. 「〜にしても」와 유사.","ex":"{雨|あめ}が{降|ふ}ったとしても、{出|で}かけます。","exk":"비가 온다 해도 나갑니다."},{"i":18,"t":"〜にあたって","c":"시점·계기","conn":"{名詞|めいし} / Vる + にあたって","m":"~에 즈음하여","tip":"격식. 의식을 가지고 임하는 자세를 말함. 「〜に{際|さい}して」와 거의 같음.","ex":"{開会|かいかい}にあたって、{一言|ひとこと}ご{挨拶|あいさつ}します。","exk":"개회에 즈음하여 한 말씀 드리겠습니다."},{"i":19,"t":"〜を{契機|けいき}に(して)","c":"시점·계기","conn":"{名詞|めいし} / Vた+の + を{契機|けいき}に","m":"~을 계기로 (격식)","tip":"단단한 문어 표현. 「〜をきっかけに」보다 격식적이고 사회적 변화에 자주 씀.","ex":"{病気|びょうき}を{契機|けいき}に、{生活|せいかつ}を{見直|みなお}した。","exk":"병을 계기로 생활을 돌아봤다."},{"i":20,"t":"〜をきっかけに(して)","c":"시점·계기","conn":"{名詞|めいし} / Vた+の + をきっかけに","m":"~을 계기로","tip":"일상적인 계기. 「〜がきっかけで」 형태도 가능.","ex":"{友人|ゆうじん}の{紹介|しょうかい}をきっかけに、{日本|にほん}{語|ご}を{習|なら}い{始|はじ}めた。","exk":"친구 소개를 계기로 일본어를 배우기 시작했다."},{"i":21,"t":"〜か〜ないかのうちに","c":"시점·계기","conn":"Vる/Vた + か + Vない + かのうちに","m":"~하자마자","tip":"같은 동사를 긍정·부정으로 반복. 극히 짧은 순간에 다음 일이 일어남. 「〜とたん」보다 빠른 느낌.","ex":"ドアを{開|あ}けるか{開|あ}けないかのうちに、{雨|あめ}が{降|ふ}り{出|だ}した。","exk":"문을 열자마자 비가 내리기 시작했다."},{"i":22,"t":"〜{次第|しだい} (ます어간+{次第|しだい})","c":"시점·계기","conn":"Vます어간 + {次第|しだい}","m":"~하는 대로 즉시","tip":"비즈니스 표현. 「{到着|とうちゃく}し{次第|しだい}」「{決|き}まり{次第|しだい}」. 명사+{次第|しだい}だ(~나름이다), {次第|しだい}に(차츰)와 모양이 같으니 구별.","ex":"{到着|とうちゃく}し{次第|しだい}、ご{連絡|れんらく}いたします。","exk":"도착하는 대로 연락드리겠습니다."},{"i":23,"t":"〜たとたん(に)","c":"시점·계기","conn":"Vた + とたん(に)","m":"~하자마자 (그 순간)","tip":"의외성·즉각성. 뒤에는 과거 사실이 옴. 내 의지적 행동에는 잘 안 씀.","ex":"{立|た}ち{上|あ}がったとたん、めまいがした。","exk":"일어나자마자 어지러웠다."},{"i":24,"t":"〜うちに","c":"시점·계기","conn":"Vる/Vない / イAい / ナAな + うちに","m":"~하는 동안에 / ~하기 전에","tip":"상태가 변하기 전에라는 뜻. 「{忘|わす}れないうちに」처럼 부정형과 자주 결합. 「〜{間|あいだ}に」는 시간 범위, 「うちに」는 변화 전의 상태에 초점.","ex":"{忘|わす}れないうちに、メモしておこう。","exk":"잊지 않았을 때 메모해 두자."},{"i":25,"t":"〜にすぎない","c":"정도·한도","conn":"{名詞|めいし} / 보통형 + にすぎない","m":"~에 불과하다","tip":"정도를 낮춰 평가. 「〜だけだ」와 비슷하지만 「에 불과하다」는 무시하는 뉘앙스.","ex":"それはうわさにすぎない。","exk":"그것은 소문에 불과하다."},{"i":26,"t":"〜どころか","c":"정도·한도","conn":"{名詞|めいし} / 보통형 + どころか","m":"~는커녕","tip":"앞을 부정하고 그보다 훨씬 극단적인 것을 제시. 「〜どころではない」는 '~할 상황이 아니다'.","ex":"{貯金|ちょきん}どころか、{生活|せいかつ}{費|ひ}も{足|た}りない。","exk":"저축은커녕 생활비도 부족하다."},{"i":27,"t":"〜はもとより","c":"정도·한도","conn":"{名詞|めいし} + はもとより","m":"~은 물론이고","tip":"격식. 당연한 것에 더해 다른 것도. 「〜はもちろん」의 문어판.","ex":"{日本|にほん}{語|ご}はもとより、{英語|えいご}も{話|はな}せる。","exk":"일본어는 물론 영어도 할 수 있다."},{"i":28,"t":"〜ないことには","c":"정도·한도","conn":"Vない / イAくない / ナAでない + ことには","m":"~하지 않고서는","tip":"뒤에 반드시 부정(できない 등)이 옴. 전제 조건을 강조.","ex":"{実際|じっさい}に{見|み}ないことには、{判断|はんだん}できない。","exk":"직접 보지 않고서는 판단할 수 없다."},{"i":29,"t":"〜かのように","c":"정도·한도","conn":"보통형 + かのように","m":"마치 ~인 것처럼","tip":"사실과 다른 모습·태도를 비유. 「まるで」와 함께 자주 씀.","ex":"{彼|かれ}は{何|なに}も{知|し}らないかのように{振|ふ}る{舞|ま}った。","exk":"그는 아무것도 모르는 것처럼 행동했다."},{"i":30,"t":"〜さえ〜ば","c":"정도·한도","conn":"{名詞|めいし}+さえ / Vます어간+さえすれば","m":"~만 하면","tip":"최소 조건만 충족되면 충분하다는 뜻. 「お{金|かね}さえあれば」처럼 명사에 붙는 형태가 빈출.","ex":"お{金|かね}さえあれば、{何|なん}でも{買|か}えるわけではない。","exk":"돈만 있으면 뭐든 살 수 있는 것은 아니다."},{"i":31,"t":"〜からいうと / 〜からすれば","c":"입장·시각","conn":"{名詞|めいし} + からいうと / から{言|い}えば / からすれば","m":"~입장에서 말하면","tip":"판단의 기준·입장을 제시. 「〜から{見|み}ると」와 유사.","ex":"{専門|せんもん}{家|か}の{立場|たちば}からいうと、この{方法|ほうほう}は{危険|きけん}だ。","exk":"전문가 입장에서 말하면 이 방법은 위험하다."},{"i":32,"t":"〜にしたら / 〜にすれば","c":"입장·시각","conn":"{名詞|めいし}(사람) + にしたら / にすれば","m":"~의 입장에서는","tip":"감정 이입. 「〜にとって」는 객관적 기준, 「〜にしたら」는 그 사람의 기분을 헤아리는 뉘앙스.","ex":"{子供|こども}にしたら、それは{大|おお}きな{問題|もんだい}だ。","exk":"아이 입장에서는 그것은 큰 문제다."},{"i":33,"t":"〜{上|うえ}は / 〜{以上|いじょう}は","c":"입장·시각","conn":"Vる/Vた + {上|うえ}は / {以上|いじょう}は","m":"~한 이상은","tip":"결의·의무를 나타냄. 「〜からには」와 거의 같고 더 문어적.","ex":"やると{決|き}めた{上|うえ}は、{最後|さいご}までやる。","exk":"하기로 정한 이상 끝까지 한다."},{"i":34,"t":"〜からには","c":"입장·시각","conn":"Vる/Vた + からには","m":"~한 이상에는","tip":"결의·의무. 뒤에는 「べきだ」「つもりだ」「なければならない」가 옴. 회화에서도 자주 씀.","ex":"{引|ひ}き{受|う}けたからには、{責任|せきにん}を{持|も}つ。","exk":"맡은 이상 책임을 진다."},{"i":35,"t":"〜として","c":"입장·시각","conn":"{名詞|めいし} + として","m":"~로서","tip":"자격·지위. 「〜としては」는 '~로서는'으로 기준을 강조.","ex":"{彼|かれ}は{代表|だいひょう}として{会議|かいぎ}に{出席|しゅっせき}した。","exk":"그는 대표로서 회의에 참석했다."},{"i":36,"t":"〜にとって","c":"입장·시각","conn":"{名詞|めいし} + にとって","m":"~에게 있어서","tip":"평가의 기준이 되는 사람·입장. 뒤에는 평가 표현({大切|たいせつ}だ·{難|むずか}しい 등)이 옴.","ex":"{私|わたし}にとって、{家族|かぞく}が{一番|いちばん}{大切|たいせつ}だ。","exk":"나에게 있어 가족이 가장 소중하다."},{"i":37,"t":"〜にほかならない","c":"격식·문어","conn":"{名詞|めいし} / 보통형 + にほかならない","m":"다름 아닌 ~이다","tip":"원인·이유를 단정. 「〜からにほかならない」 형태로 이유를 강조.","ex":"{成功|せいこう}は{努力|どりょく}の{結果|けっか}にほかならない。","exk":"성공은 다름 아닌 노력의 결과다."},{"i":38,"t":"〜に{相違|そうい}ない","c":"격식·문어","conn":"보통형 + に{相違|そうい}ない","m":"~임에 틀림없다","tip":"문어. 회화의 「〜に{違|ちが}いない」에 해당. 추측을 강하게 단정.","ex":"{彼|かれ}が{犯人|はんにん}に{相違|そうい}ない。","exk":"그가 범인임에 틀림없다."},{"i":39,"t":"〜を{問|と}わず","c":"격식·문어","conn":"{名詞|めいし} + を{問|と}わず","m":"~을 불문하고","tip":"경험 유무·연령·성별·날씨처럼 대비되는 개념에 붙음. 「〜にかかわらず」와 유사.","ex":"{経験|けいけん}の{有無|うむ}を{問|と}わず、{応募|おうぼ}できる。","exk":"경험 유무를 불문하고 지원할 수 있다."},{"i":40,"t":"〜をめぐって","c":"격식·문어","conn":"{名詞|めいし} + をめぐって","m":"~을 둘러싸고","tip":"논의·대립·분쟁의 대상. 뒤에 「{議論|ぎろん}」「{争|あらそ}い」「{意見|いけん}が{分|わ}かれる」가 옴.","ex":"その{計画|けいかく}をめぐって、{議論|ぎろん}が{続|つづ}いている。","exk":"그 계획을 둘러싸고 논의가 이어지고 있다."},{"i":41,"t":"〜に{沿|そ}って","c":"격식·문어","conn":"{名詞|めいし} + に{沿|そ}って","m":"~에 따라서 (방침·선을 따라)","tip":"매뉴얼·방침·강·길처럼 따라야 할 선({線|せん})에 씀. 「〜に{従|したが}って」는 규칙·명령에 순응하는 느낌.","ex":"マニュアルに{沿|そ}って、{作業|さぎょう}を{進|すす}める。","exk":"매뉴얼에 따라 작업을 진행한다."},{"i":42,"t":"〜をはじめ","c":"격식·문어","conn":"{名詞|めいし} + をはじめ","m":"~을 비롯하여","tip":"대표적인 예를 들고 전체로 넓힘. 「〜をはじめとして」 형태도 있음.","ex":"{東京|とうきょう}をはじめ、{各地|かくち}でイベントが{開|ひら}かれる。","exk":"도쿄를 비롯해 각지에서 이벤트가 열린다."},{"i":43,"t":"〜に{基|もと}づいて","c":"격식·문어","conn":"{名詞|めいし} + に{基|もと}づいて","m":"~에 근거하여","tip":"데이터·사실·규칙을 근거로 삼음. 뒤에 판단·작성 행위가 옴.","ex":"{調査|ちょうさ}{結果|けっか}に{基|もと}づいて、{報告|ほうこく}{書|しょ}を{書|か}いた。","exk":"조사 결과에 근거해 보고서를 썼다."},{"i":44,"t":"〜を{通|つう}じて","c":"격식·문어","conn":"{名詞|めいし} + を{通|つう}じて","m":"~을 통해","tip":"수단·매체, 또는 기간 전체. 「〜を{通|とお}して」와 거의 같음.","ex":"インターネットを{通|つう}じて{情報|じょうほう}を{得|え}た。","exk":"인터넷을 통해 정보를 얻었다."},{"i":45,"t":"〜に{限|かぎ}らず","c":"격식·문어","conn":"{名詞|めいし} + に{限|かぎ}らず","m":"~에 한하지 않고","tip":"범위를 넓힘. 「〜だけでなく」의 문어판. 「〜に{限|かぎ}って」는 '하필 ~만'으로 뜻이 다름.","ex":"{学生|がくせい}に{限|かぎ}らず、{社会|しゃかい}{人|にん}も{参加|さんか}できる。","exk":"학생에 한하지 않고 사회인도 참가할 수 있다."},{"i":46,"t":"〜おきに","c":"빈출 확장","conn":"수량 + おきに","m":"~간격으로, ~걸러","tip":"「{一|いち}{日|にち}おき」= 하루 건너(이틀에 한 번). 「{一|いち}{日|にち}ごと」= 매일. 숫자 함정이 자주 나옴.","ex":"バスは{十分|じゅうぶん}おきに{出|で}ている。","exk":"버스는 10분 간격으로 다닌다."},{"i":47,"t":"〜ごとに","c":"빈출 확장","conn":"{名詞|めいし} / Vる + ごとに","m":"~마다","tip":"빠짐없이 전부. 「{会|あ}うごとに」= 만날 때마다. 「おきに」와 혼동 주의.","ex":"{会|あ}うごとに、{彼|かれ}は{大人|おとな}っぽくなっていく。","exk":"만날 때마다 그는 어른스러워진다."},{"i":48,"t":"〜つつある","c":"빈출 확장","conn":"Vます어간 + つつある","m":"지금 ~해 가고 있다 (변화 진행)","tip":"문어. 「〜ている」가 단순 상태라면, 「〜つつある」는 변화가 진행 중임을 강조.","ex":"{町|まち}の{人口|じんこう}は{減|へ}りつつある。","exk":"마을 인구는 줄어들고 있다."},{"i":49,"t":"〜{一方|いっぽう}だ","c":"빈출 확장","conn":"Vる + {一方|いっぽう}だ","m":"~하기만 한다 (한 방향으로 계속)","tip":"한쪽으로만 진행되는 변화. 나쁜 방향({増|ふ}える·{減|へ}る·{悪|わる}くなる)에 자주 씀.","ex":"{物価|ぶっか}は{上|あ}がる{一方|いっぽう}だ。","exk":"물가는 오르기만 한다."},{"i":50,"t":"〜ようがない","c":"빈출 확장","conn":"Vます어간 + ようがない","m":"~할 방법이 없다","tip":"수단이 없어 불가능. 「{直|なお}しようがない」「{連絡|れんらく}しようがない」처럼 가능동사 어간에 붙음.","ex":"{壊|こわ}れてしまって、{直|なお}しようがない。","exk":"고장 나서 고칠 방법이 없다."},{"i":51,"t":"〜かねない","c":"빈출 확장","conn":"Vます어간 + かねない","m":"~할 수도 있다 (나쁜 가능성)","tip":"주어는 대개 사물·상황. 좋지 않은 결과가 일어날 가능성. 「〜かもしれない」보다 부정적.","ex":"そんなに{働|はたら}けば、{体|からだ}を{壊|こわ}しかねない。","exk":"그렇게 일하면 몸을 망칠 수 있다."},{"i":52,"t":"〜かねる","c":"빈출 확장","conn":"Vます어간 + かねる","m":"~하기 어렵다 (정중한 거절)","tip":"비즈니스 거절 표현. 「お{応|こた}えしかねます」= 응하기 어렵습니다. 「〜かねない」와 부호가 반대.","ex":"そのご{要望|ようぼう}にはお{応|こた}えしかねます。","exk":"그 요청에는 응하기 어렵습니다."},{"i":53,"t":"〜ざるを{得|え}ない","c":"빈출 확장","conn":"Vない어간 + ざるを{得|え}ない (する→せざるを{得|え}ない)","m":"~하지 않을 수 없다","tip":"불가피한 사정. 「〜ないわけにはいかない」보다 문어적이고 강함.","ex":"{上司|じょうし}の{命令|めいれい}なら{従|したが}わざるを{得|え}ない。","exk":"상사 명령이라면 따르지 않을 수 없다."},{"i":54,"t":"〜わけにはいかない","c":"빈출 확장","conn":"Vる + わけにはいかない","m":"~할 수는 없다 (여의치 않다)","tip":"사회적·도덕적 제약 때문에 안 된다는 뜻. 능력이 없어서가 아님.","ex":"{病気|びょうき}の{子供|こども}を{置|お}いて、{出|で}かけるわけにはいかない。","exk":"병든 아이를 두고 나갈 수는 없다."},{"i":55,"t":"〜ないまでも","c":"빈출 확장","conn":"Vない + ないまでも","m":"~까지는 아니더라도","tip":"최소한의 기대를 말함. 뒤에는 긍정적 요청·희망이 옴.","ex":"{毎日|まいにち}とは{言|い}わないまでも、{週|しゅう}に{一|いち}{度|ど}は{連絡|れんらく}してほしい。","exk":"매일까지는 아니더라도 주 1회는 연락해 줬으면 한다."},{"i":56,"t":"〜だけあって","c":"빈출 확장","conn":"{名詞|めいし} / 보통형 + だけあって","m":"~인 만큼 (기대대로)","tip":"칭찬·긍정 평가에 한정. 「さすが」와 함께 자주 씀. 「〜だけに」는 부정적 감정에도 가능.","ex":"{有名|ゆうめい}な{店|みせ}だけあって、{料理|りょうり}がうまい。","exk":"유명한 가게인 만큼 요리가 맛있다."},{"i":57,"t":"〜がたい","c":"빈출 확장","conn":"Vます어간 + がたい","m":"~하기 어렵다 (심리적)","tip":"「{信|しん}じがたい」「{言|い}いがたい」처럼 마음의 저항. 「〜にくい」는 물리적 어려움.","ex":"そんな{話|はなし}は{信|しん}じがたい。","exk":"그런 이야기는 믿기 어렵다."},{"i":58,"t":"〜っぱなし","c":"빈출 확장","conn":"Vます어간 + っぱなし","m":"~한 채로 내버려둠","tip":"부정적 평가. 「{開|あ}けっぱなし」「{置|お}きっぱなし」처럼 그대로 둔 상태.","ex":"{窓|まど}を{開|あ}けっぱなしにして{出|で}かけた。","exk":"창문을 열어 둔 채 외출했다."},{"i":59,"t":"〜がち","c":"빈출 확장","conn":"Vます어간 / {名詞|めいし} + がち","m":"~하기 쉽다 (좋지 않은 경향)","tip":"부정적 경향. 「{病気|びょうき}がち」「{遅|おく}れがち」「{曇|くも}りがち」. 「〜{気味|きみ}」는 정도가 약간 있음.","ex":"{冬|ふゆ}は{運動|うんどう}{不足|ふそく}になりがちだ。","exk":"겨울에는 운동 부족이 되기 쉽다."},{"i":60,"t":"〜{気味|きみ}","c":"빈출 확장","conn":"{名詞|めいし} / Vます어간 + {気味|きみ}","m":"~기미가 있다","tip":"정도가 조금 있는 상태. 「{疲|つか}れ{気味|きみ}」「{太|ふと}り{気味|きみ}」. 「〜がち」보다 가볍고 일시적.","ex":"{最近|さいきん}、{疲|つか}れ{気味|きみ}だ。","exk":"요즘 피곤한 기미가 있다."}]},"quiz":{"quiz":[{"i":1,"tag":"문맥 규정","q":"{会議|かいぎ}は{来週|らいしゅう}に______された。","opts":["{延期|えんき}","{延長|えんちょう}","{継続|けいぞく}","{移転|いてん}"],"a":0,"tr":"회의는 다음 주로 연기되었다.","exp":"날짜를 뒤로 미루는 것은 延期(えんき). 延長은 이미 정한 기간을 늘리는 것(회의 시간 연장 등), 継続은 계속함, 移転은 장소를 옮기는 것."},{"i":2,"tag":"문맥 규정","q":"{台風|たいふう}の______で、{多|おお}くの{便|びん}が{欠航|けっこう}した。","opts":["{影響|えいきょう}","{反映|はんえい}","{映像|えいぞう}","{印象|いんしょう}"],"a":0,"tr":"태풍의 영향으로 많은 편이 결항했다.","exp":"影響(えいきょう)=영향. 反映=반영, 映像=영상, 印象=인상. '영향으로'는 影響で."},{"i":3,"tag":"문맥 규정","q":"{会社|かいしゃ}は{新|あたら}しい______を{発表|はっぴょう}し、{在宅|ざいたく}{勤務|きんむ}を{進|すす}めることにした。","opts":["{方針|ほうしん}","{方向|ほうこう}","{方法|ほうほう}","{方式|ほうしき}"],"a":0,"tr":"회사는 새로운 방침을 발표하고 재택근무를 추진하기로 했다.","exp":"方針(ほうしん)=방침, 기본적인 나아갈 방향. 方向은 물리적 방향이나 추세, 方法은 방법, 方式은 방식·시스템."},{"i":4,"tag":"문맥 규정","q":"{都市|とし}と{地方|ちほう}の______が{問題|もんだい}になっている。","opts":["{格差|かくさ}","{区別|くべつ}","{誤差|ごさ}","{差別|さべつ}"],"a":0,"tr":"도시와 지방의 격차가 문제가 되고 있다.","exp":"格差(かくさ)=사회적 격차. 区別=구별, 誤差=오차, 差別=차별."},{"i":5,"tag":"문맥 규정","q":"{彼|かれ}の{説明|せつめい}には______がなく、{誰|だれ}も{納得|なっとく}しなかった。","opts":["{説得|せっとく}{力|りょく}","{理解|りかい}{力|りょく}","{表現|ひょうげん}{力|りょく}","{注意|ちゅうい}{力|りょく}"],"a":0,"tr":"그의 설명에는 설득력이 없어서 아무도 납득하지 않았다.","exp":"説得力(せっとくりょく)=설득력. '説得力がない'로 '납득시키는 힘이 없다'."},{"i":6,"tag":"문맥 규정","q":"この{講座|こうざ}は{初心|しょしん}{者|しゃ}を______としている。","opts":["{対象|たいしょう}","{対照|たいしょう}","{対比|たいひ}","{対応|たいおう}"],"a":0,"tr":"이 강좌는 초보자를 대상으로 하고 있다.","exp":"対象(たいしょう)=대상. 対照(たいしょう)는 발음이 같지만 '대조'라는 뜻. 対比=대비, 対応=대응."},{"i":7,"tag":"문맥 규정","q":"{彼|かれ}は{毎日|まいにち}{少|すこ}しずつお{金|かね}を______いる。","opts":["{蓄|たくわ}えて","{数|かぞ}えて","{比|くら}べて","{支|ささ}えて"],"a":0,"tr":"그는 매일 조금씩 돈을 모으고 있다.","exp":"蓄える(たくわえる)=모으다, 비축하다. 数える=세다, 比べる=비교하다, 支える=지탱하다."},{"i":8,"tag":"문맥 규정","q":"{彼|かれ}は{自分|じぶん}の{間違|まちが}いを______。","opts":["{認|みと}めた","{覚|おぼ}えた","{数|かぞ}えた","{疑|うたが}った"],"a":0,"tr":"그는 자신의 잘못을 인정했다.","exp":"認める(みとめる)=인정하다. 覚える=외우다/기억하다, 疑う=의심하다."},{"i":9,"tag":"문맥 규정","q":"{出張|しゅっちょう}の______をまとめて{部長|ぶちょう}に{送|おく}った。","opts":["{報告|ほうこく}{書|しょ}","{説明|せつめい}{書|しょ}","{案内|あんない}{書|しょ}","{申請|しんせい}{書|しょ}"],"a":0,"tr":"출장 보고서를 정리해서 부장에게 보냈다.","exp":"出張の報告書=출장 보고서. 説明書=설명서, 案内書=안내서, 申請書=신청서."},{"i":10,"tag":"문맥 규정","q":"その{判断|はんだん}は______だと{思|おも}う。","opts":["{妥当|だとう}","{相当|そうとう}","{当然|とうぜん}","{対|たい}{等|とう}"],"a":0,"tr":"그 판단은 타당하다고 생각한다.","exp":"妥当(だとう)=타당함. 相当=상당, 当然=당연, 対等=대등. 適当은 '적당'이지만 '대충'이라는 뉘앙스가 강해 이런 판단 문장에는 잘 쓰지 않음."},{"i":11,"tag":"문맥 규정","q":"{長|なが}い______の{結果|けっか}、{新|あたら}しい{案|あん}を{採用|さいよう}することになった。","opts":["{話|はな}し{合|あ}い","{言|い}い{合|あ}い","{知|し}り{合|あ}い","{待|ま}ち{合|あ}わせ"],"a":0,"tr":"긴 논의 끝에 새로운 안을 채택하게 되었다.","exp":"話し合い=논의. 言い合い=말다툼, 知り合い=지인, 待ち合わせ=약속 장소에서 만나기."},{"i":12,"tag":"문맥 규정","q":"この{会社|かいしゃ}は{海外|かいがい}{企業|きぎょう}と______している。","opts":["{提携|ていけい}","{提供|ていきょう}","{提案|ていあん}","{提出|ていしゅつ}"],"a":0,"tr":"이 회사는 해외 기업과 제휴하고 있다.","exp":"提携(ていけい)=제휴. 提供=제공, 提案=제안, 提出=제출. 모두 てい케이 계열 발음 함정."},{"i":13,"tag":"유의 표현","q":"「たまたま」と{意味|いみ}が{最|もっと}も{近|ちか}いものはどれか。","opts":["{偶然|ぐうぜん}","{突然|とつぜん}","{当然|とうぜん}","{自然|しぜん}"],"a":0,"tr":"「たまたま」와 의미가 가장 가까운 것은 어느 것인가.","exp":"たまたま=우연히. 突然=갑자기, 当然=당연히, 自然=자연히."},{"i":14,"tag":"유의 표현","q":"「{明|あき}らかな」と{意味|いみ}が{最|もっと}も{近|ちか}いものはどれか。","opts":["はっきりした","あいまいな","くわしい","めずらしい"],"a":0,"tr":"「明らかな」와 의미가 가장 가까운 것은 어느 것인가.","exp":"明らかな=명백한 → はっきりした(분명한). あいまいな=애매한."},{"i":15,"tag":"유의 표현","q":"「{異|こと}なる」と{意味|いみ}が{最|もっと}も{近|ちか}いものはどれか。","opts":["{違|ちが}う","{変|か}わる","{似|に}る","{合|あ}う"],"a":0,"tr":"「異なる」와 의미가 가장 가까운 것은 어느 것인가.","exp":"異なる=다르다 → 違う. 変わる=변하다, 似る=닮다, 合う=맞다."},{"i":16,"tag":"유의 표현","q":"「{思|おも}いきって」と{意味|いみ}が{最|もっと}も{近|ちか}いものはどれか。","opts":["{勇気|ゆうき}を{出|だ}して","あわてて","しかたなく","いやいや"],"a":0,"tr":"「思いきって」와 의미가 가장 가까운 것은 어느 것인가.","exp":"思いきって=큰맘 먹고, 과감하게 → 勇気を出して(용기를 내어)."},{"i":17,"tag":"유의 표현","q":"「{面倒|めんどう}な」と{意味|いみ}が{最|もっと}も{近|ちか}いものはどれか。","opts":["{手間|てま}がかかる","{危険|きけん}な","{退屈|たいくつ}な","{地味|じみ}な"],"a":0,"tr":"「面倒な」와 의미가 가장 가까운 것은 어느 것인가.","exp":"面倒な=번거로운, 손이 많이 가는 → 手間がかかる(품이 든다)."},{"i":18,"tag":"유의 표현","q":"「{手軽|てがる}な」と{意味|いみ}が{最|もっと}も{近|ちか}いものはどれか。","opts":["{簡単|かんたん}な","{贅沢|ぜいたく}な","{幼稚|ようち}な","{大変|たいへん}な"],"a":0,"tr":"「手軽な」와 의미가 가장 가까운 것은 어느 것인가.","exp":"手軽な=손쉬운, 간편한 → 簡単な. 贅沢な=사치스러운."},{"i":19,"tag":"한자 읽기","q":"継続","opts":["けいぞく","けいそく","けいしょう","けいぞう"],"a":0,"tr":"계속 (이어서 함)","exp":"継続=けいぞく. そ가 아니라 ぞ(탁음). 장음 けい·ぞく까지 정확히."},{"i":20,"tag":"한자 읽기","q":"貿易","opts":["ぼうえき","もうえき","ぼうやく","ぼくえき"],"a":0,"tr":"무역","exp":"貿易=ぼうえき. 貿는 음독 ぼう."},{"i":21,"tag":"한자 읽기","q":"期限切れ","opts":["きげんぎれ","きかんぎれ","きげんきれ","きけんぎれ"],"a":0,"tr":"기한 만료 (유효기간이 지남)","exp":"期限切れ=きげんぎれ. 切れ가 뒤에 붙어 탁음화(ぎれ)."},{"i":22,"tag":"한자 읽기","q":"軽傷","opts":["けいしょう","けいそう","けいざい","けいしょく"],"a":0,"tr":"가벼운 상처 (경상)","exp":"軽傷=けいしょう. 軽는 けい, 傷는 しょう(장음 주의)."},{"i":23,"tag":"한자 읽기","q":"模範","opts":["もはん","もうはん","まはん","もばん"],"a":0,"tr":"모범","exp":"模範=もはん. もうはん으로 장음화하지 않도록 주의."},{"i":24,"tag":"한자 읽기","q":"極端","opts":["きょくたん","ごくたん","きょくはん","きょっかん"],"a":0,"tr":"극단","exp":"極端=きょくたん. 極는 음독 きょく."},{"i":25,"tag":"한자 읽기","q":"勢い","opts":["いきおい","いきよい","いきごみ","ちから"],"a":0,"tr":"기세","exp":"勢い=いきおい. 훈독 명사. いきよい(勢いよく)는 부사형."},{"i":26,"tag":"문법","q":"{緊張|きんちょう}の______、スピーチの{内容|ないよう}を{全部|ぜんぶ}{忘|わす}れてしまった。","opts":["あまりに","ばかりに","うちに","{次第|しだい}"],"a":0,"tr":"긴장한 나머지 연설 내용을 전부 잊어버렸다.","exp":"감정 명사에 붙어 '너무 ~한 나머지'는 名詞+の+あまり. ばかりに는 동사·형용사에 붙어 '~한 탓에'."},{"i":27,"tag":"문법","q":"{電車|でんしゃ}が{遅|おく}れた______、{遅刻|ちこく}してしまった。","opts":["ものだから","ものの","ものなら","ものか"],"a":0,"tr":"전철이 늦는 바람에 지각하고 말았다.","exp":"변명하듯 이유를 말하는 구어 표현은 ものだから. ものの는 '~이긴 하지만' 역접."},{"i":28,"tag":"문법","q":"{高|たか}い______、{味|あじ}はそれほどでもない。","opts":["わりに","ばかりに","だけに","あまり"],"a":0,"tr":"값이 비싼 데 비해 맛은 그다지 좋지 않다.","exp":"기대와 실제의 불균형은 わりに. だけに는 '~인 만큼'으로 기대에 맞는 결과."},{"i":29,"tag":"문법","q":"{知|し}らない______、{知|し}ったふりをする。","opts":["くせに","ものの","わりに","とはいえ"],"a":0,"tr":"모르면서도 아는 척을 한다.","exp":"비난·경멸의 감정은 くせに. 사람의 행동에만 씀."},{"i":30,"tag":"문법","q":"{余計|よけい}なことを{言|い}った______、{嫌|きら}われてしまった。","opts":["ばかりに","ものの","くせに","わりに"],"a":0,"tr":"쓸데없는 말을 한 탓에 미움을 받고 말았다.","exp":"하나의 원인 때문에 나쁜 결과 → ばかりに. 뒤에는 반드시 부정적 결과."},{"i":31,"tag":"문법","q":"{引|ひ}き{受|う}けた______、{最後|さいご}まで{責任|せきにん}を{持|も}ってやる。","opts":["からには","からこそ","からといって","からして"],"a":0,"tr":"맡은 이상 끝까지 책임지고 하겠다.","exp":"'맡은 이상'이라는 결의는 からには. 뒤에 べきだ·つもりだ·なければならない 등이 옴."},{"i":32,"tag":"문법","q":"{経験|けいけん}の{有無|うむ}______、{誰|だれ}でも{応募|おうぼ}できます。","opts":["を{問|と}わず","をめぐって","に{沿|そ}って","を{通|つう}じて"],"a":0,"tr":"경험 유무를 불문하고 누구나 응모할 수 있습니다.","exp":"대비되는 개념을 불문한다는 뜻은 を問わず. をめぐって는 '~을 둘러싸고'."},{"i":33,"tag":"문법","q":"その{計画|けいかく}______、{議論|ぎろん}が{続|つづ}いている。","opts":["をめぐって","を{問|と}わず","に{基|もと}づいて","に{応|おう}じて"],"a":0,"tr":"그 계획을 둘러싸고 논의가 이어지고 있다.","exp":"논의·대립의 대상은 をめぐって. 뒤에 議論·争い가 오는 것이 정형."},{"i":34,"tag":"문법","q":"ドアを{開|あ}けるか{開|あ}けないかの______、{雨|あめ}が{降|ふ}り{出|だ}した。","opts":["うちに","たびに","とたん","{最中|さいちゅう}に"],"a":0,"tr":"문을 열자마자 비가 내리기 시작했다.","exp":"「~か~ないかのうちに」로 '~하자마자'. とたん은 Vた에 붙으므로 접속이 맞지 않음."},{"i":35,"tag":"문법","q":"{上司|じょうし}の{命令|めいれい}なら、______を{得|え}ない。","opts":["{従|したが}わざる","{従|したが}うざる","{従|したが}わないざる","{従|したが}わせざる"],"a":0,"tr":"상사의 명령이라면 따르지 않을 수 없다.","exp":"「ざるを得ない」는 ない형 어간에 붙음. 従う→従わ+ざるを得ない. する는 せざるを得ない."},{"i":36,"tag":"문법","q":"そんなに{働|はたら}けば、{体|からだ}を{壊|こわ}し______。","opts":["かねない","かねる","がたい","ようがない"],"a":0,"tr":"그렇게 일하면 몸을 상할지도 모른다.","exp":"나쁜 가능성은 かねない. かねる는 '~하기 어렵습니다'라는 정중한 거절."},{"i":37,"tag":"문법","q":"{春|はる}______、まだ{寒|さむ}い{日|ひ}が{続|つづ}く。","opts":["とはいえ","とは{限|かぎ}らず","というより","とすれば"],"a":0,"tr":"봄이라고는 해도 아직 추운 날이 이어진다.","exp":"'봄이라고는 해도'는 とはいえ. 앞을 인정하며 뒤에서 제한을 붙임."}]},"reading":{"strategy":{"types":[{"name":"단문 이해","jp":"内容理解（短文）","len":"200자 안팎","ask":"요지·세부 내용","time":"1문항 2~3분","how":"첫 문장과 마지막 문장에 요지가 오는 경우가 많음. 질문만 먼저 읽고 각 단락 첫·끝 문장부터 확인."},{"name":"중문 이해","jp":"内容理解（中文）","len":"500자 안팎","ask":"이유·인과관계","time":"지문당 5~6분","how":"「なぜなら」「そのため」 앞뒤의 인과를 표시하며 읽기. 단락마다 한 줄 요지를 머릿속으로 정리."},{"name":"통합 이해","jp":"統合理解","len":"A·B 두 지문 (합계 600자)","ask":"공통점·차이점","time":"8분","how":"A를 읽고 입장을 한 줄로 요약 → B도 같은 방식 → 그다음 비교. 두 글이 반대라고 미리 정하지 말 것."},{"name":"주장 이해","jp":"主張理解（長文）","len":"900자 안팎","ask":"필자가 가장 말하고 싶은 것","time":"10~12분","how":"일반론(~と言われている)과 필자 의견(~のではないか)을 구분. しかし 뒤에 주장이 오는 경우가 많음."},{"name":"정보 검색","jp":"情報検索","len":"안내문·표 700자 안팎","ask":"조건에 맞는 항목 찾기","time":"5분","how":"지문을 읽지 말고 질문의 인물 조건부터 뽑아 표와 대조. ※주석·ただし 뒤를 반드시 확인."}],"order":["정보 검색 (쉬운 득점을 먼저 확보)","단문","중문","통합 이해","주장 이해 (장문은 마지막에 집중해서)"],"rules":["질문 선독: 지문보다 질문·선지를 먼저 읽고 무엇을 찾을지 정한 뒤 해당 부분만 스캔. 문항당 30~40초가 줄어든다.","선지는 마지막에: ① 질문만 읽기 ② 각 단락 첫·끝 문장 ③ 질문이 가리키는 곳 ±1문장 ④ 그다음 선지. 선지를 먼저 읽으면 그럴듯한 오답이 머리에 남아 본문에서 그 선지를 지지하는 곳을 찾게 된다.","2분 룰: 단문 1문항에 2분을 넘기면 △표시하고 넘어간다. 한 문제에 붙잡히면 뒤의 장문이 통째로 날아간다.","역접 뒤가 답: しかし·だが·ところが 뒤 문장이 필자의 주장인 경우가 매우 많다. 역접이 보이면 집중도 최대.","確かに〜しかし: 「確かに」 뒤는 필자가 인정만 한 다른 사람의 생각. 오답 선지는 대개 이 부분에서 만들어진다. 답은 「しかし」 뒤에 있다.","지시어는 직전 문장: 「それ」「その」가 무엇을 가리키는지 묻는 문제는 바로 앞 문장·절에 답이 있는 경우가 대부분.","지시어 대입 테스트: 「それ」의 후보를 그 문장에 실제로 넣어 읽어 본다. 문장이 어색해지면 오답. 10초면 끝나고 한 문항을 살린다.","이중부정 = 완곡한 긍정: わけではない(전부 그런 건 아니다)·とは限らない(반드시 그렇지는 않다)·ないことはない(아닌 것도 아니다). 선지에서 긍정으로 바꿔 말한 것이 정답인 경우가 많다.","극단어 경보: 必ず·絶対·すべて·まったく·最も가 들어간 선지는 지문이 「〜傾向がある」처럼 조심스럽게 말한 경우가 많아 오답이 되기 쉽다.","오답 3패턴: ①지문 단어를 그대로 썼지만 논지가 반대 ②「必ず」「絶対」 같은 과장·극단 ③지문에 없는 정보를 덧붙임. 이 셋은 의심부터.","시간 총량(연습용): 언어지식 약 30분 + 독해 약 65분 + 검토 5분. 독해는 105분 한 블록 안에서 반드시 시계를 본다.","모르는 단어에서 멈추지 않기: 한 단어에 30초 이상 쓰면 계획이 무너진다. 문맥으로 추측하고 넘어간 뒤 질문과 선택지 기준으로 돌아온다."],"connectives":[{"w":"しかし・だが","m":"그러나 (역접)","role":"뒤에 필자 주장이 온다"},{"w":"つまり・要するに","m":"즉, 요컨대","role":"앞 내용의 결론·바꿔 말하기"},{"w":"なぜなら","m":"왜냐하면","role":"뒤에 이유·근거"},{"w":"たとえば","m":"예를 들어","role":"구체 예시 — 흐름만 잡고 넘어가도 됨"},{"w":"したがって・そのため","m":"따라서, 그 때문에","role":"원인 → 결과"},{"w":"一方・これに対して","m":"한편, 이에 반해","role":"대조 — 통합 이해의 핵심 신호"},{"w":"その結果","m":"그 결과","role":"결과 제시"},{"w":"ただし・なお","m":"단, 또한","role":"예외·보충 — 정보 검색의 함정 위치"},{"w":"むしろ","m":"오히려","role":"앞을 부정하고 다른 쪽을 강조"},{"w":"とはいえ","m":"그렇다고는 해도","role":"인정한 뒤 조건·한계를 붙임"}],"pointers":[{"w":"これ・この","m":"바로 앞에서 말한 내용 전체 또는 가까운 것"},{"w":"それ・その","m":"직전 문장·절에서 말한 내용 (가장 빈출)"},{"w":"あれ・あの","m":"둘 다 아는 먼 내용·과거"},{"w":"そう・そのように","m":"앞에서 말한 방법·상태"},{"w":"そのため","m":"바로 앞의 원인 → 결과"},{"w":"それでも","m":"그래도 (앞을 인정하고 반대 사실)"}],"claims":[{"w":"〜のではないか（だろうか）","m":"~한 것이 아닐까 — 필자의 완곡한 주장"},{"w":"〜べきだ・〜べきではない","m":"~해야 한다 — 당위 주장"},{"w":"〜と言われている","m":"~라고들 한다 — 일반론. 필자 의견과 구별!"},{"w":"〜とは限らない","m":"반드시 ~는 아니다 — 부분 부정"},{"w":"〜わけではない","m":"전부 ~인 것은 아니다 — 부분 부정. 선지에서는 긍정으로 바꿔 말한다"},{"w":"〜ないことはない","m":"~하지 않는 것은 아니다 — 이중부정(완곡한 긍정)"},{"w":"〜にほかならない","m":"다름 아닌 ~이다 — 단정"},{"w":"〜のではない。〜のだ","m":"~이 아니다. ~이다 — 주장의 핵심 대비"}],"integration":["A를 읽고 입장을 한 줄로 적는다 → B도 같은 방식으로 → 그다음 비교. 두 글을 번갈아 읽으면 헷갈린다.","먼저 '두 글이 함께 인정하는 점'과 '강조점이 다른 곳'을 나눈다. 정반대라고 정해 놓고 읽으면 두 문항을 다 잃는다.","정답은 대개 'AもBも〜を否定していない' / '각각 다른 장점을 말하고 있다'. 한쪽이 우월하다고 단정한 선지는 의심.","A의 의견을 B의 것으로 바꿔 놓은 선지가 단골. A·B 표시를 선지와 하나씩 맞춰 본다.","질문이 '공통점'인지 '차이'인지 먼저 확인. 방향을 착각하면 답이 정반대가 된다."],"options":["주어가 바뀌지 않았는가 (필자 → 일반인, A → B)","시제가 바뀌지 않았는가 (예정 → 완료, 했더라 → 한다)","조건이 넓어지지 않았는가 (一部 → すべて, 場合によって → 必ず)","지문에 없는 정보가 붙지 않았는가 (없는 이유·대상·수치)","지문 단어를 그대로 쓴 선지일수록 한 번 더 의심 (정답은 말을 바꾼 言い換え가 많다)"],"infoTips":["질문 속 인물의 조건(요일·시간·금액·수준·대상)에 번호를 붙여 적는다. 지문을 먼저 읽지 않는다.","후보마다 조건을 하나씩 대조하고, 어긋나는 즉시 지운다. 모든 조건을 다 확인할 필요는 없다.","※·ただし·なお로 시작하는 줄은 예외 없이 정답과 관련된다. 마지막 30초는 주석 확인에 쓴다.","「別途」「教材費」「入会金」이 보이면 다른 금액을 더해야 한다는 신호. 총액을 묻는 문제가 함정.","「税込」「税別」이 섞여 있으면 세금을 맞춘 뒤 비교. 한쪽만 税別인 표가 단골.","「割引の併用はできません」= 할인은 하나만. 20%+10%=30%로 계산하면 오답.","경계값 4종: 以上(이상, 포함) / 以下(이하, 포함) / 未満(미만, 불포함) / 超える(초과, 불포함). 「以内」도 경계 포함.","거주·재직 조건: 「平日は市内在住者のみ／土曜は市内在勤・在学者も可」처럼 표 본문만 보면 탈락, 주석까지 보면 통과하는 예외가 붙는다.","「先着順」과 「抽選」은 다르다. 先着順이면 신청이 늦으면 끝, 抽選이면 기간 안에 넣기만 하면 기회는 같다."],"bounds":[{"w":"以上","k":"いじょう","m":"~ 이상 (경계 포함)"},{"w":"以下","k":"いか","m":"~ 이하 (경계 포함)"},{"w":"以内","k":"いない","m":"~ 이내 (경계 포함)"},{"w":"未満","k":"みまん","m":"~ 미만 (경계 불포함)"},{"w":"超える","k":"こえる","m":"~ 초과 (경계 불포함)"}]},"passages":[{"id":1,"type":"단문 이해","len":"약 150자","title":"수면과 생활 리듬","text":"「{睡眠|すいみん}{時間|じかん}を{増|ふ}やせば{健康|けんこう}になれる」と{考|かんが}える{人|ひと}は{多|おお}い。しかし、{大切|たいせつ}なのは{長|なが}さだけではない。{毎日|まいにち}ほぼ{同|おな}じ{時刻|じこく}に{寝|ね}て、{同|おな}じ{時刻|じこく}に{起|お}きるリズムのほうが、{体|からだ}に{強|つよ}く{影響|えいきょう}するという{研究|けんきゅう}もある。{週末|しゅうまつ}に{長|なが}く{寝|ね}て{平日|へいじつ}の{不足|ふそく}を{埋|う}めようとしても、{体内|たいない}{時計|とけい}は{一|いち}{度|ど}には{戻|もど}らない。まずは{起|お}きる{時刻|じこく}をそろえることから{始|はじ}めてはどうだろう。","summary":"핵심은 수면 '시간'이 아니라 '리듬'. 주말 몰아자기로는 체내시계가 한 번에 돌아오지 않으니, 우선 일어나는 시각을 일정하게 맞추라는 제안.","tr":"「수면 시간을 늘리면 건강해진다」고 생각하는 사람은 많다. 그러나 중요한 것은 길이만이 아니다. 매일 거의 같은 시각에 자고 같은 시각에 일어나는 리듬이 몸에 더 강하게 영향을 준다는 연구도 있다. 주말에 오래 자서 평일의 부족을 채우려 해도 체내시계는 한 번에 돌아오지 않는다. 우선은 일어나는 시각을 맞추는 것부터 시작해 보면 어떨까.","questions":[{"q":"{筆者|ひっしゃ}の{考|かんが}えに{最|もっと}も{近|ちか}いものはどれか。","opts":["{睡眠|すいみん}{時間|じかん}を{長|なが}くすれば{必|かなら}ず{健康|けんこう}になれる。","{週末|しゅうまつ}に{長|なが}く{寝|ね}て{平日|へいじつ}の{不足|ふそく}を{補|おぎな}うのがよい。","{起|お}きる{時刻|じこく}を{一定|いってい}にすることが{大切|たいせつ}だ。","{体内|たいない}{時計|とけい}は{週末|しゅうまつ}に{簡単|かんたん}に{戻|もど}すことができる。"],"a":2,"exp":"「しかし」の後が主張。「大切なのは長さだけではない」「まずは起きる時刻をそろえることから」から、起床時刻を一定にすることを勧めている。1·2는 필자가 부정한 내용, 4는 「体内時計は一度には戻らない」와 반대. 1번의 「必ず」도 극단어라 소거 근거가 된다."}]},{"id":2,"type":"중문 이해","len":"약 220자","title":"보고의 양보다 질","text":"{会社|かいしゃ}では「{報告|ほうこく}・{連絡|れんらく}・{相談|そうだん}が{大切|たいせつ}だ」とよく{言|い}われる。しかし、{何|なん}でも{報告|ほうこく}すればいいというわけではない。{忙|いそが}しい{上司|じょうし}にとって、{判断|はんだん}の{必要|ひつよう}がない{細|こま}かい{報告|ほうこく}は、{仕事|しごと}の{手|て}を{止|と}めさせる{邪魔|じゃま}になることもある。{大切|たいせつ}なのは、{相手|あいて}が{決|き}める{必要|ひつよう}があるかどうかを{自分|じぶん}で{考|かんが}えてから{伝|つた}えることだ。たとえば、{金額|きんがく}の{小|ちい}さい{買|か}い{物|もの}なら{自分|じぶん}で{判断|はんだん}し、{結果|けっか}だけを{伝|つた}える。{逆|ぎゃく}に、{他|た}の{部署|ぶしょ}に{影響|えいきょう}する{話|はなし}は{早|はや}めに{相談|そうだん}する。{報告|ほうこく}の{量|りょう}を{増|ふ}やすより、{質|しつ}を{上|あ}げるほうが、{結局|けっきょく}は{信頼|しんらい}につながる。","summary":"'많이 보고'가 아니라 '상대가 판단해야 하는 일인지'를 먼저 생각하고 전한다. 예시(소액 구매=스스로 판단 후 결과만 / 타 부서 영향=일찍 상의)로 양보다 질을 뒷받침.","tr":"회사에서는 「보고·연락·상담이 중요하다」고 흔히 말한다. 그러나 무엇이든 보고하면 된다는 것은 아니다. 바쁜 상사에게 판단이 필요 없는 자잘한 보고는 일손을 멈추게 하는 방해가 되기도 한다. 중요한 것은 상대가 결정할 필요가 있는지를 스스로 생각한 뒤 전하는 것이다. 예를 들어 금액이 작은 구매라면 스스로 판단하고 결과만 전한다. 반대로 다른 부서에 영향을 주는 이야기는 일찍 상담한다. 보고의 양을 늘리기보다 질을 높이는 쪽이 결국 신뢰로 이어진다.","questions":[{"q":"{筆者|ひっしゃ}が{最|もっと}も{言|い}いたいことはどれか。","opts":["{報告|ほうこく}の{量|りょう}を{増|ふ}やせば{信頼|しんらい}される。","{相手|あいて}が{判断|はんだん}する{必要|ひつよう}があるかを{考|かんが}えてから{報告|ほうこく}することが{大切|たいせつ}だ。","{細|こま}かいことほど{詳|くわ}しく{報告|ほうこく}したほうがよい。","{上司|じょうし}には{結果|けっか}だけを{伝|つた}えればよい。"],"a":1,"exp":"「大切なのは、相手が決める必要があるかどうかを自分で考えてから伝えることだ」が要旨。量より質という結論にもつながる. 4번은 예시 하나(소액 구매)를 전체 규칙으로 넓힌 함정(一部→全部)."},{"q":"{細|こま}かい{報告|ほうこく}が{問題|もんだい}になるのはなぜか。","opts":["{情報|じょうほう}が{不足|ふそく}するから。","{上司|じょうし}の{判断|はんだん}が{間違|まちが}うから。","{上司|じょうし}の{仕事|しごと}を{止|と}めさせることになるから。","{報告|ほうこく}の{内容|ないよう}が{正確|せいかく}でないから。"],"a":2,"exp":"「判断の必要がない細かい報告は、仕事の手を止めさせる邪魔になることもある」とある。1·4는 지문에 없는 내용, 2는 지문의 논지와 다름."}]},{"id":3,"type":"주장 이해 (장문)","len":"약 260자","title":"실패에서 배우는 사람","text":"「{失敗|しっぱい}しないように」と{教|おし}えられて{育|そだ}つと、{人|ひと}は{失敗|しっぱい}を{極端|きょくたん}に{恐|おそ}れるようになる。たしかに{失敗|しっぱい}は{痛|いた}い。{時間|じかん}もお{金|かね}も{失|うしな}う。だが、{一|いち}{度|ど}も{失敗|しっぱい}したことのない{人|ひと}には、やり{直|なお}す{力|ちから}が{育|そだ}たない。うまくいかない{原因|げんいん}を{自分|じぶん}で{見|み}つけ、{方法|ほうほう}を{変|か}える。この{繰|く}り{返|かえ}しが、{次|つぎ}の{困難|こんなん}に{耐|た}える{力|ちから}を{生|う}む。だからといって、むやみに{失敗|しっぱい}すればいいわけではない。{同|おな}じ{失敗|しっぱい}を{繰|く}り{返|かえ}さないために{記録|きろく}を{残|のこ}すこと。{失敗|しっぱい}を{隠|かく}さずに{話|はな}せる{相手|あいて}を{持|も}つこと。こうした{準備|じゅんび}があって{初|はじ}めて、{失敗|しっぱい}は「{経験|けいけん}」と{呼|よ}べるものになる。{私|わたし}たちが{育|そだ}てるべきなのは、{失敗|しっぱい}しない{人|ひと}ではなく、{失敗|しっぱい}から{学|まな}べる{人|ひと}なのだ。","summary":"'실패를 두려워하지 말자'에서 끝나지 않는다. 기록을 남기고 숨기지 않고 말할 수 있는 상대를 두는 '준비'가 있어야 실패가 경험이 된다. 마지막 문장이 주장.","tr":"「실패하지 않도록」 가르침을 받으며 자라면 사람은 실패를 극단적으로 두려워하게 된다. 물론 실패는 아프다. 시간도 돈도 잃는다. 그러나 한 번도 실패한 적 없는 사람에게는 다시 해 보는 힘이 자라지 않는다. 잘 안 되는 원인을 스스로 찾아내고 방법을 바꾼다. 이 반복이 다음 어려움을 견디는 힘을 만든다. 그렇다고 함부로 실패하면 된다는 것은 아니다. 같은 실패를 되풀이하지 않도록 기록을 남길 것. 실패를 숨기지 않고 이야기할 수 있는 상대를 둘 것. 이런 준비가 있어야 비로소 실패는 '경험'이라 부를 수 있는 것이 된다. 우리가 키워야 하는 것은 실패하지 않는 사람이 아니라, 실패에서 배울 수 있는 사람이다.","questions":[{"q":"{筆者|ひっしゃ}の{主張|しゅちょう}として{最|もっと}も{適切|てきせつ}なものはどれか。","opts":["{失敗|しっぱい}は{避|さ}けるべきだ。","{失敗|しっぱい}しない{人|ひと}を{育|そだ}てるべきだ。","{失敗|しっぱい}から{学|まな}べる{人|ひと}を{育|そだ}てるべきだ。","{失敗|しっぱい}は{記録|きろく}すればそれでよい。"],"a":2,"exp":"最後の一文「育てるべきなのは、失敗しない人ではなく、失敗から学べる人なのだ」が主張そのもの. 4번은 「記録を残すこと」 하나만 떼어 낸 一部→全部 함정."},{"q":"{失敗|しっぱい}が「{経験|けいけん}」になるために{必要|ひつよう}なこととして、{筆者|ひっしゃ}が{挙|あ}げているものはどれか。","opts":["{失敗|しっぱい}を{早|はや}く{忘|わす}れること。","{失敗|しっぱい}を{記録|きろく}し、{隠|かく}さず{話|はな}せる{相手|あいて}を{持|も}つこと。","{同|おな}じ{失敗|しっぱい}を{何|なん}{度|ど}も{繰|く}り{返|かえ}すこと。","{失敗|しっぱい}したことを{誰|だれ}にも{言|い}わないこと。"],"a":1,"exp":"「記録を残すこと」「失敗を隠さずに話せる相手を持つこと」の二点。隠すこと(4)은 반대, 3은 「むやみに失敗すればいいわけではない」와 어긋난다."}]},{"id":4,"type":"정보 검색","len":"표 + 조건","title":"빵 만들기 교실 안내","text":"パン{作|つく}り{教室|きょうしつ}　{4月|しがつ}{開講|かいこう}（{各|かく}{教室|きょうしつ}とも{月|つき}4{回|かい}）\n\n{教室|きょうしつ}A　{火曜|かよう} 19:00〜21:00　{受講|じゅこう}{料|りょう} {月|げつ}5,000{円|えん}　{定員|ていいん}8{名|めい}　{初級|しょきゅう}\n{教室|きょうしつ}B　{火曜|かよう} 10:00〜12:00　{受講|じゅこう}{料|りょう} {月|げつ}3,500{円|えん}　{定員|ていいん}10{名|めい}　{初級|しょきゅう}\n{教室|きょうしつ}C　{水曜|すいよう} 19:00〜21:00　{受講|じゅこう}{料|りょう} {月|げつ}4,500{円|えん}　{定員|ていいん}6{名|めい}　{中級|ちゅうきゅう}〜{上級|じょうきゅう}\n{教室|きょうしつ}D　{火曜|かよう} 19:30〜21:30　{受講|じゅこう}{料|りょう} {月|げつ}6,000{円|えん}　{定員|ていいん}8{名|めい}　{初級|しょきゅう}\n\n※{受講|じゅこう}{料|りょう}とは{別|べつ}に、{教材|きょうざい}{費|ひ}2,000{円|えん}（{初回|しょかい}のみ）が{必要|ひつよう}です。\n※{4月|しがつ}{10日|とおか}までのお{申|もう}し{込|こ}みは、{入会|にゅうかい}{金|きん}3,000{円|えん}が{無料|むりょう}になります。\n※{定員|ていいん}になり{次第|しだい}、{締|し}め{切|き}ります。\n※{教室|きょうしつ}Cはパン{作|つく}り{経験|けいけん}{者|しゃ}{向|む}けです。\n\n{田中|たなか}さんは{会社|かいしゃ}{員|いん}で、{平日|へいじつ}の{昼間|ひるま}は{働|はたら}いている。{毎週|まいしゅう}{火曜|かよう}{日|び}の{夜|よる}なら{時間|じかん}が{取|と}れる。{月|つき}の{受講|じゅこう}{料|りょう}は5,000{円|えん}{以内|いない}にしたい。パン{作|つく}りは{初|はじ}めてだ。{4月|しがつ}{8日|ようか}に{申|もう}し{込|こ}む{予定|よてい}だ。","summary":"조건은 '화요일 밤 + 월 5,000엔 이내 + 초급'. B는 오전, C는 수요일·중급이라 탈락, A만 세 조건 충족. 4/8 신청은 4/10 이전이라 입회금 무료.","tr":"빵 만들기 교실·4월 개강(각 교실 월 4회)\n\n교실A 화요일 19:00~21:00 수강료 월 5,000엔 정원 8명 초급\n교실B 화요일 10:00~12:00 수강료 월 3,500엔 정원 10명 초급\n교실C 수요일 19:00~21:00 수강료 월 4,500엔 정원 6명 중급~상급\n교실D 화요일 19:30~21:30 수강료 월 6,000엔 정원 8명 초급\n\n※수강료와 별도로 교재비 2,000엔(첫 회만)이 필요합니다.\n※4월 10일까지 신청은 입회금 3,000엔이 무료가 됩니다.\n※정원이 차는 대로 마감합니다.\n※교실C는 빵 만들기 경험자 대상입니다.\n\n다나카 씨는 회사원으로 평일 낮에는 일한다. 매주 화요일 밤이라면 시간을 낼 수 있다. 월 수강료는 5,000엔 이내로 하고 싶다. 빵 만들기는 처음이다. 4월 8일에 신청할 예정이다.","questions":[{"q":"{田中|たなか}さんに{合|あ}う{教室|きょうしつ}はどれか。","opts":["{教室|きょうしつ}A","{教室|きょうしつ}B","{教室|きょうしつ}C","{教室|きょうしつ}D"],"a":0,"exp":"조건은 ①화요일 밤 ②월 수강료 5,000엔 이내 ③초급. B는 화요일이지만 오전 10시라 퇴근 후 불가, C는 수요일+중급, D는 6,000엔으로 예산 초과. A만 세 조건을 모두 만족. 교재비 2,000엔은 어느 교실이든 붙으므로 선택에는 영향이 없다."},{"q":"{4月|しがつ}{8日|ようか}に{申|もう}し{込|こ}む{場合|ばあい}、{田中|たなか}さんに{当|あ}てはまることはどれか。","opts":["{入会|にゅうかい}{金|きん}3,000{円|えん}を{払|はら}う{必要|ひつよう}がある。","{入会|にゅうかい}{金|きん}3,000{円|えん}が{無料|むりょう}になる。","{教材|きょうざい}{費|ひ}はかからない。","{中級|ちゅうきゅう}クラスに{申|もう}し{込|こ}める。"],"a":1,"exp":"「4月10日までのお申し込みは、入会金3,000円が無料」に該当。教材費2,000円は初回のみ必要なので3은 오답."}]},{"id":5,"type":"단문 이해","len":"약 180자","title":"아침 햇빛과 잠","text":"「{朝|あさ}、カーテンを{開|あ}けて{光|ひかり}を{浴|あ}びると、{頭|あたま}がすっきりする」と{感|かん}じたことはないだろうか。{光|ひかり}は{目|め}から{入|はい}り、{体内|たいない}{時計|とけい}をリセットする。だから、{起|お}きたらまず{明|あか}るい{場所|ばしょ}へ{行|い}くのがいい。コーヒーで{目|め}を{覚|さ}ます{人|ひと}も{多|おお}いが、カフェインの{力|ちから}は{一時|いちじ}{的|てき}だ。{朝|あさ}の{光|ひかり}を{浴|あ}びて{体内|たいない}{時計|とけい}が{動|うご}き{出|だ}せば、{夜|よる}も{自然|しぜん}に{眠|ねむ}くなる。{眠|ねむ}りが{浅|あさ}いと{悩|なや}むなら、{夜|よる}の{習慣|しゅうかん}より{朝|あさ}の{過|す}ごし{方|かた}を{変|か}えてみてはどうだろう。","summary":"잠의 문제를 '밤'이 아니라 '아침'에서 푼다. 커피는 일시적, 아침 빛이 체내시계를 리셋해 밤의 졸음을 만든다.","tr":"「아침에 커튼을 열고 빛을 쬐면 머리가 맑아진다」고 느낀 적이 있지 않은가. 빛은 눈으로 들어와 체내시계를 리셋한다. 그래서 일어나면 우선 밝은 곳으로 가는 것이 좋다. 커피로 잠을 깨는 사람도 많지만 카페인의 힘은 일시적이다. 아침 빛을 쬐어 체내시계가 움직이기 시작하면 밤에도 자연스럽게 졸려 온다. 잠이 얕아 고민이라면 밤의 습관보다 아침을 보내는 방식을 바꿔 보면 어떨까.","questions":[{"q":"{筆者|ひっしゃ}の{考|かんが}えに{最|もっと}も{近|ちか}いものはどれか。","opts":["{眠|ねむ}りが{浅|あさ}いのは、コーヒーのせいだ。","{夜|よる}の{習慣|しゅうかん}を{変|か}えれば、{朝|あさ}の{光|ひかり}は{必要|ひつよう}ない。","{眠|ねむ}りのために、{朝|あさ}の{過|す}ごし{方|かた}を{変|か}えてみるのがよい。","{体内|たいない}{時計|とけい}は、{朝|あさ}の{光|ひかり}では{動|うご}き{出|だ}さない。"],"a":2,"exp":"結論は「夜の習慣より朝の過ごし方を変えてみてはどうだろう」。1은 커피를 원인으로 단정(지문은 '일시적'이라고만 함), 2·4는 빛의 역할을 부정해 지문과 반대."}]},{"id":6,"type":"단문 이해","len":"약 220자","title":"계단과 엘리베이터","text":"{駅|えき}の{階段|かいだん}を{上|のぼ}るとき、{人|ひと}はなぜかエレベーターの{前|まえ}で{待|ま}つことが{多|おお}い。{少|すこ}し{歩|ある}けば{早|はや}いのに、である。{理由|りゆう}の{一|ひと}つは、{階段|かいだん}の「{先|さき}」が{見|み}えないことだ。エレベーターは{乗|の}れば{着|つ}くと{思|おも}えるが、{階段|かいだん}は{何|なん}{段|だん}あるか{分|わ}からない。{人|ひと}は、{先|さき}の{見|み}えない{努力|どりょく}を{避|さ}ける。{同|おな}じことが{仕事|しごと}にも{言|い}える。ゴールまでの{道|みち}のりが{見|み}えていると、{人|ひと}は{動|うご}きやすい。{逆|ぎゃく}に、{何|なに}をどこまでやれば{終|お}わるのか{分|わ}からない{仕事|しごと}は、なかなか{手|て}がつかない。{人|ひと}に{頼|たの}むときも、まず{道|みち}のりを{言葉|ことば}にして{示|しめ}したい。","summary":"사람이 계단 대신 엘리베이터를 기다리는 건 '선이 보이지 않는 노력'을 피하기 때문. 같은 원리가 일에도 적용되니, 부탁할 때는 도착점까지의 경로를 먼저 말로 보여 주자.","tr":"역 계단을 오를 때 사람은 왠지 엘리베이터 앞에서 기다리는 경우가 많다. 조금 걸으면 더 빠른데도 그렇다. 이유의 하나는 계단의 '앞'이 보이지 않는다는 것이다. 엘리베이터는 타면 도착한다고 생각할 수 있지만, 계단은 몇 계단인지 알 수 없다. 사람은 앞이 보이지 않는 노력을 피한다. 같은 이야기가 일에도 해당된다. 골까지의 경로가 보이면 사람은 움직이기 쉽다. 반대로 무엇을 어디까지 하면 끝나는지 모르는 일은 좀처럼 손이 붙지 않는다. 남에게 부탁할 때도 먼저 경로를 말로 보여 주고 싶다.","questions":[{"q":"エレベーターの{前|まえ}で{待|ま}つ{人|ひと}が{多|おお}い{理由|りゆう}として、{筆者|ひっしゃ}が{挙|あ}げているものはどれか。","opts":["{階段|かいだん}は{危|あぶ}ないから。","{階段|かいだん}の{先|さき}が{見|み}えないから。","エレベーターのほうが{速|はや}いから。","{歩|ある}くのが{面倒|めんどう}だから。"],"a":1,"exp":"「理由の一つは、階段の『先』が見えないことだ」が根拠。3은 「少し歩けば早い」とあるので 지문과 반대, 4는 그럴듯하지만 필자가 든 이유가 아니다(지문에 없는 이유를 붙인 선지)."},{"q":"この{文章|ぶんしょう}で{筆者|ひっしゃ}が{最|もっと}も{言|い}いたいことはどれか。","opts":["エレベーターをもっと{増|ふ}やすべきだ。","{仕事|しごと}では{近道|ちかみち}を{選|えら}ぶべきだ。","{目標|もくひょう}までの{道|みち}のりを{示|しめ}すことが、{人|ひと}を{動|うご}かす。","{階段|かいだん}を{使|つか}う{人|ひと}は{少|すく}ない。"],"a":2,"exp":"「ゴールまでの道のりが見えていると、人は動きやすい」「まず道のりを言葉にして示したい」가 결론. 1은 예시(엘리베이터)를 정책 제안으로 확대한 함정."}]},{"id":7,"type":"단문 이해","len":"약 170자","title":"이름을 부르는 힘","text":"{人|ひと}に{何|なに}かをお{願|ねが}いするとき、あなたは{相手|あいて}の{名前|なまえ}を{呼|よ}んでいるだろうか。「ちょっと」と{声|こえ}をかけるより、「{田中|たなか}さん」と{呼|よ}んだほうが、{相手|あいて}は{話|はなし}を{聞|き}く{気|き}になる。{名前|なまえ}は、その{人|ひと}を{一人|ひとり}の{人間|にんげん}として{認|みと}めているという{合図|あいず}だからだ。{名前|なまえ}を{呼|よ}ばれた{人|ひと}は、{自分|じぶん}が「{用|よう}を{頼|たの}まれる{人|ひと}」ではなく「{一緒|いっしょ}に{何|なに}かをする{人|ひと}」だと{感|かん}じる。{忙|いそが}しいときほど、{名前|なまえ}を{一声|ひとこえ}{添|そ}える{余裕|よゆう}を{持|も}ちたい。","summary":"'ちょっと'가 아니라 이름을 부르면 상대는 '심부름 대상'이 아니라 '함께 하는 사람'이 된다. 바쁠수록 이름 한마디를 붙이는 여유를 갖자.","tr":"누군가에게 무언가를 부탁할 때, 당신은 상대의 이름을 부르고 있는가. 「잠깐」이라고 말을 거는 것보다 「다나카 씨」라고 부르는 쪽이 상대는 이야기를 들을 마음이 된다. 이름은 그 사람을 한 사람의 인간으로 인정하고 있다는 신호이기 때문이다. 이름을 불린 사람은 자신이 '일을 맡기는 대상'이 아니라 '함께 무언가를 하는 사람'이라고 느낀다. 바쁠 때일수록 이름 한마디를 곁들이는 여유를 갖고 싶다.","questions":[{"q":"{筆者|ひっしゃ}が{言|い}いたいことはどれか。","opts":["{人|ひと}に{頼|たの}みごとをするときは、{名前|なまえ}を{呼|よ}ぶとよい。","「ちょっと」という{呼|よ}び{方|かた}は、{失礼|しつれい}だ。","{忙|いそが}しいときは、{人|ひと}に{頼|たの}むべきではない。","{名前|なまえ}を{知|し}っている{人|ひと}にだけ、{頼|たの}めばよい。"],"a":0,"exp":"「名前を呼んだほうが、相手は話を聞く気になる」+ 마지막 문장이 요지. 2는 「失礼だ」까지 단정하지 않았다(지문은 'より' 정도의 비교), 3·4는 지문에 없는 내용."}]},{"id":8,"type":"중문 이해","len":"약 350자","title":"수고와 애착","text":"{最近|さいきん}、{家電|かでん}の{多|おお}くが{自動|じどう}で{動|うご}くようになった。{掃除|そうじ}{機|き}は{自分|じぶん}で{部屋|へや}を{回|まわ}り、{料理|りょうり}は{材料|ざいりょう}を{入|い}れるだけで{完成|かんせい}する。{確|たし}かに{便利|べんり}だ。{時間|じかん}も{手間|てま}も{減|へ}り、その{分|ぶん}を{別|べつ}のことに{使|つか}える。しかし、すべてを{自動|じどう}にすれば{満足|まんぞく}が{増|ふ}えるかというと、そうではないらしい。\nある{調査|ちょうさ}では、{自分|じぶん}で{豆|まめ}をひいてコーヒーを{入|い}れる{人|ひと}は、{出来上|できあ}がったコーヒーにより{強|つよ}い{愛着|あいちゃく}を{感|かん}じていた。{手間|てま}をかけた{分|ぶん}だけ、ものとの{関係|かんけい}が{深|ふか}まるという。{何|なに}もせずに{結果|けっか}だけを{受|う}け{取|と}っていると、うまくいかなかったときに{原因|げんいん}も{分|わ}からないし、{直|なお}すこともできない。\nもちろん、{忙|いそが}しい{毎日|まいにち}にすべて{手間|てま}をかけるのは{現実|げんじつ}{的|てき}ではない。{大事|だいじ}なのは、{何|なに}を{自動|じどう}に{任|まか}せ、{何|なに}を{自分|じぶん}の{手|て}に{残|のこ}すかを{選|えら}ぶことだ。{便利|べんり}さは{手段|しゅだん}であって、{目的|もくてき}ではない。{手間|てま}の{中|なか}にこそ、{自分|じぶん}が{何|なに}を{大事|だいじ}にしているかが{現|あらわ}れる。","summary":"자동화는 편리하지만 '모두 자동'이 만족을 보장하지 않는다. 손을 거친 것에 애착이 생기고, 문제가 생겼을 때 고칠 수 있다. 핵심은 무엇을 맡기고 무엇을 손에 남길지 고르는 것.","tr":"최근 가전의 상당수가 자동으로 움직이게 되었다. 청소기는 스스로 방을 돌고, 요리는 재료를 넣기만 하면 완성된다. 확실히 편리하다. 시간도 수고도 줄어 그만큼을 다른 일에 쓸 수 있다. 그러나 모두를 자동으로 하면 만족이 늘어나는가 하면, 그렇지 않은 모양이다.\n어떤 조사에서는 직접 콩을 갈아 커피를 내리는 사람이 완성된 커피에 더 강한 애착을 느끼고 있었다. 수고를 들인 만큼 사물과의 관계가 깊어진다고 한다. 아무것도 하지 않고 결과만 받고 있으면, 잘 되지 않았을 때 원인도 알 수 없고 고칠 수도 없다.\n물론 바쁜 일상에 모든 수고를 들이는 것은 현실적이지 않다. 중요한 것은 무엇을 자동에 맡기고 무엇을 자기 손에 남길지 고르는 것이다. 편리함은 수단이지 목적이 아니다. 수고 속에야말로 자신이 무엇을 소중히 여기는지가 드러난다.","questions":[{"q":"{最近|さいきん}の{家電|かでん}について、{筆者|ひっしゃ}はどのように{述|の}べているか。","opts":["{便利|べんり}になったので、{手間|てま}はすべて{減|へ}らすべきだ。","{便利|べんり}になっても、{満足|まんぞく}が{必|かなら}ず{増|ふ}えるとは{限|かぎ}らない。","{自動|じどう}の{家電|かでん}は{壊|こわ}れやすいので、{避|さ}けるべきだ。","{便利|べんり}さと{愛着|あいちゃく}には、{関係|かんけい}がない。"],"a":1,"exp":"「すべてを自動にすれば満足が増えるかというと、そうではないらしい」를 「必ず増えるとは限らない」로 바꿔 쓴 정답(言い換え). 3은 지문에 없는 내용, 4는 「手間をかけた分だけ関係が深まる」와 반대."},{"q":"{自分|じぶん}でコーヒーを{入|い}れる{人|ひと}の{例|れい}から、{筆者|ひっしゃ}が{言|い}いたいことはどれか。","opts":["インスタントコーヒーのほうが{経済|けいざい}{的|てき}だ。","{手間|てま}をかけたものほど、{大切|たいせつ}に{感|かん}じる。","コーヒーは{毎日|まいにち}{飲|の}むと{体|からだ}にいい。","{調査|ちょうさ}の{結果|けっか}は{信用|しんよう}できない。"],"a":1,"exp":"例の直後にある「手間をかけた分だけ、ものとの関係が深まるという」が例の要点. 예시의 소재(커피)에 대한 평가가 아니라 원리를 묻는 문제라는 점에 주의."}]},{"id":9,"type":"중문 이해","len":"약 320자","title":"사과와 설명","text":"{仕事|しごと}で{失敗|しっぱい}したとき、{人|ひと}はまず{謝|あやま}ろうとする。「{申|もう}し{訳|わけ}ありません」と{言|い}えば、その{場|ば}は{収|おさ}まるかもしれない。しかし、{謝|あやま}ることと、{起|お}きたことを{説明|せつめい}することは{別|べつ}だ。\n{謝罪|しゃざい}は{気持|きも}ちを{伝|つた}えるが、{相手|あいて}が{知|し}りたいのは、{何|なに}が{起|お}きたのか、これからどうするのかである。{説明|せつめい}がなければ、{同|おな}じ{失敗|しっぱい}がまた{起|お}きるのではないかという{不安|ふあん}が{残|のこ}る。{実際|じっさい}、{謝|あやま}るだけで{終|お}わる{人|ひと}より、{原因|げんいん}と{対策|たいさく}を{短|みじか}く{報告|ほうこく}する{人|ひと}のほうが、{次|つぎ}の{仕事|しごと}を{任|まか}されやすいという{話|はなし}も{聞|き}く。\nとはいえ、{説明|せつめい}ばかりで{気持|きも}ちがなければ、{冷|つめ}たい{印象|いんしょう}を{与|あた}える。{大切|たいせつ}なのは{順番|じゅんばん}だ。まず{謝|あやま}り、{次|つぎ}に{事実|じじつ}を{伝|つた}え、{最後|さいご}にどうするかを{示|しめ}す。{五|ご}{分|ふん}で{足|た}りる。{謝|あやま}ることを{忘|わす}れずに、{説明|せつめい}することを{恐|おそ}れない。それが、{失敗|しっぱい}を{次|つぎ}の{信頼|しんらい}につなげる{最短|さいたん}の{道|みち}だ。","summary":"사과는 기분을 전할 뿐, 상대가 알고 싶은 것은 '무슨 일이 있었고 앞으로 어떻게 할지'. 순서는 사과 → 사실 → 대책, 5분이면 충분하다.","tr":"일에서 실패했을 때 사람은 우선 사과하려 한다. 「죄송합니다」라고 하면 그 자리는 수습될지도 모른다. 그러나 사과하는 것과 일어난 일을 설명하는 것은 별개다.\n사죄는 기분을 전하지만, 상대가 알고 싶은 것은 무슨 일이 일어났고 앞으로 어떻게 할 것인가이다. 설명이 없으면 같은 실패가 또 일어나지 않을까 하는 불안이 남는다. 실제로 사과만 하고 끝나는 사람보다 원인과 대책을 짧게 보고하는 사람이 다음 일을 맡겨지기 쉽다는 이야기도 들린다.\n그렇다고 설명만 하고 기분이 없으면 차갑다는 인상을 준다. 중요한 것은 순서다. 먼저 사과하고, 다음에 사실을 전하고, 마지막에 어떻게 할지를 보인다. 5분이면 충분하다. 사과하는 것을 잊지 않고, 설명하는 것을 두려워하지 않기. 그것이 실패를 다음의 신뢰로 잇는 가장 짧은 길이다.","questions":[{"q":"{筆者|ひっしゃ}によると、{失敗|しっぱい}したときに{相手|あいて}が{知|し}りたいことは{何|なに}か。","opts":["{謝|あやま}っている{気持|きも}ちの{大|おお}きさ。","{何|なに}が{起|お}きたのか、これからどうするのか。","{失敗|しっぱい}した{人|ひと}の{性格|せいかく}。","{誰|だれ}が{責任|せきにん}を{取|と}るのか。"],"a":1,"exp":"「相手が知りたいのは、何が起きたのか、これからどうするのかである」がそのまま根拠. 4번(책임 소재)은 회사 이야기에서 자연스럽게 떠오르지만 지문에 없는 정보를 붙인 함정."},{"q":"{筆者|ひっしゃ}が{勧|すす}める{順番|じゅんばん}はどれか。","opts":["{説明|せつめい} → {謝罪|しゃざい} → {対策|たいさく}","{対策|たいさく} → {謝罪|しゃざい} → {説明|せつめい}","{謝罪|しゃざい} → {説明|せつめい} → {対策|たいさく}","{原因|げんいん} → {謝罪|しゃざい} → {説明|せつめい}"],"a":2,"exp":"「まず謝り、次に事実を伝え、最後にどうするかを示す」가 그대로 순서. 지문은 '설명도 중요하지만 사과가 먼저'라고 했으므로 설명을 앞세운 1번은 논지 반전."}]},{"id":10,"type":"통합 이해","len":"A·B 합계 약 260자","title":"종이 사전 vs 전자 사전","text":"A\n{紙|かみ}の{辞書|じしょ}のよさは、{引|ひ}くまでの{時間|じかん}にある。{目的|もくてき}の{言葉|ことば}を{探|さが}してページをめくっていると、{隣|となり}に{並|なら}んだ{別|べつ}の{言葉|ことば}が{目|め}に{入|はい}る。{思|おも}いがけない{出会|であ}いがあり、{語彙|ごい}が{自然|しぜん}に{増|ふ}える。{書|か}き{込|こ}みもできるし、どこをよく{見|み}たかが{残|のこ}る。{調|しら}べるというより、{辞書|じしょ}と{話|はな}している{感覚|かんかく}だ。\n\nB\n{電子|でんし}{辞書|じしょ}やアプリの{強|つよ}みは{速|はや}さだ。{分|わ}からない{言葉|ことば}が{出|で}てきたら、その{場|ば}で{数|すう}{秒|びょう}で{引|ひ}ける。{読|よ}み{方|かた}が{分|わ}からない{漢字|かんじ}も、{手書|てが}きで{探|さが}せる。{何|なに}より、{重|おも}い{辞書|じしょ}を{持|も}ち{歩|ある}かなくていい。ただし、{速|はや}さに{慣|な}れると、{一|ひと}つ{一|ひと}つを{覚|おぼ}えなくなるとも{言|い}われる。{調|しら}べた{言葉|ことば}が、{翌日|よくじつ}には{頭|あたま}から{消|き}えているのだ。","summary":"A는 '페이지를 넘기며 만나는 우연한 단어'라는 종이의 장점, B는 '몇 초 만에 찾는 속도'라는 전자의 장점을 말한다. 두 글 모두 상대를 부정하지 않으므로 정답은 '각각 다른 장점'이다.","tr":"A\n종이 사전의 좋은 점은 찾기까지 걸리는 시간에 있다. 목적한 단어를 찾아 페이지를 넘기다 보면 옆에 나란히 놓인 다른 단어가 눈에 들어온다. 뜻밖의 만남이 있고 어휘가 자연스럽게 늘어난다. 필기도 할 수 있고, 어디를 자주 봤는지도 남는다. 찾는다기보다 사전과 이야기하는 감각이다.\n\nB\n전자사전이나 앱의 강점은 속도다. 모르는 단어가 나오면 그 자리에서 몇 초 만에 찾을 수 있다. 읽는 법을 모르는 한자도 손글씨로 찾을 수 있다. 무엇보다 무거운 사전을 들고 다니지 않아도 된다. 다만 속도에 익숙해지면 하나하나를 외우지 않게 된다고도 한다. 찾은 단어가 다음 날이면 머리에서 사라지는 것이다.","questions":[{"q":"AとBの{両方|りょうほう}が{述|の}べていることは{何|なに}か。","opts":["{紙|かみ}の{辞書|じしょ}のほうが、{語彙|ごい}が{増|ふ}える。","それぞれの{辞書|じしょ}に、{長所|ちょうしょ}と{短所|たんしょ}がある。","{電子|でんし}{辞書|じしょ}では、{言葉|ことば}を{覚|おぼ}えられない。","{辞書|じしょ}は{一|いち}{冊|さつ}あれば{十分|じゅうぶん}だ。"],"a":1,"exp":"A는 우연한 만남이라는 장점, B는 속도라는 장점을 말하면서 각각 한계(종이는 느림, 전자는 기억에 남지 않음)를 짚는다 → 공통점은 '각각 장단점이 있다'. 1은 A만의 주장, 2는 B만의 지적, 3은 어느 쪽도 말하지 않았다."},{"q":"{紙|かみ}の{辞書|じしょ}と{電子|でんし}{辞書|じしょ}について、AとBの{考|かんが}え{方|かた}はどのように{違|ちが}うか。","opts":["Aは{偶然|ぐうぜん}の{出会|であ}いを、Bは{速|はや}さを{評価|ひょうか}している。","AもBも、{速|はや}さを{最|もっと}も{重視|じゅうし}している。","Aは{電子|でんし}{辞書|じしょ}を{否定|ひてい}し、Bは{紙|かみ}の{辞書|じしょ}を{否定|ひてい}している。","AもBも、{紙|かみ}の{辞書|じしょ}のほうが{優|すぐ}れていると{考|かんが}えている。"],"a":0,"exp":"A의 중심은 「思いがけない出会い」, B의 중심은 「速さ」. 3처럼 '서로 정반대'로 단정하면 A와 B가 서로를 부정하지 않았다는 점을 놓친 것."}]},{"id":11,"type":"통합 이해","len":"A·B 합계 약 310자","title":"회의는 줄여야 할까","text":"A\n「{会議|かいぎ}は{減|へ}らすべきだ」とよく{言|い}われる。{確|たし}かに、{資料|しりょう}を{読|よ}めば{分|わ}かることを{一|いち}{時間|じかん}かけて{確認|かくにん}する{会議|かいぎ}は{無駄|むだ}だ。しかし、{私|わたし}は{会議|かいぎ}そのものを{減|へ}らすより、{会議|かいぎ}の{目的|もくてき}をはっきりさせるべきだと{思|おも}う。{何|なに}を{決|き}める{会議|かいぎ}なのかが{共有|きょうゆう}されていれば、{一|いち}{時間|じかん}もかからない。{目的|もくてき}のない{会議|かいぎ}は、{短|みじか}くしても{意味|いみ}がない。\n\nB\n「{会議|かいぎ}をなくせば{仕事|しごと}が{進|すす}む」という{意見|いけん}には{賛成|さんせい}できない。{会議|かいぎ}が{長|なが}くなるのは、{参加|さんか}{者|しゃ}が{多|おお}いからだ。だが、{人|ひと}が{集|あつ}まれば、{話|はな}しているうちに{新|あたら}しい{考|かんが}えが{出|で}る。{一人|ひとり}では{思|おも}いつかない{案|あん}が、{雑談|ざつだん}から{生|う}まれることもある。{問題|もんだい}は{長|なが}さではなく、{集|あつ}まる{意味|いみ}があるかどうかだ。{目的|もくてき}が{共有|きょうゆう}されていれば、{一|いち}{時間|じかん}でも{短|みじか}く{感|かん}じる。{減|へ}らすべきなのは、{目的|もくてき}のない{集|あつ}まりである。","summary":"A와 B는 결론이 같다 — 줄일 것은 '회의'가 아니라 '목적 없는 회의'. 차이는 원인 진단: A는 목적 불명확, B는 참가자 수. 두 글이 정반대라고 읽으면 두 문항을 다 잃는다.","tr":"A\n「회의는 줄여야 한다」고 흔히 말한다. 확실히 자료를 읽으면 알 수 있는 것을 한 시간에 걸쳐 확인하는 회의는 무의미하다. 그러나 나는 회의 자체를 줄이기보다 회의의 목적을 분명히 해야 한다고 생각한다. 무엇을 정하는 회의인지가 공유되어 있으면 1시간도 걸리지 않는다. 목적 없는 회의는 짧게 해도 의미가 없다.\n\nB\n「회의를 없애면 일이 진행된다」는 의견에는 찬성할 수 없다. 회의가 길어지는 것은 참가자가 많기 때문이다. 하지만 사람이 모이면 이야기하는 사이에 새로운 생각이 나온다. 혼자서는 떠올리지 못할 안이 잡담에서 생기는 일도 있다. 문제는 길이가 아니라, 모일 의미가 있는지 여부다. 목적이 공유되어 있으면 한 시간도 짧게 느껴진다. 줄여야 하는 것은 목적 없는 모임이다.","questions":[{"q":"AとBの{共通|きょうつう}{点|てん}はどれか。","opts":["{会議|かいぎ}はすべてなくすべきだと{考|かんが}えている。","{会議|かいぎ}の{目的|もくてき}をはっきりさせることが{大切|たいせつ}だと{考|かんが}えている。","{会議|かいぎ}は{長|なが}いほうがよいと{考|かんが}えている。","{会議|かいぎ}の{参加|さんか}{者|しゃ}を{減|へ}らすべきだと{考|かんが}えている。"],"a":1,"exp":"A는 「会議の目的をはっきりさせるべきだ」, B는 「目的が共有されていれば…減らすべきなのは目的のない集まり」 → 두 글 모두 '목적'이 핵심. 통합 이해의 대표 함정은 두 글이 반대라고 미리 정하는 것. 실제로는 결론이 같고 강조점만 다르다."},{"q":"{会議|かいぎ}が{長|なが}くなる{原因|げんいん}について、AとBはそれぞれどう{述|の}べているか。","opts":["Aは{目的|もくてき}が{不|ふ}{明確|めいかく}なこと、Bは{参加|さんか}{者|しゃ}が{多|おお}いことを{挙|あ}げている。","Aは{参加|さんか}{者|しゃ}が{多|おお}いこと、Bは{目的|もくてき}が{不|ふ}{明確|めいかく}なことを{挙|あ}げている。","AもBも、{資料|しりょう}が{多|おお}いことを{挙|あ}げている。","AもBも、{原因|げんいん}は{分|わ}からないと{述|の}べている。"],"a":0,"exp":"A는 「何を決める会議なのかが共有されていれば、一時間もかからない」= 목적 불명확, B는 「会議が長くなるのは、参加者が多いからだ」. 두 사람의 진단을 서로 바꿔 놓은 2번이 단골 함정."}]},{"id":12,"type":"주장 이해 (장문)","len":"약 650자","title":"효율의 시대에 '돌아가는 길'","text":"「もっと{効率|こうりつ}よく」という{言葉|ことば}を、{私|わたし}たちは{毎日|まいにち}のように{聞|き}く。{最短|さいたん}のルート、いちばん{速|はや}い{方法|ほうほう}、{無駄|むだ}のない{手順|てじゅん}。{効率|こうりつ}を{上|あ}げれば、{同|おな}じ{時間|じかん}でより{多|おお}くのことができる。それ{自体|じたい}は、{確|たし}かに{豊|ゆた}かなことなのだろう。\nしかし、{効率|こうりつ}だけを{基準|きじゅん}にすると、{何|なに}かが{失|うしな}われる。{遠回|とおまわ}りして{覚|おぼ}えた{知識|ちしき}は{忘|わす}れにくい。{回|まわ}り{道|みち}をした{経験|けいけん}は、{思|おも}いもよらない{場面|ばめん}で{役|やく}に{立|た}つ。{最短|さいたん}ルートで{目的|もくてき}{地|ち}に{着|つ}いた{人|ひと}は、{途中|とちゅう}に{何|なに}があったかを{知|し}らない。{速|はや}さは、その{分|ぶん}だけ{世界|せかい}を{狭|せま}くする。\n{私|わたし}は、{若|わか}いうちにこそ{無駄|むだ}を{経験|けいけん}すべきだと{思|おも}う。{時間|じかん}に{余裕|よゆう}があるからできる、というだけではない。{無駄|むだ}の{中|なか}では、{自分|じぶん}が{本当|ほんとう}に{興味|きょうみ}を{持|も}つものが{見|み}つかるからだ。{予定|よてい}どおりに{進|すす}んだ{一日|いちにち}より、{寄|よ}り{道|みち}をした{一日|いちにち}のほうが{記憶|きおく}に{残|のこ}っている、という{人|ひと}は{多|おお}い。{効率|こうりつ}の{外側|そとがわ}で、{自分|じぶん}の{感情|かんじょう}が{動|うご}く{瞬間|しゅんかん}があるからだろう。\nもちろん、{締|し}め{切|き}りのある{仕事|しごと}で{遠回|とおまわ}りをするのは、ただの{怠慢|たいまん}だ。{効率|こうりつ}を{求|もと}めるべき{場面|ばめん}はある。{問題|もんだい}は、{効率|こうりつ}をすべての{場面|ばめん}に{当|あ}てはめてしまうことである。{何|なん}のために{速|はや}くするのかを{問|と}わず、{速|はや}さそのものを{目的|もくてき}にすると、{人|ひと}は{自分|じぶん}の{人生|じんせい}を{早送|はやおく}りで{見|み}ているだけになる。\nだからといって、{効率|こうりつ}を{捨|す}てろと{言|い}っているのではない。{節約|せつやく}した{時間|じかん}で{何|なに}をしたいのかを、{先|さき}に{決|き}めておくべきだと{言|い}いたいのだ。{空|あ}いた{時間|じかん}をまた{別|べつ}の{作業|さぎょう}で{埋|う}めるだけなら、{効率|こうりつ}は{私|わたし}たちを{忙|いそが}しくする{道具|どうぐ}にすぎない。\n{道|みち}を{急|いそ}ぐときも、ときには{立|た}ち{止|ど}まって、{今|いま}どこにいるのかを{確|たし}かめたい。{遠回|とおまわ}りを{楽|たの}しめる{余裕|よゆう}こそ、{長|なが}い{目|め}で{見|み}ればいちばんの{効率|こうりつ}なのではないか。","summary":"필자는 효율을 부정하지 않는다. 문제는 '모든 장면에 효율을 적용하는 것'. 절약한 시간으로 무엇을 할지 먼저 정해야 하고, 마지막 문장에서 '돌아가는 길을 즐길 여유가 결국 가장 효율적'이라는 역설로 주장을 닫는다.","tr":"「더 효율적으로」라는 말을 우리는 매일 듣는다. 최단 경로, 가장 빠른 방법, 낭비 없는 절차. 효율을 올리면 같은 시간에 더 많은 일을 할 수 있다. 그것 자체는 확실히 풍요로운 일일 것이다.\n그러나 효율만을 기준으로 하면 무언가가 잃힌다. 돌아가며 외운 지식은 잊히지 않는다. 우회한 경험은 뜻밖의 장면에서 도움이 된다. 최단 경로로 목적지에 도착한 사람은 도중에 무엇이 있었는지 모른다. 속도는 그만큼 세계를 좁힌다.\n나는 젊을 때야말로 낭비를 경험해야 한다고 생각한다. 시간에 여유가 있어서 할 수 있다는 것만이 아니다. 낭비 속에서 자신이 정말로 흥미를 갖는 것이 발견되기 때문이다. 예정대로 진행된 하루보다 들렀다 간 하루가 기억에 남는다고 하는 사람은 많다. 효율의 바깥에서 자기 감정이 움직이는 순간이 있기 때문일 것이다.\n물론 마감이 있는 일에서 우회하는 것은 그저 게으름이다. 효율을 추구해야 하는 장면은 있다. 문제는 효율을 모든 장면에 적용해 버리는 것이다. 무엇을 위해 빠르게 하는지 묻지 않고 속도 자체를 목적으로 삼으면, 사람은 자기 인생을 빨리 감기로 보고 있는 것에 지나지 않는다.\n그렇다고 효율을 버리라고 말하는 것은 아니다. 아낀 시간으로 무엇을 하고 싶은지를 먼저 정해 두어야 한다고 말하고 싶은 것이다. 빈 시간을 또 다른 작업으로 메우기만 한다면, 효율은 우리를 바쁘게 만드는 도구에 불과하다.\n길을 서두를 때도 때로는 멈춰 서서 지금 어디에 있는지 확인하고 싶다. 우회를 즐길 수 있는 여유야말로 길게 보면 가장 효율적인 것이 아닐까.","questions":[{"q":"{筆者|ひっしゃ}の{考|かんが}えに{最|もっと}も{近|ちか}いものはどれか。","opts":["{効率|こうりつ}は、すべての{場面|ばめん}で{最|さい}{優先|ゆうせん}すべきだ。","{効率|こうりつ}を{高|たか}めることには、{失|うしな}われるものもある。","{遠回|とおまわ}りは、いつでもよいことだ。","{若|わか}いうちは、{効率|こうりつ}を{学|まな}ぶべきだ。"],"a":1,"exp":"第2단락 첫 문장 「効率だけを基準にすると、何かが失われる」가 요지. 1은 「必ず」류 과장(필자는 '풍요로운 일일 것이다'라고 인정만 함), 3은 「締め切りのある仕事で遠回りをするのは、ただの怠慢だ」와 어긋남, 4는 지문에 없는 내용."},{"q":"{筆者|ひっしゃ}が「{効率|こうりつ}」について{述|の}べていることとして{正|ただ}しいものはどれか。","opts":["{効率|こうりつ}は{目的|もくてき}ではなく、{何|なに}かのための{手段|しゅだん}だ。","{効率|こうりつ}を{上|あ}げれば、{人生|じんせい}は{必|かなら}ず{豊|ゆた}かになる。","{効率|こうりつ}を{求|もと}めるべき{場面|ばめん}は、{存在|そんざい}しない。","{効率|こうりつ}より、{睡眠|すいみん}{時間|じかん}のほうが{大切|たいせつ}だ。"],"a":0,"exp":"「何のために速くするのかを問わず、速さそのものを目的にすると…」「効率は私たちを忙しくする道具にすぎない」→ 효율은 수단. 2는 「確かに豊かなことなのだろう」를 '반드시'로 과장한 선지, 3은 「効率を求めるべき場面はある」와 반대."},{"q":"{締|し}め{切|き}りのある{仕事|しごと}について、{筆者|ひっしゃ}はどう{述|の}べているか。","opts":["{遠回|とおまわ}りしてでも、{丁寧|ていねい}にやるべきだ。","{遠回|とおまわ}りをするのは、ただの{怠慢|たいまん}だ。","{効率|こうりつ}を{気|き}にせず{取|と}り{組|く}むべきだ。","{締|し}め{切|き}りは{無視|むし}してよい。"],"a":1,"exp":"「締め切りのある仕事で遠回りをするのは、ただの怠慢だ」가 그대로 근거. 필자의 예외 인정(効율을 추구해야 하는 장면)을 확인하는 문항."}]},{"id":13,"type":"정보 검색","len":"표 + 주석","title":"스포츠클럽 봄 학기 안내","text":"{市民|しみん}スポーツクラブ　2027{年|ねん}{春期|しゅんき}（{4月|しがつ}〜{6月|ろくがつ}）\n\nクラスA「ヨガ」　{水|すい}・{金|きん}　10:00〜11:30　{月|げっ}{会費|かいひ}6,000{円|えん}　{初心|しょしん}{者|しゃ}{歓迎|かんげい}\nクラスB「ヨガ」　{火|か}・{金|きん}　19:00〜20:30　{月|げっ}{会費|かいひ}8,000{円|えん}　{経験|けいけん}{者|しゃ}{向|む}け\nクラスC「ピラティス」　{水|すい}・{土|ど}　13:00〜14:30　{月|げっ}{会費|かいひ}7,000{円|えん}　{初心|しょしん}{者|しゃ}{歓迎|かんげい}\nクラスD「エアロビクス」　{水|すい}・{土|ど}　15:00〜16:30　{月|げっ}{会費|かいひ}9,500{円|えん}　レベル{不問|ふもん}\n\n※{入会|にゅうかい}{金|きん}3,000{円|えん}が{必要|ひつよう}です（{学生|がくせい}は{無料|むりょう}）。\n※クラスCは、{教材|きょうざい}{費|ひ}として{月|げつ}500{円|えん}が{別途|べっと}かかります。\n※{学生|がくせい}{割引|わりびき}（{月|げっ}{会費|かいひ}20%{引|ひ}き）と{早|はや}{割|わり}（{月|げっ}{会費|かいひ}1,000{円|えん}{引|ひ}き）は{併用|へいよう}できません。\n※{4月|しがつ}{10日|とおか}までにお{申|もう}し{込|こ}みの{方|ほう}は、{早|はや}{割|わり}が{適用|てきよう}されます。\n※{定員|ていいん}になり{次第|しだい}、{締|し}め{切|き}ります。キャンセル{待|ま}ちはできません。\n\n{山田|やまだ}さんは{大学|だいがく}{生|せい}で、{水曜|すいよう}と{土曜|どよう}の{午後|ごご}に{時間|じかん}がある。{月|つき}の{費用|ひよう}は7,500{円|えん}{以内|いない}にしたい。{運動|うんどう}は{初|はじ}めてで、{初心|しょしん}{者|しゃ}{向|む}けのクラスを{希望|きぼう}している。","summary":"조건은 '수·토 오후 + 월 7,500엔 이내 + 초급'. A는 오전, B는 요일·경험자, D는 학생 할인을 받아도 7,600엔으로 초과. C만 7,000+교재비 500=7,500엔으로 경계를 만족.","tr":"시민 스포츠클럽·2027년 봄 학기(4월~6월)\n\n클래스A 「요가」 수·금 10:00~11:30 월회비 6,000엔 초보자 환영\n클래스B 「요가」 화·금 19:00~20:30 월회비 8,000엔 경험자 대상\n클래스C 「필라테스」 수·토 13:00~14:30 월회비 7,000엔 초보자 환영\n클래스D 「에어로빅」 수·토 15:00~16:30 월회비 9,500엔 레벨 무관\n\n※입회금 3,000엔이 필요합니다(학생은 무료).\n※클래스C는 교재비로 월 500엔이 별도로 듭니다.\n※학생 할인(월회비 20% 할인)과 조기 할인(월회비 1,000엔 할인)은 함께 쓸 수 없습니다.\n※4월 10일까지 신청하신 분은 조기 할인이 적용됩니다.\n※정원이 차는 대로 마감합니다. 취소 대기(캔슬 대기)는 받지 않습니다.\n\n야마다 씨는 대학생으로 수요일과 토요일 오후에 시간이 있다. 월 비용은 7,500엔 이내로 하고 싶다. 운동은 처음이고 초보자용 클래스를 희망한다.","questions":[{"q":"{山田|やまだ}さんに{合|あ}うクラスはどれか。","opts":["クラスA","クラスB","クラスC","クラスD"],"a":2,"exp":"조건은 ①수·토 오후 ②월 7,500엔 이내 ③초보자용. A는 水·金이지만 10:00~11:30 오전이라 오후 조건 탈락. B는 수·토가 아니고 경험자 대상. D는 9,500엔으로 학생 할인 20%를 적용해도 7,600엔이라 7,500엔을 넘는다(경계값 함정). C는 7,000엔+교재비 500엔=7,500엔으로 '以内'(경계 포함)를 만족. 입회금은 학생이라 무료."},{"q":"{費用|ひよう}について、この{案内|あんない}と{合|あ}っているものはどれか。","opts":["{学生|がくせい}の{山田|やまだ}さんは、{入会|にゅうかい}{金|きん}3,000{円|えん}を{払|はら}う{必要|ひつよう}がある。","{4月|しがつ}{10日|とおか}までに{申|もう}し{込|こ}めば、{学生|がくせい}{割引|わりびき}と{早|はや}{割|わり}の{両方|りょうほう}が{適用|てきよう}される。","クラスCは、{最初|さいしょ}の{月|つき}の{支払|しはら}いに{月|げっ}{会費|かいひ}のほかに{教材|きょうざい}{費|ひ}500{円|えん}が{加|くわ}わる。","{教材|きょうざい}{費|ひ}500{円|えん}は、すべてのクラスにかかる。"],"a":2,"exp":"「クラスCは、教材費として月500円が別途かかります」가 근거로 3번이 정답. 1번은 「学生は無料」라 오답, 2번은 「併用できません」이라 오답(둘 다 적용된다고 하면 대표 함정), 4번은 C에만 해당하므로 '모든 클래스'로 넓힌 함정."}]}]},"listening":{"listening":{"types":[{"n":"과제 이해","jp":"課題理解","q":"5문항","ask":"이 다음에 무엇을 하는가","trap":"의견 변경(やっぱり·じゃあ 뒤), 순서(まず·その前に 뒤가 먼저 할 일), 부정 지시(〜しなくていい)","how":"선지가 인쇄되어 있음 → 음성 전에 반드시 읽기. 마지막에 확정된 행동이 정답."},{"n":"포인트 이해","jp":"ポイント理解","q":"6문항","ask":"이유·시간·장소 등 특정 정보","trap":"정정(あ、違う・訂正します), 부분 부정(必ずしも〜ない・とは限らない)","how":"질문이 먼저 나옴. 무엇을 들을지 정하고 그 부분만 집중. 実は·最も·特に 뒤가 단서."},{"n":"개요 이해","jp":"概要理解","q":"5문항","ask":"화자의 주장·의도","trap":"세부에 끌려 요지를 놓침, 중간의 예시를 결론으로 착각","how":"선지가 없음 → 메모 필수. 도입(주제) → 전개 → 결론의 흐름에서 결론을 잡기."},{"n":"즉시 응답","jp":"即時応答","q":"12문항","ask":"짧은 말에 맞는 응답","trap":"문장 속 단어를 그대로 반복하는 선지, 경어·관용 표현 오해","how":"한 문장이 끝나면 바로 판단. 첫 단어만 듣고 고르지 말고 말끝(의도)까지."},{"n":"통합 이해","jp":"統合理解","q":"4문항","ask":"여러 정보를 종합해 판단","trap":"두 후보의 조건 하나씩을 섞어 만든 선지, 마지막에 바뀐 조건","how":"후보별 특징을 표처럼 메모(요일·가격·조건). 마지막에 누가 무엇을 고르는지 확인."}],"contractions":[{"a":"〜ている","b":"〜てる","ex":"{食|た}べている → {食|た}べてる"},{"a":"〜ておく","b":"〜とく","ex":"{買|か}っておく → {買|か}っとく"},{"a":"〜てしまう","b":"〜ちゃう / じゃう","ex":"{忘|わす}れてしまう → {忘|わす}れちゃう"},{"a":"〜でしまう","b":"〜じゃう","ex":"{飲|の}んでしまう → {飲|の}んじゃう"},{"a":"〜なければ","b":"〜なきゃ","ex":"{行|い}かなければ → {行|い}かなきゃ"},{"a":"〜なくては","b":"〜なくちゃ","ex":"{急|いそ}がなくては → {急|いそ}がなくちゃ"},{"a":"〜という","b":"〜って","ex":"{行|い}くという → {行|い}くって"},{"a":"〜というのは","b":"〜ってのは","ex":"{安|やす}いというのは → {安|やす}いってのは"},{"a":"〜ているの","b":"〜てんの","ex":"{何|なに}をしているの → {何|なに}してんの"},{"a":"〜れば / 〜ければ","b":"〜りゃ / 〜きゃ","ex":"すれば → すりゃ / {行|い}かなければ → {行|い}かなきゃ"},{"a":"〜ておいた","b":"〜といた","ex":"{準備|じゅんび}しておいた → {準備|じゅんび}しといた"},{"a":"〜のだ / 〜のです","b":"〜んだ / 〜んです","ex":"どうしたのですか → どうしたんですか"}],"confusables":[{"pair":"おばさん / おばあさん","m":"아주머니 / 할머니","note":"장음 1박자 차이"},{"pair":"ビル / ビール","m":"빌딩 / 맥주","note":"장음"},{"pair":"きて / きって","m":"와서 / 우표","note":"촉음"},{"pair":"でんき / てんき","m":"전기 / 날씨","note":"탁음"},{"pair":"しんぶん / しゅみ","m":"신문 / 취미","note":"ん·모음 구분"},{"pair":"いっぷん / さんぷん / ろっぷん / はっぷん","m":"1분 / 3분 / 6분 / 8분","note":"수 표현의 촉음·반탁음 변화"}],"items":[{"id":1,"type":"과제 이해","title":"회의 자료 준비","intro":"{会社|かいしゃ}で{男|おとこ}の{人|ひと}が{女|おんな}の{人|ひと}と{話|はな}しています。","question":"{女|おんな}の{人|ひと}はこのあとまず{何|なに}をしますか。","opts":["{資料|しりょう}を{七|しち}{人|にん}{分|ぶん}コピーする","{資料|しりょう}を{八|はち}{人|にん}{分|ぶん}コピーする","{資料|しりょう}にホッチキスをかける","{資料|しりょう}を{佐藤|さとう}さんに{渡|わた}す"],"a":0,"script":[{"s":"男","t":"{悪|わる}いけど、{明日|あした}の{会議|かいぎ}の{資料|しりょう}、{人数|にんずう}{分|ぶん}コピーしておいてくれる？","ko":"미안한데, 내일 회의 자료, 인원수만큼 복사해 둘 수 있어?"},{"s":"女","t":"はい。{何|なん}{人|にん}{分|ぶん}ですか。","ko":"네. 몇 부인가요?"},{"s":"男","t":"えーと、{八|はち}{人|にん}…あ、でも{佐藤|さとう}さんは{出張|しゅっちょう}でいないから、{七|しち}{人|にん}でいいよ。","ko":"음, 여덟 명… 아, 그런데 사토 씨는 출장이라 없으니까 일곱 부면 돼."},{"s":"女","t":"{七|しち}{人|にん}{分|ぶん}ですね。コピーしたあと、どうしましょうか。","ko":"일곱 부군요. 복사한 다음에는 어떻게 할까요?"},{"s":"男","t":"{席|せき}に{置|お}いておいて。あ、ホッチキスはしなくていいから。","ko":"자리에 놓아 둬. 아, 스테이플러는 안 해도 돼."}],"exp":"음성 중에 「八人」가 「七人」로 정정됨 → 정정 후 정보가 정답. 「ホッチキスはしなくていい」는 하지 않아도 되는 일이라 오답. '먼저' 할 일은 복사이므로 1번.","key":"정정(あ、でも…七人でいい) + 부정 지시(しなくていい)"},{"id":2,"type":"과제 이해","title":"의자 배달 날짜","intro":"{店|みせ}で{女|おんな}の{人|ひと}が{店員|てんいん}と{話|はな}しています。","question":"いすはいつ{届|とど}きますか。","opts":["{火曜|かよう}{日|び}の{午前|ごぜん}","{火曜|かよう}{日|び}の{午後|ごご}","{水曜|すいよう}{日|び}の{四|よ}{時|じ}{以降|いこう}","{水曜|すいよう}{日|び}の{午前|ごぜん}"],"a":2,"script":[{"s":"女","t":"すみません、この{椅子|いす}、{届|とど}けてもらえますか。","ko":"저기요, 이 의자 좀 배달해 주실 수 있나요?"},{"s":"男","t":"はい。お{届|とど}けは{来週|らいしゅう}の{火曜|かよう}か{水曜|すいよう}になりますが。","ko":"네. 배송은 다음 주 화요일이나 수요일이 됩니다만."},{"s":"女","t":"{火曜|かよう}は{出|で}かけているので…。あ、でも{午前|ごぜん}{中|じゅう}なら{家|いえ}にいます。","ko":"화요일은 외출해서요…. 아, 그래도 오전이면 집에 있어요."},{"s":"男","t":"では{火曜|かよう}の{午前|ごぜん}にいたしましょうか。","ko":"그럼 화요일 오전으로 할까요?"},{"s":"女","t":"そうですね…やっぱり{水曜|すいよう}の{午後|ごご}のほうが{確実|かくじつ}です。{四|よ}{時|じ}{以降|いこう}でお{願|ねが}いします。","ko":"글쎄요… 역시 수요일 오후가 확실해요. 네 시 이후로 부탁드립니다."},{"s":"男","t":"かしこまりました。{水曜|すいよう}の{四|よ}{時|じ}{以降|いこう}ですね。","ko":"알겠습니다. 수요일 네 시 이후군요."}],"exp":"火曜の午前으로 정해질 뻔했지만 「やっぱり水曜の午後」로 변경. 마지막에 확정된 水曜の四時以降가 정답. やっぱり 뒤를 놓치면 1번을 고르게 되는 전형적 함정.","key":"의견 변경(やっぱり) — 마지막 결정"},{"id":3,"type":"포인트 이해","title":"店を選んだ理由","intro":"{女|おんな}の{人|ひと}が{男|おとこ}の{人|ひと}にインタビューしています。","question":"{男|おとこ}の{人|ひと}がこの{店|みせ}を{選|えら}んだ{一|いち}{番|ばん}の{理由|りゆう}は{何|なん}ですか。","opts":["{駅|えき}から{近|ちか}いこと","{値段|ねだん}が{安|やす}いこと","{朝|あさ}{早|はや}く{開|ひら}いていること","{店員|てんいん}が{親切|しんせつ}なこと"],"a":2,"script":[{"s":"女","t":"この{店|みせ}を{選|えら}んだ{理由|りゆう}は{何|なん}ですか。","ko":"이 가게를 고른 이유는 무엇인가요?"},{"s":"男","t":"そうですね、{駅|えき}から{近|ちか}いことですかね。","ko":"그렇네요, 역에서 가까운 점일까요."},{"s":"女","t":"{駅|えき}から{近|ちか}いから、{通|かよ}いやすいんですね。","ko":"역에서 가까우니까 다니기 편하시군요."},{"s":"男","t":"ええ。ただ、{実|じつ}は、{値段|ねだん}よりも、{朝|あさ}{早|はや}く{開|ひら}いていることが{一番|いちばん}{大|おお}きいんです。{仕事|しごと}の{前|まえ}に{寄|よ}れるので。","ko":"네. 다만, 실은 가격보다 아침 일찍 문을 여는 것이 가장 큽니다. 출근 전에 들를 수 있어서요."},{"s":"女","t":"じゃあ、{時間|じかん}が{決|き}め{手|て}だったんですね。","ko":"그럼 시간이 결정적이었군요."},{"s":"男","t":"はい、そうなんです。","ko":"네, 그렇습니다."}],"exp":"最初に出た 駅から近い는 표면적 이유. 「実は…一番大きい」 뒤의 朝早く開いていることが 진짜 답. 実は·一番 같은 신호어를 잡는 훈련.","key":"実は + 一番 — 진짜 이유"},{"id":4,"type":"포인트 이해","title":"打ち合わせの時間","intro":"{電話|でんわ}で{男|おとこ}の{人|ひと}が{予約|よやく}の{変更|へんこう}を{伝|つた}えています。","question":"{打|う}ち{合|あ}わせは{何時|なんじ}からになりますか。","opts":["{二|に}{時|じ}","{三|さん}{時|じ}","{三|さん}{時|じ}{半|はん}","{四|よ}{時|じ}"],"a":2,"script":[{"s":"男","t":"もしもし、{明日|あした}の{打|う}ち{合|あ}わせなんですが、{三|さん}{時|じ}からでしたよね。","ko":"여보세요, 내일 미팅인데요, 세 시부터였죠?"},{"s":"女","t":"えーと、{二|に}{時|じ}からになっておりますが。","ko":"음, 두 시부터로 되어 있습니다만."},{"s":"男","t":"あ、そうでしたか。すみません。では、{三|さん}{時|じ}{半|はん}に{変更|へんこう}できますか。","ko":"아, 그랬군요. 죄송합니다. 그럼 세 시 반으로 변경할 수 있을까요?"},{"s":"女","t":"{少々|しょうしょう}お{待|ま}ちください。…はい、{三|さん}{時|じ}{半|はん}からでしたら{空|あ}いております。","ko":"잠시만 기다려 주세요. …네, 세 시 반이라면 비어 있습니다."},{"s":"男","t":"じゃあ、それでお{願|ねが}いします。","ko":"그럼 그걸로 부탁드립니다."}],"exp":"처음 남자는 三時, 여자는 二時라고 말해 숫자가 흔들림. 최종적으로 三時半に変更で合意 → 3번. 숫자는 지우지 말고 옆에 새 정보를 덧쓰는 메모법이 유효.","key":"숫자 정정 — 최종 합의 시각"},{"id":5,"type":"개요 이해","title":"화면으로 읽는 독서","intro":"ラジオでアナウンサーが{話|はな}しています。","question":"{話|はな}し{手|て}が{最|もっと}も{言|い}いたいことは{何|なん}ですか。","opts":["{紙|かみ}の{本|ほん}だけを{読|よ}むべきだ。","{画面|がめん}で{読|よ}むのはやめるべきだ。","{読|よ}んだあとに{内容|ないよう}が{残|のこ}るかを{意識|いしき}すべきだ。","できるだけ{速|はや}く{読|よ}む{練習|れんしゅう}をすべきだ。"],"a":2,"script":[{"s":"女","t":"{最近|さいきん}、スマートフォンで{本|ほん}を{読|よ}む{人|ひと}が{増|ふ}えています。{便利|べんり}な{一方|いっぽう}で、「{読|よ}んだ{気|き}になるだけ」という{声|こえ}も{聞|き}きます。{画面|がめん}では、{目|め}が{流|なが}し{読|よ}みに{慣|な}れてしまうからです。もちろん、{紙|かみ}の{本|ほん}が{絶対|ぜったい}にいいと{言|い}うつもりはありません。{大事|だいじ}なのは、{内容|ないよう}を{自分|じぶん}のことばで{説明|せつめい}できるかどうかです。{読|よ}み{方|かた}を{選|えら}ぶより、{読|よ}んだあとに{何|なに}が{残|のこ}るかを{意識|いしき}してみてください。","ko":"요즘 스마트폰으로 책을 읽는 사람이 늘고 있습니다. 편리한 한편, ‘읽은 기분만 든다’는 목소리도 들립니다. 화면에서는 눈이 대충 훑어 읽는 데 익숙해지기 때문입니다. 물론 종이책이 무조건 좋다고 말할 생각은 아닙니다. 중요한 것은 내용을 자기 말로 설명할 수 있는지입니다. 읽는 방법을 고르기보다, 읽은 뒤에 무엇이 남는지를 의식해 보세요."}],"exp":"紙か画面かを論じるのではなく「大事なのは、内容を自分のことばで説明できるかどうか」「読んだあとに何が残るか」に着地。1·2는 「紙が絶対にいいと言うつもりはありません」로 부정됨.","key":"選択肢の否定(〜つもりはありません) 뒤 주장"},{"id":6,"type":"즉시 응답","title":"퇴근 인사","intro":"{会社|かいしゃ}で、{男|おとこ}の{人|ひと}が{先|さき}に{帰|かえ}る{同僚|どうりょう}に{言|い}います。（선지는 연습용으로 표시했습니다. 실제 시험에서는 음성만 나옵니다.）","question":"{何|なん}と{言|い}いますか。","opts":["お{疲|つか}れさまでした。","おかげさまで。","いただきます。"],"a":0,"script":[{"s":"男","t":"お{先|さき}に{失礼|しつれい}します。","ko":"먼저 들어가겠습니다."}],"exp":"「お先に失礼します」(먼저 들어가겠습니다)에 대한 자연스러운 응답은 「お疲れさまでした」. おかげさまで=덕분에, お待たせしました=기다리게 해서 죄송합니다, いただきます=잘 먹겠습니다.","key":"퇴근 인사 → お疲れさまでした"},{"id":7,"type":"즉시 응답","title":"복사 부탁","intro":"{職場|しょくば}で、{先輩|せんぱい}が{後輩|こうはい}に{頼|たの}みます。（선지는 연습용 표시입니다.）","question":"{何|なん}と{答|こた}えますか。","opts":["はい、{承知|しょうち}しました。","いいえ、けっこうです。","おそれいります。"],"a":0,"script":[{"s":"女","t":"この{書類|しょるい}、コピーしておいてくれる？","ko":"이 서류, 복사해 줄 수 있어?"}],"exp":"업무 부탁에 대한 승낙은 「承知しました」. けっこうです=사양합니다, おかまいなく=신경 쓰지 마세요, おそれいります=감사합니다/죄송합니다로 어긋남.","key":"부탁 → 承知しました"},{"id":8,"type":"통합 이해","title":"携帯プランの選択","intro":"{携帯|けいたい}{電話|でんわ}の{店|みせ}で、{女|おんな}の{人|ひと}が{店員|てんいん}と{話|はな}しています。","question":"{女|おんな}の{人|ひと}はどのプランにしますか。","opts":["Aプラン","Bプラン","{両方|りょうほう}","どちらでもない"],"a":1,"script":[{"s":"女","t":"{今|いま}{使|つか}っているプランが{高|たか}くて。データをあまり{使|つか}わないんですけど、{安|やす}いプランはありますか。","ko":"지금 쓰는 요금제가 비싸서요. 데이터를 별로 안 쓰는데, 저렴한 요금제 있나요?"},{"s":"男","t":"はい、{二|ふた}つあります。Aプランは、データが{三|さん}ギガで、{月|つき}{二千|にせん}{円|えん}。{通話|つうわ}は{三十|さんじゅう}{秒|びょう}{二十|にじゅう}{円|えん}です。Bプランは、データが{一|いち}ギガで、{月|つき}{千|せん}{五百|ごひゃく}{円|えん}。{通話|つうわ}は{三十|さんじゅう}{秒|びょう}{十|じゅう}{円|えん}です。","ko":"네, 두 가지 있습니다. A 요금제는 데이터 3기가에 월 2,000엔. 통화는 30초에 20엔입니다. B 요금제는 데이터 1기가에 월 1,500엔. 통화는 30초에 10엔입니다."},{"s":"女","t":"{通話|つうわ}は{月|つき}に{一|いち}{回|かい}、{五|ご}{分|ふん}くらいしかしないんです。","ko":"통화는 한 달에 한 번, 5분 정도밖에 안 해요."},{"s":"男","t":"そのくらいでしたら、Bプランでも{足|た}りると{思|おも}います。データは{一|いち}ギガで{大丈夫|だいじょうぶ}ですか。","ko":"그 정도라면 B 요금제로도 충분할 것 같습니다. 데이터 1기가로 괜찮으세요?"},{"s":"女","t":"{家|いえ}ではWi-Fiを{使|つか}うので、たぶん{大丈夫|だいじょうぶ}です。","ko":"집에서는 와이파이를 쓰니까 아마 괜찮을 거예요."},{"s":"男","t":"では、Bプランにしておきましょうか。","ko":"그럼 B 요금제로 해 둘까요?"},{"s":"女","t":"はい、そうしてください。","ko":"네, 그렇게 해 주세요."}],"exp":"조건은 ①데이터를 많이 쓰지 않음 ②통화가 아주 적음 → B로 충분. 마지막에 「Bプランにしておきましょうか」→「はい」로 확정. A를 고르게 하려고 가격·용량을 섞은 선지가 함정.","key":"조건 종합 + 마지막 확정"},{"id":9,"type":"과제 이해","title":"引っ越しの手続き","intro":"{市|し}{役所|やくしょ}で、{男|おとこ}の{人|ひと}が{受付|うけつけ}の{人|ひと}と{話|はな}しています。","question":"{男|おとこ}の{人|ひと}はこのあとまず{何|なに}をしますか。","opts":["{二|に}{階|かい}で{身分|みぶん}{証明|しょうめい}{書|しょ}をコピーする","{受付|うけつけ}の{横|よこ}でペンを{借|か}りる","{用紙|ようし}に{新|あたら}しい{住所|じゅうしょ}を{書|か}く","{用紙|ようし}を{窓口|まどぐち}に{出|だ}す"],"a":0,"script":[{"s":"女","t":"{引|ひ}っ{越|こ}しの{届|とど}けですね。まず、この{用紙|ようし}に{新|あたら}しい{住所|じゅうしょ}を{書|か}いてください。","ko":"이사 신고네요. 먼저 이 용지에 새 주소를 써 주세요."},{"s":"男","t":"はい。{書|か}いたら、その{用紙|ようし}をこちらに{出|だ}せばいいんですか。","ko":"네. 쓰고 나서 그 용지를 여기에 내면 되나요?"},{"s":"女","t":"いいえ、{先|さき}に{二|に}{階|かい}で{身分|みぶん}{証明|しょうめい}{書|しょ}をコピーしてください。コピーがないと{受|う}け{取|と}れないんです。","ko":"아니요, 먼저 2층에서 신분증을 복사해 주세요. 복사본이 없으면 접수할 수가 없어서요."},{"s":"男","t":"コピーは{二|に}{部|ぶ}いりますか。","ko":"복사본은 두 장 필요한가요?"},{"s":"女","t":"{一部|いちぶ}でいいです。あ、それから、{用紙|ようし}は{黒|くろ}いペンで{書|か}いてくださいね。{鉛筆|えんぴつ}はだめです。","ko":"한 장이면 됩니다. 아, 그리고 용지는 검은 펜으로 써 주세요. 연필은 안 됩니다."},{"s":"男","t":"わかりました。じゃあ、この{鉛筆|えんぴつ}は{使|つか}えないんですね。ペンはどこにありますか。","ko":"알겠습니다. 그럼 이 연필은 못 쓰는 거군요. 펜은 어디에 있나요?"},{"s":"女","t":"{受付|うけつけ}の{横|よこ}に{置|お}いてあります。","ko":"접수대 옆에 놓여 있습니다."}],"exp":"「まず、この用紙に…」로 시작하지만 곧 「いいえ、先に二階で身分証明書をコピー」로 순서가 정정됩니다. 정정된 순서가 우선이므로 가장 먼저 할 일은 복사(1번). 「コピーは二部」→「一部でいい」, 「鉛筆はだめ」는 조건일 뿐 ‘먼저’ 할 일이 아니고, 주소 기입(3번)은 복사 다음, 제출(4번)은 맨 마지막입니다.","key":"정정된 순서(いいえ、先に…) + 부정 지시(一部でいい・鉛筆はだめ)"},{"id":10,"type":"과제 이해","title":"忘年会の二次会","intro":"{会社|かいしゃ}で、{女|おんな}の{人|ひと}が{男|おとこ}の{人|ひと}と{忘年|ぼうねん}{会|かい}の{相談|そうだん}をしています。","question":"{女|おんな}の{人|ひと}はこのあとまず{何|なに}をしますか。","opts":["{和食|わしょく}のお{店|みせ}を{予約|よやく}する","{予算|よさん}を{確認|かくにん}する","{部長|ぶちょう}に{人数|にんずう}を{聞|き}く","カラオケ{店|てん}を{探|さが}す"],"a":1,"script":[{"s":"女","t":"{忘年|ぼうねん}{会|かい}の{件|けん}なんですが、お{店|みせ}はもう{決|き}めましたか。","ko":"송년회 건인데요, 가게는 벌써 정하셨어요?"},{"s":"男","t":"{一|いち}{次|じ}{会|かい}は{駅前|えきまえ}の「{花|はな}」で{取|と}ったんだけど、{二|に}{次|じ}{会|かい}がまだでね。","ko":"1차는 역 앞 ‘하나’로 잡았는데, 2차가 아직이라서."},{"s":"女","t":"じゃあ、{二|に}{次|じ}{会|かい}はカラオケはどうですか。","ko":"그럼 2차는 노래방이 어떠세요?"},{"s":"男","t":"{去年|きょねん}カラオケだったから、{今年|ことし}はやっぱり{違|ちが}うところがいいな。…あ、そうだ。{部長|ぶちょう}が{和食|わしょく}がいいって{言|い}ってたんだ。","ko":"작년이 노래방이었으니까 올해는 역시 다른 데가 좋겠어. …아, 그렇지. 부장님이 일식이 좋다고 했었어."},{"s":"女","t":"じゃあ、{和食|わしょく}のお{店|みせ}を{探|さが}しますね。{何|なん}{人|にん}ぐらいで{探|さが}しましょうか。","ko":"그럼 일식집을 찾아 볼게요. 몇 명 정도로 찾을까요?"},{"s":"男","t":"{一|いち}{次|じ}{会|かい}は{二十|にじゅう}{人|にん}だけど、{二|に}{次|じ}{会|かい}は{半分|はんぶん}ぐらいかな。","ko":"1차는 스무 명인데, 2차는 절반 정도일까."},{"s":"女","t":"{十|じゅう}{人|にん}ですね。{予約|よやく}は{私|わたし}がしておきますか。","ko":"열 명이군요. 예약은 제가 해 둘까요?"},{"s":"男","t":"うん、お{願|ねが}い。あ、でも、{予算|よさん}の{確認|かくにん}だけは{先|さき}にしておいて。{一人|ひとり}{五千|ごせん}{円|えん}までって{言|い}われてるから。","ko":"응, 부탁해. 아, 그런데 예산 확인만은 먼저 해 둬. 한 사람 5,000엔까지라고 들었으니까."},{"s":"女","t":"わかりました。{予算|よさん}を{確認|かくにん}してから、お{店|みせ}を{探|さが}して、{予約|よやく}します。","ko":"알겠습니다. 예산을 확인한 다음에 가게를 찾아서 예약하겠습니다."}],"exp":"노래방은 작년과 겹쳐 「やっぱり違うところがいい」로 취소되고, 부장의 「和食」 조건이 더해집니다. 인원은 「十人ですね」로 이미 정해져 부장에게 물을 일이 없고(3번 오답), 예약은 마지막에 할 일입니다. 마지막 줄 「予算の確認だけは先にしておいて」가 ‘먼저’ 할 일을 정합니다 → 2번.","key":"의견 변경(やっぱり違うところ) + 「先に」 예산 확인"},{"id":11,"type":"과제 이해","title":"病院の受付","intro":"{病院|びょういん}の{受付|うけつけ}で、{女|おんな}の{人|ひと}が{受付|うけつけ}の{人|ひと}と{話|はな}しています。","question":"{女|おんな}の{人|ひと}はこのあとまず{何|なに}をしますか。","opts":["{問診|もんしん}{票|ひょう}に{記入|きにゅう}する","{体温|たいおん}を{測|はか}る","{保険|ほけん}{証|しょう}を{受付|うけつけ}に{出|だ}す","{番号|ばんごう}の{紙|かみ}を{取|と}る"],"a":0,"script":[{"s":"女","t":"すみません、こちら{初|はじ}めてなんですが。","ko":"저기요, 여기는 처음인데요."},{"s":"男","t":"はい。では、まずこの{問診|もんしん}{票|ひょう}に{記入|きにゅう}してください。{保険|ほけん}{証|しょう}はお{持|も}ちですか。","ko":"네. 그러면 먼저 이 문진표를 작성해 주세요. 보험증은 가지고 계신가요?"},{"s":"女","t":"はい、あります。{予約|よやく}の{時間|じかん}より{早|はや}いんですけど、{大丈夫|だいじょうぶ}ですか。","ko":"네, 있어요. 예약 시간보다 이른데 괜찮을까요?"},{"s":"男","t":"{大丈夫|だいじょうぶ}です。{記入|きにゅう}が{終|お}わったら、そちらの{機械|きかい}で{受付|うけつけ}をしてください。{番号|ばんごう}の{紙|かみ}が{出|で}ますので、{待合|まちあい}{室|しつ}でお{待|ま}ちください。","ko":"괜찮습니다. 작성을 마치면 저쪽 기계에서 접수해 주세요. 번호표가 나오니 대기실에서 기다려 주세요."},{"s":"女","t":"{体温|たいおん}も{測|はか}ったほうがいいですか。","ko":"체온도 재는 게 좋을까요?"},{"s":"男","t":"いいえ、それは{看護|かんご}{師|し}が{測|はか}りますから、しなくていいです。","ko":"아니요, 그건 간호사가 잴 거라서 안 하셔도 됩니다."},{"s":"女","t":"わかりました。{問診|もんしん}{票|ひょう}を{書|か}いてから、{機械|きかい}で{受付|うけつけ}ですね。","k

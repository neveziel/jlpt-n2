    if (b) b.style.width = (s.items.length ? Math.round(done / s.items.length * 100) : 0) + '%';
  }
  var TGT = /《([^》]*)》/g;

  function kStore() { if (!S.kako) S.kako = {}; return S.kako; }
  function kset() {
    for (var i = 0; i < KAKO.sets.length; i++) if (KAKO.sets[i].id === KF.set) return KAKO.sets[i];
    return KAKO.sets[0];
  }
  function kruby(s) {
    s = String(s || '');
    var out = '', last = 0, m, re = new RegExp(TGT.source, 'g');
    while ((m = re.exec(s))) {
      out += ruby(s.slice(last, m.index)) + '<b class="tg">' + esc(m[1]) + '</b>';
      last = m.index + m[0].length;
    }
    return out + ruby(s.slice(last));
  }
  function kpara(text) {
    return String(text || '').split(/\n\n+/).map(function (p) {
      return '<p class="kpara jp">' + kruby(p).replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }
  function kPassage(p) {
    return '<div class="card kpass">'
      + '<div class="tagline"><span>' + esc(p.title) + '</span></div>'
      + kpara(p.text)
      + (p.note ? '<div class="muted small jp" style="margin-top:8px">' + kruby(p.note) + '</div>' : '')
      + (p.kotext ? '<div class="trans" style="margin-top:10px"><b>요지</b>' + esc(p.kotext) + '</div>' : '')
      + (p.source ? '<div class="muted small" style="margin-top:6px">출처 · ' + esc(p.source) + '</div>' : '')
      + '</div>';
  }
  function kScript(it) {
    return '<div class="script jp">' + it.lines.map(function (l) {
      return '<div class="sp"><b>' + esc(l.r) + '</b><span class="jp">' + kruby(l.t) + '</span></div>';
    }).join('') + (it.q ? '<div class="sp"><b>질문</b><span class="jp">' + kruby(it.q) + '</span></div>' : '') + '</div>';
  }
  function kCard(it, st) {
    var ans = st[it.id];
    var h = '<div class="card kcard" id="k-' + it.id + '">'
      + '<div class="tagline"><span>' + esc(it.part) + '</span><span>#' + (it.num > 200 ? (it.num > 300 ? it.num - 300 : it.num - 200) : it.num) + '</span></div>';
    if (it.sec === 'choukai') {
      if (it.intro) h += '<div class="muted small jp" style="margin-bottom:6px">' + kruby(it.intro) + '</div>';
      var inst = it.type === '즉시 응답';
      if (it.prompt) h += '<div class="jp" style="font-weight:650;margin-bottom:6px">' + kruby(it.prompt) + '</div>';
      h += '<div class="player"><button class="btn pri small" data-kp="' + it.id + '">▶ 듣기</button>';
      if (!inst) {
        h += '<button class="btn ghost small" data-kr="' + it.id + '">'
          + ((S.ksc && S.ksc[it.id]) ? '대본 숨기기' : '대본 보기') + '</button>';
      }
      h += '</div>';
      if (!inst && S.ksc && S.ksc[it.id]) h += kScript(it);
      if (it.q) {
        h += '<div class="jp" style="font-weight:650;line-height:1.9;margin-top:' + (it.prompt ? '8px' : '0') + '">' + kruby(it.q) + '</div>';
      }
    } else {
      h += '<div class="jp kq">' + kruby(it.q) + '</div>';
    }
    if (it.qko) h += '<div class="muted small" style="margin:4px 0 10px">' + esc(it.qko) + '</div>';
    if (it.full) h += '<div class="trans" style="margin-bottom:10px"><b>완성 문장</b><span class="jp">' + kruby(it.full) + '</span></div>';
    h += it.opts.map(function (o, i) {
      var cls = 'opt';
      if (typeof ans === 'number') {
        if (i === it.a) cls += ' correct';
        else if (ans === i) cls += ' wrong';
      }
      return '<button class="' + cls + '" data-ka="' + it.id + '" data-ki="' + i + '"'
        + (typeof ans === 'number' ? ' disabled' : '') + '>'
        + '<span class="no">' + (i + 1) + '</span><span class="jp">' + kruby(o) + '</span></button>';
    }).join('');
    if (typeof ans === 'number') {
      h += '<div class="verdict ' + (ans === it.a ? 'ok' : 'ng') + '">'
        + (ans === it.a ? '정답!' : '오답 — 정답은 ' + (it.a + 1) + '번') + '</div>'
        + '<div class="exp">' + esc(it.exp) + '</div>';
    }
    return h + '</div>';
  }
  function bindKako(root) {
    var host = root || $('tab-kako');
    Array.prototype.forEach.call(host.querySelectorAll('[data-ks]'), function (b) {
      b.addEventListener('click', function () { KF.set = b.getAttribute('data-ks'); KF.limit = 24; renderKako(); });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-kc]'), function (b) {
      b.addEventListener('click', function () { KF.sec = b.getAttribute('data-kc'); KF.limit = 24; renderKako(); });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-ka]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-ka'), i = +b.getAttribute('data-ki');
        var st = kStore();
        if (typeof st[id] === 'number') return;
        st[id] = i;
        save();
        var s = kset(), it = null;
        s.items.forEach(function (x) { if (x.id === id) it = x; });
        var card = document.getElementById('k-' + id);
        if (it && card) {
          var tmp = document.createElement('div');
          tmp.innerHTML = kCard(it, st);
          var fresh = tmp.firstChild;
          card.parentNode.replaceChild(fresh, card);
          bindKako(fresh);
          kProgress(s, st);
        }
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-kp]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-kp'), it = null, s = kset();
        s.items.forEach(function (x) { if (x.id === id) it = x; });
        if (!it || !it.audio) return;
        toggleMp3('audio/' + it.audio, b, function () {
          speakLines(it.lines.map(function (l) { return { s: l.r, t: l.t }; }));
        });
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-kr]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-kr');
        if (!S.ksc) S.ksc = {};
        S.ksc[id] = !S.ksc[id];
        save();
        keepScroll(function () { renderKako(); });
      });
    });
    on($('kmore'), 'click', function () {
      KF.limit += 24;
      keepScroll(function () { renderKako(); });
    });
    on($('kreset'), 'click', function () {
      if (!confirm('이 회차의 답을 모두 지우고 처음부터 풀까요?')) return;
      var s = kset(), st = kStore();
      s.items.forEach(function (it) { delete st[it.id]; });
      save(); renderKako();
      toast('답을 초기화했어요');
    });
  }
  function renderKako() {
    stopSound();
    var s = kset();
    if (!s) { $('tab-kako').innerHTML = '<h2>기출문제</h2><p class="muted">데이터를 불러오지 못했어요.</p>'; return; }
    var st = kStore();
    var SEC = [['all', '전체'], ['moji', '문자·어휘'], ['bunpou', '문법'], ['dokkai', '독해'], ['choukai', '청해']];
    var setChips = KAKO.sets.map(function (x) {
      return '<button class="chip' + (x.id === KF.set ? ' on' : '') + '" data-ks="' + x.id + '">' + esc(x.label) + '</button>';
    }).join('');
    var secChips = SEC.map(function (c) {
      var n = c[0] === 'all' ? s.items.length : s.items.filter(function (it) { return it.sec === c[0]; }).length;
      return '<button class="chip' + (KF.sec === c[0] ? ' on' : '') + '" data-kc="' + c[0] + '">' + c[1] + ' <span class="small">' + n + '</span></button>';
    }).join('');
    var list = s.items.filter(function (it) { return KF.sec === 'all' || it.sec === KF.sec; });
    var done = 0, ok = 0;
    s.items.forEach(function (it) {
      if (typeof st[it.id] === 'number') { done++; if (st[it.id] === it.a) ok++; }
    });
    var html = '<h2>기출문제</h2><p class="lead">' + esc(s.sub) + '</p>'
      + '<div class="note jp" style="margin-bottom:10px">문제 지문은 일본어국제교육지원협회·국제교류기금 공개 자료(2025年7月 시험은 공개 복원본)를 개인 학습용으로 옮긴 것입니다.</div>'
      + '<div class="chips">' + setChips + '</div>'
      + '<div class="chips">' + secChips + '</div>'
      + '<div class="qmeta"><span id="kdone">' + done + ' / ' + s.items.length + ' 풀이</span><span id="kstat">정답 ' + ok
      + ' · 정답률 ' + (done ? Math.round(ok / done * 100) : 0) + '%</span></div>'
      + '<div class="bar" style="margin:6px 0 14px"><i id="kbar" style="width:'
      + (s.items.length ? Math.round(done / s.items.length * 100) : 0) + '%"></i></div>';
    var lastPass = '';
    var shown = list.slice(0, KF.limit);
    shown.forEach(function (it) {
      var pass = it.passage && s.passages[it.passage];
      if (pass && it.passage !== lastPass) html += kPassage(pass);
      lastPass = it.passage || '';
      html += kCard(it, st);
    });
    if (!list.length) html += '<div class="card"><p class="muted">문항이 없습니다.</p></div>';
    if (list.length > shown.length) {
      html += '<button class="btn" id="kmore" style="width:100%;margin:2px 0 10px">다음 ' + Math.min(24, list.length - shown.length)
        + '문항 더 보기 (' + (list.length - shown.length) + '개 남음)</button>';
    }
    html += '<button class="btn" id="kreset" style="width:100%;margin:4px 0 12px">' + esc(s.label) + ' 답 초기화</button>';
    $('tab-kako').innerHTML = html;
    bindKako();
  }

  window.__APP__ = {
    go: go, state: S, stat: stat, total: TOTAL,
    answerQuiz: answerQuiz, nextQuiz: nextQuiz, startQuiz: startQuiz,
    answerReading: answerReading, answerListening: answerListening, toggleTr: toggleTr,
    markVocab: markVocab, toggleGrammarDone: toggleGrammarDone,
    speak: speak, speakLines: speakLines, quiz: function () { return QZ; },
    listeningItem: lById, playItem: playItem, playGrammar: playGrammar, playVocabEx: playVocabEx,
    playVocabWord: playVocabWord,
    plain: plain, ruby: ruby, renderKako: renderKako, kako: function () { return KAKO; }, ios: function () { return IOS; },
    setFuri: function (v) { S.furi = !!v; applyFuri(); }
  };
  init();
})();

</script>
</body>

 신청 기간이 지났고, 정원 미달이면 개강 3일 전까지 전화만 가능.","source":"","note":""}}},{"id":"2012a","label":"2012年 7월","sub":"2012年7月 실제 시험 — 공식 정답표·스크립트 대조","items":[{"num":1,"part":"問題1 한자 읽기","q":"ずっと{好調|こうちょう}だったのに、{最後|さいご}の{試合|しあい}で《敗れて》しまった。","qko":"계속 호조였는데, 마지막 시합에서 져 버렸다.","opts":["たおれて","やぶれて","みだれて","つぶれて"],"a":1,"exp":"敗れる(やぶれる)=지다. 倒れる=たおれる(쓰러지다), 乱れる=みだれる(흐트러지다), つぶれる=찌그러지다·망하다.","sec":"moji","id":"2012a-001","no":1},{"num":2,"part":"問題1 한자 읽기","q":"この{仕事|しごと}には{高|たか}い{語学|ごがく}{力|りょく}が《要求》される。","qko":"이 일에는 높은 어학 능력이 요구된다.","opts":["ようきゅ","よっきゅう","ようきゅう","よっきゅ"],"a":2,"exp":"要求(ようきゅう)=요구. 促音 없이 짧게 읽은 ようきゅ, 要를 よっ로 읽은 よっきゅう는 모두 함정.","sec":"moji","id":"2012a-002","no":2},{"num":3,"part":"問題1 한자 읽기","q":"{友達|ともだち}の{合格|ごうかく}をみんなで《祝った》。","qko":"친구의 합격을 다 같이 축하했다.","opts":["いわった","いのった","うらなった","ねがった"],"a":0,"exp":"祝う(いわう)=축하하다 → 과거형 いわった. 祈る=いのる(빌다), 占う=うらなう(점치다), 願う=ねがう(바라다).","sec":"moji","id":"2012a-003","no":3},{"num":4,"part":"問題1 한자 읽기","q":"{寒|さむ}かったら、エアコンの{温度|おんど}を《調節》してください。","qko":"추우면 에어컨 온도를 조절해 주세요.","opts":["ちょうさい","ちょうせい","ちょうさつ","ちょうせつ"],"a":3,"exp":"調節(ちょうせつ)=조절. 調整(ちょうせい)=조정과 헷갈리기 쉽고, さい·さつ는 節을 잘못 읽은 함정.","sec":"moji","id":"2012a-004","no":4},{"num":5,"part":"問題1 한자 읽기","q":"この{書類|しょるい}を《至急》コピーしてきてください。","qko":"이 서류를 급히 복사해 오세요.","opts":["しっきゅう","ちっきゅう","しきゅう","ちきゅう"],"a":2,"exp":"至急(しきゅう)=긴급. 地球(ちきゅう)와 발음이 비슷한 함정. 促音 しっきゅう는 없는 읽기.","sec":"moji","id":"2012a-005","no":5},{"num":6,"part":"問題2 한자 표기","q":"ハトは{平和|へいわ}の《しょうちょう》だと{言|い}われている。","qko":"비둘기는 평화의 상징이라고 한다.","opts":["像徴","象微","象徴","像微"],"a":2,"exp":"象徴(しょうちょう)=상징. '상징'은 象(코끼리 상)을 쓰고, 像(모양 상)은 映像·想像처럼 '모양·모습'에 씀. 微(미)와 徴(징)도 구별.","sec":"moji","id":"2012a-006","no":6},{"num":7,"part":"問題2 한자 표기","q":"{退院|たいいん}しても、しばらくの{間|あいだ}、《はげしい》{運動|うんどう}はしないでください。","qko":"퇴원하더라도 당분간 격한 운동은 하지 마세요.","opts":["険しい","激しい","暴しい","極しい"],"a":1,"exp":"激しい(はげしい)=격렬하다. 険しい(けわしい)=험하다는 읽기가 다름. 暴しい·極しい는 없는 표기.","sec":"moji","id":"2012a-007","no":7},{"num":8,"part":"問題2 한자 표기","q":"{携帯|けいたい}{電話|でんわ}に{友達|ともだち}の{電話|でんわ}{番号|ばんごう}を《とうろく》した。","qko":"휴대전화에 친구 전화번호를 등록했다.","opts":["登録","登緑","答録","答緑"],"a":0,"exp":"登録(とうろく)=등록. 録(기록할 록)과 緑(초록 록)은 음이 같아 함정, 登(오를 등)과 答(대답 답)도 구별.","sec":"moji","id":"2012a-008","no":8},{"num":9,"part":"問題2 한자 표기","q":"{岡田|おかだ}さんを{話題|わだい}の{映画|えいが}に《さそった》。","qko":"오카다 씨를 화제의 영화에 초대했다.","opts":["招った","勧った","請った","誘った"],"a":3,"exp":"誘う(さそう)=권하다·초대하다. 招く는 まねく, 勧める는 すすめる, 請う는 こう로 읽음. さそ는 誘뿐.","sec":"moji","id":"2012a-009","no":9},{"num":10,"part":"問題2 한자 표기","q":"{待|ま}ち{合|あ}わせの{時間|じかん}を6{時|じ}に《へんこう》してもらった。","qko":"만날 시간을 6시로 변경해 달라고 했다.","opts":["変改","変更","変換","変替"],"a":1,"exp":"変更(へんこう)=변경. 変換은 변환(데이터·단위를 바꿈), 変改·変替는 없는 말.","sec":"moji","id":"2012a-010","no":10},{"num":11,"part":"問題3 문맥 규정 (한자 조합)","q":"{彼|かれ}は{医学|いがく}（　）ではかなり{知|し}られた{存在|そんざい}だ。","qko":"그는 의학계에서는 꽤 알려진 존재다.","opts":["界","帯","域","区"],"a":0,"exp":"医学界(いがくかい)=의학계. 帯(지대)·域(영역)·区(구역)는 '분야·세계'라는 뜻으로 医学에 붙지 않음.","sec":"moji","id":"2012a-011","no":11},{"num":12,"part":"問題3 문맥 규정 (한자 조합)","q":"{決勝|けっしょう}{戦|せん}で{負|ま}けて、（　）{優勝|ゆうしょう}に{終|お}わった。","qko":"결승전에서 져서 준우승으로 끝났다.","opts":["後","準","次","副"],"a":1,"exp":"準優勝(じゅんゆうしょう)=준우승. 準은 '다음 자리·준하는' 뜻. 後優勝·次優勝·副優勝은 없는 말.","sec":"moji","id":"2012a-012","no":12},{"num":13,"part":"問題3 문맥 규정 (한자 조합)","q":"（　）{段階|だんかい}では{詳細|しょうさい}は{決|き}まっていないらしい。","qko":"현 단계에서는 세부 사항이 정해지지 않았다고 한다.","opts":["現","直","近","当"],"a":0,"exp":"現段階(げんだんかい)=현 단계. 直段階·近段階·当段階는 없는 결합. 当는 「当日」「当時」처럼 씀.","sec":"moji","id":"2012a-013","no":13},{"num":14,"part":"問題3 문맥 규정 (한자 조합)","q":"{今回|こんかい}の{大臣|だいじん}の{訪問|ほうもん}は（　）{公式|こうしき}に{行|おこな}われた。","qko":"이번 장관의 방문은 비공식으로 이루어졌다.","opts":["不","未","無","非"],"a":3,"exp":"非公式(ひこうしき)=비공식. 非는 '~이 아님'으로 非公開·非売品처럼 씀. 不公式·未公式·無公式는 없는 말.","sec":"moji","id":"2012a-014","no":14},{"num":15,"part":"問題3 문맥 규정 (한자 조합)","q":"わが{社|しゃ}の{今年|ことし}の（　）{売上|うりあげ}は、{昨年|さくねん}を{上回|うわまわ}った。","qko":"우리 회사의 올해 총매출은 작년을 웃돌았다.","opts":["集","総","合","満"],"a":1,"exp":"総売上(そううりあげ)=총매출. 総는 '전체를 합친'. 合売上·集売上·満売上는 없는 결합.","sec":"moji","id":"2012a-015","no":15},{"num":16,"part":"問題4 문맥 규정","q":"さまざまなデータを（　）した{結果|けっか}、{事故|じこ}の{原因|げんいん}が{明|あき}らかになった。","qko":"다양한 데이터를 분석한 결과 사고 원인이 밝혀졌다.","opts":["{観察|かんさつ}","{検査|けんさ}","{発明|はつめい}","{分析|ぶんせき}"],"a":3,"exp":"分析(ぶんせき)=분석. 데이터를 대상으로는 分析. 観察=관찰, 検査=검사, 発明=발명.","sec":"moji","id":"2012a-016","no":16},{"num":17,"part":"問題4 문맥 규정","q":"{街|まち}を（　）していたら、{山本|やまもと}さんに{会|あ}った。","qko":"거리를 어슬렁어슬렁 걷고 있었더니 야마모토 씨를 만났다.","opts":["ぐらぐら","がらがら","ばらばら","ぶらぶら"],"a":3,"exp":"ぶらぶら=어슬렁어슬렁(걷다·놀다). ぐらぐら=흔들흔들, がらがら=덜컹덜컹·텅텅, ばらばら=뿔뿔이 흩어짐.","sec":"moji","id":"2012a-017","no":17},{"num":18,"part":"問題4 문맥 규정","q":"{祭|まつ}りの{日|ひ}は{町|まち}が（　）にあふれている。","qko":"축제 날에는 거리에 활기가 넘친다.","opts":["{活気|かっき}","{活発|かっぱつ}","{活躍|かつやく}","{活動|かつどう}"],"a":0,"exp":"活気(かっき)=활기. 「活気にあふれる」가 정형. 活発는 な형용사(活発な), 活躍=활약, 活動=활동.","sec":"moji","id":"2012a-018","no":18},{"num":19,"part":"問題4 문맥 규정","q":"コピー{機|き}に{紙|かみ}が（　）、{出|で}てこない。","qko":"복사기에 종이가 걸려서 나오지 않는다.","opts":["もぐって","つまって","しずんで","うまって"],"a":1,"exp":"詰まる(つまる)=막히다·걸리다. 潜る=もぐる(잠수하다), 沈む=しずむ(가라앉다), 埋まる=うまる(묻히다·메워지다).","sec":"moji","id":"2012a-019","no":19},{"num":20,"part":"問題4 문맥 규정","q":"この{小説|しょうせつ}は{今|いま}の{時代|じだい}を（　）した{作品|さくひん}だ。","qko":"이 소설은 지금 시대를 반영한 작품이다.","opts":["{反映|はんえい}","{放映|ほうえい}","{引用|いんよう}","{採用|さいよう}"],"a":0,"exp":"反映(はんえい)=반영. 放映=방영, 引用=인용, 採用=채용. 反映과 放映은 발음이 같아 함정.","sec":"moji","id":"2012a-020","no":20},{"num":21,"part":"問題4 문맥 규정","q":"{田中|たなか}さんは{長|なが}い{間|あいだ}（　）{窓|まど}の{外|そと}を{見|み}ていた。","qko":"다나카 씨는 오랫동안 멍하니 창밖을 보고 있었다.","opts":["ぼんやり","ふんわり","うっすら","しっとり"],"a":0,"exp":"ぼんやり=멍하니. ふんわり=푹신·둥실, うっすら=어렴풋이, しっとり=촉촉이·차분히.","sec":"moji","id":"2012a-021","no":21},{"num":22,"part":"問題4 문맥 규정","q":"{経済|けいざい}だけでなく、{法律|ほうりつ}にも{詳|くわ}しいのが{彼|かれ}の（　）だ。","qko":"경제뿐 아니라 법률에도 밝은 것이 그의 강점이다.","opts":["{深|ふか}み","{強|つよ}み","{高|たか}み","{重|おも}み"],"a":1,"exp":"強み(つよみ)=강점. 深み=깊이, 高み=높은 경지, 重み=무게·중량감.","sec":"moji","id":"2012a-022","no":22},{"num":23,"part":"問題5 유의 표현","q":"このブームは{長|なが}くは{続|つづ}かないだろう。","qko":"이 붐은 오래 계속되지 않겠지.","opts":["{効果|こうか}","{状態|じょうたい}","{流行|りゅうこう}","{緊張|きんちょう}"],"a":2,"exp":"ブーム=붐 → 流行(りゅうこう). 効果=효과, 状態=상태, 緊張=긴장.","sec":"moji","id":"2012a-023","no":23},{"num":24,"part":"問題5 유의 표현","q":"この{作業|さぎょう}は{慎重|しんちょう}にやってください。","qko":"이 작업은 신중하게 해 주세요.","opts":["{急|いそ}いで","{絶対|ぜったい}{忘|わす}れずに","{静|しず}かに","{十分|じゅうぶん}{注意|ちゅうい}して"],"a":3,"exp":"慎重に=신중하게 → 十分注意して(충분히 주의해서). 急いで=서둘러, 静かに=조용히.","sec":"moji","id":"2012a-024","no":24},{"num":25,"part":"問題5 유의 표현","q":"シャツがちぢんでしまった。","qko":"셔츠가 줄어 버렸다.","opts":["{小|ちい}さくなって","{古|ふる}くなって","{汚|よご}れて","{破|やぶ}れて"],"a":0,"exp":"縮む(ちぢむ)=줄어들다 → 小さくなる. 古くなる=낡다, 汚れる=더러워지다, 破れる=찢어지다.","sec":"moji","id":"2012a-025","no":25},{"num":26,"part":"問題5 유의 표현","q":"{宿題|しゅくだい}のレポートはほぼ{終|お}わった。","qko":"숙제 리포트는 거의 끝났다.","opts":["すべて","すぐに","だいたい","やっと"],"a":2,"exp":"ほぼ=거의 → だいたい. すべて=전부(100%), やっと=겨우, すぐに=곧.","sec":"moji","id":"2012a-026","no":26},{"num":27,"part":"問題5 유의 표현","q":"{来週|らいしゅう}は{天気|てんき}が{回復|かいふく}するそうだ。","qko":"다음 주는 날씨가 회복된다고 한다.","opts":["あまり{変|か}わらない","{変|か}わりやすい","よくなる","{悪|わる}くなる"],"a":2,"exp":"回復する=회복하다 → (날씨가) 좋아지다. 悪くなる=나빠지다로 뜻이 반대.","sec":"moji","id":"2012a-027","no":27},{"num":28,"part":"問題6 단어 사용법","q":"{方針|ほうしん}","qko":"정부의 교육 관련 방침이 크게 바뀌었다. (정답 문장)","opts":["{台風|たいふう}の{方針|ほうしん}がそれたので、{特|とく}に{被害|ひがい}は{出|で}なかった。","{私|わたし}の{今年|ことし}の{方針|ほうしん}は{漢字|かんじ}を600{字|じ}{覚|おぼ}えることだ。","この{料理|りょうり}を{作|つく}る{方針|ほうしん}を{教|おし}えてください。","{教育|きょういく}に{関|かん}する{政府|せいふ}の{方針|ほうしん}が{大|おお}きく{変|か}わった。"],"a":3,"exp":"方針=방침(조직·정부가 나아갈 기본 방향). 1 台風은 進路, 2 개인의 목표는 目標·計画, 3 요리법은 作り方.","sec":"moji","id":"2012a-028","no":28},{"num":29,"part":"問題6 단어 사용법","q":"{範囲|はんい}","qko":"내일은 넓은 범위에 걸쳐 강한 비가 내리겠습니다. (정답 문장)","opts":["この{町|まち}は{川|かわ}によって{二|ふた}つの{範囲|はんい}に{分|わ}かれている。","この{会社|かいしゃ}は{新|あたら}しい{範囲|はんい}に{進出|しんしゅつ}した。","{明日|あした}は{広|ひろ}い{範囲|はんい}で{強|つよ}い{雨|あめ}が{降|ふ}るでしょう。","{家|いえ}から{駅|えき}までの{範囲|はんい}は2キロぐらいだ。"],"a":2,"exp":"範囲=범위. 1 지역 구분은 地域, 2 진출 분야는 分野, 4 거리는 距離. 「広い範囲で」는 일기예보 정형.","sec":"moji","id":"2012a-029","no":29},{"num":30,"part":"問題6 단어 사용법","q":"せめて","qko":"교토에 간다면 적어도 1박은 하고 싶다. (정답 문장)","opts":["その{店|みせ}のセーターはせめて1{万|まん}{円|えん}はするだろう。","{今|いま}からタクシーに{乗|の}っても、せめて10{時|じ}には{着|つ}けない。","{京都|きょうと}に{行|い}くなら、せめて1{泊|はく}はしたい。","{先週|せんしゅう}のテストは{自信|じしん}がなかったが、せめて50{点|てん}は{取|と}れた。"],"a":2,"exp":"せめて=적어도(최소한 이 정도는 바란다). 1 최저 가격은 少なくとも, 2 '아무리 서둘러도'는 せいぜい, 4 '겨우'는 かろうじて·やっと.","sec":"moji","id":"2012a-030","no":30},{"num":31,"part":"問題6 단어 사용법","q":"{利益|りえき}","qko":"이 가격에 팔면 가게의 이익은 거의 없다. (정답 문장)","opts":["ジョギングは{健康|けんこう}の{利益|りえき}になる。","この{値段|ねだん}で{売|う}ったら、{店|みせ}の{利益|りえき}はほとんどない。","かぜ{薬|ぐすり}を{飲|の}んだが、{利益|りえき}が{感|かん}じられない。","バスの{利益|りえき}は、{新|しん}{幹線|かんせん}よりも{料金|りょうきん}が{安|やす}いことだ。"],"a":1,"exp":"利益=이익(돈). 1 건강에 좋다는 効果, 3 약의 효과도 効果, 4 장점은 利点(りてん).","sec":"moji","id":"2012a-031","no":31},{"num":32,"part":"問題6 단어 사용법","q":"かなう","qko":"내 가게를 갖는다는 꿈이 마침내 이루어졌다. (정답 문장)","opts":["{苦労|くろう}がかなう、{彼|かれ}は{俳優|はいゆう}として{成功|せいこう}をおさめた。","{天気|てんき}{予報|よほう}がかなう、{今日|きょう}は{一|いち}{日|にち}{中|じゅう}{快晴|かいせい}だった。","{準備|じゅんび}を{重|かさ}ねてきたイベントが{無事|ぶじ}かなう。","{自分|じぶん}の{店|みせ}を{持|も}つという{夢|ゆめ}が、とうとうかなった。"],"a":3,"exp":"かなう=이루어지다(꿈·願い). 1 '수고가 보답받다'는 報われる, 2 예보가 맞다는 当たる, 3 행사가 무사히 치러지다는 行われる·成功する.","sec":"moji","id":"2012a-032","no":32},{"num":33,"part":"問題7 문법 형식","q":"A「もう{無理|むり}だよ、{私|わたし}には5キロなんて{走|はし}れないよ。」B「まだ500メートルだよ。なんでそうやってすぐ、もうだめ（　）{言|い}うの。」","qko":"A: 이제 못 해. 나한테 5킬로 같은 건 못 뛰어. B: 아직 500미터야. 왜 그렇게 금방 '이제 안 돼'라든가 말하는 거야.","opts":["を","は","とか","とは"],"a":2,"exp":"「〜とか言う」= ~라든가 말하다(인용). 'だめだ'라는 말을 인용하는 とか. とは는 「〜とは思わなかった」처럼 정의·인용의 틀.","sec":"bunpou","id":"2012a-033","no":33},{"num":34,"part":"問題7 문법 형식","q":"あれこれ{悩|なや}んだ（　）、ABC{大学|だいがく}を{志望|しぼう}{校|こう}に{決|き}めた。","qko":"이것저것 고민한 끝에 ABC대학을 지망교로 정했다.","opts":["さきに","すえに","ところに","とおりに"],"a":1,"exp":"「〜た末に」= ~한 끝에(여러 시행착오를 거친 결과). さきに=먼저, ところに=~하려던 때에(다른 일이 발생), とおりに=~대로.","sec":"bunpou","id":"2012a-034","no":34},{"num":35,"part":"問題7 문법 형식","q":"プリンターの{調子|ちょうし}が{悪|わる}くなり、{製造|せいぞう}{会社|かいしゃ}に{電話|でんわ}で{問|と}い{合|あ}わせたら、{向|む}こうの{担当|たんとう}{者|しゃ}に、あれこれ{質問|しつもん}に{答|こた}え（　）あげく、{対応|たいおう}できないと{言|い}われた。","qko":"프린터 상태가 나빠져 제조사에 전화로 문의했더니, 상대 담당자에게 이것저것 질문에 답하게 시킴을 당한 끝에, 결국 대응할 수 없다는 말을 들었다.","opts":["させた","させられる","させる","させられた"],"a":3,"exp":"주어는 화자. 담당자가 화자에게 답을 시켰으므로 使役受身 「答えさせられた」. 「〜あげく」는 여러 일을 거친 뒤의 나쁜 결과.","sec":"bunpou","id":"2012a-035","no":35},{"num":36,"part":"問題7 문법 형식","q":"{面倒|めんどう}だが、やはりこの{仕事|しごと}は{断|ことわ}れない。{引|ひ}き{受|う}ける（　）。","qko":"귀찮지만 역시 이 일은 거절할 수 없다. 맡을 수밖에 없지.","opts":["までもあるまい","こともない","はずもない","しかあるまい"],"a":3,"exp":"「〜しかあるまい」= ~할 수밖에 없겠지(강한 추측·단정). までもあるまい=~까지는 없겠지, こともない=~할 필요 없다, はずもない=~할 리 없다.","sec":"bunpou","id":"2012a-036","no":36},{"num":37,"part":"問題7 문법 형식","q":"{山田|やまだ}{監督|かんとく}の、「{私|わたし}、{山田|やまだ}は、50{年|ねん}ぶりにふるさとに{戻|もど}って（　）。」というあいさつに、{会場|かいじょう}からは{大|おお}きな{拍手|はくしゅ}が{起|お}こった。","qko":"\"저, 야마다는 50년 만에 고향에 돌아왔습니다\"라는 야마다 감독의 인사에 회장에서 큰 박수가 터졌다.","opts":["まいりました","いらっしゃいました","うかがいました","おいでになりました"],"a":0,"exp":"감독이 자기 행동을 말하므로 겸양어 まいりました. いらっしゃいました·おいでになりました는 상대의 행동을 높이는 존경어, うかがいました는 '찾아갔습니다'로 뜻이 다름.","sec":"bunpou","id":"2012a-037","no":37},{"num":38,"part":"問題7 문법 형식","q":"{彼女|かのじょ}の{絵|え}は、{国内|こくない}より（　）{海外|かいがい}での{評価|ひょうか}が{高|たか}い。","qko":"그녀의 그림은 국내보다 오히려 해외에서 평가가 높다.","opts":["まさか","たとえ","むしろ","かりに"],"a":2,"exp":"むしろ=오히려(둘을 비교해 한쪽을 고름). まさか=설마, たとえ=설령, かりに=가령.","sec":"bunpou","id":"2012a-038","no":38},{"num":39,"part":"問題7 문법 형식","q":"{今年|ことし}も{卒業|そつぎょう}{生|せい}を{送|おく}り{出|だ}した。{次|つぎ}に{会|あ}うときには、{彼|かれ}らも{立派|りっぱ}な{大人|おとな}に（　）。","qko":"올해도 졸업생을 보냈다. 다음에 만날 때에는 그들도 훌륭한 어른이 되어 있겠지.","opts":["なるだろう","なっただろう","なっているだろう","なっていただろう"],"a":2,"exp":"미래의 어느 시점에서 '이미 그 상태가 되어 있을 것'이므로 「なっているだろう」. なった·なっていた는 과거.","sec":"bunpou","id":"2012a-039","no":39},{"num":40,"part":"문제7 문법 형식","q":"{毎日|まいにち}（　）どちらでもいいことばかりを{日記|にっき}に{書|か}いているのだが、それがストレス{解消|かいしょう}になっている。","qko":"매일 쓰든 쓰지 않든 별 상관없는 일만 일기에 쓰고 있는데, 그것이 스트레스 해소가 되고 있다.","opts":["{書|か}くとも{書|か}かないとも","{書|か}いたか{書|か}かなかったか","{書|か}いても{書|か}かなくても","{書|か}くとか{書|か}かないとか"],"a":2,"exp":"「〜ても〜なくても」= ~하든 ~하지 않든(어느 쪽이든). 뒤의 「どちらでもいい」와 호응. 書いたか書かなかったか=썼는지 안 썼는지.","sec":"bunpou","id":"2012a-040","no":40},{"num":41,"part":"問題7 문법 형식","q":"{顔|かお}を{洗|あら}うときには、せっけんを（　）、さっと{洗|あら}うのが{肌|はだ}にはよい。","qko":"세수할 때는 비누를 너무 쓰지 않고 재빨리 씻는 것이 피부에 좋다.","opts":["{使|つか}いすぎずに","{使|つか}うにすぎず","{使|つか}うにすぎなく","{使|つか}いすぎもなくて"],"a":0,"exp":"「使いすぎずに」= 너무 쓰지 않고(Vます어간 + すぎる의 부정). 「〜にすぎない」= ~에 불과하다로 뜻이 전혀 다름.","sec":"bunpou","id":"2012a-041","no":41},{"num":42,"part":"問題7 문법 형식","q":"{留学|りゅうがく}するまで、{私|わたし}は{自分|じぶん}が{見|み}ている{世界|せかい}がすべてだと{思|おも}っていた。{実|じつ}はそれが{世界|せかい}のほんの{小|ちい}さな{一|いち}{部分|ぶぶん}（　）{気付|きづ}いていなかった。","qko":"유학할 때까지 나는 내가 보는 세계가 전부라고 생각했다. 사실 그것이 세계의 아주 작은 일부분에 불과하다는 것을 깨닫지 못했다.","opts":["でないことにしか","でしかないことに","にないことでしか","にしかないことで"],"a":1,"exp":"「一部分でしかない」= 일부분에 불과하다 + 「ことに気付いていなかった」. 뒤에 오는 気付く와의 호응(〜ことに)까지 맞춰야 함.","sec":"bunpou","id":"2012a-042","no":42},{"num":43,"part":"問題7 문법 형식","q":"（{会社|かいしゃ}で）A「あれ？あそこにいるの、{山田|やまだ}さんかな。」B「{山田|やまだ}さんは{出張|しゅっちょう}{中|ちゅう}だよ。{今|いま}ここに（　）。」","qko":"(회사에서) A: 어? 저기 있는 사람, 야마다 씨인가? B: 야마다 씨는 출장 중이야. 지금 여기 있을 리가 없잖아.","opts":["いないわけじゃないよ","いるわけないじゃない","いたわけじゃないよ","いなかったわけじゃない"],"a":1,"exp":"「いるわけない」= 있을 리가 없다 + 확인을 요구하는 「じゃない」. いないわけじゃない=없는 것은 아니다로 뜻이 반대.","sec":"bunpou","id":"2012a-043","no":43},{"num":44,"part":"問題7 문법 형식","q":"A「このタレント、{最近|さいきん}よくテレビで{見|み}るね。」B「ほんと。この{人|ひと}を{見|み}ない{日|ひ}はない（　）よね。」","qko":"A: 이 연예인, 요즘 TV에서 자주 보네. B: 정말. 이 사람을 못 보는 날이 없다고 해도 될 정도야.","opts":["と{言|い}ってもいいぐらいだ","と{言|い}ったらいいだけだ","と{言|い}ってもいいからだ","と{言|い}ったらいいことだ"],"a":0,"exp":"「〜と言ってもいいぐらいだ」= ~라고 해도 될 정도다(정도를 강조). 「からだ」「ことだ」로 끝내면 앞의 ぐらい와 호응하지 않음.","sec":"bunpou","id":"2012a-044","no":44},{"num":45,"part":"問題8 문장 배열 ★","q":"{不調|ふちょう}だった{山中|やまなか}{選手|せんしゅ}がついにゴールを{決|き}めた。{彼|かれ}に ___ ___ ★ ___ {相当|そうとう}あったはずだ。","qko":"부진했던 야마나카 선수가 드디어 골을 넣었다. 그로서는 \"만약 또 실수한다면\"이라는 부담감이 상당했을 것이다.","opts":["したら","という","プレッシャーは","「もし、またミスをしたら」"],"a":1,"star":"という","full":"{不調|ふちょう}だった{山中|やまなか}{選手|せんしゅ}がついにゴールを{決|き}めた。{彼|かれ}にしたら「もし、またミスをしたら」というプレッシャーは{相当|そうとう}あったはずだ。","exp":"「彼にしたら」= 그로서는(입장)으로 したら가 먼저. 순서 1→4→2→3, ★는 という. 「〜にしたら」는 그 사람 입장에서의 추측.","sec":"bunpou","id":"2012a-045","no":45},{"num":46,"part":"問題8 문장 배열 ★","q":"「これは{地元|じもと}ではよく{知|し}られた{料理|りょうり}で、このすっぱさがおいしい。ただ ___ ___ ★ ___ {増|ふ}えていることだね。」と{田中|たなか}さんは{語|かた}る。","qko":"\"이것은 이 지역에서 잘 알려진 요리로, 이 시큼함이 맛있다. 다만 유감인 것은 시큼한 것을 싫어한다는 젊은이가 최근 늘고 있다는 것이지\"라고 다나카 씨는 말한다.","opts":["なんていう","{残念|ざんねん}なのは","{若者|わかもの}が{最近|さいきん}","すっぱいのが{苦手|にがて}だ"],"a":0,"star":"なんていう","full":"「これは{地元|じもと}ではよく{知|し}られた{料理|りょうり}で、このすっぱさがおいしい。ただ{残念|ざんねん}なのは、すっぱいのが{苦手|にがて}だなんていう{若者|わかもの}が{最近|さいきん}{増|ふ}えていることだね。」と{田中|たなか}さんは{語|かた}る。","exp":"「残念なのは」로 시작해 「〜ことだね」로 맺음. 순서 2→4→1→3, ★는 なんていう(〜라고 하는). 「なんていう」가 若者를 수식.","sec":"bunpou","id":"2012a-046","no":46},{"num":47,"part":"問題8 문장 배열 ★","q":"{忘|わす}れられないプレゼントは、{小学|しょうがく}{生|せい}のときに{両親|りょうしん}が{買|か}ってくれた{自転|じてん}{車|しゃ}です。{苦|くる}しい{生活|せいかつ}の{中|なか}、___ ___ ★ ___ {涙|なみだ}が{出|で}ます。","qko":"잊을 수 없는 선물은 초등학생 때 부모님이 사 주신 자전거입니다. 어려운 생활 속에서 어떤 마음으로 사 주셨는지 생각하면 그것만으로도 눈물이 납니다.","opts":["それだけで","どんな{思|おも}いで","{買|か}ってくれたのかと","{思|おも}うと"],"a":3,"star":"思うと","full":"{苦|くる}しい{生活|せいかつ}の{中|なか}、どんな{思|おも}いで{買|か}ってくれたのかと{思|おも}うとそれだけで{涙|なみだ}が{出|で}ます。","exp":"「どんな思いで〜のかと思うと」= 어떤 마음으로 ~했는지 생각하면. 순서 2→3→4→1, ★는 思うと.","sec":"bunpou","id":"2012a-047","no":47},{"num":48,"part":"問題8 문장 배열 ★","q":"{最近|さいきん}、{子|こ}どもがピアノを{習|なら}いたいと{言|い}いだした。わたしは、{子|こ}どもが ___ ___ ★ ___ と{思|おも}っている。","qko":"최근 아이가 피아노를 배우고 싶다고 말하기 시작했다. 나는 아이가 하고 싶다고 생각하는 일은 하게 해 주고 싶다고 생각한다.","opts":["したい","やりたい","やらせて","と{思|おも}うことは"],"a":2,"star":"やらせて","full":"{最近|さいきん}、{子|こ}どもがピアノを{習|なら}いたいと{言|い}いだした。わたしは、{子|こ}どもがしたいと{思|おも}うことはやらせてやりたいと{思|おも}っている。","exp":"「子どもがしたいと思うことは」까지가 주제, 그 뒤 「やらせてやりたい」= 하게 해 주고 싶다. 순서 1→4→3→2, ★는 やらせて.","sec":"bunpou","id":"2012a-048","no":48},{"num":49,"part":"問題8 문장 배열 ★","q":"{国民|こくみん}の、{政治|せいじ} ___ ___ ★ ___ {政治|せいじ}{家|か}は{指導|しどう}{力|りょく}を{発揮|はっき}できるのだ。","qko":"국민의 정치에 대한 신뢰가 있어야 비로소 정치가는 지도력을 발휘할 수 있는 것이다.","opts":["{初|はじ}めて","に{対|たい}する","があって","{信頼|しんらい}"],"a":2,"star":"があって","full":"{国民|こくみん}の、{政治|せいじ}に{対|たい}する{信頼|しんらい}があって{初|はじ}めて{政治|せいじ}{家|か}は{指導|しどう}{力|りょく}を{発揮|はっき}できるのだ。","exp":"「〜があって初めて」= ~이 있어야 비로소. 순서 2→4→3→1, ★는 があって. に対する는 信頼를 수식.","sec":"bunpou","id":"2012a-049","no":49},{"num":50,"part":"問題9 글의 문법","q":"ところで、{彼|かれ}ら{鉄道|てつどう}ファンたちは（　）{趣味|しゅみ}を{楽|たの}しんでいるのだろうか。","qko":"그런데 그들 철도 팬들은 어떻게 취미를 즐기고 있는 것일까.","opts":["それほど","どのように","それでも","どちらの"],"a":1,"passage":"t2012_p9","exp":"뒤에 「〜のだろうか」가 와서 방법을 묻는 どのように가 자연스럽다. それほど=그다지, それでも=그래도, どちらの=어느 쪽의.","sec":"bunpou","id":"2012a-050","no":50},{"num":51,"part":"문제9 글의 문법","q":"「{乗|の}り{鉄|てつ}」（　）、{写真|しゃしん}を{撮|と}るのが{好|す}きな「{撮|と}り{鉄|てつ}」、{車両|しゃりょう}や{鉄道|てつどう}がある{風景|ふうけい}を{描|えが}く「{描|えが}き{鉄|てつ}」、{鉄道|てつどう}の{模型|もけい}が{好|す}きな「{模型|もけい}{鉄|てつ}」などだ。","qko":"'노리테츠' 외에도 사진 찍기를 좋아하는 '토리테츠', 차량과 철도가 있는 풍경을 그리는 '카키테츠', 철도 모형을 좋아하는 '모케이테츠' 등이다.","opts":["にかわって","によって","のうえ","のほか"],"a":3,"passage":"t2012_p9","exp":"「Aのほか、B、C…など」= A 외에 B·C…. 예를 덧붙이는 のほか. にかわって=대신에, によって=에 따라, のうえ=~한 위에·~한 후에.","sec":"bunpou","id":"2012a-051","no":51},{"num":52,"part":"문제9 글의 문법","q":"ある40{代|だい}の「{乗|の}り{鉄|てつ}」の{女性|じょせい}は{鉄道|てつどう}の{魅力|みりょく}を（　）{語|かた}る。「{窓|まど}の{外|そと}の{風景|ふうけい}をながめていると{旅|たび}の{気分|きぶん}が{味|あじ}わえるし、{車|くるま}と{違|ちが}って{座|すわ}っているだけで{目的|もくてき}{地|ち}に{着|つ}けるのがいい」。","qko":"어느 40대 '노리테츠' 여성은 철도의 매력을 이렇게 말한다. \"창밖의 풍경을 바라보고 있으면 여행 기분을 느낄 수 있고, 차와 달리 앉아 있기만 해도 목적지에 도착하는 게 좋다\".","opts":["こう","そう","{同様|どうよう}に","{以上|いじょう}のように"],"a":0,"passage":"t2012_p9","exp":"바로 뒤에 인용이 이어지므로 こう(이렇게). そう는 앞서 말한 내용을 가리킬 때 씀.","sec":"bunpou","id":"2012a-052","no":52},{"num":53,"part":"문제9 글의 문법","q":"（　）の{特徴|とくちょう}は、{他|た}の「{鉄|てつ}」とは{異|こと}なり、ホームではなく、{電車|でんしゃ}が{見|み}えるところにある{公園|こうえん}やレストランなど、{子|こ}どもと{一緒|いっしょ}にゆっくり{過|す}ごせる{場所|ばしょ}で{電車|でんしゃ}を{見|み}るという{点|てん}である。","qko":"그녀들의 특징은 다른 '철'과 달리 승강장이 아니라 전차가 보이는 곳에 있는 공원이나 레스토랑처럼 아이와 함께 느긋하게 지낼 수 있는 장소에서 전차를 본다는 점이다.","opts":["{鉄道|てつどう}ファン","{女性|じょせい}ファン","{彼女|かのじょ}たち","{大人|おとな}たち"],"a":2,"passage":"t2012_p9","exp":"앞 문장 「電車を見たがる子どもを連れて…自分も鉄道ファンになってしまったという人たちだ」를 받는 지시어 彼女たち. 이미 나온 일반 명사 女性ファン을 다시 쓰면 지시가 어색함.","sec":"bunpou","id":"2012a-053","no":53},{"num":54,"part":"문제9 글의 문법","q":"{鉄道|てつどう}ファンにはいろいろなタイプがあり、{楽|たの}しみ{方|かた}も（　）。","qko":"철도 팬에게는 여러 유형이 있고, 즐기는 방법도 다양하다.","opts":["さまざまだ","さまざまだと{言|い}われた","さまざまである{点|てん}だ","さまざまだと{思|おも}われている"],"a":0,"passage":"t2012_p9","exp":"글을 맺는 자리이므로 단정 さまざまだ. 「〜である点だ」는 앞 문장의 '점'을 정리할 때만 쓰는 형태.","sec":"bunpou","id":"2012a-054","no":54},{"num":55,"part":"問題10 단문","q":"{筆者|ひっしゃ}は、なぜ{環境|かんきょう}{問題|もんだい}を「{人間|にんげん}{問題|もんだい}」と{呼|よ}んだほうがよいと{考|かんが}えているか。","qko":"필자는 왜 환경 문제를 '인간 문제'라고 부르는 편이 좋다고 생각하는가.","opts":["{環境|かんきょう}は{人間|にんげん}にしか{変|か}えられないから","{良|よ}い{環境|かんきょう}を{必要|ひつよう}としているのは{人間|にんげん}だから","{人間|にんげん}が{責任|せきにん}を{持|も}って{考|かんが}えるべき{問題|もんだい}だから","{人間|にんげん}の{生活|せいかつ}に{多大|ただい}な{影響|えいきょう}を{与|あた}えている{問題|もんだい}だから"],"a":2,"passage":"r2012_10_1","exp":"「これらの問題はどれも人類によって起こされた問題である」→ 원인을 만든 쪽이 인간이므로 「人間が責任を持って考えるべき問題」. 4는 본문에 없고, 1·2는 논지와 다름.","sec":"dokkai","id":"2012a-055","no":55},{"num":56,"part":"問題10 단문","q":"この{会社|かいしゃ}の{割引|わりびき}サービスについて{正|ただ}しいものはどれか。","qko":"이 회사의 할인 서비스에 대해 올바른 것은 어느 것인가.","opts":["「ジミック」のプリンターを{使|つか}っている{人|ひと}は、7、{8月|はちがつ}{中|なか}だけインクを5%{引|ひ}きで{買|か}うことができる。","「ジミック」のプリンターを{使|つか}っている{人|ひと}が7、{8月|はちがつ}{中|なか}にインクを{注文|ちゅうもん}すれば、5%{引|ひ}きより{安|やす}く{買|か}うことができる。","「ジミック」のプリンターを7、{8月|はちがつ}{中|なか}に{買|か}う{人|ひと}は、インクを5%{引|ひ}きより{安|やす}く{買|か}うことができる。","「ジミック」のプリンターを7、{8月|はちがつ}{中|なか}に{買|か}う{人|ひと}がインクを{一緒|いっしょ}に{注文|ちゅうもん}すれば、どちらも5%{引|ひ}きで{買|か}うことができる。"],"a":1,"passage":"r2012_10_2","exp":"평소에도 잉크는 「定価の5%引き」. 7·8월 주문자는 「さらにお得な特別割引価格」→ 5%보다 더 싸다. 1은 '7·8월만'이 틀림(평소에도 5% 할인), 3·4는 프린터 구매자를 대상으로 한 조건이 아님.","sec":"dokkai","id":"2012a-056","no":56},{"num":57,"part":"問題10 단문","q":"{筆者|ひっしゃ}は、{恐怖|きょうふ}や{不安|ふあん}をどうとらえているか。","qko":"필자는 공포와 불안을 어떻게 파악하고 있는가.","opts":["{恐怖|きょうふ}や{不安|ふあん}は、{安全|あんぜん}{性|せい}の{向上|こうじょう}を{妨|さまた}げる。","{恐怖|きょうふ}や{不安|ふあん}を{感|かん}じることが、{安全|あんぜん}につながる。","{恐怖|きょうふ}や{不安|ふあん}を{取|と}り{除|のぞ}くことが、{安全|あんぜん}に{役立|やくだ}つ。","{恐怖|きょうふ}や{不安|ふあん}があるうちは、{安全|あんぜん}とは{言|い}えない。"],"a":1,"passage":"r2012_10_3","exp":"「恐怖や不安は…ブレーキである」→ 위험을 감지해 멈추게 하므로 안전으로 이어진다. 1·3은 브레이크를 방해물로 본 것으로 정반대.","sec":"dokkai","id":"2012a-057","no":57},{"num":58,"part":"問題10 단문","q":"「{人|ひと}に{強|つよ}い{影響|えいきょう}を{与|あた}えるのは{大部|たいぶ}からなる{作品|さくひん}とは{限|かぎ}りません」とあるが、なぜか。","qko":"「사람에게 강한 영향을 주는 것은 대부(대작)만은 아닙니다」라고 했는데, 왜인가.","opts":["{強|つよ}い{影響|えいきょう}を{与|あた}えるかどうかは、{読|よ}み{手|て}の{姿勢|しせい}で{決|き}まるものであるから","どの 012a-089"},{"num":415,"no":15,"part":"問題3 개요 이해","sec":"choukai","type":"개요 이해","intro":"テレビでサッカー{選手|せんしゅ}が{今|いま}シーズンを{振|ふ}り{返|かえ}って{話|はな}しています。","q":"この{選手|せんしゅ}は{今|いま}シーズンはどうだったと{言|い}っていますか。","qko":"이 선수는 이번 시즌이 어땠다고 말합니까? — 시합에 나가지 못했지만 좋은 점도 있었다","prompt":"","opts":["しあいにでられなかったが、いいこともあった","しあいにでられず、いいことはなかった","しあいにでたが、かつやくできなかった","しあいにでて、じゅうじつしたまいにちだった"],"a":0,"exp":"부상·수술로 재활만 했으므로 「試合に出られなかった」, 하지만 「それなりに充実していました」「家族ともゆったりした時間」→ 좋은 점도 있었다.","lines":[{"r":"Ｍ","t":"シーズン{前|まえ}にけがをして{手術|しゅじゅつ}を{受|う}けたので、{今|いま}シーズンはずっと{回復|かいふく}に{向|む}けてトレーニングの{毎日|まいにち}でした。テレビなどで{仲間|なかま}やライバルの{活躍|かつやく}する{姿|すがた}を{見|み}ると、{焦|あせ}りと{悔|くや}しい{思|おも}いでいっぱいでした。"},{"r":"Ｍ","t":"でも、{専門|せんもん}{的|てき}な{本|ほん}を{読|よ}んだりして、トレーニング{方法|ほうほう}を{客観|きゃっかん}{的|てき}に{見直|みなお}すこともできて、それなりに{充実|じゅうじつ}していました。それに、{久|ひさ}しぶりに{家族|かぞく}ともゆったりした{時間|じかん}を{持|も}つことができましたしね。"}],"audio":"k_2012a_15.mp3","id":"2012a-090"},{"num":416,"no":16,"part":"문제3 개요 이해","sec":"choukai","type":"개요 이해","intro":"{会社|かいしゃ}で{男|おとこ}の{人|ひと}と{女|おんな}の{人|ひと}が{話|はな}しています。","q":"{女|おんな}の{人|ひと}は{転勤|てんきん}についてどう{思|おも}っていますか。","qko":"여자는 전근에 대해 어떻게 생각합니까? — 어머니 일이 걱정되어 전근하고 싶지 않다","prompt":"","opts":["たいちょうにじしんがないので、てんきんしたくない","おかあさんのことがしんぱいなので、てんきんしたくない","てんきんしてもいいが、てんちょうにはなりたくない","てんきんして、てんちょうとしてがんばりたい"],"a":1,"exp":"「最近、母の体調がよくないので、あまり遠く離れるのは、ちょっと」→ 어머니 걱정. 점장 제안 자체는 「やってみたいことはたくさんある」라며 아쉬워하므로 3·4는 아님.","lines":[{"r":"Ｍ","t":"{山田|やまだ}さん、ちょっといいですか。"},{"r":"Ｆ","t":"はい、{部長|ぶちょう}。"},{"r":"Ｍ","t":"この{間|あいだ}{話|はな}した{新|あたら}しい{店|みせ}のことだけど、{実|じつ}は、{君|きみ}をそこの{店長|てんちょう}にという{話|はなし}が{出|で}てるんだ。"},{"r":"Ｆ","t":"え？"},{"r":"Ｍ","t":"これまでの{仕事|しごと}が{高|たか}く{評価|ひょうか}されててね。"},{"r":"Ｆ","t":"ありがとうございます。"},{"r":"Ｍ","t":"じゃあ、いいかな。{転勤|てんきん}にはなるけどね。"},{"r":"Ｆ","t":"あ、あのう、ぜひ{行|い}かせていただきたいんですが、ただ、{転勤|てんきん}となりますと。"},{"r":"Ｍ","t":"ん？"},{"r":"Ｆ","t":"あのう、{実|じつ}は、{最近|さいきん}、{母|はは}の{体調|たいちょう}がよくないので、あまり{遠|とお}く{離|はな}れるのは、ちょっと。"},{"r":"Ｍ","t":"あ、そう。でも、せっかくのチャンスだよ。"},{"r":"Ｆ","t":"はい、{評価|ひょうか}していただいたことは{大変|たいへん}うれしいですし、もし{店長|てんちょう}になったらやってみたいことはたくさんあるんですが。{申|もう}し{訳|わけ}ありません。また{次|つぎ}の{機会|きかい}に{ 思い込む","kana":"おもいこむ","ko":"굳게 믿다, 착각하다","pt":"동사 ます형 + 込む = 그 동작을 깊게. 혼자 깊게 생각해 그렇게 믿어버리는 것.","ex":"{自分|じぶん}が{正|ただ}しいと{思|おも}い{込|こ}んでいる。","exko":"자기가 옳다고 굳게 믿고 있다.","ts":"58:58","sec":"moji"},{"id":"w067","tag":"복합 동사","ja":"盛り上がる","kana":"もりあがる","ko":"고조되다","pt":"분위기가 달아오르고 고조될 때. 盛(성할 성)자가 들어 있다.","ex":"{話|はなし}が{盛|も}り{上|あ}がる。","exko":"이야기가 고조되다.","ts":"59:16","sec":"moji"},{"id":"w068","tag":"복합 동사","ja":"飛びつく","kana":"とびつく","ko":"달려들다, 혹하다","pt":"개가 주인에게 달려들 때, 그럴듯한 얘기에 혹할 때 둘 다.","ex":"{犬|いぬ}が{主人|しゅじん}に{飛|と}びつく。","exko":"개가 주인에게 달려든다.","ts":"59:16","sec":"moji"},{"id":"w069","tag":"복합 동사","ja":"取り掛かる","kana":"とりかかる","ko":"착수하다","pt":"착수하다 = 시작하다. 의미를 짐작하기 어려우니 단어로 외울 것.","ex":"{作業|さぎょう}に{取|と}り{掛|か}かる。","exko":"작업에 착수하다.","ts":"59:41","sec":"moji"},{"id":"w070","tag":"복합 동사","ja":"締め切る","kana":"しめきる","ko":"마감하다","pt":"마감하다. N3부터 계속 나오고 청해에도 자주 나온다.","ex":"{申|もう}し{込|こ}みを{締|し}め{切|き}る。","exko":"신청을 마감하다.","ts":"59:54","sec":"moji"},{"id":"w071","tag":"복합 동사","ja":"割り込む","kana":"わりこむ","ko":"새치기하다, 끼어들다","pt":"줄에 새치기, 남의 말에 끼어들기 둘 다.","ex":"{列|れつ}に{割|わ}り{込|こ}む。","exko":"줄에 새치기하다.","ts":"1:00:05","sec":"moji"},{"id":"w072","tag":"복합 동사","ja":"引き止める","kana":"ひきとめる","ko":"붙잡다, 만류하다","pt":"잡아 끌어서 말리는 것. 引き + 止める.","ex":"{辞|や}めようとする{人|ひと}を{引|ひ}き{止|と}める。","exko":"그만두려는 사람을 만류하다.","ts":"1:00:10","sec":"moji"},{"id":"w073","tag":"복합 동사","ja":"駆け込む","kana":"かけこむ","ko":"뛰어들다","pt":"급해서 어딘가로 뛰어 들어가는 것. 화장실·전철.","ex":"{電車|でんしゃ}に{駆|か}け{込|こ}む。","exko":"전철에 뛰어들다.","ts":"1:00:23","sec":"moji"},{"id":"w074","tag":"복합 동사","ja":"触れ合う","kana":"ふれあう","ko":"교감하다, 접촉하다","pt":"접촉하다 + 교류하다·교감하다. 自然と触れ合う(자연과 교감하다)는 청해 단골.","ex":"{自然|しぜん}と{触|ふ}れ{合|あ}う。","exko":"자연과 교감하다.","ts":"1:00:31","sec":"moji"},{"id":"w075","tag":"복합 동사","ja":"取り寄せる","kana":"とりよせる","ko":"주문해서 가져오게 하다","pt":"우리말에 없는 발상. 가게에 얘기해 갖다 달라고 하는 것.","ex":"お{菓子|かし}を{取|と}り{寄|よ}せる。","exko":"과자를 주문해 갖다 받다.","ts":"1:00:53","sec":"moji"},{"id":"w076","tag":"복합 동사","ja":"結び付く","kana":"むすびつく","ko":"결부되다, 이어지다","pt":"노력이 결과로 이어지다 → 結び付く.","ex":"{努力|どりょく}が{結果|けっか}に{結|むす}びつく。","exko":"노력이 결과로 이어진다.","ts":"1:01:00","sec":"moji"},{"id":"w077","tag":"복합 동사","ja":"寄り掛かる","kana":"よりかかる","ko":"기대다, 의존하다","pt":"기대다·의존하다. 청해에도 자주 나온다.","ex":"{壁|かべ}に{寄|よ}り{掛|か}かる。","exko":"벽에 기대다.","ts":"1:01:09","sec":"moji"},{"id":"w078","tag":"문맥·유의","ja":"口実","kana":"こうじつ","ko":"구실, 핑계","pt":"구실을 붙이다 = 口実をつける. 文句(불평)와 함께 외운다.","ex":"{口実|こうじつ}を{作|つく}る。","exko":"구실을 만들다.","ts":"1:01:47","sec":"moji"},{"id":"w079","tag":"문맥·유의","ja":"余計","kana":"よけい","ko":"쓸데없다, 여분이다","pt":"이미 해결된 일에 쓸데없는 말을 하지 말라 → 余計. 한자만으로는 뜻이 안 잡힌다.","ex":"{余計|よけい}な{話|はなし}。","exko":"쓸데없는 이야기.","ts":"1:02:47","sec":"moji"},{"id":"w080","tag":"문맥·유의","ja":"厄介","kana":"やっかい","ko":"까다롭다, 골치 아프다","pt":"골치 아픈·까다로운. 重大(じゅうだい)와 함께 선택지로 나온다.","ex":"{厄介|やっかい}な{問題|もんだい}。","exko":"까다로운 문제.","ts":"1:03:02","sec":"moji"},{"id":"w081","tag":"문맥·유의","ja":"びしょ濡れ","kana":"びしょぬれ","ko":"흠뻑 젖음","pt":"완전히 젖은 상태. '비소리'로 연상해 びしょ濡れ를 기억.","ex":"{雨|あめ}でびしょ{濡|ぬ}れになった。","exko":"비에 흠뻑 젖었다.","ts":"1:03:53","sec":"moji"},{"id":"w082","tag":"문맥·유의","ja":"すっきり","kana":"すっきり","ko":"개운하다, 후련하다","pt":"샤워해서 개운하다. 흠뻑 젖은 びしょ濡れ와 반대 상황으로 구분.","ex":"シャワーを{浴|あ}びてすっきりした。","exko":"샤워하고 개운해졌다.","ts":"1:04:19","sec":"moji"},{"id":"w083","tag":"문맥·유의","ja":"ぐっすり","kana":"ぐっすり","ko":"푹 (자다)","pt":"寝る와 항상 같이 온다. ぐっすり眠る.","ex":"{昨夜|ゆうべ}はぐっすり{眠|ねむ}れた。","exko":"어젯밤은 푹 잘 수 있었다.","ts":"1:04:31","sec":"moji"},{"id":"w084","tag":"문맥·유의","ja":"うっかり","kana":"うっかり","ko":"깜빡, 무심코","pt":"うっかり忘れる·うっかりする. 덜렁거리는 そそっかしい와 묶어서.","ex":"うっかり{傘|かさ}を{忘|わす}れた。","exko":"깜빡 우산을 두고 왔다.","ts":"1:04:31","sec":"moji"},{"id":"w085","tag":"문맥·유의","ja":"触れる","kana":"ふれる","ko":"언급하다, 닿다","pt":"예산 문제는 언급하지 않기로 했다 → 触れる. 독해에서도 触れていないのはどれ로 나온다.","ex":"{予算|よさん}の{問題|もんだい}には{触|ふ}れない。","exko":"예산 문제는 언급하지 않는다.","ts":"1:05:02","sec":"moji"},{"id":"w086","tag":"문맥·유의","ja":"及ぶ","kana":"およぶ","ko":"미치다, 이르다","pt":"영향이 미치다 = 影響が及ぶ. 가장 많이 쓰는 조합.","ex":"{影響|えいきょう}が{及|およ}ぶ。","exko":"영향이 미치다.","ts":"1:05:30","sec":"moji"},{"id":"w087","tag":"문맥·유의","ja":" tag":"7월 특강","ja":"溢れる","kana":"あふれる","ko":"넘치다","pt":"활기가 넘친다 → 活気があふれる. 満ちる(みちる)·乱れる(みだれる)와 구분.","ex":"{活気|かっき}があふれる。","exko":"활기가 넘친다.","ts":"56:01","sec":"moji"},{"id":"w182","tag":"7월 특강","ja":"満ちる","kana":"みちる","ko":"가득 차다","pt":"가득 차다. 満(만)자가 들어간다.","ex":"","exko":"","ts":"56:13","sec":"moji"},{"id":"w183","tag":"7월 특강","ja":"相次ぐ","kana":"あいつぐ","ko":"잇따르다","pt":"사건이 잇따르다 → 事件が相次ぐ. 사건이 따르다는 표현.","ex":"{事件|じけん}が{相次|あいつ}いでいる。","exko":"사건이 잇따르고 있다.","ts":"55:44","sec":"moji"},{"id":"w184","tag":"7월 특강","ja":"地元","kana":"じもと","ko":"지역, 연고지","pt":"그 고장에서 살고 있는 → 地元. 地元の候補者(지역 후보자).","ex":"","exko":"","ts":"56:51","sec":"moji"}],"gram":[{"id":"g01","t":"〜かねる","conn":"Vます어간 + かねる","m":"~하기 어렵다 (정중한 거절)","pt":"N2가 아주 좋아하는 문법. 능력이 없어서가 아니라 사정상 하기 어렵다는 뜻. 정중한 거절에 쓴다. 〜かねない와 부호가 반대.","ex":"{詳細|しょうさい}な{事情|じじょう}を{知|し}らないので、{今|いま}{直|す}ぐには{判断|はんだん}しかねます。","exko":"자세한 사정을 모르기 때문에 지금 당장은 판단하기 어렵습니다.","ts":"1:28:05","sec":"bunpou"},{"id":"g02","t":"〜かねない","conn":"Vます어간 + かねない","m":"~할 수도 있다 (나쁜 가능성)","pt":"부정적인 결과가 나올 가능성. かもしれない와 비슷하지만 나쁜 쪽에만 쓴다. かねる와 헷갈리니 이번에 확실히.","ex":"このままでは{大|おお}きな{事故|じこ}に{繋|つな}がりかねない。","exko":"이대로라면 큰 사고로 이어질 수도 있다.","ts":"1:29:00","sec":"bunpou"},{"id":"g03","t":"〜っこない","conn":"Vます어간 + っこない","m":"~할 리 없다 (구어 강한 부정)","pt":"회화체. 시험에도 나왔다. わけがない·はずがない와 유의하지만 っこない가 더 구어적.","ex":"こんな{難|むずか}しい{問題|もんだい}、{私|わたし}に{解|と}けっこない。","exko":"이런 어려운 문제, 내가 풀 리 없어.","ts":"1:29:53","sec":"bunpou"},{"id":"g04","t":"〜どころではない","conn":"Vる / 名詞 + どころではない","m":"~할 상황이 아니다","pt":"너무 바빠서·아파서·돈이 없어서 할 상황이 아니라는 뜻. 뒤에 이유가 붙는다. 名詞에 바로 붙여도 된다.","ex":"{締|し}め{切|き}りが{今日|きょう}なのに、スマホを{触|さわ}っているどころではない。","exko":"마감이 오늘인데 스마트폰을 만지작거릴 상황이 아니다.","ts":"1:30:49","sec":"bunpou"},{"id":"g05","t":"〜わけにはいかない","conn":"Vる + わけにはいかない","m":"~할 수는 없다 (도리상)","pt":"상식·도덕·의무상 그렇게 할 수는 없다는 뜻. ざるを得ない와 반대 방향.","ex":"いくら{忙|いそが}しくても、{約束|やくそく}を{破|やぶ}るわけにはいかない。","exko":"아무리 바빠도 약속을 어길 수는 없다.","ts":"1:31:25","sec":"bunpou"},{"id":"g06","t":"〜ざるを得ない","conn":"Vない어간 + ざるを{得|え}ない (する→せざるを得ない)","m":"~하지 않을 수 없다","pt":"불가피한 상황을 객관적으로 말한다. する는 せざるを得ない가 되니 예문으로 외울 것.","ex":"{台風|たいふう}の{影響|えいきょう}で、{旅行|りょこう}の{予定|よてい}を{変更|へんこう}せざるを{得|え}なかった。","exko":"태풍의 영향으로 여행 예정을 변경하지 않을 수 없었다.","ts":"1:32:02","sec":"bunpou"},{"id":"g07","t":"〜というと / 〜といったら","conn":"名詞 + というと","m":"~라고 하면 (구체적 예시)","pt":"구체적인 예를 들 때. 〜のような·〜をはじめ와 같은 무리로 외운다.","ex":"{歴史|れきし}のある{町|まち}というと、{京都|きょうと}や{奈良|なら}が{思|おも}い{浮|う}かぶ。","exko":"역사가 있는 마을이라고 하면 교토나 나라가 떠오른다.","ts":"1:32:46","sec":"bunpou"},{"id":"g08","t":"〜ことだから","conn":"名詞(사람) + のことだから","m":"~이니까 (성격상 틀림없이)","pt":"성격이나 평소 모습을 근거로 추측할 때. 사람에게만 쓴다. 〜だからさすがに와 함께 기억.","ex":"{真面目|まじめ}な{田中|たなか}さんのことだから、{約束|やくそく}は{守|まも}るだろう。","exko":"성실한 다나카 씨이니까 약속은 지킬 것이다.","ts":"1:33:19","sec":"bunpou"},{"id":"g09","t":"〜だけに / 〜だけあって","conn":"名詞·보통형 + だけに / だけあって","m":"~인 만큼 (역시)","pt":"해석을 어려워하는 문법. 결과를 당연하다고 여길 때. 名詞 + な + だけに, 名詞 + の + ことだから 형태도 함께.","ex":"{真面目|まじめ}な{田中|たなか}さんだけに、{仕事|しごと}も{丁寧|ていねい}だ。","exko":"성실한 다나카 씨인 만큼 일도 꼼꼼하다.","ts":"1:33:49","sec":"bunpou"},{"id":"g10","t":"〜にかけては","conn":"名詞 + にかけては","m":"~에 있어서는 (뒤에 우수하다)","pt":"어떤 분야에서는 최고·뛰어나다는 평가가 뒤에 온다. 〜から〜にかけて(기간)와 전혀 다르니 구별.","ex":"{料理|りょうり}の{腕|うで}にかけては、{彼|かれ}に{敵|かな}う{人|ひと}はいない。","exko":"요리 솜씨에 있어서는 그를 당해낼 사람이 없다.","ts":"1:34:20","sec":"bunpou"},{"id":"g11","t":"〜に応じて / 〜に応じては","conn":"名詞 + に応じて","m":"~에 따라 (변화)","pt":"상황·조건이 변하면 거기에 맞춰 변한다는 뜻. 応자 두 개를 구별: 期待に応えて는 기대에 부응하여.","ex":"{収入|しゅうにゅう}に{応|おう}じて、{税金|ぜいきん}の{金額|きんがく}も{変|か}わる。","exko":"수입에 따라 세금 금액도 변한다.","ts":"1:35:01","sec":"bunpou"},{"id":"g12","t":"〜べきだ / 〜べきではない","conn":"Vる + べきだ (する→するべき/すべき)","m":"~해야 한다 / ~해서는 안 된다","pt":"상식·도덕적 의무. する는 するべきだ도 すべきだ도 가능. 부정형은 べきではない.","ex":"{人|ひと}の{見|み}た{目|め}だけで{判断|はんだん}するべきではない。","exko":"겉모습만으로 판단해서는 안 된다.","ts":"1:36:47","sec":"bunpou"}],"listen":[{"id":"l01","ja":"〜なしには〜ない","m":"~없이는 ~할 수 없다","pt":"즉시 응답은 N2 기능어의 의미를 정확히 알아야 풀린다.","ex":"{涙|なみだ}なしには{見|み}られない{話|はなし}だ。","exko":"눈물 없이 못 볼 이야기다.","ts":"2:13:43","sec":"choukai"},{"id":"l02","ja":"〜一方だ","m":"~하기만 한다 (한 방향으로 계속)","pt":"계속 늘기만 한다 → 상대가 '안 됐네요'라고 반응하는 즉시 응답. 문법에서도 같은 표현을 다뤘다.","ex":"{体重|たいじゅう}が{増|ふ}える{一方|いっぽう}だ。","exko":"체중이 늘기만 한다.","ts":"2:13:59","sec":"choukai"},{"id":"l03","ja":"〜ないではいられない","m":"~하지 않고는 있을 수 없다","pt":"화를 내지 않고는 못 배긴다 → 화를 낼 수밖에 없었다는 상황.","ex":"{部下|ぶか}の{態度|たいど}に{怒|おこ}らないではいられない。","exko":"부하의 태도에 화를 내지 않고는 있을 수 없다.","ts":"2:14:25","sec":"choukai"},{"id":"l04","ja":"〜なくてもいい","m":"~하지 않아도 된다","pt":"문장 끝 표현으로 화자의 의도를 파악하는 문제. 살 필요 없잖아 = 買わなくてもいい.","ex":"{高|たか}いから、そんなに{買|か}わなくてもいいんじゃない？","exko":"비싸니까 그렇게 살 필요 없지 않아?","ts":"2:14:55","sec":"choukai"},{"id":"l05","ja":"〜といいのだが / 〜たらいいのに","m":"~하면 좋을 텐데 (바람·아쉬움)","pt":"문장 끝의 아쉬움·바람 표현. 외출 전에 비가 그치면 좋을 텐데.","ex":"{出|で}かける{前|まえ}に{雨|あめ}が{止|や}むといいのだが。","exko":"외출하기 전에 비가 그치면 좋을 텐데.","ts":"2:16:04","sec":"choukai"},{"id":"l06","ja":"〜ていたら（よかったのに）","m":"~했더라면 좋았을 텐데","pt":"할아버지가 살아 계셨더라면 좋았을 텐데 → 지난 일에 대한 아쉬움 표현.","ex":"{祖父|そふ}が{生|い}きていたらよかったのに。","exko":"할아버지가 살아 계셨더라면 좋았을 텐데.","ts":"2:16:21","sec":"choukai"}],"tips":[{"id":"t01","title":"시험 한 달 전, 이것만은 꼭 (5원칙)","items":["공부 범위를 무리하게 늘리지 말 것 — 새 교재를 사서 푸는 것보다 지금까지 한 내용을 반복 정리.","맞힌 문제보다 틀린 문제를 챙길 것 — 찍어서 맞힌 문제도 이유를 짚고 넘어간다.","'알 것 같은 것'을 확실히 알 것 — 레벨이 올라갈수록 애매한 이해로는 정답을 못 고른다.","청해는 한 번 듣고 정답 고르는 연습 — 실전은 한 번뿐이다.","마지막 2주는 실제 시험과 같은 순서·시간 배분으로 연습."],"note":"유미희 선생님","ts":"0:33","sec":"plan"},{"id":"t02","title":"1교시 시간 배분 (105분)","items":["문자·어휘 30문항 → 20분 (한 문제 20초 안팎, 빠르게)","문법 21문항 → 23분","독해 → 55분 (1교시의 절반 이상)","답안 마킹 → 7분 (파트별로 나눠서 마킹)","10시 시작이면 10시 45분에는 무조건 독해 시작"],"note":"청해는 별도 55분·30문항. 과락은 언어지식·독해·청해 각 19점 이상(7월 특강).","ts":"2:43","sec":"plan"},{"id":"t03","title":"문자·어휘 요령","items":["속도감 있게 풀어 독해 시간을 확보. 모르는 문제는 체크하고 나중에.","기출 어휘를 하루 20~30개씩, 단어장 あ행부터 막 외우지 말고 기출부터.","N2 시험에는 N3·N4 어휘도 나온다. 헷갈리면 반드시 다시 확인.","한자 읽기는 눈과 입으로 암기(정확한 발음으로 소리 내서). 두 글자 음독 한자 위주.","한자 표기는 밑줄의 뜻을 먼저 파악하고 부수로 분석(한자의 80%가 형성문자)."],"note":"","ts":"4:12","sec":"moji"},{"id":"t04","title":"단어 형성·접두접미 포인트","items":["의미가 아니라 '단어 조합'으로 암기 — 玉子大·一口大처럼 붙여서 하나의 표현으로.","기출 어휘가 필수. 세 문제 중 한 문제는 새로 나오지만 대부분 기출이 반복된다.","한국어와 다른 접두어·접미어를 정리(最有力·対抗心·向上心·無理解·非常識).","부수 하나 차이 나는 한자(濃/農, 管/官, 福/副)를 짝으로 확인."],"note":"","ts":"40:38","sec":"moji"},{"id":"t05","title":"문법 포인트","items":["쉬운 문법에서 점수를 놓치지 말 것 — N3·N4 문법이 다수 출제된다.","문법 1번은 호응을 묻는 문제. 부사와 짝(めったに〜ない, 決して〜ない 등)을 세트로 암기.","문장 만들기는 구조로 접근: 명사+の+명사, 명사+조사+동사, 부사+동사 순서.","글의 문법은 네모 앞뒤 흐름(역접·순접·예시·첨가)을 먼저 예상하고 선택지를 본다."],"note":"","ts":"1:19:50","sec":"bunpou"},{"id":"t06","title":"독해 포인트","items":["질문을 먼저 읽고 → 지문 → 머릿속 정리 → 선택지 순서로.","정답을 찾으려 하지 말고 오답을 버린다. 근거를 가지고 소거.","오답 패턴: 본문에 없는 내용·방향이 다른 내용·앞뒤 정보 섞기·의미 확대·축소·왜곡.","역접 접속사 뒤에 필자의 생각이 온다. 중문·장문은 단락을 나눠 한 문제씩.","쉬운 문제부터: 정보 검색 → 통합 이해 → 단문 → 중문·장문 순서가 안전."],"note":"단문 5지문 3분씩 15분, 중문 4지문 5분씩, 통합이해 6분, 장문 8분, 정보검색.","ts":"1:41:49","sec":"dokkai"},{"id":"t07","title":"청해 포인트","items":["전부 들으려 하지 말고 흐름을 따라간다. 못 들은 말은 버린다.","처음 말이 최종 결정이 아니다 — 중간에 의견·계획이 바뀐다. 끝까지 듣는다.","패턴 숙지: 과제 이해(최종 행동)·포인트 이해(이유·계기·문제점)·개요 이해(주제)·즉시 응답·통합 이해.","손을 써라 — 누가·언제·어디서·무엇을을 기호로 메모. 셰도잉으로 속도·억양에 익숙해지기.","55분 끊지 않고 듣는 실전 시뮬레이션. 통합 이해는 예제 없이 바로 1번 시작, 마킹 시간이 따로 없다."],"note":"","ts":"2:00:00","sec":"choukai"},{"id":"t08","title":"7월 특강의 '한 달 전 대비책' (보강)","items":["시간 관리 훈련이 1순위. 모의고사 최소 2회 — 첫 회로 약점 파악, 두 번째로 보충.","과락 주의: 언어지식·독해·청해 각 19점 이상. 하나라도 미달이면 총점과 무관하게 불합격.","기출 어휘·문법은 예문으로 암기. 문맥 규정·용법은 뜻만 외우면 못 푼다.","매일 듣기 — 자기 전 10분이라도. 기출 문제 반복 청취로 속도·억양에 익숙해지기.","지난 적중특강도 함께 보기 — 출제 포인트와 풀이 노하우는 매번 크게 다르지 않다."],"note":"26년 7월 특강(업로드 약 5개월 전) 기준","ts":"0:39","sec":"plan"}],"quiz":[{"id":"q01","q":"{地震|じしん}の{多|おお}い{日本|にほん}では、{何|なに}より{防災|ぼうさい}が{重要|じゅうよう}だ。","qko":"지진이 많은 일본에서는 무엇보다 방재가 중요하다. (밑줄: 防災)","opts":["ぼうさい","ぼうざい","ほうさい"],"a":0,"exp":"正解 ぼうさい。防은 훈독 ふせぐ, 音読 ぼう. 防災·防火(ぼうか)·防止(ぼうし)·防犯(ぼうはん)로 묶어 기억. 함정은 ざい/さい의 탁점.","ts":"19:32","sec":"moji"},{"id":"q02","q":"{彼|かれ}は{莫大|ばくだい}な{財産|ざいさん}を{築|きず}いた。","qko":"그는 막대한 재산을 쌓았다. (밑줄: 莫大)","opts":["ばくだい","ぼくだい","ばくたい"],"a":0,"exp":"正解 ばくだい. 金額·손해·이익 등 규모가 클 때. 膨大(ぼうだい)는 양·수량이 많은 것이라 구분.","ts":"20:56","sec":"moji"},{"id":"q03","q":"{具体|ぐたい}{的|てき}な{数字|すうじ}を{示|しめ}して{説明|せつめい}してください。","qko":"구체적인 숫자를 제시해서 설명해 주세요. (밑줄: 示して)","opts":["しめして","さして","ためして"],"a":0,"exp":"正解 しめして(示す). 指す(さす)는 손가락으로 가리키는 것, 試す(ためす)는 시도하다. 示는 보일 시(示) 부수.","ts":"22:05","sec":"moji"},{"id":"q04","q":"{睡眠|すいみん}が{十分|じゅうぶん}でないと、{目|め}を{閉|と}じても{眠|ねむ}れない。","qko":"수면이 충분하지 않으면 눈을 감아도 잠들지 않는다. (밑줄: 睡眠)","opts":["すいみん","すいめん","ずいみん"],"a":0,"exp":"正解 すいみん. 형성문자 분석: 睡=目+垂, 眠=目+民. 물을 뜻하는 水와 헷갈리지 않게 目(눈 목)이 들어간 것을 확인.","ts":"23:50","sec":"moji"},{"id":"q05","q":"{災害|さいがい}に{備|そな}えて、{水|みず}と{食料|しょくりょう}を{用意|ようい}しておく。","qko":"재해에 대비해 물과 식료품을 준비해 둔다. (밑줄: 災害)","opts":["さいがい","さいかい","ざいがい"],"a":0,"exp":"正解 さいがい. 災는 さい로 읽어 火災(かさい)·災難(さいなん)도 같은 무리. 害(がい)에 濁点.","ts":"20:19","sec":"moji"},{"id":"q06","q":"{彼|かれ}は{選手|せんしゅ}{生活|せいかつ}から{引退|いんたい}するという{噂|うわさ}を{打|う}ち{消|け}した。","qko":"그는 선수 생활에서 은퇴한다는 소문을 부인했다. (밑줄: 打ち消した)","opts":["부인했다","지웠다","지지했다"],"a":0,"exp":"正解 '부인했다'. 打ち消す는 지우다·부인하다 두 뜻. 소문·발언·의심·불안을 목적어로 쓸 때는 '부정·떨쳐냄'이다.","ts":"1:13:44","sec":"moji"},{"id":"q07","q":"{締|し}め{切|き}りが{今日|きょう}なのに、スマホを{触|さわ}っている____ではない。","qko":"마감이 오늘인데 스마트폰을 만지작거릴 상황이 아니다. (빈칸)","opts":["どころ","ところ","ばかり"],"a":0,"exp":"正解 どころではない. '~할 상황이 아니다'. ばかりではない는 '~만이 아니다'로 뜻이 다르다.","ts":"1:30:58","sec":"moji"}]}</script>
<script>
(function () {
  'use strict';
  var DATA = window.__DATA__;
  var VOCAB = DATA.vocab.vocab;
  var GRAM = DATA.grammar.grammar;
  var QUIZ = DATA.quiz.quiz;
  var STR = DATA.reading.strategy;
  var PASS = DATA.reading.passages;
  var LST = DATA.listening.listening;
  var TIPS = DATA.tips;

  var KEY = 'jlptn2.state.v1';
  var EXAM = new Date(2026, 11, 6, 9, 40, 0);

  /* ---------- state ---------- */
  var S = { v: {}, g: {}, r: {}, l: {}, chk: {}, quizBest: 0, quizOk: {}, quizWrong: [], rate: 1, roles: true, furi: true, tr: {}, ltr: {} };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var o = JSON.parse(raw);
      for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) S[k] = o[k];
    }
  } catch (e) { }
  if (S.furi === undefined) S.furi = true;
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
    paintHeader();
  }

  /* ---------- utils ---------- */
  function $(id) { return document.getElementById(id); }
  function on(el, ev, fn) { if (el) el.addEventListener(ev, fn); }
  function keys(o) { return Object.keys(o || {}); }
  function cnt(o) { return keys(o).length; }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  /* furigana markup: {漢字|かんじ} -> <ruby>漢字<rt>かんじ</rt></ruby>  */
  var FURI = /\{([^{}|]*)\|([^{}|]*)\}/g;
  function plain(s) {
    return String(s).replace(/\{([^{}|]*)\|[^{}|]*\}/g, '$1');
  }
  function ruby(s) {
    s = String(s);
    var out = '', last = 0, m;
    FURI.lastIndex = 0;
    while ((m = FURI.exec(s))) {
      out += esc(s.slice(last, m.index)) + '<ruby>' + esc(m[1]) + '<rt>' + esc(m[2]) + '</rt></ruby>';
      last = m.index + m[0].length;
    }
    return out + esc(s.slice(last));
  }
  function furiOn() { return S.furi !== false; }
  function applyFuri() {
    var on = furiOn();
    try {
      if (document.body && document.body.classList) {
        document.body.classList.toggle('furi', on);
        document.body.classList.toggle('nofuri', !on);
      }
    } catch (e) { }
    var b = $('furibtn');
    if (b) {
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.title = on ? '예문 후리가나 끄기' : '예문 후리가나 켜기';
    }
  }
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.className = 'toast show';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = 'toast'; }, 1800);
  }
  function keepScroll(fn) {
    var y = window.scrollY || window.pageYOffset || 0;
    fn();
    window.scrollTo(0, y);
  }
  function daysLeft() {
    var n = new Date(), t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    return Math.round((EXAM - t0) / 86400000);
  }
  function dstr(d) {
    return (d.getMonth() + 1) + '/' + d.getDate();
  }
  function examMinus(n) {
    var d = new Date(EXAM); d.setDate(d.getDate() - n);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  /* ---------- speech ---------- */
  var synth = window.speechSynthesis;
  var IOS = (function () {
    try {
      var ua = navigator.userAgent || '';
      if (/iPad|iPhone|iPod/.test(ua)) return true;
      return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
    } catch (e) { return false; }
  })();
  var voiceWarned = false;
  function pickVoice() {
    if (!synth) return null;
    var vs = synth.getVoices() || [];
    for (var i = 0; i < vs.length; i++) if (/^ja[-_]JP/i.test(vs[i].lang)) return vs[i];
    for (var j = 0; j < vs.length; j++) if (/^ja/i.test(vs[j].lang)) return vs[j];
    return null;
  }
  function warnNoVoice() {
    if (voiceWarned || pickVoice()) return;
    voiceWarned = true;
    toast('일본어 음성이 없어요. 설정 → 손쉬운 사용 → 읽기 및 말하기 → 음성에서 추가하세요');
  }
  if (synth) { synth.onvoiceschanged = function () { }; }
  /* iOS WebKit drops an utterance queued in the same tick as cancel().
     Only cancel when something is actually playing, and give it a moment. */
  function afterCancel(fn) {
    if (synth && (synth.speaking || synth.pending)) {
      try { synth.cancel(); } catch (e) { }
      setTimeout(fn, 60);
    } else {
      fn();
    }
  }
  function utter(text, pitch) {
    var u = new SpeechSynthesisUtterance(plain(text));
    u.lang = 'ja-JP';
    var v = pickVoice(); if (v) u.voice = v;
    u.rate = Number(S.rate) || 1;
    u.pitch = pitch || 1;
    return u;
  }
  function speak(text, pitch) {
    if (!synth) { toast('이 브라우저에서는 음성을 지원하지 않아요'); return; }
    warnNoVoice();
    afterCancel(function () { synth.speak(utter(text, pitch)); });
  }
  function rolePitch(l) {
    if (!S.roles) return 1;
    return l.s === '男' ? 0.78 : (l.s === '女' ? 1.2 : 1);
  }
  function speakLines(lines) {
    if (!synth) { toast('이 브라우저에서는 음성을 지원하지 않아요'); return; }
    if (!lines || !lines.length) return;
    warnNoVoice();
    if (IOS || lines.length === 1) {
      /* iOS: one utterance per tap only. Queueing several drops the rest. */
      afterCancel(function () {
        var text = lines.map(function (l) { return plain(l.t); }).join('。 ');
        synth.speak(utter(text, lines.length === 1 ? rolePitch(lines[0]) : 1));
      });
      return;
    }
    var i = 0;
    var next = function () {
      if (i >= lines.length) return;
      var l = lines[i++];
      var u = utter(l.t, rolePitch(l));
      u.onend = next;
      u.onerror = next;
      synth.speak(u);
    };
    afterCancel(next);
  }
  function stopSpeak() { if (synth) { try { synth.cancel(); } catch (e) { } } }

  /* ---------- real Japanese audio (edge-tts MP3 on GitHub Pages) ----------
     iPhone Safari does not play speechSynthesis (silent-mode / voice rules),
     so the listening drills play a pre-rendered MP3 dialogue instead. The
     speech engine stays as the fallback for file:// or a failed load. */
  var curAudio = null, curBtn = null, audioWarned = false;
  var canAudio = (function () {
    try {
      if (typeof Audio === 'undefined') return false;
      if (typeof location !== 'undefined' && /^file:/i.test(location.protocol || '')) return false;
      return true;
    } catch (e) { return false; }
  })();
  function setPlaying(btn, on) {
    if (!btn) return;
    if (on) {
      if (!btn.getAttribute('data-lbl')) btn.setAttribute('data-lbl', btn.textContent);
      btn.classList.add('playing');
      btn.textContent = btn.getAttribute('data-playing') || '♪ 재생 중';
    } else {
      btn.classList.remove('playing');
      var l = btn.getAttribute('data-lbl');
      if (l) btn.textContent = l;
    }
  }
  function stopAudio() {
    if (curAudio) {
      try { curAudio.pause(); } catch (e) { }
      try { curAudio.currentTime = 0; } catch (e) { }
      curAudio = null;
    }
    if (curBtn) { setPlaying(curBtn, false); curBtn = null; }
  }

  function byId(arr, id) { for (var i = 0; i < arr.length; i++) if (String(arr[i].i) === String(id)) return arr[i]; return null; }

  /* ---------- QUIZ ---------- */
  var QZ = { order: [], idx: 0, answered: false, correct: 0, wrong: [], done: false };
  function startQuiz(ids) {
    var list = ids && ids.length ? ids.slice() : QUIZ.map(function (q) { return q.i; });
    QZ = { order: list, idx: 0, answered: false, correct: 0, wrong: [], done: false };
  }
  function answerQuiz(i) {
    if (QZ.done || QZ.answered) return;
    var q = byId(QUIZ, QZ.order[QZ.idx]);
    QZ.answered = true; QZ.picked = i;
    if (i === q.a) { QZ.correct++; S.quizOk[q.i] = 1; save(); }
    else { QZ.wrong.push(q.i); }
    keepScroll(renderQuiz);
  }
  function nextQuiz() {
    if (!QZ.answered) return;
    if (QZ.idx + 1 < QZ.order.length) {
      QZ.idx++; QZ.answered = false; QZ.picked = null; renderQuiz();
      return;
    }
    QZ.done = true;
    if (QZ.order.length === QUIZ.length && QZ.correct > (Number(S.quizBest) || 0)) S.quizBest = QZ.correct;
    S.quizWrong = QZ.wrong.slice();
    save(); renderQuiz();
  }
  function renderQuiz() {
    if (!QZ.order.length) startQuiz(null);
    if (QZ.done) {
      var totalQ = QZ.order.length;
      $('tab-quiz').innerHTML = '<h2>실전 퀴즈</h2>'
        + '<div class="card" style="text-align:center">'
        + '<div class="muted">결과</div>'
        + '<div class="bigscore">' + QZ.correct + ' / ' + totalQ + '</div>'
        + '<div class="muted small">정답률 ' + Math.round(QZ.correct / totalQ * 100) + '%</div>'
        + '<div class="hr"></div>'
        + '<div class="row" style="justify-content:center;flex-wrap:wrap">'
        + (QZ.wrong.length ? '<button class="btn pri" id="qagain">틀린 ' + QZ.wrong.length + '문제만 다시 풀기</button>' : '')
        + '<button class="btn" id="qrestart">전체 다시 풀기</button>'
        + '</div></div>'
        + (QZ.wrong.length ? '<p class="muted small">틀린 문제 번호: ' + QZ.wrong.join(', ') + '</p>' : '<p class="muted small">전부 맞혔어요. 최고 기록이 저장됩니다.</p>');
      on($('qagain'), 'click', function () { startQuiz(QZ.wrong); renderQuiz(); });
      on($('qrestart'), 'click', function () { startQuiz(null); renderQuiz(); });
      return;
    }
    var q = byId(QUIZ, QZ.order[QZ.idx]);
    var opts = q.opts.map(function (o, i) {
      var cls = 'opt';

    $('tab-quiz').innerHTML = '<h2>실전 퀴즈</h2><p class="lead">' + QUIZ.length + '문항 · 어휘·한자·문법 4지선다. 즉시 해설이 나옵니다.</p>'

    var host = root || $('tab-hit');
    Array.prototype.forEach.call(host.querySelectorAll('[data-hsec]'), function (b) {
      b.addEventListener('click', function () { HF.sec = b.getAttribute('data-hsec'); HF.limit = 20; renderHit(); });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-hw]'), function (b) {
      b.addEventListener('click', function () {
        var w = hFind(b.getAttribute('data-hw'));
        if (!w) return;
        toggleMp3('audio/hw_' + w.id + '.mp3', b, function () { speak(w.kana); });
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-hx]'), function (b) {
      b.addEventListener('click', function () {
        var w = hFind(b.getAttribute('data-hx'));
        if (!w) return;
        toggleMp3('audio/hx_' + w.id + '.mp3', b, function () { speak(w.ex); });
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-hg]'), function (b) {
      b.addEventListener('click', function () {
        var g = hFind(b.getAttribute('data-hg'));
        if (!g) return;
        toggleMp3('audio/hg_' + g.id + '.mp3', b, function () { speak(g.ex); });
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-hl]'), function (b) {
      b.addEventListener('click', function () {
        var l = hFind(b.getAttribute('data-hl'));
        if (!l) return;
        toggleMp3('audio/hl_' + l.id + '.mp3', b, function () { speak(l.ex); });
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-hd]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-hd'), s = hgStore(), w = hwStore();
        var cur = w[id] || s[id];
        if (cur) { delete w[id]; delete s[id]; } else { w[id] = 1; s[id] = 1; }
        save();
        keepScroll(renderHit);
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-hq]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-hq'), i = +b.getAttribute('data-hi'), st = hqStore();
        if (typeof st[id] === 'number') return;
        st[id] = i + 1;
        save();
        var q = hFind(id), card = document.getElementById('h-' + id);
        if (q && card) {
          var tmp = document.createElement('div');
          tmp.innerHTML = hitQuiz(q);
          var fresh = tmp.firstChild;
          card.parentNode.replaceChild(fresh, card);
          bindHit($('tab-hit'));
          hProgress();
        }
      });
    });
    on($('hmore'), 'click', function () { HF.limit += 24; keepScroll(renderHit); });
    on($('hreset'), 'click', function () {
      if (!confirm('적중 예상 문제의 답을 모두 지울까요?')) return;
      S.hq = {};
      save(); renderHit();
      toast('답을 초기화했어요');
    });
  }
  function hProgress() {
    var c = hCounts(), b = $('hbar');
    var t = $('hstat');
    if (t) t.innerHTML = '<span>표제어 <b>' + c.dw + '/' + c.tw + '</b></span><span>문법·청해 <b>' + c.dg + '/' + c.tg + '</b></span>'
      + '<span>예상 문제 <b>' + c.dq + '/' + c.tq + '</b> (정답 ' + c.ok + ')</span>';
    if (b) b.style.width = ((c.tw + c.tg + c.tq) ? Math.round((c.dw + c.dg + c.dq) / (c.tw + c.tg + c.tq) * 100) : 0) + '%';
  }
  function renderHit() {
    stopSound();
    var all = hItems();
    var list = all.filter(function (it) { return HF.sec === 'all' || it.o.sec === HF.sec; });
    var m = HIT.meta || {}, v = m.video || {}, v2 = m.video2 || {};
    var secChips = '<button class="chip' + (HF.sec === 'all' ? ' on' : '') + '" data-hsec="all">전체 <span class="small">' + all.length + '</span></button>'
      + (HIT.secs || []).map(function (s) {
        var n = all.filter(function (it) { return it.o.sec === s[0]; }).length;
        return '<button class="chip' + (HF.sec === s[0] ? ' on' : '') + '" data-hsec="' + s[0] + '">' + s[2] + ' ' + esc(s[1]) + ' <span class="small">' + n + '</span></button>';
      }).join('');
    var src = '<div class="card tight hitsrc">'
      + '<div class="hittitle">' + esc(m.title || '적중특강') + '</div>'
      + '<div class="muted" style="margin:6px 0 4px">26년 12월 시험 대비 · ' + esc(v.date || '') + ' · ' + esc(v.dur || '') + '</div>'
      + '<a href="' + v.url + '" target="_blank" rel="noopener">' + esc(v.title) + ' ↗</a>'
      + '<div class="muted" style="margin:8px 0 4px">타임코드</div>'
      + '<div class="muted small">' + (v.chap || []).map(function (c) { return esc(c[0]) + ' ' + esc(c[1]); }).join(' · ') + '</div>'
      + '<div class="muted" style="margin:10px 0 4px">보강 · 26년 7월 시험 대비 · ' + esc(v2.date || '') + ' · ' + esc(v2.dur || '') + '</div>'
      + '<a href="' + v2.url + '" target="_blank" rel="noopener">' + esc(v2.title) + ' ↗</a>'
      + '<div class="note" style="margin-top:10px">' + esc(m.note || '') + '</div>'
      + '</div>';
    var shown = list.slice(0, HF.limit);
    var html = '<h2>🎯 적중특강</h2>'
      + '<p class="lead">시원스쿨 일본어 유미희 선생님의 26년 12월 JLPT N2 적중특강(2시간 21분)에서 다룬 어휘·문법·전략·예상 문제만 골라 정리했습니다.</p>'
      + src
      + '<div class="chips wrap">' + secChips + '</div>'
      + '<div class="hitstat" id="hstat"></div>'
      + '<div class="bar" style="margin:0 0 14px"><i id="hbar" style="width:0%"></i></div>';
    html += shown.map(hRender).join('');
    if (!list.length) html += '<div class="card"><p class="muted">항목이 없습니다.</p></div>';
    if (list.length > shown.length) {
      html += '<button class="btn" id="hmore" style="width:100%;margin:2px 0 10px">다음 ' + Math.min(24, list.length - shown.length)
        + '개 더 보기 (' + (list.length - shown.length) + '개 남음)</button>';
    }
    html += '<button class="btn" id="hreset" style="width:100%;margin:4px 0 12px">적중 예상 문제 답 초기화</button>'
      + '<p class="muted small">※ 이 탭의 항목은 강의 자막(한국어 자동 생성)에서 확인된 내용만 옮겼고, 일본어 표기는 발음을 표준 표기로 되살렸습니다. 원 강의의 판서·슬라이드에만 있고 자막에 없는 예문은 담지 않았습니다.</p>';
    $('tab-hit').innerHTML = html;
    bindHit();
    hProgress();
  }
  window.__APP__ = {
    go: go, state: S, stat: stat, total: TOTAL,
    answerQuiz: answerQuiz, nextQuiz: nextQuiz, startQuiz: startQuiz,
    answerReading: answerReading, answerListening: answerListening, toggleTr: toggleTr,
    markVocab: markVocab, toggleGrammarDone: toggleGrammarDone,
    speak: speak, speakLines: speakLines, quiz: function () { return QZ; },
    listeningItem: lById, playItem: playItem, playGrammar: playGrammar, playVocabEx: playVocabEx,
    playVocabWord: playVocabWord,
    plain: plain, ruby: ruby, renderKako: renderKako, kako: function () { return KAKO; }, ios: function () { return IOS; },
    renderHit: renderHit, hit: function () { return HIT; },
    setFuri: function (v) { S.furi = !!v; applyFuri(); }
  };
  init();
})();

</script>
</body>
</html>

ったから、{今年|ことし}はやっぱり{違|ちが}うところがいいな。…あ、そうだ。{部長|ぶちょう}が{和食|わしょく}がいいって{言|い}ってたんだ。","ko":"작년이 노래방이었으니까 올해는 역시 다른 데가 좋겠어. …아, 그렇지. 부장님이 일식이 좋다고 했었어."},{"s":"女","t":"じゃあ、{和食|わしょく}のお{店|みせ}を{探|さが}しますね。{何|なん}{人|にん}ぐらいで{探|さが}しましょうか。","ko":"그럼 일식집을 찾아 볼게요. 몇 명 정도로 찾을까요?"},{"s":"男","t":"{一|いち}{次|じ}{会|かい}は{二十|にじゅう}{人|にん}だけど、{二|に}{次|じ}{会|かい}は{半分|はんぶん}ぐらいかな。","ko":"1차는 스무 명인데, 2차는 절반 정도일까."},{"s":"女","t":"{十|じゅう}{人|にん}ですね。{予約|よやく}は{私|わたし}がしておきますか。","ko":"열 명이군요. 예약은 제가 해 둘까요?"},{"s":"男","t":"うん、お{願|ねが}い。あ、でも、{予算|よさん}の{確認|かくにん}だけは{先|さき}にしておいて。{一人|ひとり}{五千|ごせん}{円|えん}までって{言|い}われてるから。","ko":"응, 부탁해. 아, 그런데 예산 확인만은 먼저 해 둬. 한 사람 5,000엔까지라고 들었으니까."},{"s":"女","t":"わかりました。{予算|よさん}を{確認|かくにん}してから、お{店|みせ}を{探|さが}して、{予約|よやく}します。","ko":"알겠습니다. 예산을 확인한 다음에 가게를 찾아서 예약하겠습니다."}],"exp":"노래방은 작년과 겹쳐 「やっぱり違うところがいい」로 취소되고, 부장의 「和食」 조건이 더해집니다. 인원은 「十人ですね」로 이미 정해져 부장에게 물을 일이 없고(3번 오답), 예약은 마지막에 할 일입니다. 마지막 줄 「予算の確認だけは先にしておいて」가 ‘먼저’ 할 일을 정합니다 → 2번.","key":"의견 변경(やっぱり違うところ) + 「先に」 예산 확인"},{"id":11,"type":"과제 이해","title":"病院の受付","intro":"{病院|びょういん}の{受付|うけつけ}で、{女|おんな}の{人|ひと}が{受付|うけつけ}の{人|ひと}と{話|はな}しています。","question":"{女|おんな}の{人|ひと}はこのあとまず{何|なに}をしますか。","opts":["{問診|もんしん}{票|ひょう}に{記入|きにゅう}する","{体温|たいおん}を{測|はか}る","{保険|ほけん}{証|しょう}を{受付|うけつけ}に{出|だ}す","{番号|ばんごう}の{紙|かみ}を{取|と}る"],"a":0,"script":[{"s":"女","t":"すみません、こちら{初|はじ}めてなんですが。","ko":"저기요, 여기는 처음인데요."},{"s":"男","t":"はい。では、まずこの{問診|もんしん}{票|ひょう}に{記入|きにゅう}してください。{保険|ほけん}{証|しょう}はお{持|も}ちですか。","ko":"네. 그러면 먼저 이 문진표를 작성해 주세요. 보험증은 가지고 계신가요?"},{"s":"女","t":"はい、あります。{予約|よやく}の{時間|じかん}より{早|はや}いんですけど、{大丈夫|だいじょうぶ}ですか。","ko":"네, 있어요. 예약 시간보다 이른데 괜찮을까요?"},{"s":"男","t":"{大丈夫|だいじょうぶ}です。{記入|きにゅう}が{終|お}わったら、そちらの{機械|きかい}で{受付|うけつけ}をしてください。{番号|ばんごう}の{紙|かみ}が{出|で}ますので、{待合|まちあい}{室|しつ}でお{待|ま}ちください。","ko":"괜찮습니다. 작성을 마치면 저쪽 기계에서 접수해 주세요. 번호표가 나오니 대기실에서 기다려 주세요."},{"s":"女","t":"{体温|たいおん}も{測|はか}ったほうがいいですか。","ko":"체온도 재는 게 좋을까요?"},{"s":"男","t":"いいえ、それは{看護|かんご}{師|し}が{測|はか}りますから、しなくていいです。","ko":"아니요, 그건 간호사가 잴 거라서 안 하셔도 됩니다."},{"s":"女","t":"わかりました。{問診|もんしん}{票|ひょう}を{書|か}いてから、{機械|きかい}で{受付|うけつけ}ですね。","ko":"알겠습니다. 문진표를 쓴 다음에 기계로 접수하는 거군요."},{"s":"男","t":"はい。あ、{保険|ほけん}{証|しょう}は{受付|うけつけ}のときに{一緒|いっしょ}に{出|だ}してください。","ko":"네. 아, 보험증은 접수할 때 같이 내 주세요."}],"exp":"「しなくていい」는 ‘하지 않아도 된다’는 부정 지시 → 체온 측정(2번)은 오답. 보험증은 「受付のときに」, 번호표는 기계에서 나오므로 모두 기입 다음입니다. 첫 지시 「まずこの問診票に記入」이 그대로 가장 먼저 할 일 → 1번.","key":"부정 지시(しなくていい) + 순서를 흐리는 선지"},{"id":12,"type":"포인트 이해","title":"電車の遅れ","intro":"{駅|えき}で、{女|おんな}の{人|ひと}が{駅員|えきいん}と{話|はな}しています。","question":"{電車|でんしゃ}が{遅|おく}れている{理由|りゆう}は{何|なん}ですか。","opts":["{事故|じこ}のため","{線路|せんろ}に{木|き}が{倒|たお}れていたため","{車両|しゃりょう}{点検|てんけん}のため","{雪|ゆき}のため"],"a":1,"script":[{"s":"女","t":"すみません、この{電車|でんしゃ}、{二十|にじゅう}{分|ふん}ぐらい{遅|おく}れているんですか。","ko":"저기요, 이 전철이 20분 정도 늦어지고 있나요?"},{"s":"男","t":"はい、{申|もう}し{訳|わけ}ありません。{車両|しゃりょう}{点検|てんけん}のため、ただいま{二十|にじゅう}{分|ふん}{遅|おく}れで{運転|うんてん}しております。","ko":"네, 죄송합니다. 차량 점검 때문에 지금 20분 늦게 운행하고 있습니다."},{"s":"女","t":"{車両|しゃりょう}{点検|てんけん}ですか。{事故|じこ}かと{思|おも}いました。","ko":"차량 점검이요? 사고인 줄 알았어요."},{"s":"男","t":"いいえ、{事故|じこ}ではありません。…あ、{訂正|ていせい}します。{実|じつ}は、{点検|てんけん}ではなくて、{線路|せんろ}に{木|き}が{倒|たお}れていたためです。{撤去|てっきょ}は{終|お}わったんですが、{安全|あんぜん}{確認|かくにん}に{時間|じかん}がかかっています。","ko":"아니요, 사고는 아닙니다. …아, 정정하겠습니다. 실은 점검이 아니라 선로에 나무가 쓰러져 있었기 때문입니다. 치우는 건 끝났는데 안전 확인에 시간이 걸리고 있습니다."},{"s":"女","t":"そうなんですね。じゃあ、{次|つぎ}は{何|なん}{時|じ}に{来|き}ますか。","ko":"그렇군요. 그럼 다음 차는 몇 시에 오나요?"},{"s":"男","t":"{十|じゅう}{五|ご}{時|じ}{四十|よんじゅう}{五|ご}{分|ふん}です。あと{五|ご}{分|ふん}ほどで{参|まい}ります。","ko":"15시 45분입니다. 5분 정도면 도착합니다."},{"s":"女","t":"ありがとうございます。","ko":"감사합니다."}],"exp":"처음에는 「車両点検のため」라고 했지만 곧 「訂正します。実は、点検ではなくて…線路に木が倒れていたため」로 번복합니다. 「事故ではありません」로 사고(1번)도 부정. 정정 뒤의 정보가 최종 사실 → 2번. 3번은 정정 전 정보라 대표적인 함정입니다.","key":"정정(訂正します・ではなくて) — 앞의 정보는 버리기"},{"id":13,"type":"포인트 이해","title":"郊外への引っ越し","intro":"ラジオで、{女|おんな}の{人|ひと}が{男|おとこ}の{人|ひと}にインタビューしています。","question":"{男|おとこ}の{人|ひと}が{引|ひ}っ{越|こ}して{一番|いちばん}よかったと{思|おも}っていることは{何|なん}ですか。","opts":["{家賃|やちん}が{安|やす}くなったこと","{通勤|つうきん}が{楽|らく}になったこと","{妻|つま}の{実家|じっか}が{近|ちか}いこと","{家|いえ}が{広|ひろ}くなったこと"],"a":2,"script":[{"s":"女","t":"{先月|せんげつ}、{郊外|こうがい}に{引|ひ}っ{越|こ}されたそうですね。{通勤|つうきん}は{大変|たいへん}じゃないですか。","ko":"지난달 교외로 이사하셨다면서요. 통근은 힘들지 않으세요?"},{"s":"男","t":"{電車|でんしゃ}が{混|こ}むのは{確|たし}かに{大変|たいへん}です。ただ、{家|いえ}が{広|ひろ}くなったので、{子|こ}どもものびのびしています。","ko":"전철이 붐비는 건 확실히 힘듭니다. 다만 집이 넓어져서 아이도 마음 편히 지내고 있어요."},{"s":"女","t":"{家賃|やちん}も{安|やす}くなったと{聞|き}きましたが。","ko":"월세도 싸졌다고 들었는데요."},{"s":"男","t":"ええ。でも、{安|やす}さが{決|き}め{手|て}だったわけではありません。{必|かなら}ずしも{家賃|やちん}が{安|やす}いところがいいとは{限|かぎ}らないですからね。{私|わたし}の{場合|ばあい}、いちばん{大|おお}きかったのは、{妻|つま}の{実家|じっか}が{近|ちか}いことなんです。{子|こ}どもを{預|あず}けられるので。","ko":"네. 하지만 싼 것이 결정적이었던 건 아닙니다. 반드시 월세가 싼 곳이 좋다고만은 할 수 없으니까요. 제 경우 가장 컸던 것은 아내의 친정이 가깝다는 점입니다. 아이를 맡길 수 있어서요."},{"s":"女","t":"なるほど。ご{家族|かぞく}のことを{優先|ゆうせん}されたんですね。","ko":"그렇군요. 가족을 우선하신 거네요."},{"s":"男","t":"はい、そういうことです。","ko":"네, 그렇습니다."}],"exp":"월세의 ‘싼 점’은 「決め手だったわけではありません」「必ずしも家賃が安いところがいいとは限らない」로 부정 → 1번. 통근은 오히려 「混むのは大変」이라 반대 → 2번. 집이 넓어진 것도 좋았지만, 「いちばん大きかったのは」 뒤에 온 것이 ‘아내 친정이 가까운 것’ → 3번. 4번은 실제로 좋았다고 한 내용이라 헷갈리기 쉬운 함정입니다.","key":"부분 부정(わけではない・必ずしも〜とは限らない) + いちばん大きかったのは"},{"id":14,"type":"포인트 이해","title":"補習の日程","intro":"{塾|じゅく}で、{女|おんな}の{学生|がくせい}が{先生|せんせい}と{話|はな}しています。","question":"{女|おんな}の{人|ひと}はいつ{補習|ほしゅう}に{出|で}ますか。","opts":["{月曜|げつよう}{日|び}の{五|ご}{時|じ}から","{水曜|すいよう}{日|び}の{五|ご}{時|じ}から","{木曜|もくよう}{日|び}の{四|よ}{時|じ}から","{木曜|もくよう}{日|び}の{五|ご}{時|じ}から"],"a":0,"script":[{"s":"女","t":"{先生|せんせい}、{来週|らいしゅう}の{補習|ほしゅう}なんですけど、{水曜|すいよう}でしたよね。","ko":"선생님, 다음 주 보충수업인데 수요일이었죠?"},{"s":"男","t":"いえ、{来週|らいしゅう}は{月曜|げつよう}と{木曜|もくよう}です。{水曜|すいよう}は{祝日|しゅくじつ}で{休|やす}みですから。","ko":"아니요, 다음 주는 월요일과 목요일입니다. 수요일은 공휴일이라 쉬니까요."},{"s":"女","t":"あ、そうでした。{両方|りょうほう}{出|で}ないといけませんか。","ko":"아, 그랬었죠. 둘 다 나가야 하나요?"},{"s":"男","t":"どちらか{一方|いっぽう}でいいですよ。{同|おな}じ{内容|ないよう}を{二|に}{回|かい}やりますから。","ko":"둘 중 하나만 하면 됩니다. 같은 내용을 두 번 하니까요."},{"s":"女","t":"じゃあ、{私|わたし}は{月曜|げつよう}にします。{部活|ぶかつ}が{木曜|もくよう}まであるので。","ko":"그럼 저는 월요일로 할게요. 동아리가 목요일까지 있어서요."},{"s":"男","t":"わかりました。あ、{時間|じかん}は{五|ご}{時|じ}から{七|しち}{時|じ}までです。{前|まえ}は{四|よ}{時|じ}からでしたが、{今週|こんしゅう}から{変|か}わりました。","ko":"알겠습니다. 아, 시간은 5시부터 7시까지입니다. 전에는 4시부터였는데 이번 주부터 바뀌었습니다."},{"s":"女","t":"{五|ご}{時|じ}からですね。わかりました。","ko":"5시부터군요. 알겠습니다."}],"exp":"수요일은 「祝日で休み」 → 2번 오답. 두 번 모두 나갈 필요 없이 「どちらか一方」이고, 목요일은 「部活が木曜まである」로 불가 → 3·4번 오답. 시간도 「前は四時からでしたが、今週から変わりました」= 5시로 바뀌었으므로 4시(3번)는 옛 정보. 남는 것은 월요일 5시 → 1번.","key":"요일 정정 + 택일(どちらか一方) + 시간 변경(今週から)"},{"id":15,"type":"개요 이해","title":"朝の散歩","intro":"ラジオで、{女|おんな}の{人|ひと}が{話|はな}しています。","question":"{話|はな}し{手|て}が{最|もっと}も{言|い}いたいことは{何|なん}ですか。","opts":["{毎日|まいにち}{一|いち}{時間|じかん}は{歩|ある}くべきだ。","{目標|もくひょう}は{小|ちい}さく{決|き}めて、{続|つづ}けることが{大切|たいせつ}だ。","{意志|いし}が{弱|よわ}い{人|ひと}は{散歩|さんぽ}に{向|む}いていない。","{遠|とお}くまで{歩|ある}くほど{効果|こうか}が{高|たか}い。"],"a":1,"script":[{"s":"女","t":"「{朝|あさ}の{散歩|さんぽ}を{始|はじ}めました」という{話|はなし}をよく{聞|き}きます。でも、{多|おお}くの{人|ひと}はなかなか{続|つづ}かないそうです。{続|つづ}かない{理由|りゆう}は、{意志|いし}が{弱|よわ}いからではありません。{目標|もくひょう}を「{毎日|まいにち}{一|いち}{時間|じかん}」のように{大|おお}きく{決|き}めてしまうからです。{私|わたし}は、{最初|さいしょ}から「{玄関|げんかん}を{出|で}て、{駅|えき}まで{歩|ある}く」だけにしました。{歩|ある}いて{五|ご}{分|ふん}もかからない{距離|きょり}です。{物|もの}{足|た}りないと{思|おも}うかもしれませんが、{毎日|まいにち}{続|つづ}けられれば、それはもう{運動|うんどう}です。{散歩|さんぽ}は、{続|つづ}けること{自体|じたい}が{目的|もくてき}です。{遠|とお}くまで{行|い}こうとしなくていいんです。","ko":"‘아침 산책을 시작했습니다’라는 이야기를 자주 듣습니다. 그런데 많은 사람이 좀처럼 계속하지 못한다고 합니다. 못 가는 이유는 의지가 약해서가 아닙니다. 목표를 ‘매일 한 시간’처럼 크게 정해 버리기 때문입니다. 저는 처음부터 ‘현관을 나서서 역까지 걷기’만 하기로 했습니다. 걸어서 5분도 안 걸리는 거리입니다. 부족하다고 생각할지 모르지만, 매일 계속할 수 있다면 그것도 이미 운동입니다. 산책은 계속하는 것 자체가 목적입니다. 멀리까지 가려고 하지 않아도 됩니다."}],"exp":"1번은 「毎日一時間」처럼 크게 정하는 것을 문제로 지적해 부정, 4번은 「遠くまで行こうとしなくていい」로 부정, 3번은 「意志が弱いからではありません」로 부정됩니다. 결론은 「続けること自体が目的」 → 작게 정하고 계속하라는 2번.","key":"부정된 선지 걸러내기(〜からではありません・〜しなくていい)"},{"id":16,"type":"개요 이해","title":"ノートの取り方","intro":"{大学|だいがく}の{講義|こうぎ}で、{男|おとこ}の{先生|せんせい}が{話|はな}しています。","question":"{先生|せんせい}が{最|もっと}も{言|い}いたいことは{何|なん}ですか。","opts":["パソコンでノートを{取|と}るのはやめるべきだ。","{手|て}で{書|か}くほうが{速|はや}く{書|か}ける。","{何|なに}を{残|のこ}すかを{考|かんが}えながら{聞|き}くことが{大切|たいせつ}だ。","ノートはあとで{必|かなら}ず{読|よ}み{返|かえ}すべきだ。"],"a":2,"script":[{"s":"男","t":"{最近|さいきん}は、パソコンでノートを{取|と}る{学生|がくせい}が{増|ふ}えました。{速|はや}く{書|か}けるし、あとで{探|さが}すのも{便利|べんり}です。{私|わたし}も{否定|ひてい}はしません。ただ、{私|わたし}の{講義|こうぎ}では、{手|て}で{書|か}くことを{勧|すす}めています。{手|て}で{書|か}くと、{速|はや}く{書|か}けないぶん、{聞|き}いた{話|はなし}を{短|みじか}くまとめようとします。その「まとめる」という{作業|さぎょう}が、{理解|りかい}につながるからです。パソコンが{悪|わる}いのではありません。{全部|ぜんぶ}をそのまま{写|うつ}すだけでは、あとで{読|よ}み{返|かえ}しても{頭|あたま}に{入|はい}っていないことが{多|おお}いんです。{大切|たいせつ}なのは、{書|か}く{道具|どうぐ}より、{何|なに}を{残|のこ}すかを{決|き}めて{聞|き}くことです。","ko":"요즘은 노트북으로 필기하는 학생이 늘었습니다. 빨리 쓸 수 있고 나중에 찾기도 편합니다. 저도 부정하지는 않습니다. 다만 제 수업에서는 손으로 쓰기를 권합니다. 손으로 쓰면 빨리 쓸 수 없는 만큼 들은 이야기를 짧게 정리하려고 합니다. 그 ‘정리하는’ 작업이 이해로 이어지기 때문입니다. 노트북이 나쁜 것은 아닙니다. 전부 그대로 옮겨 적기만 하면 나중에 다시 읽어도 머리에 남지 않은 경우가 많습니다. 중요한 것은 쓰는 도구보다, 무엇을 남길지 정하고 듣는 것입니다."}],"exp":"1번은 「パソコンが悪いのではありません」「否定はしません」로 부정, 2번은 사실 반대(빨리 쓰는 것은 노트북), 4번은 세부이며 「読み返しても頭に入っていないことが多い」와 어긋납니다. 마지막 문장 「書く道具より、何を残すかを決めて聞くこと」가 주장 → 3번.","key":"도구 논쟁으로 흘리지 않고 마지막 결론 문장 잡기"},{"id":17,"type":"개요 이해","title":"町の清掃活動","intro":"{町|まち}の{集|あつ}まりで、{男|おとこ}の{人|ひと}が{話|はな}しています。","question":"{男|おとこ}の{人|ひと}が{最|もっと}も{言|い}いたいことは{何|なん}ですか。","opts":["{宣伝|せんでん}をもっと{増|ふ}やすべきだ。","{参加|さんか}{者|しゃ}が{減|へ}ったのは{役員|やくいん}の{責任|せきにん}だ。","{当日|とうじつ}の{役割|やくわり}をはっきり{伝|つた}えるべきだ。","{清掃|せいそう}{活動|かつどう}は{初|はじ}めての{人|ひと}には{難|むずか}しい。"],"a":2,"script":[{"s":"男","t":"{今年|ことし}、{町|まち}の{清掃|せいそう}{活動|かつどう}に{参加|さんか}した{人|ひと}は、{去年|きょねん}より{三十|さんじゅう}{人|にん}{少|すく}なかったそうです。{役員|やくいん}からは「もっと{宣伝|せんでん}を」という{声|こえ}が{出|で}ています。もちろん、{宣伝|せんでん}も{必要|ひつよう}でしょう。ただ、{私|わたし}は、{人|ひと}が{減|へ}ったのは{宣伝|せんでん}{不足|ふそく}のせいだけではないと{思|おも}っています。{人|ひと}は、{自分|じぶん}の{役割|やくわり}がわからないと、なかなか{動|うご}けません。「{何時|なんじ}から、どこで、{何|なに}をする」がはっきりしていれば、{初|はじ}めての{人|ひと}でも{来|き}やすいはずです。ですから、{私|わたし}は、チラシを{増|ふ}やすより{先|さき}に、{当日|とうじつ}の{役割|やくわり}をはっきり{書|か}いて{知|し}らせるべきだと{考|かんが}えています。","ko":"올해 마을 청소 활동에 참가한 사람이 작년보다 서른 명 적었다고 합니다. 임원들 사이에서는 ‘홍보를 더 하자’는 목소리가 나오고 있습니다. 물론 홍보도 필요하겠지요. 다만 저는 사람이 줄어든 것이 홍보 부족 때문만은 아니라고 생각합니다. 사람은 자기 역할을 모르면 좀처럼 움직이지 못합니다. ‘몇 시부터, 어디서, 무엇을 하는지’가 분명하면 처음 오는 사람도 오기 쉬울 것입니다. 그래서 저는 전단지를 늘리기보다 먼저, 당일의 역할을 분명히 적어서 알려야 한다고 생각합니다."}],"exp":"1번은 「もちろん、宣伝も必要でしょう。ただ…」로 양보한 뒤 반전되어 핵심이 아니고, 2번은 언급이 없으며, 4번은 「初めての人でも来やすい」와 정반대입니다. 결론 「チラシを増やすより先に、当日の役割をはっきり書いて知らせるべき」 → 3번.","key":"양보(もちろん〜でしょう。ただ…) 뒤에 오는 주장"},{"id":18,"type":"즉시 응답","title":"ケーキのしまい方","intro":"{職場|しょくば}の{休憩|きゅうけい}{室|しつ}で、{女|おんな}の{人|ひと}が{男|おとこ}の{人|ひと}に{言|い}います。（선지는 연습용으로 표시했습니다. 실제 시험에서는 음성만 나옵니다.）","question":"{何|なん}と{答|こた}えますか。","opts":["うん、まだ{食|た}べてないよ。","あ、それは{明日|あした}{食|た}べるから、{入|い}れといて。","いいえ、{冷蔵|れいぞう}{庫|こ}はそこです。"],"a":1,"script":[{"s":"女","t":"このケーキ、{冷蔵|れいぞう}{庫|こ}に{入|い}れちゃおうか。","ko":"이 케이크, 냉장고에 넣어 버릴까?"}],"exp":"「〜ちゃおうか」는 「〜てしまおうか」의 축약형으로 ‘~해 버릴까?’ 하고 제안하는 말입니다. 자연스러운 응답은 「入れといて」(=入れておいて)로 수락하는 2번. 1번은 질문과 상관없는 대답, 3번은 장소를 알려 주는 말이라 어긋납니다.","key":"축약형 제안(〜ちゃおうか) → 〜といて로 수락"},{"id":19,"type":"즉시 응답","title":"コピーの依頼","intro":"{部長|ぶちょう}が{部下|ぶか}に{頼|たの}みます。（선지는 연습용으로 표시했습니다. 실제 시험에서는 음성만 나옵니다.）","question":"{何|なん}と{答|こた}えますか。","opts":["はい、コピーしてさしあげます。","はい、すぐコピーいたします。","はい、コピーしていただけます。"],"a":1,"script":[{"s":"女","t":"{悪|わる}いけど、この{資料|しりょう}、コピーしてくれる？","ko":"미안한데, 이 자료 좀 복사해 줄래?"}],"exp":"상사에게 자기 행동을 낮추는 겸양어는 「いたします」 → 2번. 1번 「してさしあげます」는 자신이 은혜를 베푸는 표현이라 상사에게 쓰면 실례. 3번 「していただけます」는 상사에게 부탁하는 말이 되어 앞뒤가 맞지 않습니다.","key":"겸양(いたします) vs 잘못된 겸양(さしあげます)"},{"id":20,"type":"즉시 응답","title":"昼食の誘い","intro":"{会社|かいしゃ}の{廊下|ろうか}で、{同僚|どうりょう}が{昼食|ちゅうしょく}に{誘|さそ}います。（선지는 연습용으로 표시했습니다. 실제 시험에서는 음성만 나옵니다.）","question":"{何|なん}と{答|こた}えますか。","opts":["ごめん、{今日|きょう}はちょっと。","いいえ、ラーメンじゃありません。","ええ、{行|い}きたくないです。"],"a":0,"script":[{"s":"男","t":"ねえ、{昼|ひる}、{一緒|いっしょ}にラーメン{行|い}かない？","ko":"있잖아, 점심에 같이 라멘 먹으러 갈래?"}],"exp":"권유를 부드럽게 거절할 때는 「今日はちょっと…」처럼 말끝을 흐립니다 → 1번. 2번은 ‘라멘’이라는 단어에만 반응한 오해, 3번은 「ええ」+부정으로 앞뒤가 안 맞고 지나치게 직설적입니다.","key":"완곡 거절(今日はちょっと) — 말끝 흐리기"},{"id":21,"type":"즉시 응답","title":"五時までの発送","intro":"{職場|しょくば}で、{女|おんな}の{人|ひと}が{男|おとこ}の{人|ひと}に{頼|たの}みます。（선지는 연습용으로 표시했습니다. 실제 시험에서는 음성만 나옵니다.）","question":"{何|なん}と{答|こた}えますか。","opts":["うん、{五|ご}{時|じ}に{送|おく}るね。","いいえ、{送|おく}らなくていいよ。","もちろん。{何|なに}をすればいい？"],"a":2,"script":[{"s":"女","t":"{悪|わる}いけど、これ、{五|ご}{時|じ}までに{送|おく}らなきゃいけないんだけど、{手伝|てつだ}ってくれる？","ko":"미안한데, 이거 5시까지 보내야 하는데, 좀 도와줄래?"}],"exp":"「〜なきゃ」는 「〜なければならない」의 축약형. 「五時までに」는 ‘5시까지’라는 기한이므로 「五時に送る」(1번)는 기한을 놓친 대표적 함정입니다. 부탁을 받아들이며 무엇을 할지 묻는 3번이 자연스럽습니다.","key":"축약(なきゃ) + までに(기한) 함정"},{"id":22,"type":"통합 이해","title":"家族旅行の宿","intro":"{旅行|りょこう}{会社|かいしゃ}で、{女|おんな}の{人|ひと}が{店員|てんいん}と{話|はな}しています。","question":"{女|おんな}の{人|ひと}はどうすることにしましたか。","opts":["「{山|やま}の{宿|やど}」を{予約|よやく}する","「{海辺|うみべ}のホテル」を{個室|こしつ}なしで{予約|よやく}する","「{海辺|うみべ}のホテル」を{和食|わしょく}の{個室|こしつ}{付|つ}きで{予約|よやく}する","どちらも{予約|よやく}しない"],"a":2,"script":[{"s":"女","t":"{来月|らいげつ}、{家族|かぞく}{四|よん}{人|にん}で{温泉|おんせん}に{行|い}きたいんです。{候補|こうほ}が{二|ふた}つあるんですが。","ko":"다음 달에 가족 네 명이서 온천에 가고 싶어요. 후보가 두 개 있는데요."},{"s":"男","t":"はい。「{山|やま}の{宿|やど}」は{一|いち}{泊|はく}{二|に}{食|しょく}で{一人|ひとり}{一|いち}{万|まん}{五千|ごせん}{円|えん}、お{部屋|へや}は{和室|わしつ}で、{露天|ろてん}{風呂|ふろ}があります。「{海辺|うみべ}のホテル」は{一|いち}{泊|はく}{二|に}{食|しょく}で{一人|ひとり}{一|いち}{万|まん}{二千|にせん}{円|えん}、お{部屋|へや}は{洋室|ようしつ}で、{大|だい}{浴場|よくじょう}です。","ko":"네. ‘야마노야도’는 1박 2식에 한 사람 15,000엔, 방은 일본식이고 노천탕이 있습니다. ‘해변 호텔’은 1박 2식에 한 사람 12,000엔, 방은 양식이고 대욕장입니다."},{"s":"女","t":"{子|こ}どもが{小|ちい}さいので、{布団|ふとん}よりベッドのほうがいいんです。あと、{父|ちち}が{足|あし}が{悪|わる}いので、{階段|かいだん}は{避|さ}けたいです。","ko":"아이가 어려서 이불보다 침대가 좋아요. 그리고 아버지가 다리가 불편하셔서 계단은 피하고 싶습니다."},{"s":"男","t":"なるほど。「{山|やま}の{宿|やど}」は、{露天|ろてん}{風呂|ふろ}まで{階段|かいだん}を{上|あ}がっていただくんですよ。「{海辺|うみべ}のホテル」は{全部|ぜんぶ}バリアフリーで、エレベーターもあります。","ko":"그렇군요. ‘야마노야도’는 노천탕까지 계단을 올라가셔야 합니다. ‘해변 호텔’은 전부 배리어프리이고 엘리베이터도 있습니다."},{"s":"女","t":"じゃあ、「{海辺|うみべ}のホテル」ですね。…あ、でも、{食事|しょくじ}がバイキングなんですよね。{子|こ}どもは{喜|よろこ}ぶけど、{父|ちち}はゆっくり{食|た}べたいって{言|い}うので。","ko":"그럼 ‘해변 호텔’이네요. …아, 그런데 식사가 뷔페라고요. 아이는 좋아하겠지만 아버지는 천천히 먹고 싶다고 하셔서요."},{"s":"男","t":"「{海辺|うみべ}のホテル」には{和食|わしょく}の{個室|こしつ}もあるんですが、{別|べつ}{料金|りょうきん}で{一人|ひとり}{二千|にせん}{円|えん}かかります。","ko":"‘해변 호텔’에는 일식 개인실도 있는데, 별도 요금으로 한 사람 2,000엔이 듭니다."},{"s":"女","t":"そうですか。じゃあ、{少|すこ}し{高|たか}くなっても、{個室|こしつ}をお{願|ねが}いします。{主人|しゅじん}に{相談|そうだん}してから、{明日|あした}{予約|よやく}します。","ko":"그렇군요. 그럼 조금 비싸더라도 개인실로 부탁드릴게요. 남편과 상의하고 내일 예약하겠습니다."}],"exp":"조건은 ①아이가 어려 침대(양식) ②아버지가 계단을 피함. 「山の宿」는 일본식+노천탕까지 계단이라 두 조건 모두 탈락(1번 오답). 「海辺のホテル」는 만족하지만 뷔페가 걸려 일식 개인실을 「少し高くなっても」 추가 → 3번. 「明日予約します」는 남편과 상의 후 예약한다는 뜻이므로 4번(둘 다 예약 안 함)은 오답.","key":"후보별 조건 대조 → 마지막에 더해진 조건(個室·別料金)"},{"id":23,"type":"통합 이해","title":"習い事選び","intro":"{公民|こうみん}{館|かん}で、{女|おんな}の{人|ひと}が{男|おとこ}の{人|ひと}と{話|はな}しています。","question":"{女|おんな}の{人|ひと}はまず{何|なに}を{申|もう}し{込|こ}みますか。","opts":["{書道|しょどう}を{習|なら}い{始|はじ}める","ギターを{買|か}う","ギターの{体験|たいけん}{教室|きょうしつ}に{申|もう}し{込|こ}む","{書道|しょどう}の{体験|たいけん}{教室|きょうしつ}に{申|もう}し{込|こ}む"],"a":2,"script":[{"s":"女","t":"{私|わたし}、{何|なに}か{習|なら}い{事|ごと}を{始|はじ}めたいんだけど。{書道|しょどう}かギターかで{迷|まよ}ってるの。","ko":"나 뭐든 배우고 싶은데. 서예랑 기타 중에 고민 중이야."},{"s":"男","t":"{書道|しょどう}は{月曜|げつよう}と{木曜|もくよう}の{夜|よる}で、{月|つき}{四千|よんせん}{円|えん}。ギターは{土曜|どよう}の{午後|ごご}で、{月|つき}{六千|ろくせん}{円|えん}だって。","ko":"서예는 월요일과 목요일 밤이고 월 4,000엔. 기타는 토요일 오후이고 월 6,000엔이래."},{"s":"女","t":"{平日|へいじつ}の{夜|よる}は{残業|ざんぎょう}が{多|おお}いから、{土曜|どよう}がいいな。でも、{六千|ろくせん}{円|えん}はちょっと{痛|いた}い。","ko":"평일 밤은 야근이 많아서 토요일이 좋겠어. 그런데 6,000엔은 좀 부담이야."},{"s":"男","t":"ギターは{楽器|がっき}を{買|か}わないといけないよ。{書道|しょどう}は{道具|どうぐ}が{安|やす}く{済|す}むらしい。","ko":"기타는 악기를 사야 해. 서예는 도구가 싸게 끝난다더라."},{"s":"女","t":"{楽器|がっき}を{買|か}うのは、{続|つづ}かなかったらもったいないよね。","ko":"악기를 사는 건 계속 못 하면 아깝잖아."},{"s":"男","t":"{体験|たいけん}{教室|きょうしつ}があるみたいだよ。どちらも{一|いち}{回|かい}{千|せん}{円|えん}で{受|う}けられるって。","ko":"체험 교실이 있는 모양이야. 둘 다 한 번 1,000엔으로 들을 수 있대."},{"s":"女","t":"じゃあ、{両方|りょうほう}{行|い}ってみてから{決|き}める。まず{土曜|どよう}のギターから{申|もう}し{込|こ}むね。","ko":"그럼 둘 다 가 보고 결정할게. 먼저 토요일 기타부터 신청할게."}],"exp":"서예는 평일 밤이라 「残業が多い」로 탈락(요일 조건), 기타는 6,000엔에 악기 구입까지 부담. 그래서 바로 등록하지 않고 「体験教室」로 먼저 확인하기로 하고, 「まず土曜のギターから申し込む」 → 3번. 악기 구입(2번)은 오히려 망설인 부분입니다.","key":"조건 종합(요일·가격·초기비용) + 마지막 「まず」"}]}},"tips":{"exam":{"facts":[{"k":"시험일","v":"2026년 12월 6일 (일) · N1·N2는 오전 실시"},{"k":"입실 완료","v":"09:40까지 (한국 기준). 이후 출입구 봉쇄 — 1분만 늦어도 응시 불가"},{"k":"1교시","v":"언어지식(문자·어휘·문법) + 독해 = 105분 (10:00 시작)"},{"k":"2교시","v":"청해 약 50분 (녹음 길이에 따라 종료 시각 변동)"},{"k":"합격 기준","v":"180점 만점에 90점 + 언어지식·독해·청해 각 19점 이상 (한 과목이라도 19점 미만이면 불합격)"},{"k":"준비물","v":"수험표, 규정 신분증(실물 권장), HB연필·샤프, 지우개, 아날로그 손목시계"},{"k":"주의","v":"볼펜·사인펜 답안은 채점되지 않음. 휴대전화·스마트워치는 전원을 끄고 봉투에 봉인 — 울리거나 켜면 부정행위로 해당 회차 무효 + 2년 응시 제한"}]},"sources":[{"name":"Google · 일반 웹 (전략·시간 배분)","cls":"","note":"여러 학습 사이트의 공통 결론을 정리했습니다.","items":[{"t":"독해는 시간 싸움 — 105분 배분 공식","d":"문자·어휘 약 15~30분 + 문법 약 20분 + 독해 약 65분 + 검토 5분. 앞 파트에서 1~2분씩 흘리면 장문에서 그대로 무너집니다.","meta":"ekunblog, nugunahrd 종합"},{"t":"유형별 권장 시간","d":"단문 2~3분 / 중문 5~6분 / 통합 8분 / 장문 10~12분 / 정보검색 5분. 단문 1문항 2분 초과 = 즉시 표시하고 넘기기(2분 룰).","meta":"ekunblog · nugunahrd"},{"t":"풀이 순서는 정보검색부터","d":"정보검색(표·안내문)은 문장 이해 부담이 적어 5분 안에 처리 가능. 정보검색 → 단문 → 중문 → 통합 → 장문 순이 득점에 유리하다는 후기가 많습니다.","meta":"ekunblog"},{"t":"질문 선독(先読み)","d":"지문 전에 질문·선지를 먼저 읽고 무엇을 찾을지 정한 뒤 해당 부분만 스캔. 문항당 30~40초 절약.","meta":"ekunblog · nugunahrd"},{"t":"과락 구조를 먼저 이해","d":"총점이 합격선을 넘어도 한 구분이라도 19점 미만이면 불합격. 약한 파트는 '과락 방어'까지만, 강한 파트에 시간을 몰아주는 전략이 유효합니다.","meta":"JLPT 공식 성적 안내 기준"},{"t":"정보검색은 주석에서 갈린다","d":"표 본문만 보면 맞고 ※·ただし까지 보면 틀리는 선지가 기본 설계. 別途·教材費·入会金은 총액에 더하기, 割引の併用不可면 할인은 하나만. 以上/以下(포함) vs 未満/超える(불포함) 경계값 확인.","meta":"aurothy 정보검색 노트"},{"t":"통합 이해는 '정반대'가 아니다","d":"A와 B를 비교할 때 가장 흔한 함정은 두 글이 반대라고 정해 놓고 읽는 것. 실제로는 '둘 다 부정하지 않는 점'이 있고, 차이는 다른 지점(예: 규칙을 누가 정할지)에 있습니다. 먼저 일치점을 뽑고 나서 차이를 찾으세요.","meta":"nihongo-quiz 대문 해설 · OpenExamPrep (2026-07)"},{"t":"질문만 먼저 → 단락 첫·끝 문장 → 근거 ±1문장 → 선지는 마지막","d":"선지를 먼저 읽으면 그럴듯한 오답이 머리에 남아, 본문에서 그 선지를 지지하는 곳을 찾게 됩니다. 정답은 본문 표현을 바꿔 말한 言い換え인 경우가 많고, 지문 단어를 그대로 쓴 선지는 오히려 함정입니다.","meta":"panduan-jepang (2026-10) · rapid-jt (2026-10)"},{"t":"문법 속도가 독해 시간을 만든다","d":"N2 1교시는 105분에 50문항. 문법에서 1~2분씩 흘리면 그대로 독해 시간이 사라집니다. 생각해도 모르는 문법은 찍고 △표시 후 넘어가세요.","meta":"nihongo-quiz · ekunblog (2026-04)"}],"links":[{"t":"JLPT N2 독해 시간 배분 전략","u":"https://ekunblog.com/blog/jlpt-n2-reading-time-management-strategy/","d":"유형별 시간표·풀이 순서"},{"t":"독해 시간관리와 풀이 전략 (누구나HRD)","u":"https://nugunahrd.com/resources/jlpt-n2-strategy/5","d":"105분 배분 공식, 지시어·접속사 추적법"},{"t":"정보검색 공략 노트","u":"https://aurothy.com/notes/1185","d":"조건 대조 3단계, 함정 5유형"},{"t":"N2 대문별 해설과 함정 (統合理解·情報検索)","u":"https://nihongo-quiz.jp/guide/kaikata-n2.php","d":"유형이 바뀐 지점과 오답 설계"},{"t":"統合理解·情報検索 영문 가이드","u":"https://open-exam-prep.com/study-guides/jlpt-n2/reading-comprehension/integrated-comprehension-information-retrieval","d":"작업 예시(원문·번역) 포함"},{"t":"JLPT 공식 N2 大問のねらい (PDF)","u":"https://www.jlpt.jp/guideline/pdf/n2.pdf","d":"국제교류기금 — 유형별 분량·목적"}]},{"name":"네이버 블로그 (합격 후기·단어 암기)","cls":"naver","note":"실제 응시자 후기에서 반복되는 방법만 추렸습니다.","items":[{"t":"기출 1회를 4일에 걸쳐 '모르는 단어 전부' 정리","d":"기출을 그냥 풀고 → 모르는 단어를 죄다 찾고 → 단어장 앱에 넣기. JLPT는 문제은행식이라 회차를 넘어 단어가 반복되므로, 두 번째 기출부터 모르는 단어가 확 줄어듭니다.","meta":"네이버 블로그 '양빵' 3주 독학 후기 (2023)"},{"t":"한자 읽기는 장음·탁음·촉음 함정","d":"継続(けいぞく, そ 아님), 軽傷(けいしょう), 勢い(훈독 いきおい), 扱う, 粗い — 뜻을 알아도 읽기를 틀리면 '모르는 단어'로 취급해 다시 외우기.","meta":"해커스 일본어 공식 블로그 (2021)"},{"t":"손으로 쓰는 단어장 + 앱 병행","d":"A4를 접어 한자/읽기·뜻을 가리는 수제 단어장, 이동 시간에는 회독JLPT·암기고래 같은 앱. '눈으로 아는 단어'를 '귀로 들리는 단어'로 바꾸는 것이 청해에도 직결.","meta":"네이버 블로그 독학 후기 (2018)"},{"t":"모의고사는 반드시 시간 재고","d":"실전에서는 OMR 마킹까지 해야 해서 시간이 늘 모자랍니다. 적어도 시험 2~3주 전부터는 타이머를 두고 1회분을 통으로 풀어 보세요.","meta":"네이버 블로그 후기 공통"},{"t":"독해 팁 5줄 (일본 현지 응시 후기)","d":"① 문제 먼저 읽고 지문 ② 긴 지문은 앞보다 중간·뒤쪽에 답 ③ 지문과 똑같은 단어가 있는 선지는 답이 아닐 확률이 높음 ④ 필자의 생각 중심으로 ⑤ 많이 풀기. 141점(독해 54) 후기.","meta":"네이버 블로그 '쭘이' (2023-11)"},{"t":"중문(問題11)은 득점 파트","d":"지문 3개·9문항. 문제를 먼저 읽고 '필자가 스스로 던진 질문과 그 답'을 찾으면 핵심 문장이 보입니다. 지문 길이가 적당해 연습하면 정확하고 빨라집니다.","meta":"네이버 블로그 OFINN"}],"links":[{"t":"JLPT N2 필수 단어 정리 (해커스)","u":"https://m.blog.naver.com/hackersjapan/222292681425","d":"한자 읽기 출제 포인트와 예문"},{"t":"3주 독학 합격 후기 (기출 회독법)","u":"https://m.blog.naver.com/yxngbbxng/223148138311","d":"기출 1회 4일 루틴"},{"t":"독학 공부방법·유튜브·앱 정리","u":"https://m.blog.naver.com/yhj8376/221356409906","d":"한자 2주 완성 강의, 청해 앱"},{"t":"독해 문제 구성과 팁 5가지","u":"https://m.blog.naver.com/shcute216/223262338546","d":"일본 현지 응시 후기"},{"t":"유형별 공부법 — 중문(問題11)","u":"https://m.blog.naver.com/ofinn/221744810643","d":"문제 풀이 순서 설명"}]},{"name":"유튜브 (무료 강의)","cls":"yt","note":"블로그 후기에서 실제로 도움받았다고 언급된 강의 중심.","items":[{"t":"N2 한자 2주 완성 (nihongonomori)","d":"40분 × 14강. 비슷하게 생긴 한자의 차이와 쓰임을 그림처럼 설명해 '한자 표기' 파트에 특히 도움이 됐다는 후기.","meta":"유튜브 링크는 아래 참조"},{"t":"N2 문법 1시간 정리 (nihongonomori)","d":"문법을 외우기보다 '쓰임새'로 이해시키는 압축 강의. 이해가 안 되는 문형만 골라 다시 보기 좋습니다.","meta":"유튜브 링크는 아래 참조"},{"t":"유하다요 N2 모의고사 해설","d":"문자·어휘, 문법, 독해 10~14번, 청해 1~5번을 파트별로 해설. 청해 유형별 요령을 잡기에 좋습니다.","meta":"yuhadayo.com"},{"t":"매일 짧게 듣기","d":"NHK News Web Easy(쉬운 뉴스)나 '1분 일본어' 앱으로 하루 5~10분. 청해는 몰아서가 아니라 매일이 효과적.","meta":"NHK · 앱"},{"t":"유하다요 N2 독해 완전정복 29강","d":"유형별로 '해석 → 풀이'를 나눠 구성. 통합 이해·정보검색처럼 N2에만 있는 유형을 따로 다룹니다.","meta":"yuhadayo.com"},{"t":"6개월 로드맵 (영어권 채널)","d":"1~2개월 문법·한자 기초 → 3~4개월 긴 지문·청해 집중 → 마지막 2개월 타이머 모의고사. '청해를 미루는 것'과 '실전 조건 없이 푸는 것'을 대표 실패로 꼽습니다.","meta":"Nihongo with Mitsu (2026-05)"}],"links":[{"t":"N2 한자 2주 완성 강의","u":"https://youtu.be/iGUpjlZrR78","d":"nihongonomori (블로그에서 소개된 링크)"},{"t":"N2 문법 한시간에 끝내기","u":"https://youtu.be/nhP_VZtAuro","d":"nihongonomori (블로그에서 소개된 링크)"},{"t":"유하다요 JLPT N2","u":"https://yuhadayo.com/categories/course-detail/N2_mogitest2","d":"모의고사 파트별 해설"},{"t":"NHK News Web Easy","u":"https://www3.nhk.or.jp/news/easy/","d":"후리가나 붙은 쉬운 뉴스 — 매일 듣기용"},{"t":"N2 독해 완전정복 (강의 목록)","u":"https://yuhadayo.com/categories/course-detail/n2_dokkai_","d":"29강 — 유형별 해석/풀이"},{"t":"How to Pass JLPT N2 in 2026","u":"https://www.youtube.com/watch?v=XrpEpiRt_8I","d":"6개월 학습 로드맵"}]},{"name":"X (Twitter) — 실제 게시물","cls":"x","note":"한국어 N2 팁 게시물은 많지 않았고, 검색 결과 상당수가 일본어 교사·무관 게시물이었습니다. 아래는 실제로 확인한 게시물만 정리했습니다.","items":[{"t":"과락 방어 + 강한 파트 몰빵","d":"'JLPT는 한 과목만 과락 나도 떨어지는 시험이라 다 잘하려다 다 망함. 약한 파트는 과락만 면할 만큼 깔고, 승부 볼 파트에 시간을 몰빵.' 문법은 예문을 문장째로 외우고(戦争にともなう多大な犠牲), 독해는 모르는 문장을 전부 적어 단어·뜻을 붙이기. 시험 기간엔 J-POP·일드로 귀 열기.","meta":"@laterinfo_ · 2026-08-04 · x.com/laterinfo_/status/2084610803718660132"},{"t":"7단계 루틴: 단어 10개씩, 문제 먼저, 시간 재기","d":"① 단어는 10개씩 나눠 쓰면서 외우고 이전 10개를 계속 복습 ② 문법은 뜻·형태·주의점을 함께 ③ 독해는 지문보다 문제를 먼저 ④ 청해는 선택지 빠르게 훑고 핵심(이유·누가·무엇)만 ⑤ 파트별 시간 재기 — '문제 하나에 1~2분' 감각.","meta":"@allabout_KieCYJ · 2026-06-26 · x.com/allabout_KieCYJ/status/2070355118956945650"},{"t":"시험 시작 시각 변경·전자기기 규정 강화","d":"직전 회차에서 시차를 이용한 답안 공유가 적발되어 시험 시작 시간이 바뀌고 휴대전화 관리가 대폭 강화되었습니다. 수험표의 시각과 현장 규정을 그대로 따르세요.","meta":"@HANBINIZM · 2025-03-29 · x.com/HANBINIZM/status/1905837706929918076"},{"t":"현직 일본어 교사의 관점","d":"비한자권 학습자에게 가장 큰 벽은 독해. N2 대비 독해 텍스트는 어휘도 어려워 수업만으로는 부족하니, 남은 기간에 매일 조금씩 읽는 습관이 필요하다는 지적.","meta":"@shiori_edu · 2026-10-13 · x.com/shiori_edu/status/2109899073377738782"},{"t":"시험 30일 전 — 문법에서 막힌 시간이 독해 시간을 깎는다","d":"N2 문법 60문항(형태판단 30·문장조립 20·문장문법 10)을 무료 공개하며, '문법에서 막힌 만큼 독해 시간이 줄어든다'고 정리했습니다.","meta":"@shiori_edu · 2026-11-04 · x.com/shiori_edu/status/2117928720585380183"},{"t":"모의고사로 드러난 N2 약점 = 독해·청해","d":"일본어 교실 운영자가 모의고사를 돌린 결과 N4는 독해, N3는 전반, N2는 독해와 청해가 낮았습니다. 남은 기간 배분을 독해·청해에 두라는 신호.","meta":"@Midori3C23 · 2026-11-15 · x.com/Midori3C23/status/2121762365486301220"}],"links":[{"t":"@laterinfo_ 원문","u":"https://x.com/laterinfo_/status/2084610803718660132","d":"N1·N2 독학 합격법 스레드"},{"t":"@allabout_KieCYJ 원문","u":"https://x.com/allabout_KieCYJ/status/2070355118956945650","d":"시험 준비 7단계 조언"},{"t":"@HANBINIZM 원문","u":"https://x.com/HANBINIZM/status/1905837706929918076","d":"시험 시간·전자기기 규정 변경"},{"t":"@shiori_edu 원문","u":"https://x.com/shiori_edu/status/2109899073377738782","d":"일본어 교사의 독해 고민"},{"t":"@shiori_edu 원문","u":"https://x.com/shiori_edu/status/2117928720585380183","d":"N2 문법 60문항 · 독해 시간 확보"},{"t":"@Midori3C23 원문","u":"https://x.com/Midori3C23/status/2121762365486301220","d":"모의고사 결과 분석"},{"t":"@watasistudyhard N2 독해 만점 타래","u":"https://x.com/watasistudyhard/status/2117877289509904887","d":"일반인 N2 독해 만점 후기 스레드"}]}],"free":[{"t":"JLPT 공식 샘플문제 (레벨별 1회분)","u":"https://www.jlpt.jp/e/samples/forlearners.html","d":"공식 사이트 · 청해 음성 포함. 시험 전 한 번은 시간 재고 풀어보기"},{"t":"PassJapanese — N2 기출 형식 테스트","u":"https://passjapanese.com/ko/exam","d":"가입 없이 무료 · 제출 즉시 채점 · 한국어 해설"},{"t":"RIKEE — N2 모의고사 (온라인)","u":"https://rikee.jp/ko/exams/n2/","d":"105분 제한 · 청해 1회 재생 · 점수와 해설"},{"t":"JP Notes — N2 청해 연습 (스크립트 포함)","u":"https://jpnotes.dev/n2-listening/","d":"유형별 원어민 속도 음성 + 후리가나 대본 + 오답 이유"},{"t":"가나집사 — N2 예문 790개","u":"https://ganabutler.info/sentences/jlpt/n2","d":"단어·문법이 연결된 예문, 음성·형태소 분해"},{"t":"PassJapanese — N2 문법 200개 일람","u":"https://passjapanese.com/ja/grammar/n2","d":"문형별 뜻·예문·구별 포인트 (일본어)"},{"t":"NHK News Web Easy","u":"https://www3.nhk.or.jp/news/easy/","d":"매일 5분 청해·독해 겸용"},{"t":"JLPT 공식 (시험 안내·수험표)","u":"https://www.jlpt.jp/","d":"시험일·시간표·수험표 확인"}],"caveat":"인스타그램은 로그인 장벽·비공개 계정이 많아 직접 수집하지 않았습니다. X는 한국어 N2 자료가 적어 게시물 6건만 반영했고, 나머지는 공개 웹·블로그·유튜브 요약입니다. 링크는 2026-11-18 확인 기준이며, 시험 시각·수험표는 접수한 실시위원회 공지를 최종 기준으로 하세요."}};</script>
<script>window.__KAKO__ = {"sets":[{"id":"2018b","label":"2018 공식문제집②","sub":"日本語能力試験公式問題集 第二集 — 실제 출제 문제 (정답표 검증)","items":[{"num":1,"part":"問題1 한자 읽기","q":"{先生|せんせい}に《貴重》な{資料|しりょう}を{見|み}せていただいた。","qko":"선생님께 귀중한 자료를 보여 주셨다.","opts":["きじゅう","きちょう","きっじゅう","きっちょう"],"a":1,"exp":"貴重(きちょう)=귀중. 重는 음독이 대개 じゅう·ちょう인데 貴重·尊重·慎重은 ちょう. きじゅう·きっじゅう는 重를 じゅう로 읽은 함정.","sec":"moji","id":"2018b-001"},{"num":2,"part":"問題1 한자 읽기","q":"その{話|はなし}を{聞|き}いて、とても《怪しい》と{思|おも}った。","qko":"그 이야기를 듣고 매우 수상하다고 생각했다.","opts":["むなしい","くやしい","おかしい","あやしい"],"a":3,"exp":"怪しい(あやしい)=수상하다. むなしい=허무하다(空しい), くやしい=분하다(悔しい), おかしい=이상하다(可笑しい).","sec":"moji","id":"2018b-002"},{"num":3,"part":"問題1 한자 읽기","q":"{佐藤|さとう}さんは《容姿》も{性格|せいかく}もいい。","qko":"사토 씨는 용모도 성격도 좋다.","opts":["よし","ようし","ようす","よす"],"a":2,"exp":"容姿(ようす)=용모. 子(し)를 붙여 ようし로 읽는 함정이 많음. 様子도 ようす라 발음이 같음.","sec":"moji","id":"2018b-003"},{"num":4,"part":"問題1 한자 읽기","q":"これは{危険|きけん}を《伴う》{実験|じっけん}だ。","qko":"이것은 위험을 수반하는 실험이다.","opts":["はらう","あつかう","ともなう","すくう"],"a":2,"exp":"伴う(ともなう)=수반하다, 동반하다. 払う=はらう, 扱う=あつかう, 救う=すくう.","sec":"moji","id":"2018b-004"},{"num":5,"part":"問題1 한자 읽기","q":"{以前|いぜん}は、{海外|かいがい}で{暮|く}らしたいという《願望》が{強|つよ}かった。","qko":"예전에는 해외에서 살고 싶다는 욕망이 강했다.","opts":["がんぼう","げんぼう","がんぼ","げんぼ"],"a":0,"exp":"願望(がんぼう)=원망, 욕망. 望은 ぼう로 길게 읽음. げんぼう는 原望 같은 없는 단어.","sec":"moji","id":"2018b-005"},{"num":6,"part":"問題2 한자 표기","q":"{友人|ゆうじん}を{家|いえ}に《まねいた》。","qko":"친구를 집에 초대했다.","opts":["伯いた","招いた","泊いた","召いた"],"a":1,"exp":"招く(まねく)=초대하다 → 招いた. 伯은 伯父(おじ)의 글자, 泊은 宿泊(숙박), 召는 召し上がる(드시다).","sec":"moji","id":"2018b-006"},{"num":7,"part":"問題2 한자 표기","q":"この{商品|しょうひん}は{安全|あんぜん}{性|せい}が《ほしょう》されている。","qko":"이 상품은 안전성이 보증되고 있다.","opts":["補証","保正","保証","補正"],"a":2,"exp":"保証(ほしょう)=보증. 補正은 ほしょう지만 '보정'으로 뜻이 다름. 証(증거 증)과 正(바를 정)을 구별.","sec":"moji","id":"2018b-007"},{"num":8,"part":"問題2 한자 표기","q":"この{企業|きぎょう}では、さまざまな《もよおし》を{行|おこな}っている。","qko":"이 기업에서는 다양한 행사를 열고 있다.","opts":["携し","催し","推し","権し"],"a":1,"exp":"催し(もよおし)=행사, 이벤트. 携은 携帯(けいたい), 推는 推測(すいそく), 権은 権利(けんり).","sec":"moji","id":"2018b-008"},{"num":9,"part":"問題2 한자 표기","q":"{銀行|ぎんこう}に{行|い}って、お{札|ふだ}を《こうか》に{替|か}えた。","qko":"은행에 가서 지폐를 동전으로 바꿨다.","opts":["硬貨","固貨","硬価","固価"],"a":0,"exp":"硬貨(こうか)=동전. 硬은 硬い(かたい), 貨는 貨物·貨幣(화폐). 固은 固い(굳다), 価는 価格(가격).","sec":"moji","id":"2018b-009"},{"num":10,"part":"問題2 한자 표기","q":"わが{社|しゃ}の{商品|しょうひん}はここで《せいぞう》されている。","qko":"우리 회사 제품은 여기에서 제조되고 있다.","opts":["製増","制増","制造","製造"],"a":3,"exp":"製造(せいぞう)=제조. 물건을 만드는 것은 製(製품 제), 규칙·제도는 制(제어할 제). 増은 増える(늘다), 造는 造る(만들다).","sec":"moji","id":"2018b-010"},{"num":11,"part":"問題3 한자 조합","q":"{男女|だんじょ}の{結婚|けっこん}（　）の{違|ちが}いについて{調|しら}べた。","qko":"남녀의 결혼관 차이에 대해 조사했다.","opts":["観","識","念","察"],"a":0,"exp":"結婚観(결혼관). 〜観은 가치관·인생관처럼 '관점·견해'를 뜻하는 접미사. 識은 知識, 念은 概念, 察은 観察의 글자.","sec":"moji","id":"2018b-011"},{"num":12,"part":"問題3 한자 조합","q":"ここでは（　）{水準|すいじゅん}の{医療|いりょう}が{受|う}けられる。","qko":"여기에서는 높은 수준의 의료를 받을 수 있다.","opts":["頂","上","高","特"],"a":2,"exp":"高水準(높은 수준). 水準과 붙어 쓰는 것은 高水準·低水準. 上水準·頂水準이라는 말은 없음.","sec":"moji","id":"2018b-012"},{"num":13,"part":"問題3 한자 조합","q":"{今日|きょう}は{大学|だいがく}の{講義|こうぎ}で{日本|にほん}（　）の{経営|けいえい}について{学|まな}んだ。","qko":"오늘은 대학 강의에서 일본식 경영에 대해 배웠다.","opts":["状","類","式","則"],"a":2,"exp":"日本式(일본식). 〜式은 방식·양식을 뜻함(和式·洋式·日本式). 状은 状況, 類는 種類, 則은 規則.","sec":"moji","id":"2018b-013"},{"num":14,"part":"問題3 한자 조합","q":"{開封|かいふう}しても、（　）{使用|しよう}の{物|もの}は{返品|へんぴん}{可能|かのう}です。","qko":"개봉해도 미사용인 물건은 반품 가능합니다.","opts":["外","否","前","未"],"a":3,"exp":"未使用(미사용). 未〜는 '아직 ~하지 않음'(未経験·未完成). 前使用은 말이 되지 않음.","sec":"moji","id":"2018b-014"},{"num":15,"part":"問題3 한자 조합","q":"{受験|じゅけん}{生|せい}なので、{勉強|べんきょう}（　）の{毎日|まいにち}だ。","qko":"수험생이라 공부에 파묻힌 나날이다.","opts":["漬け","浸し","溶け","満ち"],"a":0,"exp":"勉強漬け(공부에 파묻힘). 〜漬け는 '~에 젖어 있음'을 뜻하는 접미사(仕事漬け·練習漬け). 浸し는 浸す(담그다)에서 온 말로 이 형태로는 안 씀.","sec":"moji","id":"2018b-015"},{"num":16,"part":"問題4 문맥 규정","q":"この{大学|だいがく}では{一般|いっぱん}{向|む}けの{講座|こうざ}を{開|ひら}き、{社会|しゃかい}に{学習|がくしゅう}の{場|ば}を（　）している。","qko":"이 대학에서는 일반인 대상 강좌를 열어 사회에 학습의 장을 제공하고 있다.","opts":["{選出|せんしゅつ}","{提供|ていきょう}","{指示|しじ}","{寄付|きふ}"],"a":1,"exp":"提供(ていきょう)=제공. 場を提供する가 정형. 選出=선출, 指示=지시, 寄付=기부.","sec":"moji","id":"2018b-016"},{"num":17,"part":"問題4 문맥 규정","q":"{今年|ことし}の{夏|なつ}は{暑|あつ}さが{厳|きび}しく、{仕事|しごと}から{家|いえ}に{帰|かえ}ると{疲|つか}れて（　）してしまう。","qko":"올여름은 더위가 심해서, 일을 마치고 집에 돌아오면 지쳐서 녹초가 된다.","opts":["ぐったり","しっかり","すっきり","ぎっしり"],"a":0,"exp":"ぐったり=녹초가 되어. 疲れてぐったりする가 정형. しっかり=단단히, すっきり=개운하게, ぎっしり=빽빽이.","sec":"moji","id":"2018b-017"},{"num":18,"part":"問題4 문맥 규정","q":"{学生|がくせい}{時代|じだい}の{友人|ゆうじん}が{私|わたし}の{名前|なまえ}を{忘|わす}れていたので、とても（　）だった。","qko":"학생 때 친구가 내 이름을 잊고 있어서 매우 충격이었다.","opts":["アウト","ダウン","ショック","エラー"],"a":2,"exp":"ショック=충격. 〜なので、とてもショックだった가 자연스러움. アウト=아웃, ダウン=다운, エラー=오류.","sec":"moji","id":"2018b-018"},{"num":19,"part":"問題4 문맥 규정","q":"{通路|つうろ}に{荷物|にもつ}を{置|お}いたら、{通|とお}る{人|ひと}の（　）になりますよ。","qko":"통로에 짐을 두면 지나가는 사람에게 방해가 됩니다.","opts":["{面倒|めんどう}","{邪魔|じゃま}","{被害|ひがい}","{無理|むり}"],"a":1,"exp":"邪魔(じゃま)=방해. 〜の邪魔になる가 정형. 面倒은 面倒を見る/面倒くさい, 被害=피해, 無理=무리.","sec":"moji","id":"2018b-019"},{"num":20,"part":"問題4 문맥 규정","q":"{少|すこ}し{長|なが}めの{上|のぼ}り{坂|ざか}だったが（　）ので、それほど{疲|つか}れなかった。","qko":"조금 긴 오르막이었지만 완만해서 그다지 피곤하지 않았다.","opts":["おとなしかった","ささやかだった","なだらかだった","よわよわしかった"],"a":2,"exp":"なだらかだ=완만하다(경사의 정도가 부드러움). 坂·山道에 씀. おとなしい=얌전하다, ささやか=소소하다, よわよわしい=가냘프다.","sec":"moji","id":"2018b-020"},{"num":21,"part":"問題4 문맥 규정","q":"{出席|しゅっせき}{者|しゃ}は{皆|みな}{会議|かいぎ}に{積極|せっきょく}{的|てき}に{参加|さんか}し、{意見|いけん}を（　）{交換|こうかん}し{合|あ}った。","qko":"출석자는 모두 회의에 적극적으로 참여해 의견을 활발히 교환했다.","opts":["{活発|かっぱつ}に","{円満|えんまん}に","{機敏|きびん}に","{濃厚|のうこう}に"],"a":0,"exp":"活発に(かっぱつに)=활발히. 意見を活発に交換する가 자연스러움. 円満に=원만히, 機敏に=민첩하게, 濃厚に=짙게.","sec":"moji","id":"2018b-021"},{"num":22,"part":"問題4 문맥 규정","q":"{列|れつ}に{並|なら}んでいたら、{私|わたし}の{前|まえ}に{強引|ごういん}に（　）きた{人|ひと}がいて、{嫌|いや}な{気分|きぶん}になった。","qko":"줄을 서 있는데 내 앞에 억지로 끼어든 사람이 있어 기분이 나빴다.","opts":["{当|あ}てはまって","{付|つ}け{加|くわ}えて","{行|い}き{着|つ}いて","{割|わ}り{込|こ}んで"],"a":3,"exp":"割り込む(わりこむ)=끼어들다(새치기). 列に割り込む가 정형. 当てはまる=해당하다, 付け加える=덧붙이다, 行き着く=도달하다.","sec":"moji","id":"2018b-022"},{"num":23,"part":"問題5 유의 표현","q":"{高橋|たかはし}さんはとても《愉快》な{人|ひと}だ。","qko":"다카하시 씨는 매우 유쾌한 사람이다.","opts":["{面白|おもしろ}い","おしゃれな","{親切|しんせつ}な","かわいい"],"a":0,"exp":"愉快(ゆかい)≒面白い(재미있다·유쾌하다). おしゃれ=멋쟁이, 親切=친절, かわいい=귀엽다.","sec":"moji","id":"2018b-023"},{"num":24,"part":"問題5 유의 표현","q":"それは{確|たし}かに《やむをえない》ことだと{思|おも}う。","qko":"그것은 확실히 어쩔 수 없는 일이라고 생각한다.","opts":["もったいない","なさけない","つまらない","しかたない"],"a":3,"exp":"やむをえない≒しかたない(어쩔 수 없다). もったいない=아깝다, なさけない=한심하다, つまらない=시시하다.","sec":"moji","id":"2018b-024"},{"num":25,"part":"問題5 유의 표현","q":"{少|すこ}し《息抜き》したほうがいいよ。","qko":"조금 쉬는 게 좋겠어.","opts":["{待|ま}った","{急|いそ}いだ","{休|やす}んだ","{働|はたら}いた"],"a":2,"exp":"息抜き(いきぬき)=기분 전환·한숨 돌리기 ≒ 休む(쉬다). 待つ=기다리다, 急ぐ=서두르다.","sec":"moji","id":"2018b-025"},{"num":26,"part":"問題5 유의 표현","q":"{今日|きょう}はとても《ついていた》。","qko":"오늘은 운이 매우 좋았다.","opts":["{気分|きぶん}が{悪|わる}かった","{運|うん}が{悪|わる}かった","{気分|きぶん}がよかった","{運|うん}がよかった"],"a":3,"exp":"ついている=운이 좋다 ≒ 運がよかった. 気分는 기분이라 뜻이 다름. 반대는 ついていない=운이 없다.","sec":"moji","id":"2018b-026"},{"num":27,"part":"問題5 유의 표현","q":"{私|わたし}は《つねに》{言葉遣|ことばづか}いに{気|き}をつけている。","qko":"나는 항상 말투에 주의하고 있다.","opts":["{当然|とうぜん}","いつも","{特|とく}に","できるだけ"],"a":1,"exp":"つねに(常に)=항상 ≒ いつも. 当然=당연히, 特に=특히, できるだけ=가능한 한.","sec":"moji","id":"2018b-027"},{"num":28,"part":"問題6 용법","q":"{延長|えんちょう}","qko":"연장 — 다음 중 단어 사용이 가장 적절한 것은?","opts":["{悪|あく}{天候|てんこう}で{列車|れっしゃ}が{運転|うんてん}をやめたため、{旅行|りょこう}の{出発|しゅっぱつ}が{三|みっ}{日|か}{後|ご}に{延長|えんちょう}された。","{初|はじ}めの{設計|せっけい}では２{階|かい}{建|だ}てだったが、３{階|かい}{建|だ}ての{家|いえ}に{延長|えんちょう}することにした。","{予定|よてい}の{時間|じかん}{内|ない}に{結論|けつろん}が{出|で}ず、{会議|かいぎ}が１{時間|じかん}{延長|えんちょう}されることになった。","{電車|でんしゃ}の{中|なか}で{居眠|いねむ}りをして、{降|お}りる{駅|えき}を{一|いち}{駅|えき}{延長|えんちょう}してしまった。"],"a":2,"exp":"延長=이미 정한 기간·거리를 늘림. ③ 회의 시간을 1시간 늘림 ✓. ① 날짜를 미루는 것은 延期, ② 규모를 키우는 것은 拡張·増築, ④ 지나쳐 버린 것은 乗り過ごす.","sec":"moji","id":"2018b-028"},{"num":29,"part":"問題6 용법","q":"さびる","qko":"녹슬다 — 다음 중 단어 사용이 가장 적절한 것은?","opts":["{暑|あつ}いところに{生|なま}ものをずっと{置|お}いておいたら、さびて{臭|くさ}くなった。","{昨夜|さくや}は{雨|あめ}が{相当|そうとう}{降|ふ}ったらしく、{普段|ふだん}はきれいな{川|かわ}の{水|みず}がさびて{濁|にご}っている。","{鉢|ばち}に{植|う}えた{植物|しょくぶつ}に{水|みず}をやるのを{忘|わす}れていたら、{花|はな}がさびてしまった。","この{鉄|てつ}の{棒|ぼう}はずっと{家|いえ}の{外|そと}に{置|お}いてあったので、さびて{茶色|ちゃいろ}くなっている。"],"a":3,"exp":"さびる=쇠가 녹슬다. ④ 철봉이 갈색으로 녹슴 ✓. ① 음식이 상하는 것은 腐る, ② 물이 탁한 것은 濁る, ③ 꽃이 시드는 것은 枯れる.","sec":"moji","id":"2018b-029"},{"num":30,"part":"問題6 용법","q":"{目上|めうえ}","qko":"연상·윗사람 — 다음 중 단어 사용이 가장 적절한 것은?","opts":["{勉強|べんきょう}{会|かい}に{参加|さんか}した{社員|しゃいん}がすべて{目上|めうえ}だったので、{新人|しんじん}の{私|わたし}はとても{緊張|きんちょう}した。","この{店|みせ}で{一番|いちばん}{値段|ねだん}が{高|たか}く{目上|めうえ}の{商品|しょうひん}は、{店|みせ}の{奥|おく}にある{棚|たな}に{並|なら}べられていた。","{高校|こうこう}{時代|じだい}、{鈴木|すずき}さんはとても{優秀|ゆうしゅう}で、{成績|せいせき}はいつも{学年|がくねん}で{目上|めうえ}だった。","あの{若|わか}さで{金賞|きんしょう}を{受賞|じゅしょう}した{伊藤|いとう}さんは、{本当|ほんとう}に{目上|めうえ}の{人|ひと}だと{思|おも}う。"],"a":0,"exp":"目上=나이나 지위가 위인 사람. ① 참가 사원이 모두 윗사람 ✓. ② 상품에는 쓸 수 없음(高級), ③ 성적에는 上だ·上回る, ④ 젊어서 윗사람이 될 수 없으므로 立派な人.","sec":"moji","id":"2018b-030"},{"num":31,"part":"問題6 용법","q":"{大|おお}げさ","qko":"과장됨 — 다음 중 단어 사용이 가장 적절한 것은?","opts":["{息子|むすこ}の{誕生|たんじょう}{日|ひ}に{料理|りょうり}を{作|つく}りすぎてしまい、{大|おお}げさに{余|あま}ってしまった。","{天気|てんき}{予報|よほう}によると、{明日|あした}は{今日|きょう}より{大|おお}げさに{気温|きおん}が{下|さ}がるらしい。","{努力|どりょく}した{結果|けっか}、{試験|しけん}の{成績|せいせき}が{大|おお}げさに{伸|の}びて、{先生|せんせい}に{褒|ほ}められた。","あの{人|ひと}は{小|ちい}さなことを{大|おお}げさに{言|い}うので、そのまま{信|しん}じないほうがいい。"],"a":3,"exp":"大げさ=실제보다 부풀림. ④ 작은 일을 과장해서 말함 ✓. ① 많이 남은 것은 大量に, ② 기온 차는 大幅に, ③ 성적 신장은 大きく.","sec":"moji","id":"2018b-031"},{"num":32,"part":"問題6 용법","q":"{反省|はんせい}","qko":"반성 — 다음 중 단어 사용이 가장 적절한 것은?","opts":["{発表|はっぴょう}の{原稿|げんこう}を{全部|ぜんぶ}{覚|おぼ}えたのに、{緊張|きんちょう}のせいでどんなに{反省|はんせい}しても{全|まった}く{思|おも}い{出|だ}せない。","{今回|こんかい}の{企画|きかく}では、{私|わたし}の{準備|じゅんび}{不足|ふそく}で{周|まわ}りに{迷惑|めいわく}をかけたことをとても{反省|はんせい}しています。","{祖父|そふ}はいつも{若|わか}いころの{思|おも}い{出|で}を{懐|なつ}かしそうに{反省|はんせい}して{私|わたし}に{話|はな}してくれる。","この{機械|きかい}の{使|つか}い{方|かた}を{忘|わす}れないように、もう{一|いち}{度|ど}{最初|さいしょ}から{反省|はんせい}しておきましょう。"],"a":1,"exp":"反省=자기의 잘못을 돌아보고 뉘우침. ② 주변에 폐를 끼친 것을 반성 ✓. ① 되살리려는 것은 思い出す, ③ 추억을 떠올리는 것은 懐かしむ, ④ 다시 익히는 것은 復習.","sec":"moji","id":"2018b-032"},{"num":33,"part":"問題7 문법 형식 판단","q":"{卒業|そつぎょう}{論文|ろんぶん}がなかなか{書|か}けなくて、{一時|いちじ}は（　）かけたが、{何|なん}とか{今日|きょう}{無事|ぶじ}に{提出|ていしゅつ}することができた。","qko":"졸업논문이 좀처럼 써지지 않아 한때는 포기할 뻔했지만, 어떻게든 오늘 무사히 제출할 수 있었다.","opts":["あきらめ","あきらめて","あきらめる","あきらめた"],"a":0,"exp":"Vます어간 + かける = '~할 뻔하다, ~하기 시작해 아직 끝나지 않음'. あきらめる는 2그룹 동사라 あきらめ + かけた. あきらめてかけた처럼 て형은 붙지 않음.","sec":"bunpou","id":"2018b-033"},{"num":34,"part":"問題7 문법 형식 판단","q":"{子|こ}どものころ、{母|はは}（　）{作|つく}ったハンバーグが{大好|だいす}きで、よく{作|つく}ってもらった。","qko":"어렸을 때 어머니가 만든 햄버그가 너무 좋아서 자주 만들어 주셨다.","opts":["の","との","によって","にとって"],"a":0,"exp":"「母の作った〜」= 주어를 나타내는 の. 관계절 안에서 が 대신 の를 쓸 수 있음. によって는 수동문의 행위자, にとって는 '~에게 있어서'.","sec":"bunpou","id":"2018b-034"},{"num":35,"part":"問題7 문법 형식 판단","q":"{多様|たよう}な{情報|じょうほう}があふれる{現代|げんだい}{社会|しゃかい}（　）、{大切|たいせつ}なのは、{膨大|ぼうだい}な{情報|じょうほう}の{中|なか}から、{自分|じぶん}に{必要|ひつよう}な{情報|じょうほう}を{選|えら}ぶ{力|ちから}である。","qko":"다양한 정보가 넘치는 현대 사회에서 중요한 것은 방대한 정보 속에서 자신에게 필요한 정보를 고르는 힘이다.","opts":["に{加|くわ}えて","において","を{基|もと}にして","を{込|こ}めて"],"a":1,"exp":"〜において = '~에 있어서/~에서'(장소·시대·분야). 現代社会において가 정형. に加えて=~에 더해, を基にして=~을 바탕으로.","sec":"bunpou","id":"2018b-035"},{"num":36,"part":"問題7 문법 형식 판단","q":"{作文|さくぶん}が{得意|とくい}な{友達|ともだち}に「どうやったらうまくなれるの？」と{聞|き}いたら、「たくさん{書|か}けば（　）うまくなるよ。」と{言|い}われた。","qko":"작문을 잘하는 친구에게 '어떻게 하면 잘하게 돼?'라고 물었더니 '많이 쓰다 보면 곧 잘하게 돼'라고 했다.","opts":["{必|かなら}ずしも","たとえ","そのうち","さっき"],"a":2,"exp":"そのうち = '머지않아, 곧'. 미래의 변화를 완곡하게 예상. 必ずしも는 뒤에 부정이 와야 함(必ずしも〜ない).","sec":"bunpou","id":"2018b-036"},{"num":37,"part":"問題7 문법 형식 판단","q":"{看護|かんご}{師|し}の{仕事|しごと}は{夜勤|やきん}もあって{大変|たいへん}だが、{自分|じぶん}でこの{仕事|しごと}を{選|えら}んだ（　）、がんばって{続|つづ}けたいと{思|おも}う。","qko":"간호사 일은 야간 근무도 있어 힘들지만, 스스로 이 일을 선택한 이상 열심히 계속하고 싶다.","opts":["{以上|いじょう}","とたん","あげくに","かのようで"],"a":0,"exp":"Vた + 以上(は) = '~한 이상(은)'. 결의·의무가 뒤에 옴. とたん=~하자마자, あげくに=~(나쁜 결과의 끝에).","sec":"bunpou","id":"2018b-037"},{"num":38,"part":"問題7 문법 형식 판단","q":"（{内線|ないせん}{電話|でんわ}で）{山田|やまだ}「はい、{山田|やまだ}です。」　{木村|きむら}「{受付|うけつけ}の{木村|きむら}ですが、Ｘ{社|しゃ}の{中川|なかがわ}{様|さま}が（　）。」　{山田|やまだ}「わかりました。すぐ{行|い}きます。」","qko":"(내선 전화로) 야마다 \"네, 야마다입니다.\" 기무라 \"접수처의 기무라인데요, X사 나카가와 씨가 오셨습니다.\" 야마다 \"알겠습니다. 바로 가겠습니다.\"","opts":["{伺|うかが}いました","お{目|め}にかかりました","ございました","お{越|こ}しになりました"],"a":3,"exp":"손님의 행동에는 존경어 お越しになる. 伺う·お目にかかる는 '내가 가다/만나다'의 겸양어라 상대(중川様) 행동에 쓸 수 없음.","sec":"bunpou","id":"2018b-038"},{"num":39,"part":"問題7 문법 형식 판단","q":"{人|ひと}は{一生|いっしょう}のうちどのくらい{寝|ね}ているのでしょうか。{仮|かり}に{一|いち}{日|にち}８{時間|じかん}{寝|ね}て、８０{歳|さい}まで{生|い}きる（　）。すると、{睡眠|すいみん}{時間|じかん}は{約|やく}２３３,６００{時間|じかん}で、{約|やく}２７{年|ねん}{寝|ね}ている{計算|けいさん}になります。","qko":"사람은 일생 동안 얼마나 잠을 잘까요. 가령 하루 8시간 자고 80세까지 산다고 합시다. 그러면 수면 시간은 약 233,600시간으로 약 27년을 자는 셈이 됩니다.","opts":["となりました","とします","とされていました","と{見|み}られます"],"a":1,"exp":"仮に〜とします = '가령 ~라고 가정합니다'. 계산의 전제를 세울 때 쓰는 とします. 뒤의 すると(그러면)와 짝을 이룸.","sec":"bunpou","id":"2018b-039"},{"num":40,"part":"問題7 문법 형식 판단","q":"{夢|ゆめ}を{語|かた}る（　）{誰|だれ}でもできるが、{実現|じつげん}させるのは{簡単|かんたん}なことではない。","qko":"꿈을 이야기하는 것만은 누구나 할 수 있지만, 실현시키는 것은 쉬운 일이 아니다.","opts":["だけでは","だけなら","ためしか","ためには"],"a":1,"exp":"「〜だけなら」= '~하는 것만이라면'. 뒤에 오는 '누구나 할 수 있다'와 대비. だけでは는 뒤에 부정적 결과가 와서 '~만으로는 (안 된다)'.","sec":"bunpou","id":"2018b-040"},{"num":41,"part":"問題7 문법 형식 판단","q":"（{説明|せつめい}{書|しょ}で）エアコンを{掃除|そうじ}するときは、{安全|あんぜん}{上|じょう}、{必|かなら}ずコンセントを（　）してください。","qko":"(설명서에서) 에어컨을 청소할 때는 안전상 반드시 플러그를 뽑은 뒤에 해 주세요.","opts":["{抜|ぬ}いたことを","{抜|ぬ}いたことが","{抜|ぬ}いてからに","{抜|ぬ}いてからは"],"a":2,"exp":"Vて + から + に(する) = '~한 뒤에'. 「抜いてからにしてください」는 「抜いてからに(する)」의 활용. 抜いたことを는 '뽑은 것을'으로 뜻이 달라짐.","sec":"bunpou","id":"2018b-041"},{"num":42,"part":"問題7 문법 형식 판단","q":"{私|わたし}はスピーチが{苦手|にがて}なのに、{今度|こんど}{友達|ともだち}の{結婚|けっこん}パーティーでスピーチを（　）、{困|こま}っている。","qko":"나는 스피치를 못하는데 이번에 친구 결혼 파티에서 스피치를 하게 되어 곤란하다.","opts":["しにくくて","してほしくて","させてみたくて","することになってしまって"],"a":3,"exp":"〜ことになってしまった = (원하지 않는데) ~하게 되었다. 곤란한 상황과 호응. しにくい=하기 어렵다(능력 문제), させてみたい=시켜 보고 싶다.","sec":"bunpou","id":"2018b-042"},{"num":43,"part":"問題7 문법 형식 판단","q":"せっかく、{夕日|ゆうひ}がきれいなことで{有名|ゆうめい}なＡ{海岸|かいがん}に{来|き}たのに、{急|きゅう}に{雨|あめ}が{降|ふ}り{出|だ}した。どうも{夕日|ゆうひ}は（　）。","qko":"모처럼 석양이 아름답기로 유명한 A 해안에 왔는데 갑자기 비가 내리기 시작했다. 아무래도 석양은 볼 수 없을 것 같다.","opts":["{見|み}えてもしかたない","{見|み}られないことだった","{見|み}られそうにない","{見|み}えないことがあった"],"a":2,"exp":"Vます어간 + そうにない = '~할 것 같지 않다'. 見られる(가능형) + そうにない. 見えてもしかたない는 '보여도 어쩔 수 없다'로 문맥과 반대.","sec":"bunpou","id":"2018b-043"},{"num":44,"part":"問題7 문법 형식 판단","q":"{山川|やまかわ}「{中村|なかむら}くん、{毎日|まいにち}ジョギング（　）？」　{中村|なかむら}「うん、そうなんだよ。」　{山川|やまかわ}「{実|じつ}は、ぼくもなんだよ。{走|はし}るっていいよね。」","qko":"야마카와 \"나카무라 군, 매일 조깅하고 있다면서?\" 나카무라 \"응, 그래.\" 야마카와 \"실은 나도야. 달리기는 좋지.\"","opts":["しない","しててもいい","しちゃえば","してるんだって"],"a":3,"exp":"〜んだって = 전해 들은 내용을 확인하는 구어 표현('~라며?'). そうなんだよ라는 대답과 호응. しててもいい=해도 된다, しちゃえば=해 버리면.","sec":"bunpou","id":"2018b-044"},{"num":45,"part":"問題8 문장 배열 ★","q":"{結婚|けっこん}{生活|せいかつ}を{送|おく}る ___ ___ ★ ___ 、{相手|あいて}への{思|おも}いやりの{気持|きも}ちを{持|も}つことだと{思|おも}う。","qko":"결혼 생활을 하는 데 무엇이 중요한가 하면, 상대에 대한 배려의 마음을 갖는 것이라고 생각한다.","opts":["うえで","といえば","{大切|たいせつ}か","{何|なに}が"],"a":2,"star":"大切か","full":"{結婚|けっこん}{生活|せいかつ}を{送|おく}るうえで{何|なに}が{大切|たいせつ}かといえば、{相手|あいて}への{思|おも}いやりの{気持|きも}ちを{持|も}つことだと{思|おも}う。","exp":"うえで(〜하는 데 있어) → 何が → 大切か → といえば 순. 「何が大切かといえば」= '무엇이 중요한가 하면'의 정형 표현.","sec":"bunpou","id":"2018b-045"},{"num":46,"part":"問題8 문장 배열 ★","q":"{就職|しゅうしょく}したときに ___ ___ ★ ___ とうとう{壊|こわ}れたので、{買|か}い{換|か}えることにした。","qko":"취직했을 때 산 이래로 계속 쓰던 가방이 마침내 망가져서 새로 사기로 했다.","opts":["ずっと","{買|か}って{以来|いらい}","かばんが","{使|つか}っていた"],"a":3,"star":"使っていた","full":"{就職|しゅうしょく}したときに{買|か}って{以来|いらい}ずっと{使|つか}っていたかばんがとうとう{壊|こわ}れたので、{買|か}い{換|か}えることにした。","exp":"買って以来(산 이래로) → ずっと → 使っていた → かばんが. 「Vて以来」= '~한 이후로'.","sec":"bunpou","id":"2018b-046"},{"num":47,"part":"問題8 문장 배열 ★","q":"{登山|とざん}には{不思議|ふしぎ}な{魅力|みりょく}がある。{登|のぼ}っているときはこんなに ___ ___ ★ ___ なぜかまた{登|のぼ}りたくなる。","qko":"등산에는 신비한 매력이 있다. 오를 때는 이렇게 힘든 일은 두 번 다시 하고 싶지 않다고 생각하는데도, 산에서 내려온 지 며칠 지나면 왠지 또 오르고 싶어진다.","opts":["{思|おも}うのに","{二|に}{度|ど}としたくないと","{苦|くる}しいことは","{山|やま}を{下|お}りて{何|なん}{日|にち}かすると"],"a":0,"star":"思うのに","full":"{登|のぼ}っているときはこんなに{苦|くる}しいことは{二|に}{度|ど}としたくないと{思|おも}うのに、{山|やま}を{下|お}りて{何|なん}{日|にち}かすると、なぜかまた{登|のぼ}りたくなる。","exp":"苦しいことは → 二度としたくないと → 思うのに → 山を下りて何日かすると. 「〜のに」가 역접을 만들고, 뒤에 「なぜか」가 이어짐.","sec":"bunpou","id":"2018b-047"},{"num":48,"part":"問題8 문장 배열 ★","q":"{彫刻|ちょうこく}{家|か}{川村|かわむら}たけるが{作|つく}る{動物|どうぶつ}の{彫刻|ちょうこく}{作品|さくひん}は、{形|かたち}はシンプル ___ ___ ___ ★ {生命|せいめい}{力|りょく}にあふれている。","qko":"조각가 가와무라 다케루가 만드는 동물 조각 작품은 형태는 단순하지만 금방이라도 움직일 것 같은 생명력이 넘친다.","opts":["{動|うご}き{出|で}し","そうな","ながら","{今|いま}にも"],"a":1,"star":"そうな","full":"{彫刻|ちょうこく}{家|か}{川村|かわむら}たけるが{作|つく}る{動物|どうぶつ}の{彫刻|ちょうこく}{作品|さくひん}は、{形|かたち}はシンプルながら{今|いま}にも{動|うご}き{出|だ}しそうな{生命|せいめい}{力|りょく}にあふれている。","exp":"シンプルながら(단순하지만) → 今にも(금방이라도) → 動き出し → そうな + 生命力. 「今にも〜そうな」= '금방이라도 ~할 것 같은'.","sec":"bunpou","id":"2018b-048"},{"num":49,"part":"問題8 문장 배열 ★","q":"ビジネスで{成功|せいこう}できる{人|ひと}とできない{人|ひと}との{違|ちが}いは、どんなに{大変|たいへん}な{状況|じょうきょう}でもあきらめずに ___ ___ ★ ___ と{思|おも}う。","qko":"비즈니스에서 성공하는 사람과 못하는 사람의 차이는 아무리 힘든 상황에서도 포기하지 않고 끝까지 임할 수 있는지 어떤지에 있다고 생각한다.","opts":["かどうか","{取|と}り{組|く}める","にある","{最後|さいご}まで"],"a":2,"star":"取り組める","full":"ビジネスで{成功|せいこう}できる{人|ひと}とできない{人|ひと}との{違|ちが}いは、どんなに{大変|たいへん}な{状況|じょうきょう}でもあきらめずに{最後|さいご}まで{取|と}り{組|く}めるかどうかにあると{思|おも}う。","exp":"最後まで → 取り組める → かどうか → にある. 「〜かどうかにある」= '~인지 어떤지에 있다'.","sec":"bunpou","id":"2018b-049"},{"num":50,"part":"問題9 글의 문법","q":"{世界|せかい}のあちこちで{使|つか}われているこのトイレマークが{実|じつ}は{日本|にほん}で{生|う}まれたものだということを（　）。","qko":"세계 곳곳에서 쓰이는 이 화장실 마크가 실은 일본에서 태어난 것이라는 사실을 알고 계신가요?","opts":["ご{存|ぞん}じなわけだ","ご{存|ぞん}じだろうか","ご{存|ぞん}じのようだ","ご{存|ぞん}じだからだろう"],"a":1,"exp":"読者に問いかける 「ご存じだろうか」= '알고 계신가요?'. ご存じなわけだ=아는 것이 당연하다, ご存じのようだ=아시는 모양이다.","passage":"t2018_p9","sec":"bunpou","id":"2018b-050"},{"num":51,"part":"問題9 글의 문법","q":"{当時|とうじ}、{日本|にほん}{国内|こくない}の{案内|あんない}{板|ばん}は「お{手洗|てあら}い」などと{日本|にほん}{語|ご}で{書|か}かれているものがほとんどだった。（　）、それでは{世界|せかい}９０{数|すう}か{国|こく}から{来日|らいにち}する{選手|せんしゅ}たちに{理解|りかい}してもらえない。","qko":"당시 일본 국내 안내판은 '오테아라이' 등 일본어로 쓰인 것이 대부분이었다. 그러나 그것으로는 세계 90여 개국에서 온 선수들에게 이해받을 수 없다.","opts":["それに","しかし","または","それどころか"],"a":1,"exp":"앞의 사실과 반대되는 문제를 제시하므로 역접 しかし. それに=게다가, または=또는, それどころか=그것은커녕.","passage":"t2018_p9","sec":"bunpou","id":"2018b-051"},{"num":52,"part":"問題9 글의 문법","q":"そこで、{案内|あんない}{板|ばん}{作成|さくせい}{者|しゃ}たちは、あらゆる{国|くに}の{選手|せんしゅ}が{理解|りかい}できるよう、{絵|え}で{表|あらわ}すことを{考|かんが}えた。（　）、トイレマークなのだ。","qko":"그래서 안내판 제작자들은 모든 나라 선수들이 이해할 수 있도록 그림으로 나타내기로 생각했다. 이렇게 해서 태어난 것이 화장실 마크이다.","opts":["{作成|さくせい}{者|しゃ}が{理解|りかい}したのは","{日本|にほん}で{考|かんが}えられたのが","ここに{生|う}み{出|だ}したのは","こうして{生|う}まれたのが"],"a":3,"exp":"앞의 경위를 받아 결론을 내는 「こうして生まれたのが」= '이렇게 해서 태어난 것이'. 生み出す는 타동사라 「生み出したのは」 형태로는 주어와 맞지 않음.","passage":"t2018_p9","sec":"bunpou","id":"2018b-052"},{"num":53,"part":"問題9 글의 문법","q":"{競技|きょうぎ}を{表|あらわ}すマークは、この{東京|とうきょう}オリンピックで{初|はじ}めて{全面|ぜんめん}{的|てき}に{導入|どうにゅう}され、{高|たか}い{評価|ひょうか}を{受|う}けた。そして、その{後|あと}のオリンピックでもデザインを{変|か}えながら{毎回|まいかい}（　）。","qko":"경기를 나타내는 마크는 이 도쿄 올림픽에서 처음 전면 도입되어 높은 평가를 받았다. 그리고 이후 올림픽에서도 디자인을 바꾸면서 매번 사용되고 있다.","opts":["{使用|しよう}されている","{使用|しよう}した{点|てん}だ","{使用|しよう}していける","{使用|しよう}したいものだ"],"a":0,"exp":"주어가 '마크'이므로 수동 使用されている. 「毎回〜されている」로 현재까지 이어지는 상태를 표현.","passage":"t2018_p9","sec":"bunpou","id":"2018b-053"},{"num":54,"part":"問題9 글의 문법","q":"それは、あらゆる{人|ひと}にわかりやすくという{思|おも}いが{世界|せかい}に{届|とど}いた（　）。","qko":"그것은 모든 사람에게 알기 쉽게 하려는 마음이 세계에 전해진 결과임에 틀림없다.","opts":["{結果|けっか}として{表|あらわ}れるかもしれない","{結果|けっか}のはずだった","{結果|けっか}に{違|ちが}いない","{結果|けっか}でなければならなかった"],"a":2,"exp":"「〜に違いない」= '~임에 틀림없다'(강한 단정). はずだった=~였어야 했다(사실과 다름), かもしれない=~일지도 모른다(약한 추측)로 문맥 강도가 맞지 않음.","passage":"t2018_p9","sec":"bunpou","id":"2018b-054"},{"num":55,"part":"問題10 단문","q":"{筆者|ひっしゃ}の{考|かんが}えに{合|あ}うのはどれか。","qko":"필자의 생각과 맞는 것은?","opts":["ルールのないスポーツにも{価値|かち}がある。","ルールはスポーツで{楽|たの}しむためのものだ。","スポーツはルールを{理解|りかい}してから{始|はじ}めるべきだ。","スポーツを{通|とお}して、ルールの{重要|じゅうよう}さが{理解|りかい}できる。"],"a":1,"exp":"첫 문단에서 'スポーツ는 즐기기 위한 것이고, 그 스포츠를 즐기기 위해 룰이 있다'고 단정한다 → ②. ①은 룰의 존재 의의를 부정하므로 반대, ③④는 '룰을 이해해야 한다/중요성을 깨닫는다'는 논지와 어긋남.","passage":"r2018_10_1","sec":"dokkai","id":"2018b-055"},{"num":56,"part":"問題10 단문","q":"この{文書|ぶんしょ}を{書|か}いた、{一番|いちばん}の{目的|もくてき}は{何|なに}か。","qko":"이 문서를 쓴 가장 큰 목적은 무엇인가?","opts":["{暖房|だんぼう}の{使用|しよう}を{減|へ}らす{工夫|くふう}について{意見|いけん}を{求|もと}める。","{暖房|だんぼう}を{使用|しよう}せず、{服装|ふくそう}で{調整|ちょうせい}することを{求|もと}める。","{暖房|だんぼう}を{無駄|むだ}に{使用|しよう}しないことを{求|もと}める。","{暖房|だんぼう}の{温度|おんど}を{変更|へんこう}しないことを{求|もと}める。"],"a":2,"exp":"요청의 핵심은 '빈 방 난방 끄기·끄는 것 잊지 않기·온도 22도 이하' = 난방을 낭비하지 말 것 → ③. ① 의견을 구하는 문서가 아니고, ②는 '난방을 쓰지 말고 옷으로 조절하라'는 뜻이 되어 '온도 22도 이하로 설정하라'와 모순.","passage":"r2018_10_2","sec":"dokkai","id":"2018b-056"},{"num":57,"part":"問題10 단문","q":"{筆者|ひっしゃ}の{考|かんが}えに{合|あ}うのはどれか。","qko":"필자의 생각과 맞는 것은?","opts":["「やりたいことをやる」には、{大|おお}きな{目標|もくひょう}を{立|た}てることが{大切|たいせつ}だ。","「{自分|じぶん}の{望|のぞ}んでいること」を{知|し}れば、{今|いま}{何|なに}をすべきかがわかるようになる。","「{自分|じぶん}のやっていること」が「{自分|じぶん}の{望|のぞ}んでいること」だと{気|き}づくことが{大切|たいせつ}だ。","「{目|め}の{前|まえ}のやりたいこと」を{続|つづ}ければ、それが「{自分|じぶん}の{望|のぞ}んでいること」になり{得|う}る。"],"a":3,"exp":"마지막 문장이 핵심: 눈앞의 하고 싶은 일에 집중하다 보면 하는 일이 바라는 일에 가까워질 가능성이 높다 → ④. ①은 글에서 부정한 '큰 목표', ③은 '깨달음'이 아니라 '자연히 가까워짐'이 논지.","passage":"r2018_10_3","sec":"dokkai","id":"2018b-057"},{"num":58,"part":"問題10 단문","q":"このはがきで{紹介|しょうかい}されている{割引|わりびき}サービスについて{正|ただ}しいものはどれか。","qko":"이 엽서에서 소개하는 할인 서비스에 대해 올바른 것은?","opts":["コーヒー{豆|まめ}を{定期|ていき}{購入|こうにゅう}している{人|ひと}は、{１０月|じゅうがつ}{中|なか}だけ「{冬|ふゆ}の{味|あじ}わい」を１０%{割引|わりびき}で{買|か}うことができる。","コーヒー{豆|まめ}を{定期|ていき}{購入|こうにゅう}している{人|ひと}が{１０月|じゅうがつ}{中|なか}に「{冬|ふゆ}の{味|あじ}わい」を{予約|よやく}すれば、１５%{割引|わりびき}で{買|か}うことができる。","「{冬|ふゆ}の{味|あじ}わい」を{１０月|じゅうがつ}{中|なか}に{予約|よやく}すれば、その{他|た}の{商品|しょうひん}をすべて１５%{割引|わりびき}で{買|か}うことができる。","「{冬|ふゆ}の{味|あじ}わい」を{買|か}った{人|ひと}は、{１０月|じゅうがつ}{中|なか}だけその{他|た}の{商品|しょうひん}をすべて１０%{割引|わりびき}で{買|か}うことができる。"],"a":1,"exp":"「定期購入をされているお客様には、この商品を15%割引……10月中にご予約ください」→ ②. ① 할인율 10%가 틀림, ③ 다른 상품은 15%가 아니라 10%, ④ 10% 할인은 10월 한정이 아니라 상시(いつでも).","passage":"r2018_10_4","sec":"dokkai","id":"2018b-058"},{"num":59,"part":"問題10 단문","q":"{筆者|ひっしゃ}によると、{日記|にっき}を{書|か}き{続|つづ}けるとどうなるか。","qko":"필자에 따르면 일기를 계속 쓰면 어떻게 되는가?","opts":["{毎日|まいにち}を「いい{一|いち}{日|にち}」にしようとするようになる。","{毎日|まいにち}が「いい{一|いち}{日|にち}」だと{思|おも}えるようになる。","「いい{一|いち}{日|にち}」が{訪|おとず}れるのを{楽|たの}しみにするようになる。","「いい{一|いち}{日|にち}」をいつまでも{忘|わす}れないようになる。"],"a":0,"exp":"「主体的に行動するようになる」= 스스로 매일을 좋은 하루로 만들려고 하게 된다 → ①. ②는 '생각하게 된다'가 아니라 '행동하게 된다', ③은 기다리는 태도라 글의 결론과 반대.","passage":"r2018_10_5","sec":"dokkai","id":"2018b-059"},{"num":60,"part":"問題11 중문","q":"{日本|にほん}{人|にん}が{使|つか}う「{個性|こせい}」という{言葉|ことば}について、{筆者|ひっしゃ}はどのように{述|の}べているか。","qko":"일본인이 쓰는 '개성'이라는 말에 대해 필자는 어떻게 말하는가?","opts":["{本来|ほんらい}の{意味|いみ}とは{違|ちが}う{使|つか}い{方|かた}がされている。","{意味|いみ}がないと{ |じかん}）　{土日|どにち}・{祝日|しゅくじつ}のみ\n　おとな4,500{円|えん}／シニア4,200{円|えん}／こども2,200{円|えん}\n\n※ビュッフェ{料金|りょうきん}の{区分|くぶん}について（ベルン・みよし{共通|きょうつう}）\nおとな…{中学|ちゅうがく}{生|せい}から64{歳|さい}までのお{客|きゃく}{様|さま}\nシニア…65{歳|さい}{以上|いじょう}のお{客|きゃく}{様|さま}\nこども…4{歳|さい}から{小学|しょうがく}{生|せい}までのお{子|こ}{様|さま}（3{歳|さい}{以下|いか}のお{子|こ}{様|さま}は{無料|むりょう}です。）\n\n■ご{予約|よやく}・お{問|と}い{合|あ}わせ\nベルン 031-277-1116（{直通|ちょくつう}）／みよし 031-277-1119（{直通|ちょくつう}）","kotext":"벨른: 런치 90분·디저트 60분·디너 2시간. 미요시: 런치 2시간, 주말·공휴일만. 시니어는 65세 이상, 어른은 중학생~64세.","source":"","note":""}}},{"id":"2025a","label":"2025年 7월","sub":"2025年7月 실제 시험 복원본 — 정답은 공개 해설 대조","items":[{"num":1,"part":"問題1 한자 읽기","q":"{素晴|すば}らしい《才能》を{発揮|はっき}した。","qko":"훌륭한 재능을 발휘했다.","opts":["ぜいのう","ざいのう","せいのう","さいのう"],"a":3,"exp":"才能(さいのう)=재능. 才는 음독 さい. ざいのう는 在能 같은 없는 단어, せいのう는 性能(성능)과 혼동 유도.","sec":"moji","id":"2025a-001"},{"num":2,"part":"問題1 한자 읽기","q":"《辛い》{食|た}べ{物|もの}は{好|す}きではありません。","qko":"매운 음식은 좋아하지 않습니다.","opts":["あまい","からい","にがい","しぶい"],"a":1,"exp":"辛い(からい)=맵다. あまい=달다(甘い), にがい=쓰다(苦い), しぶい=떫다(渋い). 辛い는 'つらい(힘들다)'로도 읽음.","sec":"moji","id":"2025a-002"},{"num":3,"part":"問題1 한자 읽기","q":"{私|わたし}の{友人|ゆうじん}は《刑事》です。","qko":"제 친구는 형사입니다.","opts":["けんじ","かんじ","けいじ","かいじ"],"a":2,"exp":"刑事(けいじ)=형사. 刑은 음독 けい, 事는 じ. けんじ는 検事(검사)와 혼동 유도.","sec":"moji","id":"2025a-003"},{"num":4,"part":"問題1 한자 읽기","q":"{毎朝|まいあさ}6{時|じ}に《起床》して、{少|すこ}し{運動|うんどう}をしている。","qko":"매일 아침 6시에 기상해서 조금 운동을 한다.","opts":["きしょう","ぎしょう","きしょ","ぎしょ"],"a":0,"exp":"起床(きしょう)=기상. 起는 き, 床은 しょう. きしょ처럼 짧게 읽는 함정 주의(기상 vs 起床).","sec":"moji","id":"2025a-004"},{"num":5,"part":"問題1 한자 읽기","q":"{夕方|ゆうがた}になって、ようやく{風|かぜ}が《収まった》。","qko":"저녁이 되어 겨우 바람이 잦아들었다.","opts":["さだまった","しずまった","おさまった","やすまった"],"a":2,"exp":"収まる(おさまる)=가라앉다·진정되다. 静まる는 しずまる. さだまる·やすまる는 없는 읽기.","sec":"moji","id":"2025a-005"},{"num":6,"part":"問題2 한자 표기","q":"このタオルはまだ《しめって》いる。","qko":"이 수건은 아직 젖어 있다.","opts":["液って","温って","汗って","湿って"],"a":3,"exp":"湿る(しめる)=축축해지다 → 湿って. 液은 液体, 温은 温度, 汗은 汗(あせ).","sec":"moji","id":"2025a-006"},{"num":7,"part":"問題2 한자 표기","q":"この{時期|じき}は{風邪|かぜ}をひく{人|ひと}が{増|ふ}える《けいこう》がある。","qko":"이 시기에는 감기에 걸리는 사람이 늘어나는 경향이 있다.","opts":["傾向","頃向","傾高","頃高"],"a":0,"exp":"傾向(けいこう)=경향. 傾(기울 경)+向(향할 향). 頃은 頃(ころ, 무렵)의 글자로 틀림.","sec":"moji","id":"2025a-007"},{"num":8,"part":"問題2 한자 표기","q":"{大勢|おおぜい}の{人|ひと}が《しさつ》に{訪|おとず}れた。","qko":"많은 사람이 시찰하러 찾아왔다.","opts":["診察","視祭","視察","診祭"],"a":2,"exp":"視察(しさつ)=시찰. 診察(しんさつ)는 '진찰'로 발음이 다름. 祭가 들어간 視祭·診祭는 없는 단어.","sec":"moji","id":"2025a-008"},{"num":9,"part":"問題2 한자 표기","q":"もう{少|すこ}し{力|ちから}を{入|い}れて《けずって》ください。","qko":"조금 더 힘을 넣어 깎아 주세요.","opts":["絞って","削って","握って","掘って"],"a":1,"exp":"削る(けずる)=깎다 → 削って. 絞る=짜다, 握る=쥐다, 掘る=파다.","sec":"moji","id":"2025a-009"},{"num":10,"part":"問題2 한자 표기","q":"この《しせつ》には、{駐車|ちゅうしゃ}{場|じょう}はありません。","qko":"이 시설에는 주차장이 없습니다.","opts":["支接","施接","支設","施設"],"a":3,"exp":"施設(しせつ)=시설. 施(베풀 시)+設(설치할 설). 支는 支援·支出, 接는 接続의 글자.","sec":"moji","id":"2025a-010"},{"num":11,"part":"問題3 한자 조합","q":"{教師|きょうし}たちの{間|あいだ}で、{新|あら}たな{教育|きょういく}（　）が{注目|ちゅうもく}されている。","qko":"교사들 사이에서 새로운 교육론이 주목받고 있다.","opts":["則","理","論","規"],"a":2,"exp":"教育論(교육론)=교육에 관한 이론·주장. 〜論은 학설·견해. 則은 規則, 理는 理論의 일부, 規는 規模.","sec":"moji","id":"2025a-011"},{"num":12,"part":"問題3 한자 조합","q":"この{魚|さかな}は{骨|ほね}が{多|おお}くて{食|た}べ（　）。","qko":"이 생선은 가시가 많아서 먹기 힘들다.","opts":["づらい","いたい","おそい","ぐるしい"],"a":0,"exp":"〜づらい=~하기 힘들다(심리·신체적 부담). 食べづらい·言いづらい. 〜がたい는 문어적, 〜にくい는 물리적 어려움.","sec":"moji","id":"2025a-012"},{"num":13,"part":"問題3 한자 조합","q":"{今度|こんど}の{事故|じこ}は（　）{条件|じょうけん}が{重|かさ}なって{起|お}きた。","qko":"이번 사고는 나쁜 조건이 겹쳐서 일어났다.","opts":["損","劣","危","悪"],"a":3,"exp":"悪条件(あくじょうけん)=나쁜 조건. 반대는 好条件. 損은 損害, 劣은 劣悪, 危는 危険.","sec":"moji","id":"2025a-013"},{"num":14,"part":"問題4 문맥 규정","q":"{息子|むすこ}はみんなの{前|まえ}で、{悪|わる}いことにはもう{絶対|ぜったい}にしないと（　）。","qko":"아들은 모두 앞에서 나쁜 짓은 이제 절대 하지 않겠다고 맹세했다.","opts":["{論|ろん}じた","{命|めい}じた","{誓|ちか}った","{迫|せま}った"],"a":2,"exp":"誓う(ちかう)=맹세하다. 〜と誓った 형태. 論じる=논하다, 命じる=명령하다, 迫る=다그치다.","sec":"moji","id":"2025a-014"},{"num":15,"part":"問題4 문맥 규정","q":"{工事|こうじ}のため、（　）{電気|でんき}が{止|と}まることがあります。","qko":"공사 때문에 일시적으로 전기가 끊길 수 있습니다.","opts":["{簡潔|かんけつ}に","{一時|いちじ}{的|てき}に","{手軽|てがる}に","{不|ふ}{完全|かんぜん}に"],"a":1,"exp":"一時的に(いちじてきに)=일시적으로. 工事에 따른 단전 안내의 정형 표현. 簡潔に=간결하게, 手軽に=간편하게, 不完全に=불완전하게.","sec":"moji","id":"2025a-015"},{"num":16,"part":"問題4 문맥 규정","q":"あの{人物|じんぶつ}が{今回|こんかい}の{事件|じけん}に（　）していたのは{間違|まちが}いない。","qko":"그 인물이 이번 사건에 관여했던 것은 틀림없다.","opts":["{参列|さんれつ}","{加入|かにゅう}","{登場|とうじょう}","{関与|かんよ}"],"a":3,"exp":"関与(かんよ)=관여. 事件に関与する가 정형. 参列=참열(식에 참석), 加入=가입, 登場=등장.","sec":"moji","id":"2025a-016"},{"num":17,"part":"問題4 문맥 규정","q":"{油|あぶら}で{汚|よご}れたフライパンは、（　）してとても{洗|あら}いにくいです。","qko":"기름때가 묻은 프라이팬은 끈적끈적해서 매우 씻기 힘들다.","opts":["べたべた","かさかさ","じめじめ","ちくちく"],"a":0,"exp":"べたべた=끈적끈적. 기름때에 맞는 의태어. かさかさ=건조함, じめじめ=축축함(습도), ちくちく=따끔따끔.","sec":"moji","id":"2025a-017"},{"num":18,"part":"問題4 문맥 규정","q":"サッカーで{手|て}を{使|つか}うのは{禁止|きんし}されていて、もし{使|つか}ったら（　）になる。","qko":"축구에서 손을 쓰는 것은 금지되어 있어서, 쓰면 반칙이 된다.","opts":["{反則|はんそく}","{違法|いほう}","{非|ひ}{常識|じょうしき}","{不|ふ}{都合|つごう}"],"a":0,"exp":"反則(はんそく)=반칙. 스포츠 규칙 위반. 違法=법률 위반, 非常識=상식 밖, 不都合=불편.","sec":"moji","id":"2025a-018"},{"num":19,"part":"問題4 문맥 규정","q":"{虫|むし}が{飛|と}んできたので、{手|て}に{持|も}っていた{帽子|ぼうし}を{振|ふ}って{遠|とお}くに（　）。","qko":"벌레가 날아와서 손에 들고 있던 모자를 흔들어 멀리 쫓아냈다.","opts":["{連|つ}れ{出|だ}した","{締|し}め{出|だ}した","{取|と}り{払|はら}った","{追|お}い{払|はら}った"],"a":3,"exp":"追い払う(おいはらう)=쫓아내다(벌레·동물). 連れ出す=데리고 나가다, 締め出す=내쫓다(문을 닫아), 取り払う=치워 버리다.","sec":"moji","id":"2025a-019"},{"num":20,"part":"問題4 문맥 규정","q":"{社会|しゃかい}の{変化|へんか}に{合|あ}わせて、{働|はたら}き{方|かた}や{休日|きゅうじつ}の{過|す}ごし{方|かた}など{人々|ひとびと}が{選|えら}ぶ{生活|せいかつ}の（　）も{変|か}わってきた。","qko":"사회 변화에 맞춰 일하는 방식이나 휴일 보내는 법 등 사람들이 선택하는 생활 스타일도 변해 왔다.","opts":["ポーズ","スタイル","ブランド","シリーズ"],"a":1,"exp":"生活のスタイル(생활 스타일)=생활 양식. ポーズ=포즈, ブランド=브랜드, シリーズ=시리즈.","sec":"moji","id":"2025a-020"},{"num":21,"part":"問題5 유의 표현","q":"{昨夜|さくや}、{家|いえ}の{近|ちか}くで《妙な》{事件|じけん}が{起|お}こった。","qko":"어젯밤 집 근처에서 이상한 사건이 일어났다.","opts":["{恐|おそ}ろしい","{不思議|ふしぎ}な","{悲|かな}しい","{重大|じゅうだい}な"],"a":1,"exp":"妙(みょう)な=이상한·기묘한 ≒ 不思議な. 恐ろしい=무섭다, 悲しい=슬프다, 重大な=중대하다.","sec":"moji","id":"2025a-021"},{"num":22,"part":"問題5 유의 표현","q":"{鈴木|すずき}さんは《相当》{迷|まよ}っているらしい。","qko":"스즈키 씨는 꽤 망설이고 있는 모양이다.","opts":["いろいろ","まだ","やっぱり","かなり"],"a":3,"exp":"相当(そうとう)=꽤, 상당히 ≒ かなり. いろいろ=여러 가지로, まだ=아직, やっぱり=역시.","sec":"moji","id":"2025a-022"},{"num":23,"part":"問題5 유의 표현","q":"{教室|きょうしつ}が《やかましくて》、{勉強|べんきょう}に{集中|しゅうちゅう}できない。","qko":"교실이 시끄러워서 공부에 집중할 수 없다.","opts":["うるさくて","{汚|きたな}くて","{暑|あつ}くて","{暗|くら}くて"],"a":0,"exp":"やかましい=시끄럽다 ≒ うるさい. 汚い=더럽다, 暑い=덥다, 暗い=어둡다.","sec":"moji","id":"2025a-023"},{"num":24,"part":"問題5 유의 표현","q":"{中山|なかやま}さんは《帰省して》います。","qko":"나카야마 씨는 귀성(고향 방문) 중입니다.","opts":["{出張|しゅっちょう}から{戻|もど}って","{部屋|へや}に{戻|もど}って","ふるさとに{戻|もど}って","{休暇|きゅうか}から{戻|もど}って"],"a":2,"exp":"帰省(きせい)=고향에 돌아감 ≒ ふるさとに戻る. 出張=출장, 休暇=휴가.","sec":"moji","id":"2025a-024"},{"num":25,"part":"問題5 유의 표현","q":"{林|はやし}さんは、《いきなり》{振|ふ}り{向|む}いた。","qko":"하야시 씨는 갑자기 뒤를 돌아봤다.","opts":["やっと","{一|いち}{度|ど}","{突然|とつぜん}","ゆっくり"],"a":2,"exp":"いきなり=갑자기 ≒ 突然. やっと=겨우, 一度=한 번, ゆっくり=천천히.","sec":"moji","id":"2025a-025"},{"num":26,"part":"問題6 용법","q":"{潰|つぶ}す","qko":"으깨다·찌그러뜨리다 — 사용법이 가장 적절한 것은?","opts":["ガラスのコップを{落|お}として、{潰|つぶ}してしまった。","{空|あ}き{缶|かん}は、{潰|つぶ}してからごみ{箱|ばこ}に{入|い}れてください。","{洗濯|せんたく}{物|ぶつ}が{乾|かわ}いたので、きれいに{潰|つぶ}してたんすにしまった。","いらなくなった{書類|しょるい}をびりびりと{細|こま}かく{潰|つぶ}して{捨|す}てた。"],"a":1,"exp":"潰す=눌러서 찌그러뜨리다·으깨다. ② 빈 캔을 찌그러뜨려 버림 ✓. ① 유리컵은 割る(깨뜨리다), ③ 옷은 たたむ(개다), ④ 종이는 破る·細かく切る.","sec":"moji","id":"2025a-026"},{"num":27,"part":"問題6 용법","q":"{粗末|そまつ}","qko":"조잡함·소홀함 — 사용법이 가장 적절한 것은?","opts":["{昔|むかし}の{学校|がっこう}{給食|きゅうしょく}は、おかずの{種類|しゅるい}も{少|すく}なく、{今|いま}と{比|くら}べると{粗末|そまつ}なものだった。","{言葉遣|ことばづか}いが{粗末|そまつ}だったので、{友達|ともだち}を{怒|おこ}らせてしまった。","{風邪|かぜ}をひいてしまい、{声|こえ}が{粗末|そまつ}で{上手|じょうず}に{歌|うた}えない。","お{金|かね}がないので、{友人|ゆうじん}がくれた{古|ふる}くて{機能|きのう}の{粗末|そまつ}なパソコンを{使|つか}っている。"],"a":0,"exp":"粗末=조잡하다·변변치 못하다. ① 급식 반찬이 지금과 비교해 빈약했다 ✓. ② 말투는 乱暴·失礼, ③ 목소리는 かすれる, ④ 기능은 乏しい.","sec":"moji","id":"2025a-027"},{"num":28,"part":"問題6 용법","q":"{熱中|ねっちゅう}","qko":"열중 — 사용법이 가장 적절한 것은?","opts":["ごみ{処理|しょり}の{問題|もんだい}に{関|かん}して、{市民|しみん}から{担当|たんとう}{者|しゃ}に{批判|ひはん}が{熱中|ねっちゅう}した。","{学生|がくせい}のときは{野球|やきゅう}に{熱中|ねっちゅう}していて、{毎日|まいにち}{遅|おそ}くまで{練習|れんしゅう}していた。","うちの{娘|むすめ}はこの{服|ふく}に{熱中|ねっちゅう}していて、{毎日|まいにち}こればかり{着|き}たがります。","オリンピックの{期間|きかん}{中|ちゅう}、{世界|せかい}の{関心|かんしん}が{開催|かいさい}{地|ち}に{熱中|ねっちゅう}している。"],"a":1,"exp":"熱中=한 가지에 열중함. ② 야구에 열중 ✓. ① 비판은 集中·殺到, ③ 옷은 気に入る, ④ 관심은 集まる.","sec":"moji","id":"2025a-028"},{"num":29,"part":"問題6 용법","q":"{和|なご}やか","qko":"온화함·화기애애함 — 사용법이 가장 적절한 것은?","opts":["{火事|かじ}や{地震|じしん}のときは、{慌|あわ}てずに{和|なご}やかな{行動|こうどう}を{取|と}ることが{重要|じゅうよう}だ。","この{地方|ちほう}は、{一|いち}{年|ねん}{中|ちゅう}{気候|きこう}が{和|なご}やかで{暮|く}らしやすい。","この{店|みせ}のスープは、{和|なご}やかな{味|あじ}で{飲|の}むとほっとする。","{代表|だいひょう}{者|しゃ}{同士|どうし}の{話|はな}し{合|あ}いは、{和|なご}やかな{雰囲気|ふんいき}で{行|おこな}われた。"],"a":3,"exp":"和やか=분위기가 온화하고 화기애애함. ④ 화기애애한 분위기 ✓. ① 행동은 落ち着いた, ② 기후는 穏やか, ③ 맛은 やさしい.","sec":"moji","id":"2025a-029"},{"num":30,"part":"問題6 용법","q":"{愛着|あいちゃく}","qko":"애착 — 사용법이 가장 적절한 것은?","opts":["いろいろな{靴|くつ}をはいてみたが、どれも{愛着|あいちゃく}がなかったので{買|か}わなかった。","スーパーで、{地元|じもと}の{人|ひと}が{愛着|あいちゃく}を{入|い}れて{育|そだ}てた{野菜|やさい}を{買|か}った。","この{机|つくえ}はもう{使|つか}っていないのだが、{愛着|あいちゃく}があってなかなか{捨|す}てられない。","{弟|おとうと}は{教師|きょうし}になるという{夢|ゆめ}に{愛着|あいちゃく}を{持|も}ち、{教育|きょういく}{学|がく}{部|ぶ}に{進学|しんがく}した。"],"a":2,"exp":"愛着=정이 들어 애착이 감. ③ 오래 쓴 책상에 애착이 있어 버리지 못함 ✓. ②는 愛情を込めて, ④ 꿈에는 憧れ.","sec":"moji","id":"2025a-030"},{"num":31,"part":"問題7 문법 형식 판단","q":"{南|みなみ}{市|し}は、{市民|しみん}ホールを{建設|けんせつ}する（　）、{周辺|しゅうへん}の{住民|じゅうみん}に{対|たい}して{説明|せつめい}{会|かい}を{行|おこな}う{予定|よてい}だ。","qko":"남시는 시민회관을 건설함에 즈음하여 주변 주민을 대상으로 설명회를 열 예정이다.","opts":["とすると","にあたって","ものなら","わりには"],"a":1,"exp":"Vる + にあたって = '~함에 즈음하여'(격식). 의식을 가지고 임하는 시점. とすると=~라고 하면(가정), ものなら=~(할 수 있다면) 강한 가정, わりには=~에 비해서는.","sec":"bunpou","id":"2025a-031"},{"num":32,"part":"問題7 문법 형식 판단","q":"{彼女|かのじょ}は、まだ{小学|しょうがく}{生|せい}（　）、すでに{数々|かずかず}の{国際|こくさい}{的|てき}なピアノコンクールで{優勝|ゆうしょう}している。","qko":"그녀는 아직 초등학생임에도 불구하고 이미 여러 국제 피아노 콩쿠르에서 우승했다.","opts":["こそ","すら","ながらも","どころか"],"a":2,"exp":"명사 + ながらも = '~이면서도'(역접, 격식). 「小学生ながらも」= 초등학생이면서도. こそ=강조, すら=~조차, どころか=~은커녕.","sec":"bunpou","id":"2025a-032"},{"num":33,"part":"問題7 문법 형식 판단","q":"{仕事|しごと}ができると{言|い}われる{人|ひと}は、そうでない{人|ひと}と{比|くら}べて（　）{何|なに}が{違|ちが}うのだろうか。","qko":"일을 잘한다고 하는 사람은 그렇지 않은 사람과 비교해 도대체 무엇이 다른 걸까.","opts":["いったい","おそらく","かえって","どうしても"],"a":0,"exp":"いったい(一体)=도대체(의문을 강조). 「いったい何が違うのだろうか」가 정형. おそらく=아마, かえって=오히려, どうしても=아무리 해도.","sec":"bunpou","id":"2025a-033"},{"num":34,"part":"問題7 문법 형식 판단","q":"（{旅館|りょかん}で）{旅館|りょかん}の{人|ひと}「いらっしゃいませ。{本日|ほんじつ}は{森川|もりかわ}{旅館|りょかん}に（　）、ありがとうございます。」","qko":"(여관에서) 여관 직원 \"어서 오십시오. 오늘 모리카와 여관을 찾아 주셔서 감사합니다.\"","opts":["{伺|うかが}いまして","お{越|こ}しになり","{参|まい}りまして","おいでくださり"],"a":3,"exp":"손님이 와 준 것에 감사하는 표현은 「おいでくださり(오셔서)」. 「〜てくださる」의 높임 + 감사. 伺う·参る는 자기 행동의 겸양어라 손님에게 쓸 수 없음.","sec":"bunpou","id":"2025a-034"},{"num":35,"part":"問題7 문법 형식 판단","q":"{父|ちち}は、{健康|けんこう}のことを{考|かんが}えてなるべく（　）、{会社|かいしゃ}から{家|いえ}まで1{時間|じかん}かけて{歩|ある}いて{帰|かえ}ってくることもある。","qko":"아버지는 건강을 생각해서 되도록 걷도록 하고 있는 모양으로, 회사에서 집까지 1시간 걸어서 돌아오기도 한다.","opts":["{歩|ある}こうとしそうで","{歩|ある}こうとすることで","{歩|ある}くようにしているらしく","{歩|ある}くようにしていたら"],"a":2,"exp":"「〜ようにしているらしく」= (~하도록 하고 있는) 모양이다. 문장 끝 「〜こともある」와 자연스럽게 연결. 歩こうとする는 '걸으려고 하다'로 뜻이 어긋남.","sec":"bunpou","id":"2025a-035"},{"num":36,"part":"問題7 문법 형식 판단","q":"{図書|としょ}{館|かん}で{本|ほん}を{借|か}りたのだが、{最後|さいご}まで（　）、{返却|へんきゃく}{期限|きげん}が{来|き}そうだ。","qko":"도서관에서 책을 빌렸는데, 끝까지 다 읽기 전에 반납 기한이 올 것 같다.","opts":["{読|よ}み{終|お}わるより","{読|よ}み{終|お}わらないうちに","{読|よ}んでしまうまで","{読|よ}んでしまわなければ"],"a":1,"exp":"「Vないうちに」= ~하기 전에. 「読み終わらないうちに返却期限が来る」= 다 읽기 전에 기한이 온다. より=비교, まで=~까지.","sec":"bunpou","id":"2025a-036"},{"num":37,"part":"問題7 문법 형식 판단","q":"{最近|さいきん}{成績|せいせき}が{伸|の}びないので、このままの{勉強|べんきょう}{方法|ほうほう}（　）、{先生|せんせい}に{相談|そうだん}してみた。","qko":"최근 성적이 오르지 않아서 이대로의 공부 방법으로 좋은 건지 어떤지 선생님께 상담해 봤다.","opts":["でいいことを","ならいいことを","でいいのかどうか","ならいいのかどうか"],"a":2,"exp":"「〜でいいのかどうか」= ~로 좋은지 어떤지(의문). 「このままの勉強方法でいいのかどうか相談する」가 정형. ことを는 '~을'이라 상담 내용과 호응하지 않음.","sec":"bunpou","id":"2025a-037"},{"num":38,"part":"問題7 문법 형식 판단","q":"{環境|かんきょう}{問題|もんだい}への{意識|いしき}が{世界|せかい}{的|てき}に{高|たか}まってきており、メーカー{間|かん}の{電気|でんき}{自動|じどう}{車|しゃ}の{開発|かいはつ}{競争|きょうそう}は{激|はげ}しくなる（　）。","qko":"환경 문제에 대한 의식이 세계적으로 높아지고 있어, 제조사 간 전기차 개발 경쟁은 치열해지기만 한다.","opts":["{一方|いっぽう}だ","{次第|しだい}だ","ほどだ","べきだ"],"a":0,"exp":"Vる + 一方だ = '~하기만 한다'(한 방향으로 계속 변화). 激しくなる一方だ. 次第だ=~나름이다, ほどだ=~정도다, べきだ=~해야 한다.","sec":"bunpou","id":"2025a-038"},{"num":39,"part":"問題7 문법 형식 판단","q":"{週末|しゅうまつ}、{山|やま}に{登|のぼ}った。とても{暑|あつ}い{日|ひ}だったが、{頂上|ちょうじょう}の{近|ちか}くは{気候|きこう}が{低|ひく}くて{寒|さむ}い（　）。","qko":"주말에 산에 올랐다. 매우 더운 날이었지만 정상 근처는 기온이 낮아 추울 정도였다.","opts":["とよかった","に{違|ちが}いなかった","かのようだった","くらいだった"],"a":3,"exp":"「〜くらいだった」= ~할 정도였다(정도의 예시). 「寒いくらいだった」= 추울 정도였다. かのようだ=마치 ~인 것처럼(비유)로는 문맥이 어색.","sec":"bunpou","id":"2025a-039"},{"num":40,"part":"問題7 문법 형식 판단","q":"{満員|まんいん}{電車|でんしゃ}に{乗|の}るのは{嫌|いや}だが、ほかに{手段|しゅだん}がないので（　）。","qko":"만원 전철을 타는 것은 싫지만 다른 수단이 없어서 타지 않을 수는 없다.","opts":["{乗|の}るものではない","{乗|の}りようがない","{乗|の}らないわけにはいかない","{乗|の}らなくてもかまわない"],"a":2,"exp":"「Vないわけにはいかない」= ~하지 않을 수 없다(사회적·상황적 제약). 乗りようがない=탈 방법이 없다(수단 부재), ものではない=~해서는 안 된다.","sec":"bunpou","id":"2025a-040"},{"num":41,"part":"問題7 문법 형식 판단","q":"（テレビ{番組|ばんぐみ}で）{司会|しかい}「{薬|くすり}はどうして{水|みず}{以外|いがい}の{飲|の}み{物|もの}で{飲|の}んではいけないんでしょうか。」{医者|いしゃ}「それは、お{茶|ちゃ}やジュースで{飲|の}むと{薬|くすり}の{効|き}きめに{影響|えいきょう}が{出|で}る（　）。」","qko":"(TV 프로그램에서) 진행자 \"약은 왜 물 이외의 음료로 먹으면 안 되는 겁니까?\" 의사 \"그것은 녹차나 주스로 먹으면 약의 효능에 영향이 나오는 경우가 있기 때문입니다.\"","opts":["ことがあるためです","ことにするためです","ことがあるはずです","ことにするはずです"],"a":0,"exp":"이유를 묻는 질문에 「〜ことがあるためです」= ~하는 수가 있기 때문입니다. ことにする=~하기로 하다(의지)라 이유 설명이 안 됨.","sec":"bunpou","id":"2025a-041"},{"num":42,"part":"問題7 문법 형식 판단","q":"{私|わたし}は{猫|ねこ}アレルギーで、{猫|ねこ}に{触|さわ}ると{体|からだ}がかゆくなってしまうのだが、{猫|ねこ}は{好|す}きなので、{見|み}るとつい（　）。","qko":"나는 고양이 알레르기가 있어서 고양이를 만지면 몸이 가려워지는데, 고양이를 좋아해서 보면 나도 모르게 만져 보고 싶어져 버린다.","opts":["{触|さわ}ってみたがっている","{触|さわ}ってみたくなってしまう","{触|さわ}ってみてほしがっている","{触|さわ}ってみてほしくなってしまう"],"a":1,"exp":"「Vてみたくなる」= ~해 보고 싶어진다. つい〜てしまう = 저도 모르게 ~해 버린다. 주어가 '나'이므로 ほしがる(남이 원하다)·たがる는 맞지 않음.","sec":"bunpou","id":"2025a-042"},{"num":43,"part":"問題8 문장 배열 ★","q":"このパン{屋|や}では、{原料|げんりょう}の ___ ___ ★ ___ {一|ひと}つ{一|ひと}つ{丁寧|ていねい}にパンを{作|つく}っているそうだ。","qko":"이 빵집에서는 원료인 밀가루는 물론 물에까지 고집해서 하나하나 정성껏 빵을 만들고 있다고 한다.","opts":["こだわって","{小麦|こむぎ}{粉|こな}は","{水|みず}にまで","もちろん"],"a":2,"star":"水にまで","full":"このパン{屋|や}では、{原料|げんりょう}の{小麦|こむぎ}{粉|こな}はもちろん、{水|みず}にまでこだわって{一|ひと}つ{一|ひと}つ{丁寧|ていねい}にパンを{作|つく}っているそうだ。","exp":"小麦粉は → もちろん → 水にまで → こだわって. 「AはもちろんBにまでこだわる」= A는 물론 B에까지 고집하다.","sec":"bunpou","id":"2025a-043"},{"num":44,"part":"問題8 문장 배열 ★","q":"{昨日|きのう}は、{梅雨|つゆ}の ___ ___ ★ ___ 、{久|ひさ}しぶりに{洗濯|せんたく}{物|ぶつ}を{外|そと}に{干|ほ}すことができた。","qko":"어제는 장마철치고는 이렇게 드물게 날씨가 좋아서, 오랜만에 빨래를 밖에 널 수 있었다.","opts":["いい{天気|てんき}で","{時期|じき}にしては","この","{珍|めずら}しく"],"a":3,"star":"珍しく","full":"{昨日|きのう}は、{梅雨|つゆ}の{時期|じき}にしてはこの{珍|めずら}しくいい{天気|てんき}で、{久|ひさ}しぶりに{洗濯|せんたく}{物|ぶつ}を{外|そと}に{干|ほ}すことができた。","exp":"時期にしては → この → 珍しく → いい天気で. 「〜にしては」= ~치고는, 「珍しく」= 드물게.","sec":"bunpou","id":"2025a-044"},{"num":45,"part":"問題8 문장 배열 ★","q":"{今回|こんかい}のセミナーの{開催|かいさい}{日|ひ}が{人|ひと}の ___ ___ ★ ___ {参加|さんか}{者|しゃ}が{集|あつ}まったのは{大|だい}{成功|せいこう}といえる。","qko":"이번 세미나 개최일이 사람이 모이기 어려운 평일이었다는 점을 생각하면 200명이나 참가자가 모인 것은 대성공이라 할 수 있다.","opts":["{集|あつ}まりにくい","ことを{考|かんが}えると","{平日|へいじつ}だった","200{名|めい}もの"],"a":1,"star":"ことを考えると","full":"{今回|こんかい}のセミナーの{開催|かいさい}{日|ひ}が{人|ひと}の{集|あつ}まりにくい{平日|へいじつ}だったことを{考|かんが}えると、200{名|めい}もの{参加|さんか}{者|しゃ}が{集|あつ}まったのは{大|だい}{成功|せいこう}といえる。","exp":"集まりにくい → 平日だった → ことを考えると → 200名もの. 「〜ことを考えると」= ~인 점을 생각하면.","sec":"bunpou","id":"2025a-045"},{"num":46,"part":"問題8 문장 배열 ★","q":"{人|ひと}には ___ ___ ★ ___ {気|き}づくのは{難|むずか}しい。","qko":"사람에게는 누구나 그 사람만의 장점이 있다고 하지만, 스스로 그것을 깨닫기는 어렵다.","opts":["{良|よ}さがあるというが","{誰|だれ}にでも","その{人|ひと}にしかない","{自分|じぶん}でそれに"],"a":0,"star":"良さがあるというが","full":"{人|ひと}には{誰|だれ}にでもその{人|ひと}にしかない{良|よ}さがあるというが、{自分|じぶん}でそれに{気|き}づくのは{難|むずか}しい。","exp":"誰にでも → その人にしかない → 良さがあるというが → 自分でそれに. 「その人にしかない良さ」가 한 덩어리.","sec":"bunpou","id":"2025a-046"},{"num":47,"part":"問題8 문장 배열 ★","q":"{昨日|きのう}の{晩|ばん}、{目覚|めざ}まし{時計|とけい}をセットするのを{忘|わす}れてしまい、{今朝|けさ}は{寝坊|ねぼう}してしまった。それでも ___ ___ ★ ___ からだ。","qko":"어젯밤 알람시계를 맞추는 것을 잊어버려 오늘 아침 늦잠을 잤다. 그래도 지각하지 않고 끝난 것은 우연히 걸려온 전화에 깨어났기 때문이다.","opts":["のは","たまたまかかってきた","{電話|でんわ}に{起|お}こされた","{遅刻|ちこく}をせずに{済|す}んだ"],"a":1,"star":"たまたまかかってきた","full":"それでも{遅刻|ちこく}をせずに{済|す}んだのは、たまたまかかってきた{電話|でんわ}に{起|お}こされたからだ。","exp":"遅刻をせずに済んだ → のは → たまたまかかってきた → 電話に起こされた + からだ. 「〜のは…からだ」강조 구문.","sec":"bunpou","id":"2025a-047"},{"num":48,"part":"問題9 글의 문법","q":"{車|くるま}の{運転|うんてん}が{困難|こんなん}な{人|ひと}や、{最寄|もよ}りのバス{停|てい}や{駅|えき}まで{歩|ある}くことが{負担|ふたん}になる{人|ひと}に（　）。","qko":"운전이 어려운 사람이나 가장 가까운 버스 정류장·역까지 걷는 것이 부담인 사람에게 (이용되고 있다).","opts":["{利用|りよう}させてほしい","{利用|りよう}されている","{利用|りよう}してくれている","{利用|りよう}してもいい"],"a":1,"exp":"주어가 '서비스'이므로 수동 利用されている = (사람들에게) 이용되고 있다. 利用させてほしい=이용하게 해 달라, 利用してくれている=이용해 주고 있다(주어가 사람).","passage":"t2025_p9","sec":"bunpou","id":"2025a-048"},{"num":49,"part":"問題9 글의 문법","q":"{用事|ようじ}がないから{外出|がいしゅつ}しないという{高齢|こうれい}{者|しゃ}は（　）。","qko":"볼일이 없어서 외출하지 않는다는 고령자는 적지 않다고 한다.","opts":["{少|すく}なかったはずだ","{少|すく}なくなったのだ","{少|すく}なくないという","{少|すく}なくなりかねない"],"a":2,"exp":"뒤에 「そのため、〜の目的や場所を提供している」가 이어지므로 '적지 않다'가 자연스럽다 → 少なくないという. 少なくなりかねない=줄어들 수 있다(부정적 추측)로 문맥이 반대.","passage":"t2025_p9","sec":"bunpou","id":"2025a-049"},{"num":50,"part":"問題9 글의 문법","q":"{外出|がいしゅつ}{回数|かいすう}は、{高齢|こうれい}{者|しゃ}の{体|からだ}と{心|こころ}の{健康|けんこう}に{大|おお}きく{影響|えいきょう}する。（　）{調査|ちょうさ}では、{歩行|ほこう}に{障害|しょうがい}が{出|で}た{人|ひと}の{数|かず}は、{外出|がいしゅつ}{回数|かいすう}が{1日|ついたち}1{回|かい}{以上|いじょう}の{人|ひと}より{3日|みっか}に1{回|かい}{未満|みまん}の{人|ひと}のほうが{約|やく}4{倍|ばい}も{多|おお}かった。","qko":"외출 횟수는 고령자의 몸과 마음의 건강에 크게 영향을 준다. 어떤 조사에서는 보행 장애가 생긴 사람의 수가 1일 1회 이상인 사람보다 3일에 1회 미만인 사람이 약 4배나 많았다.","opts":["このような","その","{次|つぎ}の","ある"],"a":3,"exp":"「ある調査では」= '어떤 조사에서는'. 처음 언급하는 불특정 조사에는 ある. このような·その·次の는 앞뒤 지시 대상이 있어야 함.","passage":"t2025_p9","sec":"bunpou","id":"2025a-050"},{"num":51,"part":"問題9 글의 문법","q":"{高齢|こうれい}{化|か}が{進|すす}む{日本|にほん}（　）、{外出|がいしゅつ}{支援|しえん}サービスは{重要|じゅうよう}な{役割|やくわり}を{果|は}たしているのだ。","qko":"고령화가 진행되는 일본에서, 외출 지원 서비스는 중요한 역할을 하고 있다.","opts":["において","に{限|かぎ}らず","を{中心|ちゅうしん}に","をはじめ"],"a":0,"exp":"명사 + において = '~에 있어서/~에서'(장소·상황). 日本において가 정형. に限らず=~에 한하지 않고, を中心に=~을 중심으로, をはじめ=~을 비롯해.","passage":"t2025_p9","sec":"bunpou","id":"2025a-051"},{"num":52,"part":"問題10 단문","q":"{筆者|ひっしゃ}の{考|かんが}えに{合|あ}うのはどれか。","qko":"필자의 생각과 맞는 것은?","opts":["{自分|じぶん}がどういう{人間|にんげん}かは、{他者|たしゃ}とのかかわりがなければわからない。","{相手|あいて}がどういう{人間|にんげん}かは、{自分|じぶん}との{好|この}みの{違|ちが}いを{知|し}ればわかる。","{他者|たしゃ}からの{評価|ひょうか}がなければ、{自分|じぶん}がどういう{人間|にんげん}かわからない。","{他者|たしゃ}との{付|つ}き{合|あ}いを{通|とお}して、{自分|じぶん}への{評価|ひょうか}がわかる。"],"a":0,"exp":"「他人と自分の違いを通して初めて、自分というものがどういうものかがわかる」→ ①. ③은 글에서 명시적으로 부정한 내용(「他人の評価によって自分が決まる」ということではなく).","passage":"r2025_10_1","sec":"dokkai","id":"2025a-052"},{"num":53,"part":"問題10 단문","q":"このメールで{問|と}い{合|あ}わせていることは{何|なに}か。","qko":"이 메일에서 문의하고 있는 것은 무엇인가?","opts":["{来月|らいげつ}から「{水石|すいせき}りんごジャム」をホテルの{朝食|ちょうしょく}で{提供|ていきょう}できるか。","{来月|らいげつ}から{販売|はんばい}{予定|よてい}の「{水石|すいせき}りんごジャム」は、{名産|めいさん}のりんごを{使|つか}っているか。","{来月|らいげつ}までに{名産|めいさん}のりんごを{使|つか}った{新|あたら}しい{土産品|みやげひん}が{作|つく}れるか。","{売店|ばいてん}で{販売|はんばい}するための「{水石|すいせき}りんごジャム」を、{来月|らいげつ}から{納品|のうひん}できるか。"],"a":3,"exp":"「このジャムを売店でも販売したい……同じ時期に販売を開始したい……ご対応いただけるでしょうか」→ 매장 판매용 잼을 다음 달부터 납품(대응) 가능한지 → ④. ①은 이미 결정된 사항, ②③은 묻고 있지 않음.","passage":"r2025_10_2","sec":"dokkai","id":"2025a-053"},{"num":54,"part":"問題10 단문","q":"ラジオについて、{筆者|ひっしゃ}はどのように{考|かんが}えているか。","qko":"라디오에 대해 필자는 어떻게 생각하는가?","opts":["{他|ほか}のことをしながら{聴|き}け、{時間|じかん}が{有効|ゆうこう}に{使|つか}える。","いい{音楽|おんがく}や{話|はなし}が{聴|き}け、{自由|じゆう}が{感|かん}じられる。","{音|おん}{以外|いがい}の{情報|じょうほう}がなく、{自由|じゆう}に{空想|くうそう}が{広|ひろ}がりやすい。","{目|め}からの{情報|じょうほう}がなく、{小説|しょうせつ}より{自由|じゆう}に{空想|くうそう}ができる。"],"a":2,"exp":"「音しかそこには存在しない」「情報が少ないほど自由度が高い」→ 소리 외 정보가 없어 공상이 퍼지기 쉽다 → ③. ①은 시간 활용, ④는 '소설보다'라는 비교가 글에 없음(소설은 비유일 뿐).","passage":"r2025_10_3","sec":"dokkai","id":"2025a-054"},{"num":55,"part":"問題10 단문","q":"ガスの{使用|しよう}{量|りょう}と{料金|りょうきん}の{通知|つうち}について、このお{知|し}らせで{伝|つた}えたかったことは{何|なに}か。","qko":"가스 사용량·요금 통지에 관해 이 안내에서 전하고 싶었던 것은?","opts":["{7月|しちがつ}{中|なか}にウェブ{会員|かいいん}サービスの{申|もう}し{込|こ}みを{始|はじ}めるので、{登録|とうろく}してほしい。","{8月|はちがつ}{末|すえ}で{使用|しよう}{量|りょう}と{料金|りょうきん}の{通知|つうち}を{終了|しゅうりょう}するので、{知|し}りたい{場合|ばあい}は{連絡|れんらく}してほしい。","{9月|くがつ}から{新|あたら}しい{形式|けいしき}の{通知|つうち}{書|しょ}を{郵送|ゆうそう}するので、{手数|てすう}{料|りょう}を{負担|ふたん}してほしい。","{9月|くがつ}から{紙|かみ}の{通知|つうち}{書|しょ}を{有料|ゆうりょう}にするので、{無料|むりょう}で{確認|かくにん}したい{場合|ばあい}はウェブで{確認|かくにん}してほしい。"],"a":3,"exp":

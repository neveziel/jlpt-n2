"ko":"지난달 교외로 이사하셨다면서요. 통근은 힘들지 않으세요?"},{"s":"男","t":"{電車|でんしゃ}が{混|こ}むのは{確|たし}かに{大変|たいへん}です。ただ、{家|いえ}が{広|ひろ}くなったので、{子|こ}どもものびのびしています。","ko":"전철이 붐비는 건 확실히 힘듭니다. 다만 집이 넓어져서 아이도 마음 편히 지내고 있어요."},{"s":"女","t":"{家賃|やちん}も{安|やす}くなったと{聞|き}きましたが。","ko":"월세도 싸졌다고 들었는데요."},{"s":"男","t":"ええ。でも、{安|やす}さが{決|き}め{手|て}だったわけではありません。{必|かなら}ずしも{家賃|やちん}が{安|やす}いところがいいとは{限|かぎ}らないですからね。{私|わたし}の{場合|ばあい}、いちばん{大|おお}きかったのは、{妻|つま}の{実家|じっか}が{近|ちか}いことなんです。{子|こ}どもを{預|あず}けられるので。","ko":"네. 하지만 싼 것이 결정적이었던 건 아닙니다. 반드시 월세가 싼 곳이 좋다고만은 할 수 없으니까요. 제 경우 가장 컸던 것은 아내의 친정이 가깝다는 점입니다. 아이를 맡길 수 있어서요."},{"s":"女","t":"なるほど。ご{家族|かぞく}のことを{優先|ゆうせん}されたんですね。","ko":"그렇군요. 가족을 우선하신 거네요."},{"s":"男","t":"はい、そういうことです。","ko":"네, 그렇습니다."}],"exp":"월세의 ‘싼 점’은 「決め手だったわけではありません」「必ずしも家賃が安いところがいいとは限らない」로 부정 → 1번. 통근은 오히려 「混むのは大変」이라 반대 → 2번. 집이 넓어진 것도 좋았지만, 「いちばん大きかったのは」 뒤에 온 것이 ‘아내 친정이 가까운 것’ → 3번. 4번은 실제로 좋았다고 한 내용이라 헷갈리기 쉬운 함정입니다.","key":"부분 부정(わけではない・必ずしも〜とは限らない) + いちばん大きかったのは"},{"id":14,"type":"포인트 이해","title":"補習の日程","intro":"{塾|じゅく}で、{女|おんな}の{学生|がくせい}が{先生|せんせい}と{話|はな}しています。","question":"{女|おんな}の{人|ひと}はいつ{補習|ほしゅう}に{出|で}ますか。","opts":["{月曜|げつよう}{日|び}の{五|ご}{時|じ}から","{水曜|すいよう}{日|び}の{五|ご}{時|じ}から","{木曜|もくよう}{日|び}の{四|よ}{時|じ}から","{木曜|もくよう}{日|び}の{五|ご}{時|じ}から"],"a":0,"script":[{"s":"女","t":"{先生|せんせい}、{来週|らいしゅう}の{補習|ほしゅう}なんですけど、{水曜|すいよう}でしたよね。","ko":"선생님, 다음 주 보충수업인데 수요일이었죠?"},{"s":"男","t":"いえ、{来週|らいしゅう}は{月曜|げつよう}と{木曜|もくよう}です。{水曜|すいよう}は{祝日|しゅくじつ}で{休|やす}みですから。","ko":"아니요, 다음 주는 월요일과 목요일입니다. 수요일은 공휴일이라 쉬니까요."},{"s":"女","t":"あ、そうでした。{両方|りょうほう}{出|で}ないといけませんか。","ko":"아, 그랬었죠. 둘 다 나가야 하나요?"},{"s":"男","t":"どちらか{一方|いっぽう}でいいですよ。{同|おな}じ{内容|ないよう}を{二|に}{回|かい}やりますから。","ko":"둘 중 하나만 하면 됩니다. 같은 내용을 두 번 하니까요."},{"s":"女","t":"じゃあ、{私|わたし}は{月曜|げつよう}にします。{部活|ぶかつ}が{木曜|もくよう}まであるので。","ko":"그럼 저는 월요일로 할게요. 동아리가 목요일까지 있어서요."},{"s":"男","t":"わかりました。あ、{時間|じかん}は{五|ご}{時|じ}から{七|しち}{時|じ}までです。{前|まえ}は{四|よ}{時|じ}からでしたが、{今週|こんしゅう}から{変|か}わりました。","ko":"알겠습니다. 아, 시간은 5시부터 7시까지입니다. 전에는 4시부터였는데 이번 주부터 바뀌었습니다."},{"s":"女","t":"{五|ご}{時|じ}からですね。わかりました。","ko":"5시부터군요. 알겠습니다."}],"exp":"수요일은 「祝日で休み」 → 2번 오답. 두 번 모두 나갈 필요 없이 「どちらか一方」이고, 목요일은 「部活が木曜まである」로 불가 → 3·4번 오답. 시간도 「前は四時からでしたが、今週から変わりました」= 5시로 바뀌었으므로 4시(3번)는 옛 정보. 남는 것은 월요일 5시 → 1번.","key":"요일 정정 + 택일(どちらか一方) + 시간 변경(今週から)"},{"id":15,"type":"개요 이해","title":"朝の散歩","intro":"ラジオで、{女|おんな}の{人|ひと}が{話|はな}しています。","question":"{話|はな}し{手|て}が{最|もっと}も{言|い}いたいことは{何|なん}ですか。","opts":["{毎日|まいにち}{一|いち}{時間|じかん}は{歩|ある}くべきだ。","{目標|もくひょう}は{小|ちい}さく{決|き}めて、{続|つづ}けることが{大切|たいせつ}だ。","{意志|いし}が{弱|よわ}い{人|ひと}は{散歩|さんぽ}に{向|む}いていない。","{遠|とお}くまで{歩|ある}くほど{効果|こうか}が{高|たか}い。"],"a":1,"script":[{"s":"女","t":"「{朝|あさ}の{散歩|さんぽ}を{始|はじ}めました」という{話|はなし}をよく{聞|き}きます。でも、{多|おお}くの{人|ひと}はなかなか{続|つづ}かないそうです。{続|つづ}かない{理由|りゆう}は、{意志|いし}が{弱|よわ}いからではありません。{目標|もくひょう}を「{毎日|まいにち}{一|いち}{時間|じかん}」のように{大|おお}きく{決|き}めてしまうからです。{私|わたし}は、{最初|さいしょ}から「{玄関|げんかん}を{出|で}て、{駅|えき}まで{歩|ある}く」だけにしました。{歩|ある}いて{五|ご}{分|ふん}もかからない{距離|きょり}です。{物|もの}{足|た}りないと{思|おも}うかもしれませんが、{毎日|まいにち}{続|つづ}けられれば、それはもう{運動|うんどう}です。{散歩|さんぽ}は、{続|つづ}けること{自体|じたい}が{目的|もくてき}です。{遠|とお}くまで{行|い}こうとしなくていいんです。","ko":"‘아침 산책을 시작했습니다’라는 이야기를 자주 듣습니다. 그런데 많은 사람이 좀처럼 계속하지 못한다고 합니다. 못 가는 이유는 의지가 약해서가 아닙니다. 목표를 ‘매일 한 시간’처럼 크게 정해 버리기 때문입니다. 저는 처음부터 ‘현관을 나서서 역까지 걷기’만 하기로 했습니다. 걸어서 5분도 안 걸리는 거리입니다. 부족하다고 생각할지 모르지만, 매일 계속할 수 있다면 그것도 이미 운동입니다. 산책은 계속하는 것 자체가 목적입니다. 멀리까지 가려고 하지 않아도 됩니다."}],"exp":"1번은 「毎日一時間」처럼 크게 정하는 것을 문제로 지적해 부정, 4번은 「遠くまで行こうとしなくていい」로 부정, 3번은 「意志が弱いからではありません」로 부정됩니다. 결론은 「続けること自体が目的」 → 작게 정하고 계속하라는 2번.","key":"부정된 선지 걸러내기(〜からではありません・〜しなくていい)"},{"id":16,"type":"개요 이해","title":"ノートの取り方","intro":"{大学|だいがく}の{講義|こうぎ}で、{男|おとこ}の{先生|せんせい}が{話|はな}しています。","question":"{先生|せんせい}が{最|もっと}も{言|い}いたいことは{何|なん}ですか。","opts":["パソコンでノートを{取|と}るのはやめるべきだ。","{手|て}で{書|か}くほうが{速|はや}く{書|か}ける。","{何|なに}を{残|のこ}すかを{考|かんが}えながら{聞|き}くことが{大切|たいせつ}だ。","ノートはあとで{必|かなら}ず{読|よ}み{返|かえ}すべきだ。"],"a":2,"script":[{"s":"男","t":"{最近|さいきん}は、パソコンでノートを{取|と}る{学生|がくせい}が{増|ふ}えました。{速|はや}く{書|か}けるし、あとで{探|さが}すのも{便利|べんり}です。{私|わたし}も{否定|ひてい}はしません。ただ、{私|わたし}の{講義|こうぎ}では、{手|て}で{書|か}くことを{勧|すす}めています。{手|て}で{書|か}くと、{速|はや}く{書|か}けないぶん、{聞|き}いた{話|はなし}を{短|みじか}くまとめようとします。その「まとめる」という{作業|さぎょう}が、{理解|りかい}につながるからです。パソコンが{悪|わる}いのではありません。{全部|ぜんぶ}をそのまま{写|うつ}すだけでは、あとで{読|よ}み{返|かえ}しても{頭|あたま}に{入|はい}っていないことが{多|おお}いんです。{大切|たいせつ}なのは、{書|か}く{道具|どうぐ}より、{何|なに}を{残|のこ}すかを{決|き}めて{聞|き}くことです。","ko":"요즘은 노트북으로 필기하는 학생이 늘었습니다. 빨리 쓸 수 있고 나중에 찾기도 편합니다. 저도 부정하지는 않습니다. 다만 제 수업에서는 손으로 쓰기를 권합니다. 손으로 쓰면 빨리 쓸 수 없는 만큼 들은 이야기를 짧게 정리하려고 합니다. 그 ‘정리하는’ 작업이 이해로 이어지기 때문입니다. 노트북이 나쁜 것은 아닙니다. 전부 그대로 옮겨 적기만 하면 나중에 다시 읽어도 머리에 남지 않은 경우가 많습니다. 중요한 것은 쓰는 도구보다, 무엇을 남길지 정하고 듣는 것입니다."}],"exp":"1번은 「パソコンが悪いのではありません」「否定はしません」로 부정, 2번은 사실 반대(빨리 쓰는 것은 노트북), 4번은 세부이며 「読み返しても頭に入っていないことが多い」와 어긋납니다. 마지막 문장 「書く道具より、何を残すかを決めて聞くこと」가 주장 → 3번.","key":"도구 논쟁으로 흘리지 않고 마지막 결론 문장 잡기"},{"id":17,"type":"개요 이해","title":"町の清掃活動","intro":"{町|まち}の{集|あつ}まりで、{男|おとこ}の{人|ひと}が{話|はな}しています。","question":"{男|おとこ}の{人|ひと}が{最|もっと}も{言|い}いたいことは{何|なん}ですか。","opts":["{宣伝|せんでん}をもっと{増|ふ}やすべきだ。","{参加|さんか}{者|しゃ}が{減|へ}ったのは{役員|やくいん}の{責任|せきにん}だ。","{当日|とうじつ}の{役割|やくわり}をはっきり{伝|つた}えるべきだ。","{清掃|せいそう}{活動|かつどう}は{初|はじ}めての{人|ひと}には{難|むずか}しい。"],"a":2,"script":[{"s":"男","t":"{今年|ことし}、{町|まち}の{清掃|せいそう}{活動|かつどう}に{参加|さんか}した{人|ひと}は、{去年|きょねん}より{三十|さんじゅう}{人|にん}{少|すく}なかったそうです。{役員|やくいん}からは「もっと{宣伝|せんでん}を」という{声|こえ}が{出|で}ています。もちろん、{宣伝|せんでん}も{必要|ひつよう}でしょう。ただ、{私|わたし}は、{人|ひと}が{減|へ}ったのは{宣伝|せんでん}{不足|ふそく}のせいだけではないと{思|おも}っています。{人|ひと}は、{自分|じぶん}の{役割|やくわり}がわからないと、なかなか{動|うご}けません。「{何時|なんじ}から、どこで、{何|なに}をする」がはっきりしていれば、{初|はじ}めての{人|ひと}でも{来|き}やすいはずです。ですから、{私|わたし}は、チラシを{増|ふ}やすより{先|さき}に、{当日|とうじつ}の{役割|やくわり}をはっきり{書|か}いて{知|し}らせるべきだと{考|かんが}えています。","ko":"올해 마을 청소 활동에 참가한 사람이 작년보다 서른 명 적었다고 합니다. 임원들 사이에서는 ‘홍보를 더 하자’는 목소리가 나오고 있습니다. 물론 홍보도 필요하겠지요. 다만 저는 사람이 줄어든 것이 홍보 부족 때문만은 아니라고 생각합니다. 사람은 자기 역할을 모르면 좀처럼 움직이지 못합니다. ‘몇 시부터, 어디서, 무엇을 하는지’가 분명하면 처음 오는 사람도 오기 쉬울 것입니다. 그래서 저는 전단지를 늘리기보다 먼저, 당일의 역할을 분명히 적어서 알려야 한다고 생각합니다."}],"exp":"1번은 「もちろん、宣伝も必要でしょう。ただ…」로 양보한 뒤 반전되어 핵심이 아니고, 2번은 언급이 없으며, 4번은 「初めての人でも来やすい」와 정반대입니다. 결론 「チラシを増やすより先に、当日の役割をはっきり書いて知らせるべき」 → 3번.","key":"양보(もちろん〜でしょう。ただ…) 뒤에 오는 주장"},{"id":18,"type":"즉시 응답","title":"ケーキのしまい方","intro":"{職場|しょくば}の{休憩|きゅうけい}{室|しつ}で、{女|おんな}の{人|ひと}が{男|おとこ}の{人|ひと}に{言|い}います。（선지는 연습용으로 표시했습니다. 실제 시험에서는 음성만 나옵니다.）","question":"{何|なん}と{答|こた}えますか。","opts":["うん、まだ{食|た}べてないよ。","あ、それは{明日|あした}{食|た}べるから、{入|い}れといて。","いいえ、{冷蔵|れいぞう}{庫|こ}はそこです。"],"a":1,"script":[{"s":"女","t":"このケーキ、{冷蔵|れいぞう}{庫|こ}に{入|い}れちゃおうか。","ko":"이 케이크, 냉장고에 넣어 버릴까?"}],"exp":"「〜ちゃおうか」는 「〜てしまおうか」의 축약형으로 ‘~해 버릴까?’ 하고 제안하는 말입니다. 자연스러운 응답은 「入れといて」(=入れておいて)로 수락하는 2번. 1번은 질문과 상관없는 대답, 3번은 장소를 알려 주는 말이라 어긋납니다.","key":"축약형 제안(〜ちゃおうか) → 〜といて로 수락"},{"id":19,"type":"즉시 응답","title":"コピーの依頼","intro":"{部長|ぶちょう}が{部下|ぶか}に{頼|たの}みます。（선지는 연습용으로 표시했습니다. 실제 시험에서는 음성만 나옵니다.）","question":"{何|なん}と{答|こた}えますか。","opts":["はい、コピーしてさしあげます。","はい、すぐコピーいたします。","はい、コピーしていただけます。"],"a":1,"script":[{"s":"女","t":"{悪|わる}いけど、この{資料|しりょう}、コピーしてくれる？","ko":"미안한데, 이 자료 좀 복사해 줄래?"}],"exp":"상사에게 자기 행동을 낮추는 겸양어는 「いたします」 → 2번. 1번 「してさしあげます」는 자신이 은혜를 베푸는 표현이라 상사에게 쓰면 실례. 3번 「していただけます」는 상사에게 부탁하는 말이 되어 앞뒤가 맞지 않습니다.","key":"겸양(いたします) vs 잘못된 겸양(さしあげます)"},{"id":20,"type":"즉시 응답","title":"昼食の誘い","intro":"{会社|かいしゃ}の{廊下|ろうか}で、{同僚|どうりょう}が{昼食|ちゅうしょく}に{誘|さそ}います。（선지는 연습용으로 표시했습니다. 실제 시험에서는 음성만 나옵니다.）","question":"{何|なん}と{答|こた}えますか。","opts":["ごめん、{今日|きょう}はちょっと。","いいえ、ラーメンじゃありません。","ええ、{行|い}きたくないです。"],"a":0,"script":[{"s":"男","t":"ねえ、{昼|ひる}、{一緒|いっしょ}にラーメン{行|い}かない？","ko":"있잖아, 점심에 같이 라멘 먹으러 갈래?"}],"exp":"권유를 부드럽게 거절할 때는 「今日はちょっと…」처럼 말끝을 흐립니다 → 1번. 2번은 ‘라멘’이라는 단어에만 반응한 오해, 3번은 「ええ」+부정으로 앞뒤가 안 맞고 지나치게 직설적입니다.","key":"완곡 거절(今日はちょっと) — 말끝 흐리기"},{"id":21,"type":"즉시 응답","title":"五時までの発送","intro":"{職場|しょくば}で、{女|おんな}の{人|ひと}が{男|おとこ}の{人|ひと}に{頼|たの}みます。（선지는 연습용으로 표시했습니다. 실제 시험에서는 음성만 나옵니다.）","question":"{何|なん}と{答|こた}えますか。","opts":["うん、{五|ご}{時|じ}に{送|おく}るね。","いいえ、{送|おく}らなくていいよ。","もちろん。{何|なに}をすればいい？"],"a":2,"script":[{"s":"女","t":"{悪|わる}いけど、これ、{五|ご}{時|じ}までに{送|おく}らなきゃいけないんだけど、{手伝|てつだ}ってくれる？","ko":"미안한데, 이거 5시까지 보내야 하는데, 좀 도와줄래?"}],"exp":"「〜なきゃ」는 「〜なければならない」의 축약형. 「五時までに」는 ‘5시까지’라는 기한이므로 「五時に送る」(1번)는 기한을 놓친 대표적 함정입니다. 부탁을 받아들이며 무엇을 할지 묻는 3번이 자연스럽습니다.","key":"축약(なきゃ) + までに(기한) 함정"},{"id":22,"type":"통합 이해","title":"家族旅行の宿","intro":"{旅行|りょこう}{会社|かいしゃ}で、{女|おんな}の{人|ひと}が{店員|てんいん}と{話|はな}しています。","question":"{女|おんな}の{人|ひと}はどうすることにしましたか。","opts":["「{山|やま}の{宿|やど}」を{予約|よやく}する","「{海辺|うみべ}のホテル」を{個室|こしつ}なしで{予約|よやく}する","「{海辺|うみべ}のホテル」を{和食|わしょく}の{個室|こしつ}{付|つ}きで{予約|よやく}する","どちらも{予約|よやく}しない"],"a":2,"script":[{"s":"女","t":"{来月|らいげつ}、{家族|かぞく}{四|よん}{人|にん}で{温泉|おんせん}に{行|い}きたいんです。{候補|こうほ}が{二|ふた}つあるんですが。","ko":"다음 달에 가족 네 명이서 온천에 가고 싶어요. 후보가 두 개 있는데요."},{"s":"男","t":"はい。「{山|やま}の{宿|やど}」は{一|いち}{泊|はく}{二|に}{食|しょく}で{一人|ひとり}{一|いち}{万|まん}{五千|ごせん}{円|えん}、お{部屋|へや}は{和室|わしつ}で、{露天|ろてん}{風呂|ふろ}があります。「{海辺|うみべ}のホテル」は{一|いち}{泊|はく}{二|に}{食|しょく}で{一人|ひとり}{一|いち}{万|まん}{二千|にせん}{円|えん}、お{部屋|へや}は{洋室|ようしつ}で、{大|だい}{浴場|よくじょう}です。","ko":"네. ‘야마노야도’는 1박 2식에 한 사람 15,000엔, 방은 일본식이고 노천탕이 있습니다. ‘해변 호텔’은 1박 2식에 한 사람 12,000엔, 방은 양식이고 대욕장입니다."},{"s":"女","t":"{子|こ}どもが{小|ちい}さいので、{布団|ふとん}よりベッドのほうがいいんです。あと、{父|ちち}が{足|あし}が{悪|わる}いので、{階段|かいだん}は{避|さ}けたいです。","ko":"아이가 어려서 이불보다 침대가 좋아요. 그리고 아버지가 다리가 불편하셔서 계단은 피하고 싶습니다."},{"s":"男","t":"なるほど。「{山|やま}の{宿|やど}」は、{露天|ろてん}{風呂|ふろ}まで{階段|かいだん}を{上|あ}がっていただくんですよ。「{海辺|うみべ}のホテル」は{全部|ぜんぶ}バリアフリーで、エレベーターもあります。","ko":"그렇군요. ‘야마노야도’는 노천탕까지 계단을 올라가셔야 합니다. ‘해변 호텔’은 전부 배리어프리이고 엘리베이터도 있습니다."},{"s":"女","t":"じゃあ、「{海辺|うみべ}のホテル」ですね。…あ、でも、{食事|しょくじ}がバイキングなんですよね。{子|こ}どもは{喜|よろこ}ぶけど、{父|ちち}はゆっくり{食|た}べたいって{言|い}うので。","ko":"그럼 ‘해변 호텔’이네요. …아, 그런데 식사가 뷔페라고요. 아이는 좋아하겠지만 아버지는 천천히 먹고 싶다고 하셔서요."},{"s":"男","t":"「{海辺|うみべ}のホテル」には{和食|わしょく}の{個室|こしつ}もあるんですが、{別|べつ}{料金|りょうきん}で{一人|ひとり}{二千|にせん}{円|えん}かかります。","ko":"‘해변 호텔’에는 일식 개인실도 있는데, 별도 요금으로 한 사람 2,000엔이 듭니다."},{"s":"女","t":"そうですか。じゃあ、{少|すこ}し{高|たか}くなっても、{個室|こしつ}をお{願|ねが}いします。{主人|しゅじん}に{相談|そうだん}してから、{明日|あした}{予約|よやく}します。","ko":"그렇군요. 그럼 조금 비싸더라도 개인실로 부탁드릴게요. 남편과 상의하고 내일 예약하겠습니다."}],"exp":"조건은 ①아이가 어려 침대(양식) ②아버지가 계단을 피함. 「山の宿」는 일본식+노천탕까지 계단이라 두 조건 모두 탈락(1번 오답). 「海辺のホテル」는 만족하지만 뷔페가 걸려 일식 개인실을 「少し高くなっても」 추가 → 3번. 「明日予約します」는 남편과 상의 후 예약한다는 뜻이므로 4번(둘 다 예약 안 함)은 오답.","key":"후보별 조건 대조 → 마지막에 더해진 조건(個室·別料金)"},{"id":23,"type":"통합 이해","title":"習い事選び","intro":"{公民|こうみん}{館|かん}で、{女|おんな}の{人|ひと}が{男|おとこ}の{人|ひと}と{話|はな}しています。","question":"{女|おんな}の{人|ひと}はまず{何|なに}を{申|もう}し{込|こ}みますか。","opts":["{書道|しょどう}を{習|なら}い{始|はじ}める","ギターを{買|か}う","ギターの{体験|たいけん}{教室|きょうしつ}に{申|もう}し{込|こ}む","{書道|しょどう}の{体験|たいけん}{教室|きょうしつ}に{申|もう}し{込|こ}む"],"a":2,"script":[{"s":"女","t":"{私|わたし}、{何|なに}か{習|なら}い{事|ごと}を{始|はじ}めたいんだけど。{書道|しょどう}かギターかで{迷|まよ}ってるの。","ko":"나 뭐든 배우고 싶은데. 서예랑 기타 중에 고민 중이야."},{"s":"男","t":"{書道|しょどう}は{月曜|げつよう}と{木曜|もくよう}の{夜|よる}で、{月|つき}{四千|よんせん}{円|えん}。ギターは{土曜|どよう}の{午後|ごご}で、{月|つき}{六千|ろくせん}{円|えん}だって。","ko":"서예는 월요일과 목요일 밤이고 월 4,000엔. 기타는 토요일 오후이고 월 6,000엔이래."},{"s":"女","t":"{平日|へいじつ}の{夜|よる}は{残業|ざんぎょう}が{多|おお}いから、{土曜|どよう}がいいな。でも、{六千|ろくせん}{円|えん}はちょっと{痛|いた}い。","ko":"평일 밤은 야근이 많아서 토요일이 좋겠어. 그런데 6,000엔은 좀 부담이야."},{"s":"男","t":"ギターは{楽器|がっき}を{買|か}わないといけないよ。{書道|しょどう}は{道具|どうぐ}が{安|やす}く{済|す}むらしい。","ko":"기타는 악기를 사야 해. 서예는 도구가 싸게 끝난다더라."},{"s":"女","t":"{楽器|がっき}を{買|か}うのは、{続|つづ}かなかったらもったいないよね。","ko":"악기를 사는 건 계속 못 하면 아깝잖아."},{"s":"男","t":"{体験|たいけん}{教室|きょうしつ}があるみたいだよ。どちらも{一|いち}{回|かい}{千|せん}{円|えん}で{受|う}けられるって。","ko":"체험 교실이 있는 모양이야. 둘 다 한 번 1,000엔으로 들을 수 있대."},{"s":"女","t":"じゃあ、{両方|りょうほう}{行|い}ってみてから{決|き}める。まず{土曜|どよう}のギターから{申|もう}し{込|こ}むね。","ko":"그럼 둘 다 가 보고 결정할게. 먼저 토요일 기타부터 신청할게."}],"exp":"서예는 평일 밤이라 「残業が多い」로 탈락(요일 조건), 기타는 6,000엔에 악기 구입까지 부담. 그래서 바로 등록하지 않고 「体験教室」로 먼저 확인하기로 하고, 「まず土曜のギターから申し込む」 → 3번. 악기 구입(2번)은 오히려 망설인 부분입니다.","key":"조건 종합(요일·가격·초기비용) + 마지막 「まず」"}]}},"tips":{"exam":{"facts":[{"k":"시험일","v":"2026년 12월 6일 (일) · N1·N2는 오전 실시"},{"k":"입실 완료","v":"09:40까지 (한국 기준). 이후 출입구 봉쇄 — 1분만 늦어도 응시 불가"},{"k":"1교시","v":"언어지식(문자·어휘·문법) + 독해 = 105분 (10:00 시작)"},{"k":"2교시","v":"청해 약 50분 (녹음 길이에 따라 종료 시각 변동)"},{"k":"합격 기준","v":"180점 만점에 90점 + 언어지식·독해·청해 각 19점 이상 (한 과목이라도 19점 미만이면 불합격)"},{"k":"준비물","v":"수험표, 규정 신분증(실물 권장), HB연필·샤프, 지우개, 아날로그 손목시계"},{"k":"주의","v":"볼펜·사인펜 답안은 채점되지 않음. 휴대전화·스마트워치는 전원을 끄고 봉투에 봉인 — 울리거나 켜면 부정행위로 해당 회차 무효 + 2년 응시 제한"}]},"sources":[{"name":"Google · 일반 웹 (전략·시간 배분)","cls":"","note":"여러 학습 사이트의 공통 결론을 정리했습니다.","items":[{"t":"독해는 시간 싸움 — 105분 배분 공식","d":"문자·어휘 약 15~30분 + 문법 약 20분 + 독해 약 65분 + 검토 5분. 앞 파트에서 1~2분씩 흘리면 장문에서 그대로 무너집니다.","meta":"ekunblog, nugunahrd 종합"},{"t":"유형별 권장 시간","d":"단문 2~3분 / 중문 5~6분 / 통합 8분 / 장문 10~12분 / 정보검색 5분. 단문 1문항 2분 초과 = 즉시 표시하고 넘기기(2분 룰).","meta":"ekunblog · nugunahrd"},{"t":"풀이 순서는 정보검색부터","d":"정보검색(표·안내문)은 문장 이해 부담이 적어 5분 안에 처리 가능. 정보검색 → 단문 → 중문 → 통합 → 장문 순이 득점에 유리하다는 후기가 많습니다.","meta":"ekunblog"},{"t":"질문 선독(先読み)","d":"지문 전에 질문·선지를 먼저 읽고 무엇을 찾을지 정한 뒤 해당 부분만 스캔. 문항당 30~40초 절약.","meta":"ekunblog · nugunahrd"},{"t":"과락 구조를 먼저 이해","d":"총점이 합격선을 넘어도 한 구분이라도 19점 미만이면 불합격. 약한 파트는 '과락 방어'까지만, 강한 파트에 시간을 몰아주는 전략이 유효합니다.","meta":"JLPT 공식 성적 안내 기준"},{"t":"정보검색은 주석에서 갈린다","d":"표 본문만 보면 맞고 ※·ただし까지 보면 틀리는 선지가 기본 설계. 別途·教材費·入会金은 총액에 더하기, 割引の併用不可면 할인은 하나만. 以上/以下(포함) vs 未満/超える(불포함) 경계값 확인.","meta":"aurothy 정보검색 노트"},{"t":"통합 이해는 '정반대'가 아니다","d":"A와 B를 비교할 때 가장 흔한 함정은 두 글이 반대라고 정해 놓고 읽는 것. 실제로는 '둘 다 부정하지 않는 점'이 있고, 차이는 다른 지점(예: 규칙을 누가 정할지)에 있습니다. 먼저 일치점을 뽑고 나서 차이를 찾으세요.","meta":"nihongo-quiz 대문 해설 · OpenExamPrep (2026-07)"},{"t":"질문만 먼저 → 단락 첫·끝 문장 → 근거 ±1문장 → 선지는 마지막","d":"선지를 먼저 읽으면 그럴듯한 오답이 머리에 남아, 본문에서 그 선지를 지지하는 곳을 찾게 됩니다. 정답은 본문 표현을 바꿔 말한 言い換え인 경우가 많고, 지문 단어를 그대로 쓴 선지는 오히려 함정입니다.","meta":"panduan-jepang (2026-10) · rapid-jt (2026-10)"},{"t":"문법 속도가 독해 시간을 만든다","d":"N2 1교시는 105분에 50문항. 문법에서 1~2분씩 흘리면 그대로 독해 시간이 사라집니다. 생각해도 모르는 문법은 찍고 △표시 후 넘어가세요.","meta":"nihongo-quiz · ekunblog (2026-04)"}],"links":[{"t":"JLPT N2 독해 시간 배분 전략","u":"https://ekunblog.com/blog/jlpt-n2-reading-time-management-strategy/","d":"유형별 시간표·풀이 순서"},{"t":"독해 시간관리와 풀이 전략 (누구나HRD)","u":"https://nugunahrd.com/resources/jlpt-n2-strategy/5","d":"105분 배분 공식, 지시어·접속사 추적법"},{"t":"정보검색 공략 노트","u":"https://aurothy.com/notes/1185","d":"조건 대조 3단계, 함정 5유형"},{"t":"N2 대문별 해설과 함정 (統合理解·情報検索)","u":"https://nihongo-quiz.jp/guide/kaikata-n2.php","d":"유형이 바뀐 지점과 오답 설계"},{"t":"統合理解·情報検索 영문 가이드","u":"https://open-exam-prep.com/study-guides/jlpt-n2/reading-comprehension/integrated-comprehension-information-retrieval","d":"작업 예시(원문·번역) 포함"},{"t":"JLPT 공식 N2 大問のねらい (PDF)","u":"https://www.jlpt.jp/guideline/pdf/n2.pdf","d":"국제교류기금 — 유형별 분량·목적"}]},{"name":"네이버 블로그 (합격 후기·단어 암기)","cls":"naver","note":"실제 응시자 후기에서 반복되는 방법만 추렸습니다.","items":[{"t":"기출 1회를 4일에 걸쳐 '모르는 단어 전부' 정리","d":"기출을 그냥 풀고 → 모르는 단어를 죄다 찾고 → 단어장 앱에 넣기. JLPT는 문제은행식이라 회차를 넘어 단어가 반복되므로, 두 번째 기출부터 모르는 단어가 확 줄어듭니다.","meta":"네이버 블로그 '양빵' 3주 독학 후기 (2023)"},{"t":"한자 읽기는 장음·탁음·촉음 함정","d":"継続(けいぞく, そ 아님), 軽傷(けいしょう), 勢い(훈독 いきおい), 扱う, 粗い — 뜻을 알아도 읽기를 틀리면 '모르는 단어'로 취급해 다시 외우기.","meta":"해커스 일본어 공식 블로그 (2021)"},{"t":"손으로 쓰는 단어장 + 앱 병행","d":"A4를 접어 한자/읽기·뜻을 가리는 수제 단어장, 이동 시간에는 회독JLPT·암기고래 같은 앱. '눈으로 아는 단어'를 '귀로 들리는 단어'로 바꾸는 것이 청해에도 직결.","meta":"네이버 블로그 독학 후기 (2018)"},{"t":"모의고사는 반드시 시간 재고","d":"실전에서는 OMR 마킹까지 해야 해서 시간이 늘 모자랍니다. 적어도 시험 2~3주 전부터는 타이머를 두고 1회분을 통으로 풀어 보세요.","meta":"네이버 블로그 후기 공통"},{"t":"독해 팁 5줄 (일본 현지 응시 후기)","d":"① 문제 먼저 읽고 지문 ② 긴 지문은 앞보다 중간·뒤쪽에 답 ③ 지문과 똑같은 단어가 있는 선지는 답이 아닐 확률이 높음 ④ 필자의 생각 중심으로 ⑤ 많이 풀기. 141점(독해 54) 후기.","meta":"네이버 블로그 '쭘이' (2023-11)"},{"t":"중문(問題11)은 득점 파트","d":"지문 3개·9문항. 문제를 먼저 읽고 '필자가 스스로 던진 질문과 그 답'을 찾으면 핵심 문장이 보입니다. 지문 길이가 적당해 연습하면 정확하고 빨라집니다.","meta":"네이버 블로그 OFINN"}],"links":[{"t":"JLPT N2 필수 단어 정리 (해커스)","u":"https://m.blog.naver.com/hackersjapan/222292681425","d":"한자 읽기 출제 포인트와 예문"},{"t":"3주 독학 합격 후기 (기출 회독법)","u":"https://m.blog.naver.com/yxngbbxng/223148138311","d":"기출 1회 4일 루틴"},{"t":"독학 공부방법·유튜브·앱 정리","u":"https://m.blog.naver.com/yhj8376/221356409906","d":"한자 2주 완성 강의, 청해 앱"},{"t":"독해 문제 구성과 팁 5가지","u":"https://m.blog.naver.com/shcute216/223262338546","d":"일본 현지 응시 후기"},{"t":"유형별 공부법 — 중문(問題11)","u":"https://m.blog.naver.com/ofinn/221744810643","d":"문제 풀이 순서 설명"}]},{"name":"유튜브 (무료 강의)","cls":"yt","note":"블로그 후기에서 실제로 도움받았다고 언급된 강의 중심.","items":[{"t":"N2 한자 2주 완성 (nihongonomori)","d":"40분 × 14강. 비슷하게 생긴 한자의 차이와 쓰임을 그림처럼 설명해 '한자 표기' 파트에 특히 도움이 됐다는 후기.","meta":"유튜브 링크는 아래 참조"},{"t":"N2 문법 1시간 정리 (nihongonomori)","d":"문법을 외우기보다 '쓰임새'로 이해시키는 압축 강의. 이해가 안 되는 문형만 골라 다시 보기 좋습니다.","meta":"유튜브 링크는 아래 참조"},{"t":"유하다요 N2 모의고사 해설","d":"문자·어휘, 문법, 독해 10~14번, 청해 1~5번을 파트별로 해설. 청해 유형별 요령을 잡기에 좋습니다.","meta":"yuhadayo.com"},{"t":"매일 짧게 듣기","d":"NHK News Web Easy(쉬운 뉴스)나 '1분 일본어' 앱으로 하루 5~10분. 청해는 몰아서가 아니라 매일이 효과적.","meta":"NHK · 앱"},{"t":"유하다요 N2 독해 완전정복 29강","d":"유형별로 '해석 → 풀이'를 나눠 구성. 통합 이해·정보검색처럼 N2에만 있는 유형을 따로 다룹니다.","meta":"yuhadayo.com"},{"t":"6개월 로드맵 (영어권 채널)","d":"1~2개월 문법·한자 기초 → 3~4개월 긴 지문·청해 집중 → 마지막 2개월 타이머 모의고사. '청해를 미루는 것'과 '실전 조건 없이 푸는 것'을 대표 실패로 꼽습니다.","meta":"Nihongo with Mitsu (2026-05)"}],"links":[{"t":"N2 한자 2주 완성 강의","u":"https://youtu.be/iGUpjlZrR78","d":"nihongonomori (블로그에서 소개된 링크)"},{"t":"N2 문법 한시간에 끝내기","u":"https://youtu.be/nhP_VZtAuro","d":"nihongonomori (블로그에서 소개된 링크)"},{"t":"유하다요 JLPT N2","u":"https://yuhadayo.com/categories/course-detail/N2_mogitest2","d":"모의고사 파트별 해설"},{"t":"NHK News Web Easy","u":"https://www3.nhk.or.jp/news/easy/","d":"후리가나 붙은 쉬운 뉴스 — 매일 듣기용"},{"t":"N2 독해 완전정복 (강의 목록)","u":"https://yuhadayo.com/categories/course-detail/n2_dokkai_","d":"29강 — 유형별 해석/풀이"},{"t":"How to Pass JLPT N2 in 2026","u":"https://www.youtube.com/watch?v=XrpEpiRt_8I","d":"6개월 학습 로드맵"}]},{"name":"X (Twitter) — 실제 게시물","cls":"x","note":"한국어 N2 팁 게시물은 많지 않았고, 검색 결과 상당수가 일본어 교사·무관 게시물이었습니다. 아래는 실제로 확인한 게시물만 정리했습니다.","items":[{"t":"과락 방어 + 강한 파트 몰빵","d":"'JLPT는 한 과목만 과락 나도 떨어지는 시험이라 다 잘하려다 다 망함. 약한 파트는 과락만 면할 만큼 깔고, 승부 볼 파트에 시간을 몰빵.' 문법은 예문을 문장째로 외우고(戦争にともなう多大な犠牲), 독해는 모르는 문장을 전부 적어 단어·뜻을 붙이기. 시험 기간엔 J-POP·일드로 귀 열기.","meta":"@laterinfo_ · 2026-08-04 · x.com/laterinfo_/status/2084610803718660132"},{"t":"7단계 루틴: 단어 10개씩, 문제 먼저, 시간 재기","d":"① 단어는 10개씩 나눠 쓰면서 외우고 이전 10개를 계속 복습 ② 문법은 뜻·형태·주의점을 함께 ③ 독해는 지문보다 문제를 먼저 ④ 청해는 선택지 빠르게 훑고 핵심(이유·누가·무엇)만 ⑤ 파트별 시간 재기 — '문제 하나에 1~2분' 감각.","meta":"@allabout_KieCYJ · 2026-06-26 · x.com/allabout_KieCYJ/status/2070355118956945650"},{"t":"시험 시작 시각 변경·전자기기 규정 강화","d":"직전 회차에서 시차를 이용한 답안 공유가 적발되어 시험 시작 시간이 바뀌고 휴대전화 관리가 대폭 강화되었습니다. 수험표의 시각과 현장 규정을 그대로 따르세요.","meta":"@HANBINIZM · 2025-03-29 · x.com/HANBINIZM/status/1905837706929918076"},{"t":"현직 일본어 교사의 관점","d":"비한자권 학습자에게 가장 큰 벽은 독해. N2 대비 독해 텍스트는 어휘도 어려워 수업만으로는 부족하니, 남은 기간에 매일 조금씩 읽는 습관이 필요하다는 지적.","meta":"@shiori_edu · 2026-10-13 · x.com/shiori_edu/status/2109899073377738782"},{"t":"시험 30일 전 — 문법에서 막힌 시간이 독해 시간을 깎는다","d":"N2 문법 60문항(형태판단 30·문장조립 20·문장문법 10)을 무료 공개하며, '문법에서 막힌 만큼 독해 시간이 줄어든다'고 정리했습니다.","meta":"@shiori_edu · 2026-11-04 · x.com/shiori_edu/status/2117928720585380183"},{"t":"모의고사로 드러난 N2 약점 = 독해·청해","d":"일본어 교실 운영자가 모의고사를 돌린 결과 N4는 독해, N3는 전반, N2는 독해와 청해가 낮았습니다. 남은 기간 배분을 독해·청해에 두라는 신호.","meta":"@Midori3C23 · 2026-11-15 · x.com/Midori3C23/status/2121762365486301220"}],"links":[{"t":"@laterinfo_ 원문","u":"https://x.com/laterinfo_/status/2084610803718660132","d":"N1·N2 독학 합격법 스레드"},{"t":"@allabout_KieCYJ 원문","u":"https://x.com/allabout_KieCYJ/status/2070355118956945650","d":"시험 준비 7단계 조언"},{"t":"@HANBINIZM 원문","u":"https://x.com/HANBINIZM/status/1905837706929918076","d":"시험 시간·전자기기 규정 변경"},{"t":"@shiori_edu 원문","u":"https://x.com/shiori_edu/status/2109899073377738782","d":"일본어 교사의 독해 고민"},{"t":"@shiori_edu 원문","u":"https://x.com/shiori_edu/status/2117928720585380183","d":"N2 문법 60문항 · 독해 시간 확보"},{"t":"@Midori3C23 원문","u":"https://x.com/Midori3C23/status/2121762365486301220","d":"모의고사 결과 분석"},{"t":"@watasistudyhard N2 독해 만점 타래","u":"https://x.com/watasistudyhard/status/2117877289509904887","d":"일반인 N2 독해 만점 후기 스레드"}]}],"free":[{"t":"JLPT 공식 샘플문제 (레벨별 1회분)","u":"https://www.jlpt.jp/e/samples/forlearners.html","d":"공식 사이트 · 청해 음성 포함. 시험 전 한 번은 시간 재고 풀어보기"},{"t":"PassJapanese — N2 기출 형식 테스트","u":"https://passjapanese.com/ko/exam","d":"가입 없이 무료 · 제출 즉시 채점 · 한국어 해설"},{"t":"RIKEE — N2 모의고사 (온라인)","u":"https://rikee.jp/ko/exams/n2/","d":"105분 제한 · 청해 1회 재생 · 점수와 해설"},{"t":"JP Notes — N2 청해 연습 (스크립트 포함)","u":"https://jpnotes.dev/n2-listening/","d":"유형별 원어민 속도 음성 + 후리가나 대본 + 오답 이유"},{"t":"가나집사 — N2 예문 790개","u":"https://ganabutler.info/sentences/jlpt/n2","d":"단어·문법이 연결된 예문, 음성·형태소 분해"},{"t":"PassJapanese — N2 문법 200개 일람","u":"https://passjapanese.com/ja/grammar/n2","d":"문형별 뜻·예문·구별 포인트 (일본어)"},{"t":"NHK News Web Easy","u":"https://www3.nhk.or.jp/news/easy/","d":"매일 5분 청해·독해 겸용"},{"t":"JLPT 공식 (시험 안내·수험표)","u":"https://www.jlpt.jp/","d":"시험일·시간표·수험표 확인"}],"caveat":"인스타그램은 로그인 장벽·비공개 계정이 많아 직접 수집하지 않았습니다. X는 한국어 N2 자료가 적어 게시물 6건만 반영했고, 나머지는 공개 웹·블로그·유튜브 요약입니다. 링크는 2026-11-18 확인 기준이며, 시험 시각·수험표는 접수한 실시위원회 공지를 최종 기준으로 하세요."}};</script>

    on($('vrev'), 'click', function () { markVocab(x.i, false, true); });

    var sx = 0, sy = 0, moved = false;

    on(card, 'touchmove', function (e) {
      var t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;

    on(card, 'touchend', function (e) {
      card.style.transition = ''; card.style.transform = '';
      if (!moved) return;
      var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)) return;
      justSwiped = true;
      var right = dx > 0;
      markVocab(x.i, right, false);
      toast(right ? '암기 완료 ✓' : '다시 보기로 넘겼어요');
      vFlipped = false;

  /* ---------- GRAMMAR ---------- */
  var gQuery = '', gCat = '전체';

  function byId(arr, id) { for (var i = 0; i < arr.length; i++) if (String(arr[i].i) === String(id)) return arr[i]; return null; }

  /* ---------- QUIZ ---------- */
  var QZ = { order: [], idx: 0, answered: false, correct: 0, wrong: [], done: false };
  function startQuiz(ids) {

  function answerQuiz(i) {
    if (QZ.done || QZ.answered) return;

    else { QZ.wrong.push(q.i); }

  }
  function nextQuiz() {
    if (!QZ.answered) return;

      QZ.idx++; QZ.answered = false; QZ.picked = null; renderQuiz();
      return;
    }
    QZ.done = true;
    if (QZ.order.length === QUIZ.length && QZ.correct > (Number(S.quizBest) || 0)) S.quizBest = QZ.correct;
    S.quizWrong = QZ.wrong.slice();

        + '<div class="card" style="text-align:center">'

        + '<div class="qtitle jp">質問：' + ruby(it.question) + '</div>'
        + opts
        + (typeof ans === 'number' ? '<div class="verdict ' + (ans === it.a ? 'ok' : 'ng') + '">'
          + (ans === it.a ? '⭕️ 정답!' : '❌ 오답 — 정답은 ' + (it.a + 1) + '번') + '</div>'
          + '<div class="exp"><b>포인트: ' + esc(it.key) + '</b><br>' + esc(it.exp) + '</div>' : '')
        + '</div>';
    }).join('');

    $('tab-listening').innerHTML = '<h2>청해 공략 · 쉐도잉</h2><p class="lead">N2 청해 5유형 함정 + 구어 축약형 + 미니 연습 ' + LST.items.length + '문항 (일본어 음성 재생)</p>'
      + '<div class="card tight"><h3 style="margin-top:0">5유형과 함정</h3>'
      + '<div style="overflow-x:auto"><table class="t"><tr><th>유형</th><th>실제 시험</th><th>묻는 것</th><th>요령</th><th>함정</th></tr>' + types + '</table></div></div>'
      + '<div class="card tight"><h3 style="margin-top:0">구어 축약형 (모르면 문장이 통째로 안 들림)</h3>' + con + '</div>'
      + '<div class="card tight"><h3 style="margin-top:0">헷갈리는 소리</h3>' + conf + '</div>'
      + '<div class="card tight"><div class="row" style="justify-content:space-between">'
      + '<span class="small"><b>재생 속도</b></span>'
      + '<span class="wrap"><button class="btn small" data-rate="0.85">0.85x</button>'
      + '<button class="btn small" data-rate="1">1.0x</button>'
      + '<button class="btn small" data-rate="1.1">1.1x</button></span></div>'
      + '<div class="row" style="justify-content:space-between;margin-top:8px"><span class="small"><b>역할별 목소리</b> (남/여 높낮이 구분)</span>'
      + '<button class="btn small" id="lroles">' + (S.roles ? '켜짐' : '꺼짐') + '</button></div>'
      + '<p class="muted small" style="margin:10px 0 0">청해 음성은 실제 일본어 성우(남/여)로 미리 녹음한 MP3라서 아이폰 사파리에서도 재생됩니다. 소리가 안 나면 측면 무음 모드를 해제하고 기기 볼륨을 올려 주세요. ‘역할별 목소리’는 음원을 불러오지 못했을 때만 쓰는 기기 음성용 설정입니다. 각 문항은 실제 시험처럼 한 번만 듣고 답해 보세요.</p></div>'
      + '<h2 style="margin-top:20px">미니 청해 연습</h2><p class="muted small">문항마다 ‘대본 보기’를 누르면 일본어 대본과 한국어 해석이 함께 나옵니다. 정답을 고르면 함정 포인트와 근거가 표시됩니다.</p>' + items;

    Array.prototype.forEach.call($('tab-listening').querySelectorAll('[data-play]'), function (b) {
      b.addEventListener('click', function () {
        playItem(b, lById(b.getAttribute('data-play')));
      });
    });
    Array.prototype.forEach.call($('tab-listening').querySelectorAll('[data-lsay]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var pr = String(b.getAttribute('data-lsay')).split(':');
        playLine(b, lById(pr[0]), Number(pr[1]));
      });
    });
    Array.prototype.forEach.call($('tab-listening').querySelectorAll('[data-stop]'), function (b) {
      b.addEventListener('click', function () { stopSound(); });
    });
    Array.prototype.forEach.call($('tab-listening').querySelectorAll('[data-trans]'), function (b) {
      b.addEventListener('click', function () {
        var d = $('scr-' + b.getAttribute('data-trans'));
        d.classList.toggle('hide');
        b.textContent = d.classList.contains('hide') ? '대본 보기' : '대본 숨기기';
      });
    });
    Array.prototype.forEach.call($('tab-listening').querySelectorAll('[data-l]'), function (b) {
      b.addEventListener('click', function () {
        answerListening(b.getAttribute('data-l'), Number(b.getAttribute('data-o')));
      });
    });
    Array.prototype.forEach.call($('tab-listening').querySelectorAll('[data-rate]'), function (b) {
      b.addEventListener('click', function () {
        S.rate = Number(b.getAttribute('data-rate'));
        if (curAudio) { try { curAudio.playbackRate = S.rate; } catch (e) { } }
        save(); toast('속도 ' + S.rate + 'x');
      });
    });
    on($('lroles'), 'click', function () { S.roles = !S.roles; save(); renderListening(); });
  }

  /* ---------- TIPS ---------- */
  function renderTips() {
    var ex = TIPS.exam;
    var facts = ex.facts.map(function (f) { return kv(f.k, f.v); }).join('');
    var srcs = TIPS.sources.map(function (s) {
      var cls = s.cls || '';
      var items = s.items.map(function (it) {
        return '<div class="tipitem"><b>' + esc(it.t) + '</b><span>' + esc(it.d) + '</span>'
          + (it.meta ? '<div class="meta">' + esc(it.meta) + '</div>' : '') + '</div>';
      }).join('');
      var links = (s.links || []).map(function (l) {
        return '<a href="' + esc(l.u) + '" target="_blank" rel="noopener"><b>' + esc(l.t) + '</b><span>' + esc(l.d || l.u) + '</span></a>';
      }).join('');
      return '<div class="card src ' + cls + '"><h3 style="margin-top:0">' + esc(s.name) + '</h3>'
        + '<p class="muted small" style="margin-top:-4px">' + esc(s.note || '') + '</p>'
        + items + (links ? '<div class="links" style="margin-top:12px">' + links + '</div>' : '') + '</div>';
    }).join('');
    var free = TIPS.free.map(function (l) {
      return '<a href="' + esc(l.u) + '" target="_blank" rel="noopener"><b>' + esc(l.t) + '</b><span>' + esc(l.d) + '</span></a>';
    }).join('');
    $('tab-tips').innerHTML = '<h2>출처별 핵심 요약</h2><p class="lead">구글·네이버·유튜브·X에서 추린 실전 팁과 무료 학습 링크</p>'
      + '<div class="card"><h3 style="margin-top:0">시험 개요</h3>' + facts + '</div>'
      + srcs
      + '<h2 style="margin-top:20px">무료 학습 링크</h2><div class="links">' + free + '</div>'
      + '<div class="note" style="margin-top:14px">' + esc(TIPS.caveat) + '</div>';
  }

  /* ---------- init ---------- */
  function init() {
    var nav = $('tabbar');
    nav.innerHTML = TABS.map(function (t) {
      return '<button id="nb-' + t[0] + '" data-t="' + t[0] + '"><i>' + t[1] + '</i>' + t[2] + '</button>';
    }).join('');
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { go(b.getAttribute('data-t')); });
    });
    on($('furibtn'), 'click', function () {
      S.furi = !furiOn();
      save(); applyFuri();
      toast(furiOn() ? '예문 후리가나 켜짐' : '예문 후리가나 꺼짐 (한자만)');
    });
    applyFuri();
    paintHeader();
    go('home');
  }
  window.__APP__ = {
    go: go, state: S, stat: stat, total: TOTAL,
    answerQuiz: answerQuiz, nextQuiz: nextQuiz, startQuiz: startQuiz,
    answerReading: answerReading, answerListening: answerListening, toggleTr: toggleTr,
    markVocab: markVocab, toggleGrammarDone: toggleGrammarDone,
    speak: speak, speakLines: speakLines, quiz: function () { return QZ; },
    listeningItem: lById, playItem: playItem,
    plain: plain, ruby: ruby, ios: function () { return IOS; },
    setFuri: function (v) { S.furi = !!v; applyFuri(); }
  };
  init();
})();

</script>
</body>
</html>

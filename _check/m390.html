<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>mobile check</title>
<style>body{font:13px/1.5 -apple-system,sans-serif;margin:0;padding:12px}
iframe{width:390px;height:844px;border:1px solid #999}
pre{white-space:pre-wrap;font-size:12px}</style></head>
<body>
<pre id="out">loading…</pre>
<iframe id="fr" src="../index.html"></iframe>
<script>
function scan(w, d) {
  var W = w.innerWidth;
  var bad = [];
  Array.prototype.forEach.call(d.querySelectorAll('body *'), function (el) {
    var r = el.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return;
    if (r.right > W + 0.5 || r.left < -0.5) {
      bad.push(el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + (el.className && el.className.toString ? '.' + String(el.className).split(' ')[0] : '')
        + ' ' + Math.round(r.left) + '..' + Math.round(r.right));
    } else if (el.scrollWidth > el.clientWidth + 1 && getComputedStyle(el).overflowX !== 'visible') {
      bad.push('scroll:' + el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + ' ' + el.scrollWidth + '>' + el.clientWidth);
    }
  });
  return { win: W, docW: d.documentElement.scrollWidth, bodyW: d.body.scrollWidth, offenders: bad.slice(0, 12), count: bad.length };
}
var fr = document.getElementById('fr');
fr.onload = function () {
  var w = fr.contentWindow, d = fr.contentDocument;
  var rep = {};
  rep.home = scan(w, d);
  // 적중 tab
  var b = d.getElementById('nb-hit');
  if (b) b.click();
  setTimeout(function () {
    rep.hit = scan(w, d);
    rep.hitCards = d.querySelectorAll('#tab-hit .hcard').length;
    rep.tabbar = Array.prototype.map.call(d.querySelectorAll('nav.tabbar button'), function (x) {
      var r = x.getBoundingClientRect();
      return x.textContent + ':' + Math.round(r.width) + 'px@' + Math.round(r.left);
    }).join(' | ');
    var nav = d.querySelector('nav.tabbar');
    rep.navW = Math.round(nav.getBoundingClientRect().width) + '/' + nav.scrollWidth;
    // quiz + toggle check
    var qb = d.querySelector('#tab-hit [data-hq]');
    if (qb) qb.click();
    setTimeout(function () {
      rep.quizRevealed = !!d.querySelector('#tab-hit .verdict');
      rep.quizExp = (d.querySelector('#tab-hit .exp') || {}).textContent ? 'yes' : 'no';
      rep.afterQuiz = scan(w, d);
      rep.stat = (d.getElementById('hstat') || {}).textContent;
      document.getElementById('out').textContent = JSON.stringify(rep, null, 1);
      document.title = 'DONE ' + rep.hit.count + '/' + rep.hit.docW;
    }, 400);
  }, 700);
};
</script>
</body></html>

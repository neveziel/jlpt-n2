<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>mobile check</title>
<style>body{font:13px/1.5 -apple-system,sans-serif;margin:0;padding:12px}
iframe{width:390px;height:844px;border:1px solid #999}
pre{white-space:pre-wrap;font-size:12px}</style></head>
<body>
<pre id="out">loading…</pre>
<iframe id="fr"></iframe>
<script>
function scan(w, d) {
  var W = w.innerWidth, bad = [];
  Array.prototype.forEach.call(d.querySelectorAll('body *'), function (el) {
    var r = el.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return;
    if (el.closest && el.closest('.chips')) return; /* horizontally scrollable by design */
    if (r.right > W + 0.5 || r.left < -0.5) {
      bad.push((el.id ? '#' + el.id : el.tagName.toLowerCase()) + '.' + String(el.className || '').split(' ')[0]
        + ' ' + Math.round(r.left) + '..' + Math.round(r.right));
    } else if (el.scrollWidth > el.clientWidth + 1 && getComputedStyle(el).overflowX !== 'visible') {
      bad.push('scroll:' + (el.id ? '#' + el.id : el.tagName.toLowerCase()) + ' ' + el.scrollWidth + '>' + el.clientWidth);
    }
  });
  return { win: W, docW: d.documentElement.scrollWidth, offenders: bad.slice(0, 8), count: bad.length };
}
var fr = document.getElementById('fr'), rep = {};
fr.src = '../index.html?v=' + Date.now();
function step2(w, d) {
  rep.hit = scan(w, d);
  rep.hitCards = d.querySelectorAll('#tab-hit .hcard').length;
  rep.chipsWrap = getComputedStyle(d.querySelector('#tab-hit .chips')).flexWrap;
  rep.tabbar = Array.prototype.map.call(d.querySelectorAll('nav.tabbar button'), function (x) {
    var r = x.getBoundingClientRect(); return Math.round(r.width);
  }).join(',');
  var nav = d.querySelector('nav.tabbar');
  rep.navScroll = nav.scrollWidth + '/' + nav.clientWidth;
  // furigana toggle
  d.getElementById('furibtn').click();
  var kn = d.querySelector('#tab-hit .hitkana');
  rep.furiOffHidesKana = kn ? getComputedStyle(kn).display === 'none' : 'no-kana';
  d.getElementById('furibtn').click();
  // quiz: first option
  var qb = d.querySelector('#tab-hit [data-hq]');
  rep.quizBtn = !!qb;
  if (qb) qb.click();
  setTimeout(function () {
    rep.quizVerdict = (d.querySelector('#tab-hit .verdict') || {}).textContent || null;
    rep.quizExp = !!d.querySelector('#tab-hit .exp');
    rep.afterQuiz = scan(w, d);
    // memorize toggle
    var mb = d.querySelector('#tab-hit [data-hd]');
    if (mb) mb.click();
    setTimeout(function () {
      rep.stat = (d.getElementById('hstat') || {}).textContent;
      // grammar section
      var gc = d.querySelector('#tab-hit [data-hsec="bunpou"]');
      if (gc) gc.click();
      setTimeout(function () {
        rep.bunpou = scan(w, d);
        rep.bunpouCards = d.querySelectorAll('#tab-hit .hcard').length;
        rep.bunpouAudio = d.querySelectorAll('#tab-hit [data-hg]').length;
        document.getElementById('out').textContent = JSON.stringify(rep, null, 1);
        document.title = 'DONE';
      }, 500);
    }, 400);
  }, 500);
}
fr.onload = function () {
  var w = fr.contentWindow, d = fr.contentDocument;
  rep.home = scan(w, d);
  var b = d.getElementById('nb-hit');
  if (b) b.click();
  setTimeout(function () { step2(w, d); }, 800);
};
</script>
</body></html>
